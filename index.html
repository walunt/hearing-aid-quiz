var LECTURES = [{"id": "l1", "no": "第①课", "title": "中耳传声能力评估", "teacher": "周梦琪（戴蒙特集团）", "dur": "约 1h11m", "file": "钉钉直播回放_周梦琪戴孟特_中耳传声能力评估.md", "body": "<h2>学习笔记 ·《中耳传声能力评估》（周梦琪 / 戴蒙特集团）</h2>\n<blockquote>来源：钉钉直播回放 · 讲师周梦琪（戴蒙特集团技术支持，参与二/三/四级验配师培训教材编写）</blockquote>\n<blockquote>时长：约 1 小时 11 分 · 本节讲两块：<b>声导抗测试</b> + <b>真耳分析</b></blockquote>\n<blockquote>整理：AI 据转写稿结构化（术语已纠错：声导抗/声反射/鼓室图/真耳分析/验配等）</blockquote>\n<hr>\n<div class=\"lec-sec-head\"><h3>一、声导抗测试（声阻抗 + 声导纳）</h3><button class=\"lec-practice\" onclick='practiceTopics([\"声导抗\", \"声导抗探测音\", \"鼓室图\", \"鼓室图分型\", \"声反射/镫骨肌\", \"不舒适阈\"])'>🏋 练本节相关的题 →</button></div>\n<h4>1. 测试原理</h4>\n<ul><li>&quot;声导抗&quot;源自声学物理概念：测的是<b>中耳传声介质对声音传播的能力</b>。</li><li>分两部分：<b>声导纳（声导抗）</b> = 声音能被传播的部分；<b>声阻抗</b> = 传声介质对声音的反射/阻碍能力。</li><li>设备实际测到的是<b>被反射回来的声音能量（阻抗值）</b>，再换算得到&quot;有多少声音被传进去&quot;——即声导纳（声顺）值。</li><li>临床与验配常规开展，也是验配时常遇到的测试项。</li></ul>\n<h4>2. 探测音选择</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>探测音</th><th>适用</th><th>原因</th></tr></thead>\n<tr><td><b>226 Hz</b>（低频）</td><td>成人常规必做</td><td>成人中耳以&quot;劲度&quot;因素为主</td></tr>\n<tr><td><b>678 / 800 / 1000 Hz</b>（高频）</td><td>评估质量因素疾病（如中耳积液）</td><td>高频声受质量因素影响大</td></tr>\n<tr><td><b>1000 Hz</b></td><td><b>&lt; 6 个月婴儿必须加测</b></td><td>婴儿中耳骨壁未完全骨化、以质量为主，对高频更敏感；只用 226 Hz 结果不可靠</td></tr>\n</table>\n<h4>3. 鼓室图（Tympanogram，Jerger ABC 分型）—— 必须牢记</h4>\n<ul><li>做法：向外耳道施加压力（x 轴压力，范围约 <b>+200 ~ -400 daPa</b>），改变鼓膜形态 → 记录不同压力下声导纳 → 形成&quot;山峰状&quot;曲线（y 轴 = 声导纳值）。</li><li>解读四个指标：</li></ul>\n<table class=\"lec-tbl\">\n<thead><tr><th>指标</th><th>含义</th><th>正常参考</th></tr></thead>\n<tr><td><b>外耳道容积</b></td><td>探头入外耳道形成密闭空腔的容积；容积偏大提示鼓膜穿孔</td><td>成人 <b>0.6~1.5 mL</b></td></tr>\n<tr><td><b>补偿声顺值（峰压点声顺）</b></td><td>鼓室图峰对应的声顺值，代表中耳整体传声能力</td><td><b>0.3~1.6 mL</b>（226 Hz 时毫升=毫姆欧）</td></tr>\n<tr><td><b>峰压值（TPP）</b></td><td>峰对应的压力点 = 中耳内部压力</td><td>正常 <b>-100 ~ +50 daPa</b></td></tr>\n<tr><td><b>宽度 / 梯度</b></td><td>提示积液或异常</td><td>宽度=峰值一半两交点 x 轴宽度；梯度=±50 daPa 内曲线高度/峰值</td></tr>\n</table>\n<ul><li><b>A 型</b>：峰在正常框内（峰压 -100~+50、声顺 0.3~1.6、外耳道容积正常）→ 正常中耳（或轻度早期病变）</li><li><b>As 型</b>：峰压正常，但<b>声顺值过低（矮）</b> → 听骨链固定、耳硬化、鼓膜活动度降低</li><li><b>Ad 型</b>：峰压正常，但<b>声顺值异常高（出头）</b> → 鼓膜松弛、听骨链中断</li><li><b>B 型</b>：<b>平坦型、无峰</b>；外耳道容积正常 → 中耳积液；容积过小 → 耵聍堵塞/探头抵壁；容积过大 → 鼓膜穿孔或置管</li><li><b>C 型</b>（负压型）：声顺/容积正常，但<b>峰压往负方向（&lt; -100 daPa）</b> → 咽鼓管功能异常（中耳被吸陷）</li></ul>\n<h4>4. 声反射（镫骨肌反射）</h4>\n<ul><li>人类天然保护机制：强声 → 大脑指令<b>镫骨肌收缩</b> → 听骨链不动 → 声音传不进内耳 → 保护听力。</li><li><b>声反射阈（ART）</b>：能引出反射的最小刺激声强度（dB HL），正常值 <b>同侧/对侧 70~90 dB</b>。</li><li><b>临床用途</b>：</li><li>验配中作为<b>不舒适阈（UCL）参考值</b>：患者无法配合测 UCL 时，可用声反射阈快速客观估 UCL</li><li><b>定位诊断</b>：同侧/对侧可判断反射通路哪个节点出问题（面神经、耳蜗、脑干等）</li><li><b>鉴别伪聋</b>：客观测试，反射引出说明通路完整</li><li><b>引出判定</b>：226 Hz 探测音下声导纳变化量 <b>&gt; 0.02</b> 即认为引出</li><li><b>声反射衰减</b>：正常 10 秒内肌肉收缩幅度衰减<b>不超过 50%</b>；<b>&gt; 50% 阳性</b> → 提示蜗后病变</li></ul>\n<hr>\n<div class=\"lec-sec-head\"><h3>二、真耳分析（Real Ear Measurement, REM）</h3><button class=\"lec-practice\" onclick='practiceTopics([\"真耳增益\", \"插入增益\", \"原位测听\"])'>🏋 练本节相关的题 →</button></div>\n<h4>1. 概念</h4>\n<ul><li>在真人耳朵里进行声学测量的过程；验配领域特指<b>戴助听器后在近鼓膜处（探管）测声学</b>。</li><li>为何要做：个体差异大（外耳道容积、结构、阻抗不同），传统 <b>2cc 耦合腔</b> 公式给的增益值是&quot;标准耳&quot;算的，不等于真实耳朵 → 必须戴真机、用细探管（麦克风）放到近鼓膜处测实际输出强度。</li></ul>\n<h4>2. 核心测量值</h4>\n<ul><li><b>REUG（真耳未助增益）</b>：不带助听器时，外耳道本身对声音的放大能力（人耳在 <b>2000 Hz 附近有共振峰</b>）</li><li><b>REAR（真耳助后响度/增益）</b>：戴上助听器后，近鼓膜处实际产生的声音强度</li><li>目标增益 = 验配公式 + 听力图算出的目标曲线；REUG 本身已放大 10 dB 的部分，助听器只需补差</li></ul>\n<h4>3. 特殊测试</h4>\n<ul><li><b>REOG（真耳堵耳增益）</b>：验证堵耳效应，决定是否开放式验配</li><li><b>RECD（真耳耦合腔差）</b>：小儿难配合时，用耦合腔做&quot;仿真耳&quot;，宝宝可离开</li></ul>\n<h4>4. 验配流程（英国验配流程成人儿童都强制）</h4>\n<p>1. 校准设备（扬声器 0°、距耳约 50 cm）</p>\n<p>2. 输入听力图（算目标曲线）</p>\n<p>3. 测 <b>REUG</b></p>\n<p>4. 非开放式验配 → 加测 <b>REOG</b></p>\n<p>5. 戴机、工作状态测 <b>REAR</b> → 对比目标曲线调补偿增益</p>\n<hr>\n<div class=\"lec-sec-head\"><h3>三、本节对应题库考点</h3></div>\n<ul><li>声导抗原理 / 声顺 vs 声阻抗 / 探测音 226 Hz（成人）与 100 Hz（&lt;6月婴儿必做）</li><li>鼓室图 ABC 分型（A/As/Ad/B/C）及对应疾病（积液、穿孔、咽鼓管异常、听骨链固定/中断）</li><li>外耳道容积 0.6~1.5 mL；声顺值 0.3~1.6 mL；峰压正常 -100~+50 daPa</li><li>镫骨肌反射（保护机制）、声反射阈 70~90 dB、UCL 参考、声反射衰减 &gt;50% 提示蜗后病变</li><li>真耳分析 REM：REUG / REAR / REOG / RECD 概念与验配流程</li></ul>"}, {"id": "l2", "no": "第②课", "title": "三级助听器模块1", "teacher": "戴瑞邦（WSA听力集团）", "dur": "约 2h10m", "file": "钉钉直播回放_戴瑞邦_三级助听器模块1.md", "body": "<h2>钉钉直播回放_戴瑞邦_三级助听器模块1</h2>\n<blockquote><b>来源</b>：钉钉直播回放（第②课）</blockquote>\n<blockquote><b>讲师</b>：戴瑞邦 —— WSA 听力集团新零售总监，20 年从业经验，参与教材编写</blockquote>\n<blockquote><b>时长</b>：约 130 分钟</blockquote>\n<blockquote><b>本节主题</b>：儿童听力筛查与诊断、小儿行为测听、助听器验配、听力言语康复、职业道德</blockquote>\n<blockquote><b>适用对象</b>：助听器验配师（三级）考生（结合 363 题题库考点）</blockquote>\n<hr>\n<div class=\"lec-sec-head\"><h3>目录</h3></div>\n<p>1. [儿童听力康复「三早」原则](#一儿童听力康复三早原则)</p>\n<p>2. [新生儿听力筛查流程](#二新生儿听力筛查流程)</p>\n<p>3. [听神经病（ANSD）](#三听神经病ansd)</p>\n<p>4. [病史采集要点](#四病史采集要点)</p>\n<p>5. [听力学检查报告解读](#五听力学检查报告解读)</p>\n<p>6. [听觉发育月龄规律](#六听觉发育月龄规律)</p>\n<p>7. [学龄期听障儿童康复](#七学龄期听障儿童康复)</p>\n<p>8. [职业道德与三级预防](#八职业道德与三级预防)</p>\n<p>9. [真题高频考点速记](#九真题高频考点速记)</p>\n<p>10. [本节对应题库考点（复习范围）](#十本节对应题库考点复习范围)</p>\n<hr>\n<div class=\"lec-sec-head\"><h3>一、儿童听力康复「三早」原则</h3><button class=\"lec-practice\" onclick='practiceTopics([\"三早原则\", \"新生儿筛查\", \"残疾预防条例\"])'>🏋 练本节相关的题 →</button></div>\n<h4>核心要点</h4>\n<ul><li><b>三早</b>：早发现、早诊断、早干预。</li><li>临床常扩展为<b>「四早」</b>，即在「三早」基础上增加<b>早语训（早期听力言语康复）</b>。</li><li>逻辑链条：筛查（早发现）→ 诊断性听力学检查（早诊断）→ 助听/康复（早干预、早语训）。</li><li>这一原则是儿童听力残疾预防与康复工作的总纲，也是题库反复考查的核心理念题。</li></ul>\n<h4>与题库对应考点</h4>\n<ul><li>常以「儿童听力康复原则」「三早/四早内容」形式命题。</li><li>注意区分：三级预防（见第八节）是公共卫生层面，三早是临床康复层面，二者关联但不同。</li></ul>\n<hr>\n<div class=\"lec-sec-head\"><h3>二、新生儿听力筛查流程</h3><button class=\"lec-practice\" onclick='practiceTopics([\"新生儿筛查\", \"ABR\"])'>🏋 练本节相关的题 →</button></div>\n<h4>核心要点</h4>\n<p>新生儿听力筛查（UNHS）是按时间轴推进的闭环流程，关键时间节点必须记牢。</p>\n<table class=\"lec-tbl\">\n<thead><tr><th>时间节点</th><th>检查内容</th><th>说明 / 注意事项</th></tr></thead>\n<tr><td><b>出生 24–72 小时</b>（出院前）</td><td>初筛：OAE 和/或 AABR</td><td>足月儿常规做；未通过率偏高，<b>主因是羊水、胎脂、中耳积液等传导因素干扰</b>，并非一定耳聋</td></tr>\n<tr><td><b>出生 42 天内</b></td><td>复筛</td><td>初筛未过者复筛；仍为「筛查」性质</td></tr>\n<tr><td><b>复筛未过后 3 个月内</b></td><td>诊断性听力学检查</td><td>明确听力损失性质、程度、侧别</td></tr>\n<tr><td><b>确诊永久性感音神经性聋后 6 个月内</b></td><td>干预：验配助听器</td><td>黄金干预期，越早越好</td></tr>\n<tr><td><b>10–12 月龄</b></td><td>可考虑人工耳蜗植入</td><td>重度/极重度、助听效果不佳者评估 CI</td></tr>\n<tr><td><b>NICU（重症监护）患儿出院时</b></td><td>OAE <b>+</b> AABR 联合</td><td>高危儿必须双项，不能只做单项</td></tr>\n</table>\n<h4>关键数据 / 正常值</h4>\n<ul><li>初筛窗口：<b>24–72 h</b>（真题常考「72 小时」）。</li><li>复筛窗口：<b>42 天（约 6 周）内</b>。</li><li>诊断时限：<b>复筛未过后 3 个月内</b>。</li><li>干预时限：<b>确诊后 6 个月内</b>配助听器。</li><li>人工耳蜗评估时机：<b>10–12 月</b>。</li></ul>\n<h4>与题库对应考点</h4>\n<ul><li>时间轴排序题、填空/单选题：72h、42 天、3 个月、6 个月、10–12 月。</li><li>NICU 患儿筛查方案（OAE+AABR）。</li><li>初筛未过率高的原因（羊水/胎脂/中耳积液 → 传导性干扰）。</li></ul>\n<hr>\n<div class=\"lec-sec-head\"><h3>三、听神经病（ANSD）</h3><button class=\"lec-practice\" onclick='practiceTopics([\"听神经\", \"听神经谱系障碍\", \"ABR\"])'>🏋 练本节相关的题 →</button></div>\n<h4>核心要点</h4>\n<ul><li><b>听神经病谱系障碍（ANSD）</b> 的特征性表现：<b>耳声发射（OAE）可引出，但 AABR 引不出（或严重异常）</b>。</li><li>机制：外毛细胞功能正常（故 OAE 存在），但听神经同步化放电受损（故 AABR 异常）。</li><li>常见于<b>出生缺氧、高胆红素血症（核黄疸）</b> 患儿 —— 见病史采集。</li></ul>\n<h4>关键鉴别</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>检查</th><th>传导性聋</th><th>感音神经性聋</th><th>听神经病（ANSD）</th></tr></thead>\n<tr><td>OAE</td><td>引不出/异常</td><td>引不出/异常</td><td><b>可引出</b></td></tr>\n<tr><td>AABR</td><td>引不出/异常</td><td>引不出/异常</td><td><b>引不出/异常</b></td></tr>\n<tr><td>鉴别要点</td><td>—</td><td>OAE、AABR 均差</td><td>OAE 好 + AABR 差 = 特征组合</td></tr>\n</table>\n<h4>与题库对应考点</h4>\n<ul><li>OAE 与 AABR 结果矛盾的情景题 → 指向听神经病。</li><li>高危因素（缺氧、高胆红素）与 ANSD 的关联。</li></ul>\n<hr>\n<div class=\"lec-sec-head\"><h3>四、病史采集要点</h3><button class=\"lec-practice\" onclick='practiceTopics([\"病史采集\", \"病史询问要点\", \"耳毒性药物\"])'>🏋 练本节相关的题 →</button></div>\n<p>病史采集是儿童听力损失病因判断的基础，按三大板块系统询问。</p>\n<h4>1. 孕产史（重点关注致聋因素）</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>类别</th><th>具体内容</th><th>关联听力问题</th></tr></thead>\n<tr><td><b>感染史（TORCH 类）</b></td><td>弓形体、巨细胞病毒（CMV）、风疹、梅毒、单纯疱疹（单疱）</td><td>宫内感染致感音神经性聋</td></tr>\n<tr><td><b>用药史</b></td><td>耳毒性药物（氨基糖苷类、袢利尿剂、水杨酸类、部分抗肿瘤药）</td><td>药物性聋</td></tr>\n<tr><td><b>出生异常</b></td><td>缺氧窒息、高胆红素血症（黄疸过重）</td><td><b>听神经病（ANSD）</b></td></tr>\n</table>\n<h4>2. 发育史</h4>\n<ul><li>整体生长发育、运动/语言发育里程碑是否延迟。</li><li>语言发育落后往往是听力损失的早期信号。</li></ul>\n<h4>3. 家族史（遗传性耳聋）</h4>\n<ul><li>约 <b>50%–60%</b> 的儿童感音神经性聋与遗传相关。</li><li><b>GJB2（ connexin 26）</b>：最常见<b>常染色体隐性</b>遗传性聋基因。</li><li><b>线粒体 DNA（如 A1555G）</b>：母系遗传，<b>氨基糖苷类药物致聋</b> —— 须<b>绝对避免氨基糖苷类抗生素</b>。</li><li><b>SLC26A4（PDS）</b>：与大前庭导水管综合征（LVAS）相关，头颅外伤/颅内压波动可诱发听力骤降。</li></ul>\n<h4>与题库对应考点</h4>\n<ul><li>遗传性聋比例（50–60%）。</li><li>各基因对应疾病：GJB2→隐性聋；线粒体→药物性聋（避氨基糖苷）；SLC26A4→大前庭导水管综合征。</li><li>孕期感染「五联」：弓形体、巨细胞、风疹、梅毒、单疱。</li><li>缺氧/高胆红素 → 听神经病。</li></ul>\n<hr>\n<div class=\"lec-sec-head\"><h3>五、听力学检查报告解读</h3><button class=\"lec-practice\" onclick='practiceTopics([\"ABR\", \"声导抗\", \"鼓室图\", \"声反射/镫骨肌\"])'>🏋 练本节相关的题 →</button></div>\n<p>儿童听力学评估需多项检查互补，理解每项检查的适用范围与解读逻辑。</p>\n<h4>1. 听觉脑干诱发电位（ABR）</h4>\n<ul><li>刺激声：<b>短声（click）</b> 与 <b>短纯音（tone burst）</b>。</li><li>通路：<b>气导 ABR</b> 与 <b>骨导 ABR</b>（骨导用于鉴别传导性 vs 感音神经性）。</li><li>短纯音 ABR 可得到分频（频率特异性）阈值，常用于轻中度听力损失的频率评估。</li></ul>\n<h4>2. 声导抗（声阻抗）</h4>\n<ul><li>鼓室图（A/B/C/As/Ad 型）判断中耳状态。</li><li>声反射辅助判断听神经与脑干通路。</li></ul>\n<h4>3. 耳声发射（OAE）</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>类型</th><th>用途</th><th>解读</th></tr></thead>\n<tr><td><b>TEOAE（瞬态耳声发射）</b></td><td><b>筛查</b>用</td><td>未引出提示耳蜗（外毛细胞）功能异常</td></tr>\n<tr><td><b>DPOAE（畸变产物耳声发射）</b></td><td><b>诊断</b>用</td><td>频率特异性好，用于诊断评估</td></tr>\n<tr><td>通用判读</td><td>—</td><td>OAE <b>未引出</b>提示听力损失 <b>&gt;30–40 dB</b> 或<b>传导性</b>问题</td></tr>\n</table>\n<h4>4. 多频稳态诱发电位（ASSR）</h4>\n<ul><li>适用于<b>重度及以上</b>听力损失阈值预估（客观、可多频同时给声）。</li><li><b>轻、中度</b>听力损失更推荐用<b>短纯音 ABR</b> 评估。</li></ul>\n<h4>5. 小儿行为测听（按年龄选择方法）</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>方法</th><th>英文 / 简称</th><th>适用年龄</th><th>说明</th></tr></thead>\n<tr><td>行为观察测听</td><td><b>BOA</b>（Behavioral Observation Audiometry）</td><td><b>&lt; 6 个月</b></td><td>观察惊跳、睁眼、安静等反射性反应</td></tr>\n<tr><td>视觉强化测听</td><td><b>VRA</b>（Visual Reinforcement Audiometry）</td><td><b>7 月 – 2.5 岁</b></td><td>转头找声源 + 视觉奖励（7 月可 conditioned 转头）</td></tr>\n<tr><td>游戏测听</td><td><b>PA</b>（Play Audiometry）</td><td><b>2.5 – 5 岁</b></td><td>将听声反应嵌入游戏动作</td></tr>\n<tr><td>主观测听</td><td><b>PTA</b>（纯音测听）</td><td>能配合的较大儿童</td><td>裸耳测听，获取行为听阈</td></tr>\n</table>\n<h4>与题库对应考点</h4>\n<ul><li>OAE 类型用途：TEOAE 筛查 / DPOAE 诊断。</li><li>OAE 未引出意义（&gt;30–40 dB 或传导性）。</li><li>ASSR vs 短纯音 ABR 的轻重选择。</li><li>行为测听年龄分层与英文缩写（BOA / VRA / PA / PTA）。</li><li>ABR 气导/骨导、短声/短纯音概念。</li></ul>\n<hr>\n<div class=\"lec-sec-head\"><h3>六、听觉发育月龄规律</h3><button class=\"lec-practice\" onclick='practiceTopics([\"行为测听法\", \"分龄测听法\", \"VOT\"])'>🏋 练本节相关的题 →</button></div>\n<p>理解正常听觉与言语发育里程碑，才能识别「该有反应却没有」的异常。</p>\n<table class=\"lec-tbl\">\n<thead><tr><th>月龄</th><th>听觉/行为反应</th><th>言语发展</th></tr></thead>\n<tr><td>出生–1 月</td><td>突发声响出现惊跳反射（Moro）、安静/啼哭变化</td><td>反射性发声</td></tr>\n<tr><td>2–3 月</td><td>觉醒时注意声音、停止活动听声</td><td>发出「咿呀」元音</td></tr>\n<tr><td><b>3–4 月</b></td><td><b>对 50–60 dB 声音有反应</b></td><td>笑出声，咕咕声</td></tr>\n<tr><td>5–6 月</td><td>转向声源倾向增强</td><td>呀呀学语（辅音出现）</td></tr>\n<tr><td><b>7 月</b></td><td><b>可 conditioned 转头寻声 → VRA 适用</b></td><td>重复音节（ba-ba）</td></tr>\n<tr><td>9–12 月</td><td>听懂简单指令、定位准确</td><td>有意识叫「爸/妈」、首批词汇</td></tr>\n<tr><td>1.5–2 岁</td><td>群聊中能分辨熟悉声</td><td>词组、短句</td></tr>\n<tr><td>3 岁+</td><td>嘈杂环境也能交流</td><td>完整句子、叙事</td></tr>\n</table>\n<h4>核心记忆</h4>\n<ul><li><b>3–4 月：50–60 dB 有反应</b>（考题常考该 dB 值）。</li><li><b>7 月：可转头 → VRA 开始可用</b>（与行为测听年龄分界呼应）。</li></ul>\n<h4>与题库对应考点</h4>\n<ul><li>各月龄听觉反应与 dB 数（3–4 月 50–60 dB）。</li><li>7 月转头能力 → VRA 适用起点。</li></ul>\n<hr>\n<div class=\"lec-sec-head\"><h3>七、学龄期听障儿童康复</h3><button class=\"lec-practice\" onclick='practiceTopics([\"助听器听觉康复/适应\", \"言语康复教学法\", \"康复计划制定\"])'>🏋 练本节相关的题 →</button></div>\n<h4>1. 聆听环境优化</h4>\n<ul><li>三大声学因素：<b>噪声、混响、信噪比（SNR）</b>。</li><li>教室座位建议：坐<b>第 2–3 排中间</b>，正对老师、距离适中、减少后方噪声。</li><li>助听器<b>方向性麦克风</b>开启后：对<b>侧面、后面</b>声源有衰减（聚焦前/上方讲话声），故需让孩子面向说话人。</li></ul>\n<h4>2. 康复原则</h4>\n<ul><li>早干预、个性化、家校协同、听觉优先（auditory-first）。</li><li>结合助听设备（助听器/人工耳蜗）+ 语训 + 教育支持。</li></ul>\n<h4>3. 听觉训练四过程（层级递进）</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>层级</th><th>名称</th><th>含义</th><th>举例</th></tr></thead>\n<tr><td>1</td><td><b>觉察（Detection）</b></td><td>听到「有无声音」</td><td>知道声音出现了</td></tr>\n<tr><td>2</td><td><b>辨别（Discrimination）</b></td><td>区分声音异同</td><td>分辨「pa」与「ba」不同</td></tr>\n<tr><td>3</td><td><b>识别（Identification）</b></td><td>认出是什么</td><td>听到并说出「猫」</td></tr>\n<tr><td>4</td><td><b>理解（Comprehension）</b></td><td>明白含义</td><td>理解句子语义</td></tr>\n</table>\n<h4>4. 分年龄段训练目标</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>年龄段</th><th>训练重点目标</th></tr></thead>\n<tr><td><b>6–11 岁（学龄期）</b></td><td>巩固听觉技能、课堂聆听、词汇与语句理解、读唇辅助</td></tr>\n<tr><td><b>12–18 岁（青少年期）</b></td><td>复杂语言（抽象、隐喻）、社交沟通、自主学习与设备自我管理</td></tr>\n</table>\n<h4>与题库对应考点</h4>\n<ul><li>聆听环境三要素（噪声/混响/信噪比）、座位建议（2–3 排中间）。</li><li>方向性麦克风对侧面/后面的衰减特点。</li><li>听觉训练四过程顺序（觉察→辨别→识别→理解）。</li><li>6–11 岁 / 12–18 岁训练目标差异。</li></ul>\n<hr>\n<div class=\"lec-sec-head\"><h3>八、职业道德与三级预防</h3><button class=\"lec-practice\" onclick='practiceTopics([\"职业道德特征\", \"残疾预防条例\", \"残疾人康复条例-隐私\"])'>🏋 练本节相关的题 →</button></div>\n<h4>1. 职业道德</h4>\n<ul><li><b>保护隐私</b>：患儿及家庭听力资料、基因信息属敏感个人信息，须严格保密。</li><li>诚信服务、科学验配、如实告知、不夸大疗效。</li><li>尊重家长知情权与选择权，尤其涉及人工耳蜗等重大事项。</li></ul>\n<h4>2. 三级预防（听力残疾预防体系）</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>级别</th><th>目标</th><th>措施举例</th></tr></thead>\n<tr><td><b>一级预防</b></td><td>防发生</td><td>孕前/孕期保健、避免耳毒性药物、预防感染（TORCH）</td></tr>\n<tr><td><b>二级预防</b></td><td>早发现早诊断</td><td>新生儿听力筛查、早期诊断</td></tr>\n<tr><td><b>三级预防</b></td><td>防残障/促康复</td><td>助听干预、语训、教育康复、减少残疾影响</td></tr>\n</table>\n<h4>与题库对应考点</h4>\n<ul><li>职业道德情境题（隐私保护、知情同意）。</li><li>三级预防的定义与对应措施区分。</li></ul>\n<hr>\n<div class=\"lec-sec-head\"><h3>九、真题高频考点速记</h3></div>\n<table class=\"lec-tbl\">\n<thead><tr><th>高频考点</th><th>标准答案要点</th></tr></thead>\n<tr><td>新生儿听力筛查初筛时间</td><td>出生 <b>24–72 小时</b>（常考 72h）</td></tr>\n<tr><td>婴儿期定义</td><td><b>28 天 – 1 周岁</b></td></tr>\n<tr><td>VRA 英文全称</td><td><b>Visual Reinforcement Audiometry</b>（视觉强化测听）</td></tr>\n<tr><td>听觉观察测听 BOA</td><td><b>Behavioral Observation Audiometry</b>，适用 <b>&lt; 6 个月</b></td></tr>\n<tr><td>三早原则</td><td>早发现、早诊断、早干预（可加早语训）</td></tr>\n<tr><td>听神经病典型表现</td><td>OAE 可引出，AABR 引不出</td></tr>\n<tr><td>遗传性聋比例</td><td>50%–60%</td></tr>\n<tr><td>最常见隐性遗传基因</td><td>GJB2（connexin 26）</td></tr>\n<tr><td>药物性聋相关基因</td><td>线粒体 DNA（避氨基糖苷）</td></tr>\n<tr><td>大前庭导水管综合征基因</td><td>SLC26A4</td></tr>\n<tr><td>OAE 未引出意义</td><td>听力损失 &gt;30–40 dB 或传导性</td></tr>\n<tr><td>听觉训练四过程</td><td>觉察→辨别→识别→理解</td></tr>\n</table>\n<hr>\n<div class=\"lec-sec-head\"><h3>十、本节对应题库考点（复习范围）</h3></div>\n<p>以下为结合本节内容可对照 363 题题库的复习方向（按主题归类，供刷题时定位，无需精确到每题号）：</p>\n<p>1. <b>新生儿听力筛查与干预时间轴</b></p>\n<ul><li>初筛（24–72h）、复筛（42 天内）、诊断（3 个月内）、干预（6 个月内）、CI 评估（10–12 月）、NICU 双项筛查。</li><li>筛查未过率高的原因（羊水/胎脂/中耳积液）。</li></ul>\n<p>2. <b>听神经病（ANSD）</b></p>\n<ul><li>OAE 与 AABR 结果矛盾；高危因素（缺氧、高胆红素）。</li></ul>\n<p>3. <b>病史采集与病因</b></p>\n<ul><li>孕期感染五联（弓形体/巨细胞/风疹/梅毒/单疱）。</li><li>耳毒性药物；缺氧/高胆红素。</li><li>遗传：比例、GJB2、线粒体（药物性聋）、SLC26A4（大前庭）。</li></ul>\n<p>4. <b>听力学检查</b></p>\n<ul><li>ABR（气导/骨导、短声/短纯音）。</li><li>声导抗意义。</li><li>OAE：TEOAE 筛查 / DPOAE 诊断，未引出判读。</li><li>ASSR 与短纯音 ABR 的轻重适用选择。</li><li>小儿行为测听年龄分层与英文（BOA/VRA/PA/PTA）。</li></ul>\n<p>5. <b>听觉与言语发育</b></p>\n<ul><li>月龄规律（3–4 月 50–60 dB；7 月转头→VRA）。</li><li>各阶段言语发展里程碑。</li></ul>\n<p>6. <b>学龄期康复</b></p>\n<ul><li>聆听环境（噪声/混响/信噪比、座位 2–3 排中间、方向性衰减侧面/后面）。</li><li>听觉训练四过程；6–11 岁 / 12–18 岁目标。</li></ul>\n<p>7. <b>职业道德与预防</b></p>\n<ul><li>隐私保护等职业道德规范。</li><li>三级预防定义与措施区分。</li></ul>\n<p>8. <b>概念/定义类单选题</b></p>\n<ul><li>婴儿期（28 天–1 周岁）、VRA/BOA 英文与适用年龄、三早原则等。</li></ul>\n<hr>\n<blockquote><b>复习建议</b>：本节以「时间轴 + 年龄分层 + 检查选择」三条主线串联，建议结合题库把每条时间节点（72h / 42 天 / 3 月 / 6 月 / 10–12 月）和行为测听年龄分界（&lt;6 月 BOA、7 月–2.5 岁 VRA、2.5–5 岁 PA）做成记忆卡片，配对刷题效果最佳。</blockquote>"}, {"id": "l3", "no": "第③课", "title": "声导抗测试", "teacher": "申屠思灵", "dur": "约 1h50m", "file": "钉钉直播回放_申屠思灵_声导抗测试.md", "body": "<h2>学习笔记 ·《声导抗测试 + 小儿行为测听（游戏测听）》（申屠思灵）</h2>\n<blockquote>来源：钉钉直播回放 · 讲师申屠思灵</blockquote>\n<blockquote>时长：约 110 分钟</blockquote>\n<blockquote>主题：声导抗测试原理 + 鼓室图分型 + 声反射（镫骨肌反射）+ 游戏测听（小儿行为测听）</blockquote>\n<blockquote>整理：AI 据转写稿结构化（术语已纠错：声导抗 / 声反射 / 鼓室图 / 镫骨肌反射 / 行为测听等）</blockquote>\n<hr>\n<div class=\"lec-sec-head\"><h3>一、声导抗测试基础（声阻抗 + 声导纳）</h3><button class=\"lec-practice\" onclick='practiceTopics([\"声导抗\", \"声导抗探测音\", \"鼓室图\", \"鼓室图分型\", \"声反射/镫骨肌\", \"不舒适阈\"])'>🏋 练本节相关的题 →</button></div>\n<h4>1. 概念与「弹簧类比」</h4>\n<ul><li><b>声导抗 = 声阻抗 + 声导纳</b> 二者的总称。</li><li><b>声阻抗（Z）</b> 由两部分组成：</li><li><b>声阻</b>：能量被消耗、不可逆的部分 → 类比「购物车车轮与地面的<b>摩擦力</b>」。</li><li><b>声抗</b>：能量暂时储存、可反弹释放（不消耗）的部分 → 类比「购物车里的<b>弹簧</b>，推时压缩储能、放开回弹」。</li><li><b>声导纳（Y）</b> 也由两部分组成：</li><li><b>声导</b>：真正允许声音能量通过的部分 → 类比「水龙头里<b>实际流过的水流</b>」。</li><li><b>声纳</b>：声音被暂时储存、反弹的能力（虚分量）→ 类比「<b>弹簧床</b>跳上去会反弹、不牺牲能量」。</li><li>概念上声导与声阻相反、声纳与声抗相反，但数量上<b>不是简单的倒数关系</b>。</li><li>一句话记忆：<b>声阻抗 = 阻碍（消耗+储存），声导纳 = 通过（实流+虚弹）</b>。</li></ul>\n<blockquote>📌 <b>题库考点</b>：声导抗是声阻抗与声导纳的总称；弹簧/购物车类比用来区分「声阻（摩擦）、声抗（弹簧）、声导（水流）、声纳（弹簧床反弹）」。</blockquote>\n<h4>2. 中耳阻抗三因素与探测音选择</h4>\n<p>中耳的阻抗特性由三个物理因素决定，不同频率受影响不同：</p>\n<table class=\"lec-tbl\">\n<thead><tr><th>因素</th><th>与频率的关系</th><th>对应探测音</th><th>说明</th></tr></thead>\n<tr><td><b>质量</b></td><td>频率↑→质量影响<b>越大</b>；质量增加→声能传递减小</td><td><b>678 / 1000 Hz（高频）</b></td><td>评估质量因素疾病（如中耳积液）时用高频探测音</td></tr>\n<tr><td><b>劲度（ stiffness ）</b></td><td>频率↑→劲度作用<b>越小</b>（成反比）</td><td><b>226 Hz（低频）</b></td><td>成人中耳发育完成后以劲度为主，故常规用 226 Hz</td></tr>\n<tr><td><b>摩擦</b></td><td>贯穿全程的损耗</td><td>—</td><td>能量消耗部分</td></tr>\n</table>\n<ul><li>*探测音选择结论（必背）：**</li></ul>\n<table class=\"lec-tbl\">\n<thead><tr><th>对象</th><th>探测音</th><th>原因</th></tr></thead>\n<tr><td>成人 / 大多数儿童（≥6 月，中耳接近成人）</td><td><b>226 Hz</b></td><td>中耳以「劲度」因素为主</td></tr>\n<tr><td><b>&lt; 6 个月婴儿</b></td><td><b>100 Hz</b></td><td>婴儿中耳结构「团在一起」、以<b>质量</b>为主</td></tr>\n<tr><td>评估质量因素疾病（中耳积液等）</td><td><b>678 / 1000 Hz 高频</b></td><td>高频声受质量因素影响大；<b>高频探测音无峰 → 提示中耳积液</b></td></tr>\n</table>\n<blockquote>📌 <b>题库考点</b>：成人用 226 Hz；&lt;6 月婴儿用 100 Hz（质量为主）；高频（678/1000 Hz）探测音无峰提示中耳积液。</blockquote>\n<h4>3. 测试仪结构与探头「三小管」</h4>\n<ul><li>声导抗仪分手动型、自动筛查型；常用<b>单一低频探测音</b>测试。</li><li>基本结构：探头 + 探测音扬声器 + 气泵（气压系统）+ 分析处理系统 + 气压表 + 声反射刺激信号装置。</li><li><b>耳塞探头有三个小管（必记）：</b></li><li><b>上管</b> = 刺激信号装置（发探测音 / 刺激声）</li><li><b>中管</b> = 气泵、气压计（改变并测外耳道压力）</li><li><b>下管</b> = 麦克风（持音器，接收反射回来的声能）</li><li>测试原理：探测音进入密闭外耳道 → 同时向中耳发刺激信号 → 气泵改变压力 → 据鼓膜松弛变化反弹回的压力，推算声导纳（声顺）。</li></ul>\n<blockquote>📌 <b>题库考点</b>：探头三小管对应「刺激信号 / 气泵气压 / 麦克风」；鼓室图测试是向外耳道加压、记录声导纳随压力变化的函数。</blockquote>\n<hr>\n<div class=\"lec-sec-head\"><h3>二、鼓室图（Tympanogram，Jerger ABC 分型）</h3><button class=\"lec-practice\" onclick='practiceTopics([\"鼓室图\", \"鼓室图分型\", \"咽鼓管功能障碍声导抗\", \"传导性聋声导抗\"])'>🏋 练本节相关的题 →</button></div>\n<h4>1. 测试原理与读图</h4>\n<ul><li>做法：向外耳道施加压力（x 轴，约 <b>+200 ~ −400 daPa</b>），改变鼓膜紧张度 → 记录不同压力下的声导纳（y 轴）→ 形成「中间高、两边低」的山峰状曲线。</li><li>零压力（0 daPa）时内外压力平衡、鼓膜最松弛、传声能力最大，故峰在 0 附近。</li><li><b>三个核心读图指标：</b></li></ul>\n<table class=\"lec-tbl\">\n<thead><tr><th>指标</th><th>含义</th><th>正常参考（成人）</th></tr></thead>\n<tr><td><b>外耳道等效容积</b></td><td>探头形成密闭空腔的容积；偏大提示穿孔/置管，偏小提示耵聍/抵壁</td><td><b>0.6 ~ 1.5 mL</b></td></tr>\n<tr><td><b>静态补偿声顺</b>（峰压点声顺）</td><td>仪器自动扣除外耳道容积影响后、代表中耳「弹性」的真实值；越高越软、越低越硬</td><td><b>0.3 ~ 1.6 mL</b></td></tr>\n<tr><td><b>峰压值（TPP）</b></td><td>峰对应的压力 = 中耳内压；偏离 0 多提示咽鼓管问题</td><td><b>−100 ~ +100 daPa</b>（部分教材 −100 ~ +50）</td></tr>\n</table>\n<ul><li><b>宽度 / 梯度</b>（机器自动测）：宽度 = 峰值一半高度处的压力范围；梯度 = ±50 daPa 内曲线高度 / 峰值。宽度越大 → 气骨导差越大（积液、耳硬化、炎症均可致异常）。</li></ul>\n<h4>2. 鼓室图分型总表（A / As / Ad / B / C）</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>分型</th><th>峰压</th><th>声顺</th><th>外耳道容积</th><th>临床意义 / 常见疾病</th></tr></thead>\n<tr><td><b>A 型（正常型）</b></td><td>−100 ~ +100 daPa</td><td>0.3 ~ 1.6 mL</td><td>0.6 ~ 1.5 mL</td><td>正常中耳（或轻度/早期病变）</td></tr>\n<tr><td><b>As 型</b></td><td>正常</td><td><b>&lt; 0.3 mL</b>（峰矮）</td><td>正常</td><td>听骨链固定、耳硬化、鼓膜活动度降低（劲儿大、偏硬）</td></tr>\n<tr><td><b>Ad 型</b></td><td>正常</td><td><b>&gt; 1.6 mL</b>（峰高）</td><td>正常</td><td>鼓膜松弛、听骨链中断、鼓膜萎缩性穿孔（劲儿小、偏软）</td></tr>\n<tr><td><b>B 型（平坦型）</b></td><td>—（<b>无峰</b>）</td><td>—</td><td>看容积区分（见下）</td><td>中耳积液 / 耵聍栓塞 / 鼓膜穿孔</td></tr>\n<tr><td><b>C 型（负压型）</b></td><td><b>&lt; −100 daPa</b></td><td>正常</td><td>正常</td><td>咽鼓管功能障碍，中耳持续负压、被「吸陷」</td></tr>\n</table>\n<blockquote>📌 <b>题库考点</b>：A 型峰压 −100~+100、声顺 0.3~1.6、外耳道容积 0.6~1.5；As=声顺&lt;0.3（固定/耳硬化）；Ad=声顺&gt;1.6（松弛/中断）；B=平坦无峰；C=负压（峰压&lt;−100，咽鼓管障碍）。</blockquote>\n<h4>3. B 型判断关键：看「外耳道等效容积」</h4>\n<p>B 型本身无峰，必须结合容积区分病因：</p>\n<table class=\"lec-tbl\">\n<thead><tr><th>外耳道等效容积</th><th>提示</th></tr></thead>\n<tr><td><b>过小（如 &lt; 0.3 mL）</b></td><td>耵聍栓塞 / 探头抵壁</td></tr>\n<tr><td><b>正常</b></td><td><b>中耳积液</b>（鼓室图平坦典型原因）</td></tr>\n<tr><td><b>增大</b>（成人 &gt; 2.5 mL、儿童 &gt; 2 mL；或双耳差成人 &gt; 1、儿童 &gt; 0.5）</td><td>鼓膜穿孔 / 通气管（置管）</td></tr>\n</table>\n<blockquote>📌 <b>题库考点</b>：鼓室图可通过外耳道容积异常发现鼓膜穿孔；但「最优选」诊断穿孔是耳镜，考试不首选鼓室图判穿孔。</blockquote>\n<h4>4. 鼓室图的局限</h4>\n<ul><li>只反映<b>离探头最近（鼓膜）</b>的病变；对听力损失程度<b>无直接判断价值</b>。</li><li>临床诊断必须结合：病史、物理检查、纯音测听、声发射、其他听力学与影像学<b>综合判断</b>，不可单凭鼓室图下结论。</li></ul>\n<h4>5. 宽频声导抗（简述）</h4>\n<ul><li>以宽频噪声为探测音，将探头发出的宽频声定义为入射声能，部分被吸收传入、部分被反射回探头，据反射率作图。</li><li>图形较复杂，目前更多用于科研；常规临床以<b>单成分（单频 226 Hz）鼓室图</b>为主即可。</li></ul>\n<blockquote>📌 <b>题库考点</b>：鼓室图分型用 226 Hz；小儿一般 6 月~3 岁用高频探测音，4 岁以上基本同成人用 226 Hz。</blockquote>\n<hr>\n<div class=\"lec-sec-head\"><h3>三、声反射（镫骨肌反射 / 镫骨肌收缩）</h3><button class=\"lec-practice\" onclick='practiceTopics([\"声反射/镫骨肌\", \"不舒适阈\", \"声导抗应用\"])'>🏋 练本节相关的题 →</button></div>\n<h4>1. 保护机制与反射通路</h4>\n<ul><li>当人耳受到<b>足够强（&gt; 80 dB）且足够时长</b>的声音刺激，引起<b>镫骨肌收缩</b> → 听骨链收紧 → 减少强声传入内耳 → <b>保护内耳</b>（类似大声保护机制）。</li><li>反射属<b>皮层下中枢</b>的简单反射，大脑听觉中枢病变不一定影响声反射。</li><li><b>反射通路：</b></li><li><b>同侧</b>：刺激耳 → 同侧耳蜗 → 同侧脑干 → 同侧面神经 → 同侧镫骨肌。</li><li><b>对侧</b>：刺激耳 → 对侧耳蜗 → 脑干交叉 → 对侧（或同侧）面神经 → 镫骨肌。</li><li><b>同侧 / 对侧 / 指示耳：</b></li><li><b>刺激耳</b> = 给声的耳朵；<b>指示耳</b> = 放探头的耳朵（测声导纳变化）。</li><li>左耳同侧：刺激=指示=左耳；左耳对侧：刺激左、指示右（反之亦然）。</li></ul>\n<blockquote>📌 <b>题库考点</b>：强声 &gt; 80 dB 触发镫骨肌收缩保护内耳；反射不受大脑听觉中枢直接影响（皮层下）。</blockquote>\n<h4>2. 声反射阈（ART）与同侧 / 对侧</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>项目</th><th>正常值</th></tr></thead>\n<tr><td>同侧声反射阈（512 / 4000 Hz 刺激音）</td><td><b>70 ~ 95 dB HL</b></td></tr>\n<tr><td>对侧声反射阈</td><td>比同侧<b>低 3 ~ 12 dB</b></td></tr>\n<tr><td>白噪声声反射阈</td><td>比纯音<b>低 20 ~ 25 dB</b></td></tr>\n</table>\n<ul><li>引出判定：226 Hz 探测音下声导纳变化量 <b>&gt; 0.03</b>（部分要求 &gt; 0.05）即认为引出；强度越大收缩越强。</li><li>判定用<b>感觉级（SL）</b>而非纯 HL：蜗性聋虽听不清小声，但声一大就「吵得受不了」（重振），照样能触发保护性收缩。</li></ul>\n<h4>3. 不同听力损失性质的声反射表现（必背）</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>听力损失类型</th><th>声反射表现</th></tr></thead>\n<tr><td><b>传导性聋（差耳）</b></td><td>差耳同侧、差耳对侧声反射<b>均消失或阈值严重升高</b>（声音传不进去，能量太小引不出）；健耳同侧可引出，健耳→差耳的对侧消失</td></tr>\n<tr><td><b>感音神经性聋（蜗性·重振）</b></td><td>看损失程度：轻中度可引出；重度引不出；<b>处于重振范围内能引出</b>；患耳同侧/健耳对侧可引出，患耳对侧/健耳同侧不受影响</td></tr>\n<tr><td><b>蜗后病变</b></td><td>声反射<b>多消失或阈值严重升高</b>；引得出基本可排除蜗后，各种检查示蜗后且声反射未引出→可确诊（以 ABR 协助）</td></tr>\n</table>\n<ul><li><b>声反射阈与纯音听力的差值</b>：差值越小 → 重振越明显 → <b>蜗性病变指标</b>；反射存在基本可排除蜗后病变。</li></ul>\n<blockquote>📌 <b>题库考点</b>：传导性聋差耳同侧+对侧均消失；感音性聋看重振（声反射存在提示蜗性病变，引不出提示蜗后）；单耳感音神经性聋时患耳同侧、健耳对侧反射可引出。</blockquote>\n<h4>4. 声反射衰减（声反射衰变）</h4>\n<ul><li>方法：用 <b>500 Hz 或 1000 Hz 纯音</b>持续刺激 <b>10 秒</b>，观察镫骨肌收缩幅度。</li><li><b>衰减 &gt; 50%（阳性）→ 提示蜗后病变</b>。</li><li>为何只用 500/1000 Hz：高频信号收缩衰减过快，无法保证 10 秒内维持收缩状态。</li></ul>\n<h4>5. 潜伏期</h4>\n<ul><li>正常潜伏期有指标；<b>&gt; 140 ms</b>，或<b>双耳差值 &gt; 40 ms → 提示蜗后病变</b>（可提示蜗后性耳聋）。</li></ul>\n<h4>6. 临床用途与注意事项</h4>\n<ul><li>用途：① 验配中不舒适阈（UCL）的参考（患者无法配合测 UCL 时快速客观估）；② 定位诊断（面神经/耳蜗/脑干）；③ 鉴别伪聋；④ 儿童听力筛查组合（声导抗 + OAE）。</li><li>注意事项：指示耳传声功能必须正常；避免听觉疲劳（可升高阈）；<b>术后至少稳定 2 个月</b>才能做；消失可能因面神经/蜗后/探测耳传声障碍任一节点病变。</li></ul>\n<blockquote>📌 <b>题库考点</b>：声反射衰减阳性（&gt;50%）提示蜗后；潜伏期 &gt;140ms 或双耳差 &gt;40ms 提示蜗后；术后 2 个月才可做声反射。</blockquote>\n<hr>\n<div class=\"lec-sec-head\"><h3>四、小儿行为测听（BOA / VRA / PA）</h3><button class=\"lec-practice\" onclick='practiceTopics([\"行为测听法\", \"分龄测听法\", \"新生儿筛查\", \"VOT\"])'>🏋 练本节相关的题 →</button></div>\n<h4>1. 三种方法总表（缩写、年龄、条件化、反应方式）</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>方法</th><th>英文 / 缩写</th><th>适用年龄</th><th>是否条件化（强化）</th><th>反应方式</th><th>能否分耳</th></tr></thead>\n<tr><td><b>行为观察测听</b></td><td>BOA（Behavioral Observation Audiometry）</td><td><b>&lt; 6 个月</b></td><td>无（仅筛查/出入指标）</td><td>反射性：觉醒反射、惊跳（Moro/拥抱）反射、眼震反射</td><td>否（声场，反映双耳综合）</td></tr>\n<tr><td><b>视觉强化测听</b></td><td>VRA（Visual Reinforcement Audiometry）</td><td><b>7 月 ~ 2.5 岁</b></td><td>是（建立声音—转头—奖励链接）</td><td>听到声→转头看发光/动画箱</td><td>可戴耳机（但不如 PA 易）</td></tr>\n<tr><td><b>游戏测听</b></td><td>PA（Play Audiometry）</td><td><b>2.5 ~ 5 岁（或更大）</b></td><td>是（建立游戏规则）</td><td>听声做游戏（如听声放积木入桶）</td><td><b>可戴耳机分耳测（最大优势）</b></td></tr>\n</table>\n<blockquote>📌 <b>题库考点</b>：BOA = 6 月内、无强化、仅筛查；VRA = 7 月~2.5 岁、条件化；PA = 2.5~5 岁。三者的英文缩写与适用年龄必须一一对应记牢。</blockquote>\n<h4>2. BOA（行为观察测听）</h4>\n<ul><li>定义：给校准刺激声后，在数秒（约 3 秒）时间窗内观察小儿是否出现可辨认的行为改变（看「行为改变」而非「是否听见」）。</li><li>适用：6 个月内婴儿——不能独坐、认知未发展到可建立声音—奖励联系，行为受反射/本能支配。</li><li>观察指标：觉醒反射（突然睁眼）、惊跳反射（Moro 反射：双臂外展内收的拥抱动作）、眼震反射。</li><li>刺激声：校准的窄带噪声、啭音、纯音或发声玩具（兼顾低/中/高频，粗略判断听力问题）。</li><li><b>假阳性多</b>（婴儿自发活动易误判）、假阴性；只作「听力正常/已有损失」的筛查指标，结果不精确，常配合 ABR / ASSR 交叉验证。</li><li>记录要求：写清声源（玩具名）、强度、给声侧、具体反应（如「发声小熊 60 dB SPL 左，给声后转头向左」），不可只写「有/无反应」。</li></ul>\n<h4>3. VRA（视觉强化测听）</h4>\n<ul><li>做法：带光源玩具/电视（放左右前方透明箱）配合声刺激，先「上课」建立「听声→转头→奖励出现」的条件反射，再测听。</li><li><b>核心临床价值</b>：可逐渐降低强度，找到小儿刚好能听到的最小反应阈（≈纯音听阈）。</li><li>体格条件：7 月左右能独坐、颈部控制稳、进入有意识交流阶段、对动/发光物好奇——具备条件化基础；2.5 岁以上可过渡到 PA。</li><li>双人操作：一人在控制室给声，一人在隔声室吸引/观察；家长可陪同但须<b>提前解释、不得给任何暗示</b>（掐一下、腿抖都不可，否则建立的是「家长暗示→转头」而非「听声→转头」）。</li><li><b>条件化关键</b>：给声强度<b>一定要给足</b>，确保孩子真听到，再慢慢延长「先给声、后亮箱」的间隔建立链接；多次不给反应要重做条件化。</li><li>假阳性（提前转头抢玩具）、假阴性（延迟反应，有效窗口 <b>1.5~3 秒</b>内转头才有效）；测试者要当「木头人」，手/肩/身/表情绝不暴露给声方向与信号。</li></ul>\n<h4>4. PA 游戏测听（重点）</h4>\n<ul><li>定义：让小儿参与与年龄、生理发育相称的简单有趣游戏，对给出的声音做出明确可靠反应，从而得到听力反应阈。</li><li>适用：<b>2.5 ~ 5 岁</b>（更大也可；配合极好 3 岁可试纯音，发育慢者 6~7 岁仍可用）。填补 2.5~5 岁过渡期；5 岁左右多可配合常规纯音测听。</li><li>常见游戏：听声放积木（听到声音把手里积木放进桶里）。<b>条件化</b>：手把手带做几次（「宝宝注意听，听到声音把积木放桶里」），确认理解规则后再正式测。</li><li><b>测试频率同纯音测听</b>：先 1000/2000/4000/500 Hz（语频重要，先测 1k/4k/0.5k），再补 250/125 Hz；骨导同法。气导完配合好可加测骨导阈。</li><li><b>最大优势：可戴耳机分耳测</b>——左耳给声只测左、右耳给声只测右，获得每耳独立听阈，早发现每耳问题（BOA/VRA 多在声场，测的是「好耳」水平，差耳被掩盖）。</li><li>条件化给声强度：<b>15~20 dB 以上</b>确保听到，直到完全理解规则；证实测试时才降强度。测试者要「眼观六路」关注表情/状态/反应速度。</li><li>报告须写清小儿状态、结果可靠性、假阳性/假阴性判别；连续 2~3 次无反应或过度反应，须返回条件化用大声确认。</li></ul>\n<blockquote>📌 <b>题库考点</b>：游戏测听<b>可戴耳机分耳测</b>（错误说法：「不戴耳机只能声场、每耳都能测」是错的）；建立条件化必须给足声音（约 15~20 dB 以上）；假阳性=过度反应（阈偏低）、假阴性=延迟反应（阈偏高）。</blockquote>\n<h4>5. 小儿发育年龄参考（辅助记忆）</h4>\n<ul><li>0~3 月：抬头、哭笑，对 60~85 dB 有反应；<b>Moro 反射</b>为阶段性指标。</li><li>4~7 月：独坐，对 40~60 dB（FPL）有持续可信反应，进入有意识交流。</li><li>8~12 月：独立行动、模仿、有意义词。</li><li>1~2 岁：词汇阶段、精细动作。</li><li>2~5 岁：更好语言交流能力（游戏测听主要对象）。</li><li>新生儿筛查：出生 <b>72 小时内</b>初筛 → 42 天内复筛 → 3/6/9/12 月诊断；<b>6 月可配助听器，约 1 岁可人工耳蜗</b>。</li></ul>\n<hr>\n<div class=\"lec-sec-head\"><h3>五、本节对应题库考点（结合 363 题）</h3></div>\n<ul><li><b>声导抗总称</b>：声阻抗 + 声导纳；弹簧/购物车类比区分声阻（摩擦）、声抗（弹簧）、声导（水流）、声纳（弹簧床反弹）。</li><li><b>中耳三因素与探测音</b>：质量（高频 678/1000 Hz）、劲度（低频 226 Hz）、摩擦；成人 226 Hz；&lt;6 月婴儿 100 Hz（质量为主）；高频探测音无峰提示中耳积液。</li><li><b>探头三小管</b>：上管刺激信号、中管气泵/气压、下管麦克风。</li><li><b>鼓室图 ABC 分型（226 Hz）</b>：</li><li>A 型：峰压 −100~+100 daPa、声顺 0.3~1.6 mL、外耳道容积 0.6~1.5 mL（正常）；</li><li>As：声顺 &lt;0.3（听骨链固定/耳硬化）；Ad：声顺 &gt;1.6（松弛/中断）；</li><li>B：平坦无峰，看容积区分积液/耵聍/穿孔；</li><li>C：峰压 &lt;−100 daPa（咽鼓管功能障碍、负压）。</li><li><b>声反射（镫骨肌）</b>：&gt;80 dB 触发保护内耳；同侧阈 70~95 dB HL，对侧低 3~12 dB，白噪声低 20~25 dB；传导性聋差耳同侧+对侧均消失；感音性聋看重振（存在→蜗性，引不出→蜗后）；衰减（500/1000 Hz、10 秒内 &gt;50%）阳性→蜗后；潜伏期 &gt;140 ms 或双耳差 &gt;40 ms→蜗后。</li><li><b>小儿行为测听三法</b>：</li><li>BOA（&lt;6 月，无强化，仅筛查，声场双耳综合）；</li><li>VRA（7 月~2.5 岁，条件化，转头看发光箱，可求最小反应阈）；</li><li>PA 游戏测听（2.5~5 岁，条件化游戏，<b>可戴耳机分耳测</b>）。</li><li>英文缩写与适用年龄一一对应；4~6 月用 BOA、8 月用 VRA、34 月用 PA；新生儿 72 h 内初筛。</li><li><b>条件化与误差</b>：建立条件化给声须给足（约 15~20 dB 以上）；假阳性（过度/提前反应，阈偏低）、假阴性（延迟反应，有效窗口 1.5~3 秒，阈偏高）；测试者不可成信号源。</li><li><b>相关真题方向</b>：正常鼓室图形态（A 型）；6 月以下探测音（100 Hz）；咽鼓管功能（捏鼻鼓气后峰压向正压移动）；声导抗包括鼓室图+声反射（非言语测试）；双耳传导性/感音性聋的声导抗特点；单耳感音神经性聋反射引出规律；BOA/VRA/PA 的年龄与缩写对应。</li></ul>"}, {"id": "l4", "no": "第④课", "title": "言语测听与纯音测听", "teacher": "申屠思灵", "dur": "约 2h", "file": "钉钉直播回放_申屠思灵_言语测听与纯音测听.md", "body": "<h2>学习笔记 ·《言语测听与纯音测听》（申屠思灵）</h2>\n<blockquote>来源：钉钉直播回放 · 讲师申屠思灵（培训机构讲师，主讲三级验配师听力检测与耳模取样）</blockquote>\n<blockquote>时长：约 122 分钟 · 本节讲两块：<b>言语测听（含纯音测听基础）</b> + <b>耳模取样（耳模制取）</b></blockquote>\n<blockquote>整理：AI 据转写稿结构化（术语已纠错：听觉/听力、察觉阈、识别阈、言语接受阈、蜗性/蜗后、阳平格词、隔声室、校准、耳模制取等）</blockquote>\n<hr>\n<div class=\"lec-sec-head\"><h3>一、基础概念：听觉 vs 听力（先有四级纯音测听，才有三级言语测听）</h3><button class=\"lec-practice\" onclick='practiceTopics([\"言语测听基础\", \"纯音测听局限\"])'>🏋 练本节相关的题 →</button></div>\n<h4>1. 两个概念的本质区别</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>维度</th><th>听觉（Hearing 的生理层面）</th><th>听力（理解能力）</th></tr></thead>\n<tr><td>性质</td><td>生理性功能</td><td>心理 + 认知能力</td></tr>\n<tr><td>内涵</td><td>声音的物理<b>接收、传递、初步处理</b></td><td>主动的<b>理解、辨别、意义赋予</b></td></tr>\n<tr><td>依赖</td><td>听觉通路结构的完整性（被动感知）</td><td>大脑皮层整合分析（主动加工）</td></tr>\n<tr><td>一句话</td><td>只是「听到」</td><td>能够「听懂」</td></tr>\n<tr><td>检测</td><td>四级纯音测听只反映听觉通路情况</td><td>言语测听反映听力的整体情况</td></tr>\n</table>\n<ul><li><b>听觉是听力的生理基础，听力是听觉的高级认知延伸</b>：前者决定「是否听到」，后者决定「如何理解」。</li><li>验配师能帮的主要是<b>听觉障碍</b>；若为<b>听力障碍</b>（如儿童 APD 听觉处理障碍），则需后续语言训练、认知干预。</li><li>本节三级课程建立在四级纯音测听基础之上，纯音测听是验配的「前期基础工作」，而言语测听更多用于<b>助听器效果评估</b>。</li></ul>\n<h4>2. 信息处理的四层级：察觉 → 辨别 → 认定 → 识别</h4>\n<p>（从模糊感知到精确确认，逐层递进；听力理解也经历同样四步：有东西→是不是→我确定是→我懂了）</p>\n<table class=\"lec-tbl\">\n<thead><tr><th>层级</th><th>别名</th><th>含义</th><th>举例</th></tr></thead>\n<tr><td>① 察觉</td><td>查决</td><td>被动感知到「某事物存在」，不知任何细节</td><td>余光瞥见草丛晃动，知道「有动静」但不明原因</td></tr>\n<tr><td>② 辨别</td><td>辩别</td><td>通过对比分析不同特征，动用已有知识经验做初步加工</td><td>侧耳一听，判断是「动物叫声、像鸟、不是风」</td></tr>\n<tr><td>③ 认定</td><td>认定</td><td>基于个人经验/推理的主观确认，未经系统验证</td><td>看体型、颜色，凭经验得出「这是只麻雀」</td></tr>\n<tr><td>④ 识别</td><td>识别</td><td>客观系统比对验证后达成结论</td><td>查图鉴、比对羽毛/嘴形/叫声，客观确认「确实是麻雀」</td></tr>\n</table>\n<hr>\n<div class=\"lec-sec-head\"><h3>二、言语测听概述（概念、方法、作用）</h3><button class=\"lec-practice\" onclick='practiceTopics([\"言语测听作用\", \"言语测听基础\", \"言语识别阈\"])'>🏋 练本节相关的题 →</button></div>\n<h4>1. 什么是言语测听</h4>\n<ul><li><b>定义</b>：用<b>言语信号</b>作为刺激声，来检查被试者<b>言语听阈</b>及<b>言语识别能力</b>的一种听力检测方式。</li><li>与纯音测听一样，是听力测试中不可或缺的重要方法。</li><li><b>作用</b>：评估交流能力、评估助听器/人工耳蜗效果、管理康复期望值。</li></ul>\n<h4>2. 常用测听方法及核心指标</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>方法 / 指标</th><th>英文 / 缩写</th><th>定义</th><th>说明</th></tr></thead>\n<tr><td>言语识别阈</td><td><b>SRT</b>（Speech Reception Threshold），又称言语接受阈</td><td>能听懂 <b>50%</b> 言语信号所对应的最低言语级</td><td>临床上常规的言语测听内容，通常以<b>双音节（阳平格）词</b>为测试材料</td></tr>\n<tr><td>言语察觉阈</td><td><b>SDT / SAT</b>（Speech Detection / Awareness Threshold）</td><td>能<b>察觉</b> 50% 测试材料的最低言语级（能察觉但不能正确复述）</td><td>听损极重、言语识别能力很差、测不到 SRT 时使用，用以表达言语听力损失程度</td></tr>\n<tr><td>最大言语识别率</td><td>WRS（词语识别率）</td><td>在舒适级给声时，能听懂所测词表的<b>百分比</b></td><td>最有用、最常用的验配效果评估指标；一般测单/双音节词表</td></tr>\n<tr><td>背景噪声中言语识别</td><td>—</td><td>在设定信噪比（如 0 / 5 / 10 / −5 dB）的噪声环境下测识别率</td><td>最贴近真实聆听场景；常用 <b>信噪比 5 dB 或 10 dB</b></td></tr>\n</table>\n<blockquote>小提示：题库里「言语接受阈」即言语识别阈（SRT），反映「能听到但复述不出一半以上的最低强度」。</blockquote>\n<h4>3. 言语测试的核心术语：音位 / 音节 / 双音节 / 语句 / 开放-封闭项</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>术语</th><th>含义</th><th>考点 / 举例</th></tr></thead>\n<tr><td>音位</td><td>语言中能区分词义的<b>最小语音单位</b>，言语最基本的「砖块」</td><td>如声母 b/m 不同，区分「爸/妈」；音位识别本身无意义，但能改变词义</td></tr>\n<tr><td>音节</td><td>听能感受到的<b>最自然语音单位</b>，由 1 个或几个音位按规律组合</td><td>「爸」= 声母 + 韵母，构成独立完整声音单元</td></tr>\n<tr><td>双音节（阳平格词）</td><td><b>两个音节强度相等、无重音</b>的双音节词</td><td>篮球、茶杯、冰箱、火车；「柿子」有重音→不是阳平格词</td></tr>\n<tr><td>语句材料</td><td>最具自然语调、逻辑联系的连续言语</td><td>最能量化「能否正常交流」；中文句子冗余度高，抓关键词即可理解</td></tr>\n<tr><td>开放项测试</td><td>无标准答案，听到什么答什么</td><td>答对错有无数种可能，不受文化程度/方言影响</td></tr>\n<tr><td>封闭项测试</td><td>给出可供选择的有限项（类似 ABCD），选听到的一项</td><td>类似英语听力；儿童常用，降低紧张感</td></tr>\n</table>\n<ul><li><b>检查项 / 检查项组</b>：词表中每个测试词即一个检查项；一张检查表分组（如 25 词、5 词一组）。</li><li><b>引导语</b>：如「请跟我读（单音节测试词表）」，各平衡词表均有。</li></ul>\n<h4>4. 言语香蕉图（Speech Banana）</h4>\n<ul><li>是说话人在言语频率（约 250 Hz～6000 Hz）和强度（约 20～60 dB）上的分布区域。</li><li><b>与听力图结合看</b>：若听力图各频率点全部落在香蕉图内，说明患者基本能敏感捕捉、清晰听到日常言语声。</li><li><b>验配应用</b>：用真耳分析/助听器调试时，尽量把所有补偿点「补进」香蕉图；出具「验配前/后听力图+香蕉图」的直观报告，提升用户满意度。</li></ul>\n<hr>\n<div class=\"lec-sec-head\"><h3>三、言语测听的设备、给声方式与受试者准备</h3><button class=\"lec-practice\" onclick='practiceTopics([\"言语测听装置\", \"言语测听前准备\", \"言语听力计校准\"])'>🏋 练本节相关的题 →</button></div>\n<h4>1. 设备要求</h4>\n<ul><li><b>隔声室</b>：必须与纯音测听同要求；即便做背景噪声下言语测试，也在隔声室内通过设备制造噪声环境。</li><li><b>言语听力计</b>：分 <b>A 类 / B 类</b>（筛查型）。</li><li><b>A 类</b>：精度高、频率范围更宽、频率更精细、强度差更小（可达 5 dB，部分 2.5 dB 步进）、输出更高——用于正式言语测听。</li><li><b>B 类</b>：筛查型，精度较低。</li><li><b>校准（必考）</b>：测试前必须对听力计做<b>输出校准</b>，各耳机及扬声器有不同校准值；这是保证信号一致性、结果可靠可比的基础。内置言语测评材料（如 Bell 系列、各医院词表）的听力计精度更高。</li></ul>\n<h4>2. 两种给声方式：口声 vs 录音</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>对比项</th><th>口声给声</th><th>录音给声（推荐用于可比性评估）</th></tr></thead>\n<tr><td>做法</td><td>测试者实时发声（单词/句子）</td><td>播放录制的标准化语音材料（内置词表/电脑扬声器）</td></tr>\n<tr><td>优点</td><td>接近日常、有语调情感、灵活性高（可调速/量/重复）</td><td>强度、时长、重音严格统一，<b>一致性高、结果可靠可比、可多次复用</b></td></tr>\n<tr><td>缺点</td><td>一致性差、受发音/状态/口音影响，<b>不宜跨时间对比</b></td><td>较机械、灵活性低，对设备（扬声器校准、内置词表）要求高</td></tr>\n<tr><td>适用</td><td>临床快速筛查、不配合儿童、日常随意交谈式评估</td><td>助听器配前/配后对比、效果评估、期望值管理</td></tr>\n</table>\n<h4>3. 受试者准备与反应方式</h4>\n<ul><li><b>准备</b>（同纯音测听）：避免长时间噪声暴露（否则结果偏高）；清理耵聍/耳部疾病；耳机佩戴<b>左蓝右红</b>（戴反=考试零分）；讲解规则（先测哪耳、听到什么就复述、不确定也大胆猜、大致时长）。</li><li><b>反应方式对比</b>：</li></ul>\n<table class=\"lec-tbl\">\n<thead><tr><th>反应方式</th><th>说明</th><th>局限</th></tr></thead>\n<tr><td>口语声</td><td>口头回答，<b>最常用、最自然快速</b></td><td>受方言/口音、失语症、构音障碍影响，可能误判为「没听懂」</td></tr>\n<tr><td>笔写</td><td>书写文字或作答</td><td>慢；需听写能力与视觉-运动协调（失写症、卒中患者不能）</td></tr>\n<tr><td>按键</td><td>按选符合项</td><td>认知要求低，适合纯音测听；言语测试不理想</td></tr>\n</table>\n<hr>\n<div class=\"lec-sec-head\"><h3>四、言语测听的操作与结果判读</h3><button class=\"lec-practice\" onclick='practiceTopics([\"言语测听结果\", \"言语测听规则\", \"言语测听顺序\", \"言语测听掩蔽\"])'>🏋 练本节相关的题 →</button></div>\n<h4>1. 言语察觉阈（SDT）测试步骤</h4>\n<ul><li>所有测试<b>先测纯音听阈</b>；用口声/录音给声，从纯音听阈上 <b>20～30 dB</b> 开始往下降，用降阶法得出 SDT。</li><li>若听力图阈值已到设备极限输出，则测 SDT 也无意义，可能需考虑人工耳蜗。</li></ul>\n<h4>2. 言语识别阈（SRT）测试与 PTA 比较</h4>\n<ul><li>通常用<b>阳平格词（双音节）</b>测试。</li><li>从纯音听阈上 <b>15～20 dB</b> 开始，分配降档与升档，在 50% 左右用<b>线性内插法</b>求得 SRT（两点求一次函数 y=kx+b）。</li><li><b>SRT 与 PTA（纯音听阈均值）比较判读</b>：</li></ul>\n<table class=\"lec-tbl\">\n<thead><tr><th>差值</th><th>判读</th></tr></thead>\n<tr><td>≤ 6 dB</td><td>结果<b>吻合</b></td></tr>\n<tr><td>≤ 12 dB</td><td>结果<b>一致</b></td></tr>\n<tr><td>&gt; 12 dB</td><td>结果<b>不一致</b>（对感音神经性聋患者，SRT 往往高于 PTA，有助选配）</td></tr>\n</table>\n<h4>3. 最大言语识别率</h4>\n<ul><li>在舒适级（纯音听阈上 <b>30～40 dB</b>，即言语信息最丰富的 500～2000 Hz 范围）测试；也可从中小大声或固定 60/65/70 dB 模拟日常交谈。</li><li><b>临床意义</b>：戴助听器后识别率 <b>&gt;90%</b> → 效果极好；<b>70%～90%</b> → 帮助很大；<b>偏低</b> → 效果较差，需配合言语康复训练；极低者助听器仅起听觉刺激作用，不能当「神药」。</li><li>蜗后病变随强度加大识别率反降，故可做 3～5 个不同强度的识别率测试得到 <b>PI 曲线</b>。</li></ul>\n<h4>4. PI 函数（言语识别率-强度函数）五种型 —— 必考重点</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>型</th><th>名称</th><th>曲线特征</th><th>对应病变</th></tr></thead>\n<tr><td><b>A 型</b></td><td>正常型</td><td>上下拉长的 <b>S 型</b>，快速上升段窄（约 10～20 dB 即从低到最大），最大识别率 <b>&gt;90%</b></td><td>正常人</td></tr>\n<tr><td><b>B 型</b></td><td>平移型</td><td>曲线形状同 A，但整体<b>右移</b>（需更大强度才引出）</td><td><b>单纯传导性</b>耳聋（加大声音可全收到）</td></tr>\n<tr><td><b>C 型</b></td><td>平缓型</td><td>从低到高跨度大、上升慢、整体识别率低于 A/B</td><td><b>蜗性</b>（耳蜗）损伤</td></tr>\n<tr><td><b>D 型</b></td><td>回跌型</td><td>到最大识别率后<b>再加强度反而降低</b></td><td><b>蜗后</b>病变（神经/中枢，时间编码、相位锁定崩溃）</td></tr>\n<tr><td><b>E 型</b></td><td>未引出型</td><td>始终很低、无法引出完整曲线</td><td><b>蜗后</b>问题</td></tr>\n</table>\n<ul><li><b>形象比喻</b>：蜗性病变像「音量调大节目更清晰」的收音机；蜗后病变像「线路接触不良」的收音机，音量一大全是自激噪音反而淹没节目。</li><li><b>临床意义</b>：PI 曲线可辅助判断<b>传导性 / 感音性 / 神经性</b>听力损失；评估交流能力、助听器与人工耳蜗效果；若提示蜗后病变，需结合耳声发射、ABR、MRI 等进一步诊断。</li><li><b>影响因素</b>：方言、智力、教育、词表熟悉度（需换词表防记忆）、给声强度/方式、反应方式、受试者状态等——控制好变量才有可比性。</li></ul>\n<hr>\n<div class=\"lec-sec-head\"><h3>五、耳模取样（耳模制取）—— 三级面对耳廓异常耳</h3><button class=\"lec-practice\" onclick='practiceTopics([\"耳印模/耳模\", \"耳模更换\"])'>🏋 练本节相关的题 →</button></div>\n<blockquote>四级面对正常耳，三级面对<b>耳廓异常 / 外耳道异常</b>的取模。</blockquote>\n<h4>1. 耳廓 / 外耳道异常分类与可取样性</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>异常类型</th><th>代表</th><th>能否取样</th></tr></thead>\n<tr><td>小耳</td><td>发育不全，常伴耳道畸形</td><td>视畸形程度；大型腔体存在者可取</td></tr>\n<tr><td>招风耳</td><td>耳廓显著外突，耳道基本正常</td><td><b>可取样</b>（医学属耳廓畸形，可做耳模配耳背机/定制机）</td></tr>\n<tr><td>杯状耳</td><td>耳朵被压扁</td><td>大型腔体存在 → 可取样</td></tr>\n<tr><td>隐耳</td><td>部分被隐藏、解剖沟壑消失，可能影响听力</td><td>轻度、腔体存在 → 可取样</td></tr>\n<tr><td>菜花耳</td><td>后天外伤，耳轴较大</td><td>一般不影响听力 → 可取样</td></tr>\n<tr><td>垂耳 / 猿耳等</td><td>轻微畸形，耳道正常</td><td>正常取模即可</td></tr>\n<tr><td><b>严重耳道狭窄</b></td><td>耳道特别狭窄</td><td><b>不能取</b>（取不出完整耳样）</td></tr>\n</table>\n<h4>2. 可取样条件与禁忌</h4>\n<ul><li><b>可取样</b>：耳廓畸形但<b>大型腔体存在</b>、外耳道正常或轻度狭窄 → 招风耳、杯状耳、轻度隐耳等均可取模。</li><li><b>外耳道异常需先处理</b>：湿疹、炎症、肿物（严重者需穿刺/切开）→ <b>全部不能取</b>；耵聍、异物（取出后）→ 可取样；鼓膜损伤 → <b>注意</b>；外耳道形状正常或轻度下塌 → 可取样，取样范围同样到<b>第二弯曲</b>。</li><li><b>禁忌（绝对不能取）</b>：<b>化脓性中耳炎活动期</b>、外耳道急性炎症/肿物未治、严重耳道狭窄。</li></ul>\n<h4>3. 材料与工具</h4>\n<ul><li><b>材料</b>：广泛使用的耳模材料 = <b>基质 + 凝固剂，严格 1:1 混合</b>（夏天少凝固剂/冬天多凝固剂不科学，会破坏收缩比，导致耳模消缩、出声孔对位偏差）。</li><li><b>工具</b>：注射器、耳模材料、棉花球（置于第二弯）、耳灯。</li></ul>\n<h4>4. 取模流程（重点：第二弯曲必须取到）</h4>\n<p>1. <b>讲解规则</b>：约 6 分钟，告知会有不适、受不了举手、不要动。</p>\n<p>2. <b>检查耳道</b>：干净、鼓膜完整、无手术/流脓、走向大小（为棉球大小与放置位做准备）。</p>\n<p>3. <b>棉花球塞到第二弯</b>：上下左右填实，深耳道式（CIC）需超出第二弯 2～5 mm；不留置空气，否则材料易打不进。</p>\n<p>4. <b>混合材料</b>：1:1 混合，装入注射器、排尽空气。</p>\n<p>5. <b>注射</b>：捏住棉线防棉球移动；注射头<b>始终埋在耳样材料中</b>，先充耳道再慢慢外退。</p>\n<p>6. <b>等待凝固</b>：指甲抠无痕即可取出。</p>\n<p>7. <b>取出</b>：向鼻尖方向、向前转轻轻脱出；检查耳道无残留。</p>\n<p>8. <b>质检</b>：第二弯取到否、各解剖位置取到否、表面光滑饱满、无凹陷/裂痕/气泡 → 合格。</p>\n<blockquote><b>第二弯曲为何必须取到</b>：可判断耳道走向，使助听器出声孔准确对准鼓膜，提升音质；未取到第二弯，出声孔易对着耳道壁「碰壁」，音质下降。</blockquote>\n<h4>5. 注意事项与易错点</h4>\n<ul><li>耳模作用：固定助听器、提升舒适与美观、<b>密封防声反馈</b>；材料选择与正常耳相同。</li><li>乳突术后患者耳道可能有巨大空腔，应选<b>合适大小棉障</b>、放适量耳样。</li><li>隐耳/乳突术后取模时间、棉障选择等为多选题考点。</li><li>这是助听器行业<b>唯一可能产生医疗事故</b>的环节，务必规范操作。</li></ul>\n<hr>\n<div class=\"lec-sec-head\"><h3>六、本节对应题库考点</h3></div>\n<ul><li><b>言语测听定义</b>：以<b>言语信号</b>为刺激声，检查言语听阈与识别能力；是听力测试重要方法之一。</li><li><b>言语识别阈英文 = SRT</b>（Speech Reception Threshold），又称言语接受阈；反映「听懂 50% 的最低言语级」。</li><li><b>言语识别阈一般采用的词表 = 双音节（阳平格）词表</b>（单音节反应会偏高，一般用双音节）。</li><li><b>言语察觉阈 = SDT / SAT</b>；听损过重测不到 SRT 时改用。</li><li><b>背景噪声中言语识别</b>：成人常用，信噪比常设 <b>5 dB 或 10 dB</b>（也可 0 / −5 dB）；最能反映真实聆听。</li><li><b>SRT 与 PTA 比较</b>：≤ 6 dB 吻合，≤ 12 dB 一致，&gt; 12 dB 不一致。</li><li><b>言语听力计</b>：分 <b>A 类（高精度）/ B 类（筛查型）</b>；测试前须<b>校准</b>（各耳机/扬声器校准值）。</li><li><b>给声方式</b>：口声（灵活但不一致）/ 录音（一致可比，设备要求高）。</li><li><b>儿童言语测试</b>：测试者与被试<b>并排而坐</b>；时间控制在较短范围内（注意力易分散）；多用封闭项降低紧张。</li><li><b>PI 曲线分型（5 型必背）</b>：A 正常型 / B 平移型（传导性）/ C 平缓型（蜗性）/ D 回跌型（蜗后）/ E 未引出型（蜗后）；用于判断传导性/感音性/神经性听力损失及助听效果评估。</li><li><b>言语香蕉图</b>：与听力图结合，验配时尽量将补偿点补入香蕉图。</li><li><b>耳模取样</b>：第二弯曲必须取到、材料 1:1 混合、棉花球置于第二弯；可取样畸形（招风耳、杯状耳、轻度隐耳），<b>严重耳道狭窄 / 化脓性中耳炎活动期不能取</b>；外耳道炎症/肿物先治、鼓膜损伤注意。</li><li><b>Ling 六音（零六音）</b>：快速检查言语关键频率（/a/ /i/ /u/ /m/ /s/ /sh/）感知，用于助听器各频率工作与否及补偿是否到位的快速评估。</li></ul>"}, {"id": "l5", "no": "第⑤课", "title": "听力助听器", "teacher": "董燕华（浙江中医药大学）", "dur": "约 2h42m", "file": "钉钉直播回放_董燕华_听力助听器.md", "body": "<h2>第⑤课 听力助听器（模块4）学习笔记</h2>\n<blockquote><b>课程性质</b>：助听器验配师（三级）备考 · 知识要求（理论）部分</blockquote>\n<blockquote><b>来源</b>：钉钉直播回放</blockquote>\n<blockquote><b>讲师</b>：董燕华（毕业于浙江中医药大学，进入听力行业 7 年，现任助听器培训工作）</blockquote>\n<blockquote><b>时长</b>：约 162 分钟</blockquote>\n<blockquote><b>主题</b>：模块4 —— 助听器常规性能测试、方向性调试、程序设置、移频技术、无线/智能设备连接、CROS/BiCROS 调试</blockquote>\n<blockquote><b>教材对应</b>：《助听器验配师（三级）》基础知识 第 65–111 页；四级《基础知识》第 159–161 页、第 134 页、第 145 页、第 158 页可作参考</blockquote>\n<blockquote><b>说明</b>：本次直播只讲&quot;知识要求（理论）&quot;部分；&quot;能力要求（实操）&quot;由各品牌时操代教老师线下讲解。</blockquote>\n<hr>\n<div class=\"lec-sec-head\"><h3>〇、本节知识地图（先记框架）</h3></div>\n<table class=\"lec-tbl\">\n<thead><tr><th>序号</th><th>模块</th><th>核心一句话</th></tr></thead>\n<tr><td>1</td><td>助听器常规性能测试</td><td>6 大指标 + 参考测试频率/增益 + 频响曲线（GB/T 25102.7-2017 / IEC 118-7）</td></tr>\n<tr><td>2</td><td>方向性调试</td><td>提高信噪比；DI 指数；单/双麦克风；CIC 不能做方向性</td></tr>\n<tr><td>3</td><td>程序设置</td><td>默认程序不可删 + 可添加 3–4 个；安静/噪声/其他（电话）程序</td></tr>\n<tr><td>4</td><td>移频技术</td><td>高频死区/陡降型；频率转移 + 频率压缩；能不移就不移</td></tr>\n<tr><td>5</td><td>无线/智能连接</td><td>电感线圈（T 线圈）/ FM（DAI）/ 数字调制（蓝牙）/ 红外</td></tr>\n<tr><td>6</td><td>CROS / BiCROS</td><td>单侧聋 / 双侧均有听损的差异化验配</td></tr>\n</table>\n<hr>\n<div class=\"lec-sec-head\"><h3>一、助听器常规性能测试（GB/T 25102.7-2017 / IEC 118-7）</h3><button class=\"lec-practice\" onclick='practiceTopics([\"助听器性能指标\", \"助听器检验标准\", \"饱和声压级\", \"满档声增益\", \"等效输入噪声\", \"最大声输出\", \"频响曲线绘图\"])'>🏋 练本节相关的题 →</button></div>\n<h4>1.1 为什么要测？依据什么标准？</h4>\n<ul><li><b>目的</b>：助听器出厂/交货时检验是否合格。</li><li><b>核心标准</b>：<b>GB/T 25102.7-2017</b>《电声学 助听器 第7部分 助听器生产、供应和交货时质量保证的性能特性测量》（2017 年发布）。</li><li>四大标准体系辨析（易考）：</li></ul>\n<table class=\"lec-tbl\">\n<thead><tr><th>标准</th><th>制定方</th><th>规范内容</th></tr></thead>\n<tr><td><b>IEC</b></td><td>国际电工委员会</td><td>电器设备（含助听器）及测量方法</td></tr>\n<tr><td><b>ISO</b></td><td>国际标准化组织</td><td>语言相关（如正常听阈、测听方法）</td></tr>\n<tr><td><b>ANSI</b></td><td>美国国家标准</td><td>美国国标</td></tr>\n<tr><td><b>GB/T</b></td><td>中国国家标准（&quot;T&quot;=推荐）</td><td>中国国标，等同对应 IEC 118-7</td></tr>\n</table>\n<blockquote>📌 <b>考点</b>：助听器交货时质量检验的性能测量标准 = <b>IEC 118-7</b>（对应国标 <b>GB/T 25102.7-2017</b>）。IEC 118-0 对应 GB/T 25102.100（第一部分 电声特性测量）。</blockquote>\n<h4>1.2 六大常规性能测试项目（三级书列 6 项；四级书更详细）</h4>\n<blockquote>📌 <b>记忆口诀</b>：满档测增益/饱和要&quot;满档&quot;；其余（频响范围、谐波失真、等效输入噪声、电源电流）全部在<b>参考测试增益</b>下测。</blockquote>\n<h4># ① 饱和声压级 OSPL90（最重要）</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>项目</th><th>内容</th></tr></thead>\n<tr><td>定义</td><td>放大电路处于<b>饱和状态</b>时，在助听器模拟器（耦合腔）上测得的声压级频响曲线上的<b>最大值</b></td></tr>\n<tr><td>测量条件</td><td>输入声压级 = <b>90 dB SPL</b>（各频率），助听器置于<b>满档增益</b></td></tr>\n<tr><td>结果判读</td><td>测得的峰值与产品规格书（Data Sheet / Spec）比较，<b>误差 ≤ ±4 dB 合格</b></td></tr>\n<tr><td>功率划分</td><td>见下表（<b>必背</b>）</td></tr>\n</table>\n<ul><li>*OSPL90 与功率、适配听损对应表（必背）：**</li></ul>\n<table class=\"lec-tbl\">\n<thead><tr><th>饱和声压级 OSPL90</th><th>功率分类</th><th>适用听力损失</th></tr></thead>\n<tr><td><b>&lt; 105 dB</b></td><td>小功率</td><td>轻度</td></tr>\n<tr><td><b>105–114 dB</b></td><td>中小功率</td><td>中度</td></tr>\n<tr><td><b>115–124 dB</b></td><td>中功率</td><td>中重度</td></tr>\n<tr><td><b>125–134 dB</b></td><td>大功率</td><td>重度</td></tr>\n<tr><td><b>&gt; 135 dB</b></td><td>特大功率</td><td>极重度</td></tr>\n</table>\n<blockquote>📌 <b>高频考点</b>：</blockquote>\n<blockquote>- &quot;最大饱和声压级数值&quot;指的是 <b>OSPL90 曲线上的最大值</b>。</blockquote>\n<blockquote>- 平均听力损失 65 dB → 选<b>中功率</b>（115–124 dB）。</blockquote>\n<blockquote>- 平均听力损失 90 dB → 选<b>大功率</b>（125–134 dB）。</blockquote>\n<blockquote>- 超大功率助听器最大饱和声压级会<b>超过 140 dB</b>。</blockquote>\n<blockquote>- 市面上大部分 CIC 最大饱和声压级在 <b>101–120 dB</b> 范围（超大功率 CIC 可达 120–130 dB）。</blockquote>\n<blockquote>- 最大声输出设置目的：<b>避免大声损伤残余听力</b>（C 对）；低设置还会影响言语可懂度。</blockquote>\n<h4># ② 满档声增益（满档增益）</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>项目</th><th>内容</th></tr></thead>\n<tr><td>定义</td><td>输出声压级 − 输入声压级（增益 = 输出 − 输入）</td></tr>\n<tr><td>测量条件</td><td>输入 <b>65 dB SPL</b> 扫频纯音（125–8000 Hz），助听器置于<b>满档增益</b></td></tr>\n<tr><td>前提</td><td><b>电路线性、未饱和</b></td></tr>\n<tr><td>反映</td><td>助听器的<b>最大放大能力</b>（电路最大放大能力）</td></tr>\n<tr><td>特殊情况</td><td>小功率机给 65 dB 易饱和 → 降为 <b>50 dB SPL</b>（&quot;较低输入声&quot;），<b>须在报告中注明</b>；AGC 无法手动关闭者也用 50 dB SPL</td></tr>\n</table>\n<blockquote>📌 满档声增益多用于描述助听器的<b>电路最大放大能力</b>（非最大声输出能力）。</blockquote>\n<blockquote>压缩放大助听器增益随输入变 → 厂家多用 <b>60 dB SPL</b>（&quot;较低输入&quot;）测增益，再降 10 dB 即 50 dB SPL 为&quot;叫低输入&quot;。</blockquote>\n<h4># ③ 频率响应范围</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>项目</th><th>内容</th></tr></thead>\n<tr><td>前提</td><td>在<b>参考测试增益</b>下的频响曲线</td></tr>\n<tr><td>方法</td><td>取 <b>1000 Hz / 1600 Hz / 2500 Hz</b> 三点增益，求<b>平均值</b>，作一条水平线，<b>向下移 20 dB</b>，与频响曲线相交得<b>两个交点</b>，两交点间频率范围即频率响应范围</td></tr>\n</table>\n<h4># ④ 谐波失真（仅限&quot;差波失真&quot;）</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>项目</th><th>内容</th></tr></thead>\n<tr><td>范围</td><td>国际标准规定仅测量<b>差波失真</b>（不包含互调失真）</td></tr>\n<tr><td>定义</td><td>单一频率 F0 输入，输出端除 F0 外还产生 <b>2F0、3F0、4F0…</b> 成分</td></tr>\n<tr><td>F0 选取</td><td><b>400–1600 Hz</b> 之间或厂家指定频率（取低频是为避免高次谐波超出机器频宽）</td></tr>\n<tr><td>输入声</td><td><b>70 dB SPL</b></td></tr>\n<tr><td>计算</td><td>二次谐波失真 = (2F0 处声压级 − F0 处声压级) 换算成百分比；三次同理</td></tr>\n<tr><td>最显著</td><td><b>二次谐波失真最为显著</b>；总谐波失真 ≈ 二次 + 三次</td></tr>\n</table>\n<h4># ⑤ 等效输入噪声</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>项目</th><th>内容</th></tr></thead>\n<tr><td>本质</td><td>评价助听器<b>内在固有噪声</b>（电子元器件工作产生的<b>热噪声</b>）</td></tr>\n<tr><td>4 步测量法</td><td>① 测试箱声设为 <b>60 dB SPL</b>，参考测试增益下在参考测试频率测得输出声压级 <b>SL</b>；② SL − 60 dB = 该频率处增益；③ <b>关闭声源</b>，测得内在噪声输出声压级 <b>L2</b>；④ <b>等效输入噪声 = L2 − 增益</b>（即 L2 − (SL−60)）</td></tr>\n<tr><td>关键结论</td><td><b>不能通过数字降噪完全消除</b>（电子固有噪声）</td></tr>\n<tr><td>误区</td><td>新用户初戴觉&quot;沙沙声&quot;≠等效输入噪声（可能是久未听到高频小声的误判）</td></tr>\n</table>\n<h4># ⑥ 电源电流</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>项目</th><th>内容</th></tr></thead>\n<tr><td>适用</td><td><b>仅电池款助听器</b>（充电款不适用）</td></tr>\n<tr><td>方法</td><td>放入模拟电池片（675 / 13 / 312 / 10 / 5 型号），参考测试增益下输入 60 dB SPL，测定电池电流</td></tr>\n</table>\n<h4>1.3 两个关键名词：参考测试频率 &amp; 参考测试增益</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>名词</th><th>取值 / 方法</th><th>备注</th></tr></thead>\n<tr><td><b>参考测试频率</b></td><td>通常 <b>1600 Hz</b>；为反映<b>高频特性</b>时选 <b>2500 Hz</b></td><td>选 2500 Hz <b>须在报告中注明</b></td></tr>\n<tr><td><b>参考测试增益</b></td><td>先测 OSPL90；给 60 dB SPL 纯音，调节增益使参考测试频率处输出恰为 <b>OSPL90 以下 15 ± 1 dB</b> 时的增益</td><td>测前<b>必须先测 OSPL90</b>；若增益调到最大仍达不到，取 <b>OSPL90 以下 20 ± 1 dB</b></td></tr>\n</table>\n<blockquote>📌 <b>考点</b>：IEC 规定参考测试频率/增益的目的 = <b>评判助听器实际使用时的效果</b>（助听器日常不会处于满档，实际增益也达不到满档）。</blockquote>\n<h4>1.4 频响曲线（频响图）的画法规则</h4>\n<ul><li>横坐标 = <b>对数频率刻度</b>（与纯音听力图不同）；纵坐标 = <b>分贝（线性）</b>。</li><li><b>黄金比例</b>：横坐标上 <b>10 倍频程</b>（如 100→1000、1000→10000）的长度 = 纵坐标上 <b>50 dB</b> 的长度。</li><li>满档声增益 = 频响曲线最高点（肉眼估算题常考）。</li></ul>\n<ul><li>*耦合腔适配器类型（必记）：**</li></ul>\n<table class=\"lec-tbl\">\n<thead><tr><th>适配器</th><th>适用助听器</th></tr></thead>\n<tr><td><b>hA-1</b> 耦合腔适配器</td><td><b>耳内式（ITE / ITC / CIC）</b></td></tr>\n<tr><td><b>hA-2</b> 耦合腔适配器</td><td><b>耳背式（BTE）/ 盒式</b></td></tr>\n</table>\n<ul><li>测试连接：扬声器发声 → 助听器麦克风收集 → 输出端经耳钩/声管接入耦合腔麦克风 → 参考麦克风（校准用，尽量靠近但不接触助听器麦克风）。</li><li>通用测试设备：如 Inventus / Audiometer 类测试仪，原理一致（耦合腔、参考麦克风、电池插片）。</li></ul>\n<hr>\n<div class=\"lec-sec-head\"><h3>二、方向性麦克风调试</h3><button class=\"lec-practice\" onclick='practiceTopics([\"方向性模式\", \"方向性麦克风功能\", \"方向性麦克风与机型\", \"双麦克风方向性\"])'>🏋 练本节相关的题 →</button></div>\n<h4>2.1 基础概念</h4>\n<ul><li><b>麦克风（传声器）</b>：将声波转为电信号。按原理分：<b>电磁动圈式、压电陶瓷式、驻极体式</b>（最新为 MEMS 硅微机械麦克风，体积小、可靠性高、可批量生产、方向性可预示）。</li><li><b>方向性目的</b>：减少不相关信号（噪声）输入 → <b>提高信噪比</b>。</li><li><b>方向性指数 DI</b>：前方声 0 敏感度与其他方向之比（dB）。<b>DI 越高，噪声环境交流越容易</b>。</li><li><b>极性图（指向图）</b>：以原点为中心，正前方 0°、正后方 180°、左右 90°/270°。<b>仅示意</b>（戴在人耳上头对声波有遮挡，实际有偏向）。</li></ul>\n<h4>2.2 DI 方向性指数与极性对照表（必背）</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>极性类型</th><th>延迟比（内/外）</th><th>DI 方向性指数</th><th>0 位点（无效区）</th></tr></thead>\n<tr><td><b>心型（Cardioid）</b></td><td>1</td><td><b>4.8</b></td><td>180°（后方）</td></tr>\n<tr><td><b>超强心型（Super-cardioid）</b></td><td>0.577</td><td><b>5.7</b></td><td>后侧</td></tr>\n<tr><td><b>超强/超强心型（Hyper-cardioid，最高）</b></td><td>0.33</td><td><b>6.0（文中实测 6.01）</b></td><td>后侧</td></tr>\n<tr><td><b>8 字型（Figure-8）</b></td><td>0</td><td><b>4.8</b></td><td>前后 0°，左右最大</td></tr>\n</table>\n<blockquote>📌 <b>记忆</b>：超强心型&quot;又超又强&quot;DI 最高 = <b>6.0</b>；强心型 5.7；心型/8 字型并列 4.8。</blockquote>\n<h4>2.3 全向性 vs 单/双麦克风</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>类型</th><th>特点</th><th>适用</th></tr></thead>\n<tr><td><b>全向性</b></td><td>0°–360° 各方向信号强度均接近最大，无衰减</td><td>ITE 选配儿童；成人安静居家（想听更多环境声）</td></tr>\n<tr><td><b>单麦克风系统（早期）</b></td><td>一个麦克风、上下两开口；外部延时（声波先后到达两口）+ 内部延时（阻尼器）；延时比 = 内/外 = 1</td><td>早期方向性实现</td></tr>\n<tr><td><b>双麦克风系统（数字）</b></td><td>两个麦克风、有间距 → 外部延时；内部延时由<b>电子时间延迟</b>数字编程控制 → <b>自适应方向性占优</b></td><td>现代主流，可做自适应/多通道自适应</td></tr>\n</table>\n<h4>2.4 失匹配（仅发生在双麦克风系统）</h4>\n<ul><li>出厂正常，使用后因温湿度、磕碰、麦克风口堆积物导致<b>幅度失配 / 相位失配</b>，方向性减弱甚至适得其反。</li><li>DI 变化典型值（完全匹配 → 失配）：</li></ul>\n<table class=\"lec-tbl\">\n<thead><tr><th>状态</th><th>DI 方向性指数</th></tr></thead>\n<tr><td>完全匹配（超强心型）</td><td><b>6.01</b></td></tr>\n<tr><td>幅度失配（前/后麦克风幅度两度）</td><td>降至 <b>4.6</b>（另一典型值 <b>4.1</b>）</td></tr>\n<tr><td>相位失配（前后麦克风相位颠倒）</td><td>降至 <b>−2.1</b>（方向性完全丧失）</td></tr>\n</table>\n<ul><li><b>解决</b>：① 提升硬件（位置麦克风，稳定性好）；② 电子修正（持续估算并修正两麦克风失配，多年保持方向性）。</li></ul>\n<h4>2.5 CIC 为什么不能做方向性？（高频考点）</h4>\n<p>1. 面板太小，<b>无法满足&quot;一前一后两个开口&quot;</b> → 无外部延时（上下开口则声波同时到达，无时间差）。</p>\n<p>2. 麦克风位置深，受<b>耳廓遮挡</b>产生复杂声场，即便耳道大也难做好。</p>\n<p>3. 现实中 98%–99% 未验配过 CIC 方向性；<b>ITC 比 CIC 更小更做不了</b>。</p>\n<h4>2.6 方向性的进展与特殊类型</h4>\n<ul><li><b>自适应方向性</b>：自动捕捉/分析噪声源，自动选最佳极性，<b>无需手动切换</b>。</li><li><b>多通道自适应方向性</b>：不同通道应用不同极性（带通滤波器分频），按各通道噪声位置处理。</li><li><b>自动麦克风系统</b>：噪声环境启动方向性；安静环境切回全向性；复杂噪声启多通道自适应。</li><li><b>特殊指向性</b>：① 全向指向性；② 窄向调控型（聚焦 / 超聚焦 / 宽向，前置 0°–180° 范围可调）；③ <b>空间方向性</b>（RIC 麦克风位于耳后，缺失耳廓自然滤波 → 电子模拟恢复，增强前后定位）。</li><li><b>生活数据</b>：约 <b>20%</b> 感兴趣的声音不是来自正前方。</li></ul>\n<blockquote>📌 <b>考点</b>：无论何种方向性模式，<b>正前方（0°）声音强度永不降低</b>；双指向（8 字型）降低的是 <b>90°/270°（左右侧）</b> 强度。</blockquote>\n<hr>\n<div class=\"lec-sec-head\"><h3>三、助听器程序设置</h3><button class=\"lec-practice\" onclick='practiceTopics([\"多程序/程序\", \"工作程序\", \"噪声程序场景\"])'>🏋 练本节相关的题 →</button></div>\n<h4>3.1 什么是&quot;程序&quot;</h4>\n<ul><li>程序 = 增益、频响、麦克风方式、方向性、降噪等多项参数的<b>特定组合</b>。</li></ul>\n<h4>3.2 程序分类</h4>\n<ul><li>*分类一：默认程序 + 可添加程序**</li></ul>\n<table class=\"lec-tbl\">\n<thead><tr><th>类型</th><th>说明</th></tr></thead>\n<tr><td><b>默认程序</b></td><td>助听器默认开启的第一个程序，<b>软件中不可取消/删除</b>；命名各异（自动程序 / 基本程序 / 正常环境）</td></tr>\n<tr><td><b>可添加程序</b></td><td>手动添加，验配时一般 <b>3–4 个</b>；连手机 APP 可设更多（某品牌可达 20 个）</td></tr>\n</table>\n<ul><li>*分类二：安静程序 / 噪声程序 / 其他程序**（对应教材 85–86 页）</li></ul>\n<table class=\"lec-tbl\">\n<thead><tr><th>程序</th><th>频响特征</th></tr></thead>\n<tr><td>安静（默认）程序</td><td>实际增益 ≈ 公式目标增益，完全匹配</td></tr>\n<tr><td>噪声程序</td><td>整体增益降低（舒适优先），低/中/大声均降</td></tr>\n<tr><td>其他程序（如电话）</td><td><b>电话程序 500–4000 Hz 有效，4000 Hz 后陡降</b>（避免环境高低频声被放大干扰听电话）</td></tr>\n</table>\n<blockquote>程序间差异举例：默认程序&quot;自动/自信&quot;开、降噪开；噪声程序&quot;自信&quot;开、降噪关；电话程序切全向性、降噪关；音频流增强（蓝牙听歌/电话）程序降噪全关。</blockquote>\n<h4>3.3 是否设置多程序？依据什么？</h4>\n<ul><li>依据<b>年龄、生活环境、聆听需求</b>综合决定。</li><li>学龄前/学龄儿童（常配远程麦克风等附件）→ 添加相应程序。</li><li><b>老人</b>：按生活环境、个人需求、手指灵活度、<b>认知能力</b>决定（不会用就不强给多程序）。</li><li>必须多程序的特殊情况：① 不满足整体音量调整（中高频想单独加、不想整体变吵）；② 想用蓝牙音乐；③ 听力情况特殊；④ 想尝试 AI/ML 功能；⑤ CROS 验配。</li></ul>\n<h4>3.4 程序相关考点</h4>\n<ul><li><b>噪声程序</b>适合人多嘈杂场景（如 50 人同时就餐）。</li><li><b>T 线圈程序</b>主要目的 = <b>接打固定电话</b>（智能手机/微信/平板多用蓝牙）。</li><li>只想单纯使用电感音：选<b>仅开启 T 档程序</b>（M=麦克风，T+M=同时开麦克风）。</li><li>接听电话最佳方式 = <b>2.4 GHz 无线蓝牙程序</b>。</li><li>安静环境程序应满足：<b>聆听舒适度 + 言语清晰度</b>需求。</li></ul>\n<hr>\n<div class=\"lec-sec-head\"><h3>四、移频技术（一平技术 / 频移技术）</h3><button class=\"lec-practice\" onclick='practiceTopics([\"移频\", \"压缩/增益\", \"倍频程\"])'>🏋 练本节相关的题 →</button></div>\n<h4>4.1 背景（为什么需要移频）</h4>\n<ul><li>传统高频放大不足（&gt;5000 Hz 输出急剧下降）；强推高频易致失真、啸叫。</li><li><b>高频死区</b>：听力损失 &gt;70 dB 时耳蜗（蜗底对应高频）部分毛细胞死亡，强行补偿反而<b>言语清晰度下降</b>。</li><li>→ 将高频声音往低中频&quot;移&quot;，提高高频可听度（鸟叫、气音 /s/ 识别）。</li></ul>\n<h4>4.2 移频两大分类</h4>\n<h4># （1）频率转移（Frequency Transposition）</h4>\n<ul><li>把部分高频声音<b>复制并叠加到较低频率区域</b>（早期为剪切，现多为<b>复制</b>保留全部频率）。</li><li>仅当输入中<b>高频成分占主导</b>时转移（如 /s/ 音转移；/m/ 音不转移）。</li><li>适用陡降型，提高高频可听度。</li></ul>\n<h4># （2）频率压缩（Frequency Compression）</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>类型</th><th>特征</th></tr></thead>\n<tr><td><b>线性频率压缩</b></td><td>整条曲线斜率下降（输入 4000→输出 2500，6000→≈4000，8000→≈5000）</td></tr>\n<tr><td><b>非线性频率压缩</b></td><td>设截止频率（如 2000 Hz），其前不压缩，其后压缩</td></tr>\n<tr><td><b>自适应非线性频率压缩（主流）</b></td><td>引入<b>双截止频率</b>：较低的 = <b>移频频率/分歧频率</b>，较高的 = <b>截止频率</b>；高于截止必压缩，低于分歧必不压缩，两者之间依输入信号决定（高频为主才启动）。更好保护低频（如 /a/、/u/）</td></tr>\n</table>\n<h4>4.3 适应证与原则</h4>\n<ul><li><b>适应证</b>：<b>陡降型听力损失</b>（定义：每个倍频程上升/下降 <b>≥ 16 dB</b>；不必卡死两个倍频程，研究证实陡降型用户满意度更高）。</li><li><b>调试原则</b>：<b>能不移就不移，能少移不多移</b>。</li><li><b>验证</b>：高频听阈符号上移（阈值改善）；能听到流水/鸟叫等高频声；做高频词汇言语测听。</li></ul>\n<blockquote>📌 <b>考点</b>：移频是把<b>高频声音转移到低中频</b>；适合<b>低频中重度、中高频中度的陡降型</b>听损（选 C 型）。</blockquote>\n<hr>\n<div class=\"lec-sec-head\"><h3>五、无线传输 / 智能设备连接</h3><button class=\"lec-practice\" onclick='practiceTopics([\"MFI蓝牙\", \"FM系统\", \"DAI\", \"无线发射机麦克风模式\", \"麦克风FM音量\"])'>🏋 练本节相关的题 →</button></div>\n<h4>5.1 四类无线传输技术</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>技术</th><th>原理</th><th>要点</th></tr></thead>\n<tr><td><b>电感线圈（T 线圈）</b></td><td>电磁感应：声→电流→磁场→线圈感应电压→放大→声波</td><td>耳背式一般内置，ITE 可定制加装；剧院/影院（国内少见，欧美多）</td></tr>\n<tr><td><b>FM（调频）</b></td><td>无线电调频电磁波；说话者戴发射器，听障者戴接收器；接收器经 <b>DAI（直接音频输入）</b> 接入</td><td>易<b>串台（串频）</b>；教室/车载广播常用</td></tr>\n<tr><td><b>数字调制（蓝牙）</b></td><td>音频转 0/1 数字组合；抗干扰强、精准</td><td>经典蓝牙（耗电大、适用广）/ 低功耗蓝牙（局限、拓宽中）；<b>Made for iPhone（2014）</b>；<b>BLE Audio / Auracast（2021，SIG 小组）</b> 打破品牌壁垒、可代替 FM</td></tr>\n<tr><td><b>红外</b></td><td>调幅电磁波（肉眼不可见，手机摄像头可见）</td><td>遥控器原理</td></tr>\n</table>\n<h4>5.2 关键名词与考点</h4>\n<ul><li><b>DAI</b> = <b>直接音频输入</b>（Direct Audio Input），非 FM/方向性/直连。</li><li>FM 接收无线电信号后，助听器麦克风<b>仍开启但处于衰减位置</b>（调试项在&quot;麦克风衰减&quot;，非风噪管理/自动程序）。</li><li>不同班级 FM <b>频道设置重叠 → 串台（串频）</b>（A 教室收到 B 教室声）。</li><li>蓝牙 <b>MFi</b> = 直连<b>苹果</b>智能设备。</li><li><b>Auracast</b> ≈ 新一代代替 FM 的广播音频（国内少数场所试点，如西安咸阳某航站楼）。</li><li>Cross 附件采用 <b>NFMI</b> 传输（距离仅头颅宽度，约 <b>20–25 cm</b>），耗电大。</li></ul>\n<hr>\n<div class=\"lec-sec-head\"><h3>六、CROS / BiCROS 调试</h3><button class=\"lec-practice\" onclick='practiceTopics([\"CROS/BICROS\", \"交联式助听器\", \"声源定位\", \"头影效应\"])'>🏋 练本节相关的题 →</button></div>\n<h4>6.1 CROS（对侧信号传穿 / 单耳交连式助听器）</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>部件</th><th>佩戴侧</th><th>麦克风</th><th>声音</th></tr></thead>\n<tr><td><b>传送器（Cross 配件）</b></td><td>差耳（极重度/全聋侧）</td><td><b>开启</b></td><td><b>永远没有声音</b>（假受话器，无金属丝，仅固定）</td></tr>\n<tr><td><b>接收器（助听器）</b></td><td>好耳（正常/轻度侧）</td><td><b>关闭</b></td><td>正常工作</td></tr>\n</table>\n<ul><li><b>适应证</b>：<b>单侧聋</b>——一侧完全无听力（极重度感音神经聋、言语识别极差/对放大不耐受），<b>对侧听力正常或高频轻度下降</b>。</li><li>⚠️ <b>单侧聋（WHO 2021：好耳 &lt;20 dB，差耳 &gt;35 dB）≠ 所有单侧听损</b>：差耳识别率尚可（如 82%）者只需给差耳单耳配助听器，<b>不需 CROS</b>。</li><li><b>配件不能单独使用</b>，须与同系列同外观同充电款的助听器配对成&quot;CROS 系统&quot;（借设备要借<b>一对</b>）。机身刻字&quot;Cross&quot;；假受话器无金属丝。</li><li><b>优势</b>：消除头影效应、改善差耳侧言语清晰度、改善噪声环境清晰度、改善声源定位（存在时间延迟线索）。</li><li><b>局限</b>：双侧都戴机器、<b>90% 为外挂（耳背式/RIC）</b>、NFMI 耗电大（续航约减半）。</li></ul>\n<h4>6.2 BiCROS（双侧交连式 / 双耳对侧信号传送）</h4>\n<ul><li>与 CROS 的区别：<b>接收器侧（好耳侧实际也有听损）的麦克风开启</b>，需对好耳进行补偿。</li><li><b>适应证</b>：一侧轻/中度听损，另一侧极重度听损（双侧均有听损）。</li><li><b>调试依据</b>：只按<b>好耳（豪耳）</b>听损情况调试（差耳侧始终听不到声音，不考虑其听损/言语识别率）。</li></ul>\n<h4>6.3 CROS vs BiCROS 核心区别（必背）</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>对比项</th><th>CROS</th><th>BiCROS</th></tr></thead>\n<tr><td>适用听损</td><td>一侧全聋 + 对侧正常/轻度</td><td>双侧均有听损（一侧轻中 + 一侧极重）</td></tr>\n<tr><td>接收器侧麦克风</td><td><b>关闭</b></td><td><b>开启</b></td></tr>\n<tr><td>调试依据</td><td>好耳</td><td>好耳（豪耳）</td></tr>\n<tr><td>传送器侧声音</td><td>永远无声音</td><td>永远无声音</td></tr>\n<tr><td>配件单独使用</td><td>不可（须配对）</td><td>不可（须配对）</td></tr>\n</table>\n<blockquote>📌 <b>英文考点</b>：BiCROS = <b>双侧信号对传助听器</b>（Bilateral Contralateral Routing of Signal）；CROS = 对侧信号传穿。</blockquote>\n<hr>\n<div class=\"lec-sec-head\"><h3>七、本节对应题库考点（结合 363 题题库 · 高频必考）</h3></div>\n<h4>【A 类·数值与标准（死记）】</h4>\n<table class=\"lec-tbl\">\n<thead><tr><th>考点</th><th>答案</th></tr></thead>\n<tr><td>常规性能测试标准</td><td><b>IEC 118-7</b> / GB/T 25102.7-2017</td></tr>\n<tr><td>OSPL90 输入声压级</td><td><b>90 dB SPL</b>（满档增益、峰值）</td></tr>\n<tr><td>OSPL90 合格误差</td><td><b>±4 dB</b></td></tr>\n<tr><td>满档声增益输入声压级</td><td><b>65 dB SPL</b>（易饱和降 50 dB 须注明）</td></tr>\n<tr><td>谐波失真 F0 范围</td><td><b>400–1600 Hz</b>，输入 <b>70 dB SPL</b></td></tr>\n<tr><td>参考测试频率</td><td>通常 <b>1600 Hz</b>；高频特性 <b>2500 Hz</b>（须注明）</td></tr>\n<tr><td>参考测试增益</td><td>OSPL90 以下 <b>15 ± 1 dB</b>（测前先测 OSPL90）</td></tr>\n<tr><td>频响图比例</td><td>横 10 倍频程 = 纵 <b>50 dB</b></td></tr>\n<tr><td>频率响应范围下移</td><td>均值水平线<b>下移 20 dB</b> 取两交点</td></tr>\n<tr><td>适配器</td><td>耳内式=<b>hA-1</b>，耳背式=<b>hA-2</b></td></tr>\n<tr><td>DI 指数</td><td>超强心型 <b>6.0</b> / 强心型 <b>5.7</b> / 心型·8 字型 <b>4.8</b></td></tr>\n<tr><td>失匹配 DI</td><td>完全 6.01 → 幅度失配 4.6（/4.1）→ 相位失配 <b>−2.1</b></td></tr>\n<tr><td>生活中非正前方声</td><td>约 <b>20%</b></td></tr>\n<tr><td>陡降型定义</td><td>每倍频程 ≥ <b>16 dB</b></td></tr>\n<tr><td>Cross 传输</td><td><b>NFMI</b>，距离约 <b>20–25 cm</b></td></tr>\n</table>\n<h4>【B 类·对应/匹配（必考）】</h4>\n<ul><li><b>OSPL90 ↔ 功率 ↔ 听损</b>：&lt;105小/105–114中小/115–124中/125–134大/&gt;135特大 ↔ 轻/中/中重/重/极重。</li><li><b>DI 越高 → 噪声环境越好</b>；正前方声音永不被降低；双指向降低 90°/270°。</li><li><b>CIC/ITC 不能做方向性</b>（无前后开口、无外部延时）。</li><li><b>移频 = 高频 → 低中频</b>；适合<b>陡降型</b>。</li><li><b>T 线圈程序 = 固定电话</b>；<b>蓝牙 = 智能手机/最佳通话</b>；<b>DAI = 直接音频输入</b>。</li><li><b>CROS</b>：好耳正常、差耳全聋、接收侧麦克风关、传送侧永远无声、配件不可单用、90% 外挂。</li><li><b>BiCROS</b>：双侧均有听损、接收侧麦克风开、按好耳调试。</li><li><b>单侧聋 ≠ 单侧听损</b>（后者轻者只需差耳单配）。</li></ul>\n<h4>【C 类·易错判断题】</h4>\n<ul><li>✅ 等效输入噪声<b>不能</b>靠数字降噪消除。</li><li>✅ 新用户&quot;沙沙声&quot;<b>不一定</b>是等效输入噪声。</li><li>❌ 谐波失真测量包含互调失真 → 错，仅限<b>差波失真</b>。</li><li>❌ 测满档增益须置参考测试增益 → 错，须置<b>满档增益</b>。</li><li>❌ 测谐波失真/等效噪声/电源电流须置满档 → 错，须置<b>参考测试增益</b>（仅 OSPL90 与满档增益用满档）。</li><li>❌ CROS 叉耳装置均装受话器 → 错，传送器侧是<b>假受话器无声音</b>。</li><li>❌ CROS 只能无线实现 → 错，早期为有线。</li><li>❌ 频率响应范围高频截止 = 移频截止频率 → 错，两者无关（移频截止属压缩调试参数）。</li></ul>\n<h4>【D 类·典型习题回顾（直播随堂）】</h4>\n<p>1. 助听器交货质量检验标准 → <b>IEC 118-7</b>。</p>\n<p>2. 平均听力损失 65 dB 选 → <b>中功率（115–124 dB 输出）</b>。</p>\n<p>3. 平均听力损失 90 dB 选 → <b>大功率（125–134 dB）</b>。</p>\n<p>4. 超大功率最大饱和声压级超 → <b>140 dB</b>。</p>\n<p>5. 最大饱和声压级数值指 → <b>OSPL90 曲线最大值</b>。</p>\n<p>6. 最大声输出设置目的 → <b>避免大声损伤残余听力（C）</b>（低设置还影响可懂度）。</p>\n<p>7. 参考测试频率/增益目的 → <b>评判实际使用效果</b>。</p>\n<p>8. 频响图横 10 倍频程 = 纵 → <b>50 dB</b>。</p>\n<p>9. 非线性失真测量仅限 → <b>差波失真</b>。</p>\n<p>10. 满档声增益反映 → <b>电路最大放大能力</b>。</p>\n<p>11. 低频处方公式（线性）题 → 选 <b>B</b>（凭经验）。</p>\n<p>12. 等效输入噪声描述错误 → <b>C（可数字降噪消除）</b>。</p>\n<p>13. 谐波失真测量错误项 → <b>A（互调）/B（满档状态）/D（50 dB 输入）</b>。</p>\n<p>14. 方向性：安静环境选 → <b>全向性模式</b>。</p>\n<p>15. 无论何种模式不被降低的方向 → <b>正前方</b>。</p>\n<p>16. 双指向降低的方向 → <b>90°/270°（左右侧）</b>。</p>\n<p>17. 难做双麦克风方向性 → <b>ITC / CIC（选 D）</b>。</p>\n<p>18. 可有方向性功能的 → 耳背式 / RIC / ITE（反之选）。</p>\n<p>19. 方向性不符项 → 闷感减轻 / 噪声不吵 / 声音变近（CDE 均不符）。</p>\n<p>20. 麦克风原理分类 → 电磁动圈式 / 压电陶瓷式 / 驻极体式（<b>不含最新 MEMS</b>）。</p>\n<p>21. 适合移频的听损 → <b>低频中重、中高频中度的陡降型（C）</b>。</p>\n<p>22. 移频方向 → <b>高频转到低中频</b>。</p>\n<p>23. 噪声程序场景 → <b>50 人就餐</b>。</p>\n<p>24. 多程序目的 → <b>提高不同环境聆听效果（用户实际效果为准）</b>。</p>\n<p>25. T 线圈程序主要目的 → <b>接打固定电话</b>。</p>\n<p>26. 仅用电感音 → <b>仅开启 T 档</b>。</p>\n<p>27. 接听电话最佳 → <b>2.4 GHz 蓝牙程序</b>。</p>\n<p>28. 安静程序应满足 → <b>舒适度 + 言语清晰度</b>。</p>\n<p>29. 移频范围决定因素 → <b>移频频率 + 截止频率</b>（频率压缩时）。</p>\n<p>30. 建议多程序情形 → <b>全选（多环境/想切换/场景转换不适/噪声下摘机/总手动调音量）</b>。</p>\n<p>31. DAI 指 → <b>直接音频输入</b>。</p>\n<p>32. FM 接收后麦克风位置 → <b>衰减位置</b>。</p>\n<p>33. 不同班级 FM 频道重叠 → <b>串台（串频）</b>。</p>\n<p>34. 蓝牙 MFi → <b>直连苹果设备</b>。</p>\n<p>35. BiCROS 英文缩写 → <b>选 C（双侧信号对传）</b>。</p>\n<p>36. bycross 指 → <b>双侧信号对传助听器</b>。</p>\n<p>37. 一侧轻中 + 另一侧极重 → <b>BiCROS</b>。</p>\n<p>38. bycross 调试正确理解 → 按<b>好耳</b>调试（不考虑差耳侧听损/识别率）。</p>\n<p>39. bycross 验配注意 → <b>ABCDE 全对</b>（依差耳选佩戴式 / 软件选模式 / 双侧麦克风开 / 多程序解决 / 增益依好耳）。</p>\n<p>40. CROS 工作原理错误项 → <b>B（叉耳均装受话器）/ D（仅无线）</b>。</p>\n<p>41. CROS 局限性 → <b>ABCD</b>（不能真双耳提升、差耳听不到放大声、单耳非立体感、好耳正常也须戴机）；<b>E（不能减少头影效应）错</b>——CROS 首要解决头影效应。</p>\n<hr>\n<blockquote><b>备考提示</b>：三级相较四级新增<b>多选题</b>且难度提升，部分习题会出现书本未细讲的知识点（如处方公式、CIC 最大饱和声压级范围），需结合四级教材与经验作答。本笔记已将所有随堂习题答案标注，建议对照教材 65–111 页逐节复盘。</blockquote>"}, {"id": "sum", "no": "汇总", "title": "学习汇总（系统化主线）", "teacher": "AI 整合 5 课", "dur": "测听→声导抗→真耳分析→验配→康复", "file": "学习汇总.md", "body": "<h2>学习汇总 · 助听器验配师（三级）网课系统复习</h2>\n<blockquote>整合 5 节钉钉直播回放：<b>测听 → 声导抗 → 真耳分析 → 助听器验配 → 听力康复</b></blockquote>\n<blockquote>配套分课笔记：钉钉直播回放_周梦琪戴孟特_中耳传声能力评估.md / _戴瑞邦_三级助听器模块1.md / _申屠思灵_声导抗测试.md / _申屠思灵_言语测听与纯音测听.md / _董燕华_听力助听器.md</blockquote>\n<hr>\n<div class=\"lec-sec-head\"><h3>一、主线知识地图</h3></div>\n<div class=\"lec-flow\">\n<div class=\"flow-node\">\n<div class=\"flow-stage\">三早</div>\n<div class=\"flow-tags\">\n<span class=\"flow-tag\">早发现 → 早诊断 → 早干预</span>\n</div>\n</div>\n<div class=\"flow-arrow\">▼</div>\n<div class=\"flow-node\">\n<div class=\"flow-stage\">听力检测（主客观）</div>\n<div class=\"flow-tags\">\n<span class=\"flow-tag\">客观：OAE / ABR / ASSR / 声导抗</span>\n<span class=\"flow-tag\">主观：纯音测听 / 言语测听 / 小儿行为测听</span>\n</div>\n</div>\n<div class=\"flow-arrow\">▼</div>\n<div class=\"flow-node\">\n<div class=\"flow-stage\">声导抗（中耳功能）</div>\n<div class=\"flow-tags\">\n<span class=\"flow-tag\">鼓室图 ABC 分型</span>\n<span class=\"flow-tag\">声反射 / 衰减</span>\n</div>\n</div>\n<div class=\"flow-arrow\">▼</div>\n<div class=\"flow-node\">\n<div class=\"flow-stage\">纯音 / 言语测听</div>\n<div class=\"flow-tags\">\n<span class=\"flow-tag\">PI 曲线</span>\n<span class=\"flow-tag\">香蕉图</span>\n</div>\n</div>\n<div class=\"flow-arrow\">▼</div>\n<div class=\"flow-node\">\n<div class=\"flow-stage\">真耳分析 REM</div>\n<div class=\"flow-tags\">\n<span class=\"flow-tag\">个性化验配验证</span>\n</div>\n</div>\n<div class=\"flow-arrow\">▼</div>\n<div class=\"flow-node\">\n<div class=\"flow-stage\">助听器验配</div>\n<div class=\"flow-tags\">\n<span class=\"flow-tag\">性能测试</span>\n<span class=\"flow-tag\">方向性</span>\n<span class=\"flow-tag\">程序</span>\n<span class=\"flow-tag\">移频</span>\n<span class=\"flow-tag\">无线</span>\n</div>\n</div>\n<div class=\"flow-arrow\">▼</div>\n<div class=\"flow-node\">\n<div class=\"flow-stage\">听力言语康复</div>\n<div class=\"flow-tags\">\n<span class=\"flow-tag\">环境</span>\n<span class=\"flow-tag\">训练</span>\n<span class=\"flow-tag\">家庭指导</span>\n</div>\n</div>\n</div>\n<hr>\n<div class=\"lec-sec-head\"><h3>二、分模块系统梳理</h3></div>\n<h4>模块 1 · 听力检测（测听）</h4>\n<ul><li>*客观测听**（不需配合）</li><li><b>耳声发射 OAE</b>：来源于耳蜗外毛细胞，经中耳传入外耳道。TEOAE 用于新生儿筛查（快、无创），DPOAE 用于诊断（频率特异性强）。未引出提示 &gt;30~40 dB 或中耳/外耳问题。</li><li><b>ABR（听性脑干反应）</b>：短声 ABR（click）反映 2k~4k 高频；分频 ABR（tone-burst）测 500/1k/2k/4k；骨导 ABR 鉴别传导性/感音性；AABR 用于新生儿筛查（35 dB 测试音）。</li><li><b>ASSR（多频稳态）</b>：重者用，轻中度更建议短纯音 ABR。</li><li><b>声导抗</b>：见模块 2。</li></ul>\n<ul><li>*主观测听**（需配合）</li><li><b>纯音测听</b>：气导/骨导听阈，得出 PTA 平均听阈。</li><li><b>言语测听</b>：言语识别阈 SRT、言语识别率（最大言语识别率，单/双音节词表）、背景噪声中言语识别（信噪比 5/10 dB）。<b>听觉 vs 听力</b>：听觉=生理接收，听力=心理认知理解；处理四层级：察觉→辨别→认定→识别。</li><li><b>PI 曲线（言语识别率-强度函数）五型</b>：A 正常型、B 平移型（传导性）、C 平缓型（蜗性）、D 回跌型、E 未引出型（蜗后）。</li><li><b>小儿行为测听</b>：BOA 行为观察测听（&lt;6 月，无强化，仅筛查）；VRA 视觉强化测听（7 月~2.5 岁，条件化）；PA 游戏测听（2.5~5 岁，可戴耳机分耳测）。英文与年龄一一对应须记。</li></ul>\n<h4>模块 2 · 声导抗（中耳传声功能）</h4>\n<ul><li><b>原理</b>：声导抗 = 声阻抗 + 声导纳；测反射声能量换算声顺值。</li><li><b>探测音</b>：成人 226 Hz（劲度因素）；&lt;6 月婴儿 <b>1000 Hz</b>（质量因素，骨壁未全骨化）；高频 678/1000 Hz 看质量因素疾病。</li><li><b>鼓室图 ABC 分型</b>：A 正常（峰压 -100~+50 daPa，声顺 0.3~1.6 mL，外耳道容积 0.6~1.5 mL）；As 声顺&lt;0.3（听骨链固定/耳硬化）；Ad 声顺&gt;1.6（鼓膜松弛/听骨链中断）；B 平坦无峰（积液/耵聍/穿孔，看等效容积区分）；C 负压型（峰压&lt;-100 daPa，咽鼓管功能障碍）。</li><li><b>声反射</b>：&gt;80 dB 强声引起镫骨肌收缩保护内耳；阈 70~95 dB HL；<b>衰减 &gt;50%（500/1000 Hz，10 秒）提示蜗后病变</b>；引不出提示传导性/蜗后病变。</li></ul>\n<h4>模块 3 · 真耳分析 REM（个性化验配验证）</h4>\n<ul><li>戴真机在近鼓膜处测实际输出。REUG 未助增益、REAR 助后增益、REOG 堵耳增益、RECD 耦合腔差。</li><li>必做流程（英/美验配强制）：校准 → 输听力图 → 测 REUG → 非开放加测 REOG → 戴机测 REAR → 比对目标曲线调增益。为何做：2cc 耦合腔是&quot;标准耳&quot;，真实耳朵个体差异大。</li></ul>\n<h4>模块 4 · 助听器验配</h4>\n<ul><li><b>常规性能测试（GB/T 25102.7 / IEC 118-7）</b>：① OSPL90 饱和声压级（输入 90 dB SPL 满档增益，误差 ±4 dB 合格；功率划分 &lt;105 小 / 105-114 中小 / 115-124 中 / 125-134 大 / &gt;135 特大，对应轻/中/中重/重/极重）；② 满档声增益（65 dB SPL，反映最大放大）；③ 频率响应范围；④ 谐波失真（仅差波，2F0/3F0）；⑤ 等效输入噪声（电子热噪，数字降噪不能消除）；⑥ 电源电流（仅电池款）。</li><li><b>方向性麦克风</b>：提高信噪比。DI 方向性指数：超强心型 6.0 &gt; 强心型 5.7 &gt; 心型/8 字型 4.8。全向性各向均最大。<b>CIC 不能做方向性</b>（面板太小无两开口、无外部延时）。双麦克风可数字调延时；自适应/多通道自适应方向性自动选极性；相位/幅度失匹配致 DI 下降。</li><li><b>程序设置</b>：默认程序（不可删）+ 可添加（3~4 个）；安静/噪声/其他（电话程序 500-400 Hz 后陡降）；按用户需求设多程序。</li><li><b>移频技术</b>：高频死区/陡降型适用。频率转移（复制叠加到低频）、频率压缩（线性/非线性/自适应非线性，双截止频率：移频/截止）。原则：能不移就不移、能少移不多移。</li><li><b>无线/智能连接</b>：电感线圈（T 线圈）、FM（调频，DAI 直接音频输入，易串台）、数字调制（蓝牙，经典/低功耗，BLE Audio/Auracast 2021 打破品牌壁垒）、红外。</li><li><b>CROS / BiCROS</b>：CROS 单侧全聋、对侧正常（传送器侧<b>永无声音</b>、配件不能单独用、90% 外挂）；BiCROS 双侧均有听损（接收侧麦克风开启）。单侧听损 ≠ 单侧聋，仅单侧聋适用 CROS。</li></ul>\n<h4>模块 5 · 听力言语康复</h4>\n<ul><li>学龄期听障儿童：聆听环境（噪声/混响/信噪比；座位坐 2~3 排中间；方向性开了侧面后面衰减）；康复原则（早基线、持续兼顾、精细分析、联动实施等）；听觉训练四过程（觉察→辨别→识别→理解）；6-11 岁 / 12-18 岁训练目标。</li><li>言语康复：发声/构音/语义/语法/语用训练；交际训练（人际沟通技巧、看话读唇）。</li><li>验配师/听力师角色：教家长儿童使用助听设备（佩戴/开关/电池/清洁/保养）、聆听策略（看话、调整交流方式、优化环境）。</li></ul>\n<hr>\n<div class=\"lec-sec-head\"><h3>三、儿童听力康复全流程（三早）</h3><button class=\"lec-practice\" onclick='practiceTopics([\"三早原则\", \"新生儿筛查\", \"残疾预防条例\"])'>🏋 练本节相关的题 →</button></div>\n<p>1. <b>早发现</b>：出生 24~72 h 做 OAE/AABR 初筛；未过率高（羊水胎脂中耳积液）；42 天内复筛（90%+ 通过）；NICU 宝宝出院做 OAE+AABR。</p>\n<p>2. <b>早诊断</b>：复筛未过 → 3 个月内听力诊断（鼓室图、DPOAE、ABR 气/骨导、ASSR 等）。</p>\n<p>3. <b>早干预</b>：确诊永久性感音神经性聋 → 6 个月内配助听器；10~12 月可人工耳蜗；同时家庭言语康复。</p>\n<p>4. <b>遗传/高危</b>：50~60% 遗传性（GJB2 最常见隐性、SLC26A4→大前庭导水管、线粒体 DNA→避免氨基糖苷）；非遗传（感染弓形体/巨细胞/风疹/梅毒/单疱、耳毒性药物、高胆红素→听神经病、缺氧早产）。</p>\n<hr>\n<div class=\"lec-sec-head\"><h3>四、与 363 题题库高频对应考点（速记锚点）</h3></div>\n<ul><li>新生儿筛查 <b>72 h</b> 内；婴儿期 <b>28 天~1 周岁</b>；VRA 英文=视觉强化；BOA=行为观察测听</li><li>鼓室图 A/As/Ad/B/C 分型与疾病；声顺 0.3~1.6 mL、容积 0.6~1.5 mL、峰压 -100~+50 daPa</li><li>声反射阈 70~95 dB；衰减 &gt;50% 蜗后；PI 曲线五型</li><li>香蕉图（言语频率是否在图内）；言语识别率最大用双音节词表</li><li>OSPL90 与功率对应；参考测试频率 1600 Hz（高频 2500 Hz）；CIC 不做方向性；DI 超强心型最高</li><li>CROS（对侧传声、传送器侧无声）/ BiCROS（双侧）</li><li>三早原则；GJB2/SLC26A4/线粒体 DNA；听神经病（OAE 引出 ABR 未引出）</li></ul>"}];

function getTopic(q){ return q.exp.title.replace(/^考察点：/,''); }
function getWrong(){ return LS.get('wrong',[]); }
function addWrong(qid){ var w=getWrong(); if(w.indexOf(qid)<0){ w.push(qid); LS.set('wrong',w); } }
function removeWrong(qid){ var w=getWrong(); var i=w.indexOf(qid); if(i>=0){ w.splice(i,1); LS.set('wrong',w); } }
// 已做过（去重）：无论对错，答过就计入，用于算"未做题"进度
function getDone(){ return LS.get('done',[]); }
function getRounds(){ return LS.get('rounds',0); }
function addDone(qid){
  var d=getDone();
  if(d.indexOf(qid)<0){
    d.push(qid);
    if(d.length>=TOTAL){            // 本轮刷满全部题 → 完成一轮，进入下一轮并重新计数
      LS.set('rounds', getRounds()+1);
      d=[];
    }
    LS.set('done',d);
  }
}
function practiceOne(qid){ S.page='quiz'; S.qid=qid; S.history=[]; S.answered=false; S.multi_sel={}; render(); }
function topicPool(topic){ var p=[]; for(var i=0;i<BANK.length;i++){ if(getTopic(BANK[i])===topic) p.push(i); } return p; }
function startWrong(){ S.mode='wrong'; startQuiz(); }
function startUndone(){ S.mode='undone'; startQuiz(); }
function practiceTopics(topics){
  S.mode='topics'; S.topics=topics.slice(); S.page='quiz'; S.history=[]; pickNext();
}
function startTopic(t){ S.topic=t; S.mode='topic'; startQuiz(); }

// ========== 首页 ==========
function renderHome(){
  var stats = LS.get('stats',{total:0,correct:0});
  var w = getWeights(); var wrongCount=0, masteredCount=0;
  for(var k in w){ if(w[k]>=2.0) wrongCount++; else if(w[k]<=0.3) masteredCount++; }
  var rate = stats.total>0 ? (stats.correct/stats.total*100).toFixed(1) : '--';
  var doneCount = getDone().length;
  var undone = Math.max(0, TOTAL - doneCount);
  app.innerHTML = topbar('home') +
  '<div class="home-hero"><h1>助听器验配师（三级）考试复习系统</h1>'+
    '<div class="sub">'+TOTAL+' 道题 · 单选 '+SINGLE_COUNT+' + 多选 '+MULTI_COUNT+' · 间隔重复算法 · 内置知识点解析 · 相似题对比 '+SIMILAR_COUNT+' 组</div></div>'+
  '<div class="stats-grid">'+
    '<div class="s-item"><div class="n">'+stats.total+'</div><div class="l">累计做题</div></div>'+
    '<div class="s-item"><div class="n">'+rate+'%</div><div class="l">正确率</div></div>'+
    '<div class="s-item"><div class="n">'+doneCount+'</div><div class="l">已做过</div></div>'+
    '<div class="s-item undone"><div class="n" style="color:'+(undone>0?'var(--warn)':'var(--correct)')+'">'+undone+'</div>'+
      '<div class="l">未做题 · 已刷 '+getRounds()+' 轮</div>'+
      '<button class="mini-cta" onclick="startUndone()">只刷未做题 →</button></div>'+
  '</div>'+
  '<div class="prog-wrap"><div class="prog-bar"><div class="prog-fill" style="width:'+(TOTAL>0?doneCount/TOTAL*100:0)+'%"></div></div>'+
    '<div class="prog-label">做题进度 <b>'+doneCount+'</b> / '+TOTAL+'（还剩 <b style="color:'+(undone>0?'var(--warn)':'var(--correct)')+'">'+undone+'</b> 题没做过）</div></div>'+
  '<div class="card"><h2>开始刷题</h2><div class="mode-grid">'+
    modeBtn('all','混合随机',TOTAL+' 道 · 单选多选混合',false)+
    modeBtn('single','仅单选题',SINGLE_COUNT+' 道',false)+
    modeBtn('multi','仅多选题',MULTI_COUNT+' 道',false)+
    modeBtn('weak','薄弱突击','错题更高频复现',true)+
    modeBtn('wrong','错题练习','答错过的题重做',true)+
  '</div>'+
  '<button class="big-start" onclick="startQuiz()">开始刷题</button></div>'+
  '<div class="card"><h2>按知识点分类练习</h2><p>按考查主题挑题刷：耳部解剖、声学基础、测听方法、声导抗、儿童康复、助听器技术、职业道德等。练到薄弱主题，逐个击破。</p>'+
    '<button class="btn btn-ghost" onclick="goTab(\'topic\')">去选择分类 →</button></div>'+
  '<div class="card"><h2>算法说明</h2><p>系统记录每道题的出现权重：答对权重减半（减少出现），答错权重翻倍（更频繁出现）。越薄弱的题越容易被抽到（间隔重复）。答错后自动展示相关知识点解析。做题记录保存在本机浏览器，随时返回。</p></div>'+
  '<div class="card"><h2>📝 模拟考试</h2><p>按真实考试节奏：自定义单选/多选题量与时长，限时作答、交卷判分。检验当前水平，找出薄弱点。</p>'+
    '<button class="btn btn-primary" onclick="goTab(\'exam\')">去设置模拟考 →</button></div>'+
  '<div class="card" style="text-align:center"><button class="btn btn-danger btn-mini" onclick="goTab(\'setting\')">⚙ 系统数据设置（重置 / 导入导出 / 弱项重练）</button></div>'+
  '<div class="footer">本系统由核桃制作 · '+VERSION+'</div>';
}
function modeBtn(mode,title,desc,weak){
  var sel = (S.mode===mode) ? ' sel' : '';
  return '<button class="mode-btn'+(weak?' weak':'')+sel+'" onclick="setMode(\''+mode+'\')">'+
    '<b><span class="mark"></span>'+title+'</b><span>'+desc+'</span></button>';
}
function setMode(m){ S.mode=m; renderHome(); }

// ========== 刷题 ==========
function startQuiz(){
  // 弱项间隔重练：开启且超间隔 → 优先把错题本塞进本轮前段
  S.weakFirst = [];
  var wr = LS.get('weak_review', {on:false, days:1, last:0});
  if(wr.on && wr.days){
    var passed = (Date.now() - (wr.last||0)) >= wr.days*86400000;
    var wrong = getWrong();
    if(passed && wrong.length){ S.weakFirst = wrong.slice(); wr.last = Date.now(); LS.set('weak_review', wr); }
  }
  S.page='quiz'; S.history=[]; pickNext();
}
function pickNext(){
  var pool=[];
  if(S.mode==='all'){ for(var i=0;i<BANK.length;i++) pool.push(i); }
  else if(S.mode==='single'){ for(var i=0;i<BANK.length;i++) if(!BANK[i].multi) pool.push(i); }
  else if(S.mode==='multi'){ for(var i=0;i<BANK.length;i++) if(BANK[i].multi) pool.push(i); }
  else if(S.mode==='weak'){ var w=getWeights(); for(var i=0;i<BANK.length;i++){ if((w[i]||1.0)>=1.5) pool.push(i); } if(!pool.length){ for(var i=0;i<BANK.length;i++) pool.push(i); } }
  else if(S.mode==='wrong'){ pool=getWrong().slice(); if(!pool.length){ for(var i=0;i<BANK.length;i++) pool.push(i); } }
  else if(S.mode==='topic'){ if(S.topic!=null){ pool=topicPool(S.topic); if(!pool.length){ for(var i=0;i<BANK.length;i++) pool.push(i); } } }
  else if(S.mode==='topics'){ var tp=[]; for(var ti=0;ti<S.topics.length;ti++){ tp=tp.concat(topicPool(S.topics[ti])); } pool=tp; if(!pool.length){ for(var i=0;i<BANK.length;i++) pool.push(i); } }
  else if(S.mode==='undone'){ var d=getDone(); for(var i=0;i<BANK.length;i++){ if(d.indexOf(i)<0) pool.push(i); } }
  if(!pool.length){ for(var i=0;i<BANK.length;i++) pool.push(i); }
  if(S.weakFirst && S.weakFirst.length){
    var wf = S.weakFirst.shift();           // 优先出弱项错题
    if(pool.indexOf(wf)>=0 || S.mode==='all' || S.mode==='wrong' || S.mode==='weak'){ S.qid=wf; }
    else { S.weakFirst.unshift(wf); S.qid = weightedPick(pool); }
  } else {
    S.qid = weightedPick(pool);
  }
  S.answered=false; S.multi_sel={};
  render();
}
function renderQuiz(){
  var q = BANK[S.qid];
  var sessionCorrect=0, sessionTotal=S.history.length;
  for(var h=0;h<S.history.length;h++){ if(S.history[h].correct) sessionCorrect++; }
  var sessRate = sessionTotal>0 ? (sessionCorrect/sessionTotal*100).toFixed(0) : '--';
  var qWeight = getWeight(S.qid).toFixed(2);
  var last = (S.answered && S.history.length>0) ? S.history[S.history.length-1] : null;

  var mainHTML = '<div class="q-card">'+
    '<div><span class="q-tag '+(q.multi?'multi':'sel')+'">'+(q.multi?'多选题':'单选题')+'</span>'+
      '<span class="q-meta">第 '+(S.history.length+1)+' 题 · 权重 '+qWeight+'</span></div>'+
    '<div class="q-stem">'+q.s+'</div>';

  if(q.multi){
    // 多选题：可勾选，确认作答
    mainHTML += '<div class="options">';
    for(var i=0;i<q.o.length;i++){
      var k=q.o[i].k;
      var cls='multi-tog';
      if(S.answered){
        var inSel = last && last.userAns.indexOf(k)>=0;
        if(q.a.indexOf(k)>=0){ cls+=' correct'+((inSel)?'':''); }
        else if(inSel){ cls+=' wrong'; }
        else { cls+=' dim'; }
      } else {
        if(S.multi_sel[k]) cls+=' selected';
      }
      mainHTML += '<div class="option '+cls+'" '+(S.answered?'':'onclick="toggleMulti(\''+k+'\')"')+'><span class="letter">'+k+'</span><span>'+q.o[i].t+'</span></div>';
    }
    mainHTML += '</div>';
    if(!S.answered){
      mainHTML += '<div class="confirm-bar"><button class="btn btn-primary" onclick="answerMulti()">确认作答（已选 '+Object.keys(S.multi_sel).length+' 项）</button></div>';
    }
  } else {
    mainHTML += '<div class="options">';
    var labels=['A','B','C','D'];
    for(var i=0;i<q.o.length;i++){
      var cls='';
      if(S.answered){
        if(q.o[i].k===q.a) cls=' correct';
        else if(last && q.o[i].k===last.userAns) cls=' wrong';
        else cls=' dim';
      }
      mainHTML += '<div class="option'+cls+'" '+(S.answered?'':'onclick="answer(\''+q.o[i].k+'\')"')+'><span class="letter">'+q.o[i].k+'</span><span>'+q.o[i].t+'</span></div>';
    }
    mainHTML += '</div>';
  }

  if(S.answered && q.exp){
    var ok = last && last.correct;
    mainHTML += '<div class="feedback '+(ok?'ok':'err')+'">'+(ok?'✅ 回答正确！':'❌ 回答错误！')+
      '<div class="explain" style="margin-top:12px"><div class="exp-title">📖 '+q.exp.title+'</div>'+q.exp.text.replace(/\n/g,'<br>')+'</div></div>';
  }

  mainHTML += '<div class="next-hint">'+(S.answered?'点击「下一题」或按 <kbd>空格</kbd>':'点击选项作答')+'</div>'+
    (S.answered?'<div class="mobile-next"><button class="btn btn-primary" onclick="pickNext()">下一题 →</button></div>':'')+'</div>';
  var dots=''; for(var d=0;d<S.history.length;d++){ dots+='<span class="dot '+(S.history[d].correct?'ok':'bad')+'">'+(S.history[d].correct?'✓':'✗')+'</span>'; }
  var sideHTML = '<div class="side">'+
    '<div class="side-top">'+
    '<div class="p-title">📊 学习面板</div>'+
    '<div class="big">'+sessRate+'%</div><div class="label">本轮正确率</div>'+
    '<div class="p-row"><span>本轮已做</span><b>'+sessionTotal+' 题</b></div>'+

    '</div>'+
    '<div class="side-scroll">'+
    '<div class="dots-wrap"><div class="p-row" style="border-bottom:none"><span>答题轨迹</span><b>'+sessionCorrect+'对 / '+(sessionTotal-sessionCorrect)+'错</b></div><div class="dots">'+(dots||'<span style="color:var(--muted);font-size:12px">暂无</span>')+'</div></div>'+
    '<div class="p-row"><span>本题权重</span><b class="'+(qWeight>=2?'red':'green')+'">'+qWeight+'</b></div>'+

    '</div>'+

      '<button class="btn btn-primary" onclick="pickNext()">下一题</button>'+
      '<button class="btn btn-ghost" onclick="goTab(\'home\')">结束本轮</button>'+
    '</div></div>';
  app.innerHTML = topbar('quiz') + '<div class="q-wrap">'+mainHTML+sideHTML+'</div>';
  document.documentElement.setAttribute('data-theme', S.theme);
}
function toggleMulti(k){ if(S.answered) return; if(S.multi_sel[k]) delete S.multi_sel[k]; else S.multi_sel[k]=1; renderQuiz(); }
function answer(u){
  if(S.answered) return;
  var q = BANK[S.qid];
  var correct = (u===q.a);
  S.history.push({qid:S.qid, userAns:u, correct:correct});
  S.answered=true; updateWeight(S.qid,correct);
  if(correct) removeWrong(S.qid); else addWrong(S.qid);
  addDone(S.qid);
  var stats=LS.get('stats',{total:0,correct:0}); stats.total++; if(correct) stats.correct++; LS.set('stats',stats);
  render();
}
function answerMulti(){
  if(S.answered) return;
  var q = BANK[S.qid];
  var chosenKeys=[], correct=true;
  // 逐一核对
  for(var i=0;i<q.o.length;i++){
    var k=q.o[i].k;
    var chosen = !!S.multi_sel[k];
    var right = q.a.indexOf(k)>=0;
    if(chosen!==right){ correct=false; }
    if(chosen) chosenKeys.push(k);
  }
  var ua = chosenKeys.join('');
  S.history.push({qid:S.qid, userAns:ua, correct:correct});
  S.answered=true; updateWeight(S.qid,correct);
  if(correct) removeWrong(S.qid); else addWrong(S.qid);
  addDone(S.qid);
  var stats=LS.get('stats',{total:0,correct:0}); stats.total++; if(correct) stats.correct++; LS.set('stats',stats);
  render();
}

    '<div style="margin:12px 0">'+
      '<button class="btn btn-primary" onclick="startWrong()">全部重做（'+w.length+' 题）</button>'+

    html += '<p style="color:var(--sub);line-height:1.8">还没有错题记录。<br>答题时答错的题会自动收进这里，等你答对后自动移出，直到全部清零。</p>';

}

// 完整渲染一道题（题干+全部选项+答案）
function fullQ(bq, label){
  var ansTxt;
  if(bq.multi){ ansTxt = bq.o.filter(function(o){return bq.a.indexOf(o.k)>=0}).map(function(o){return o.k+') '+o.t}).join('、'); }
  else { var o=bq.o.filter(function(x){return x.k===bq.a})[0]; ansTxt=o?o.k+') '+o.t:''; }
  var opts='';
  for(var j=0;j<bq.o.length;j++){ var o=bq.o[j]; opts+='<div class="opt'+(bq.a.indexOf(o.k)>=0?' ans':'')+'"><span class="ol">'+o.k+'</span><span>'+o.t+'</span></div>'; }
  return '<div class="fullq">'+(label?'<div class="fq-tag">'+label+'</div>':'')+
    '<div class="fq-stem">'+bq.s+'</div>'+
    '<div class="fq-opts">'+opts+'</div>'+
    '<div class="fq-ans">答案：<b>'+ansTxt+'</b></div></div>';
}
function memoSection(title, list, tag){
  var out='<div class="memo-sec"><h2>'+title+' <span class="memo-count">'+list.length+' 题</span></h2>';
  for(var i=0;i<list.length;i++){ out+=fullQ(list[i], tag); }
  return out+'</div>';
}
function renderSimilarList(q){
  var el = document.getElementById('sim-list'); if(!el) return;
  var out='';
  if(S.simFilter==='all' || S.simFilter==='memo'){
    var yl=MEMO.year.filter(function(x){return !q || x.s.indexOf(q)>=0 || x.o.some(function(o){return o.t.indexOf(q)>=0;});});
    var ll=MEMO.latin.filter(function(x){return !q || x.s.indexOf(q)>=0 || x.o.some(function(o){return o.t.indexOf(q)>=0;});});
    out += memoSection('📅 纯记忆 · 年份类', yl, '年份');
    out += memoSection('🔤 纯记忆 · 英文/数字代号', ll, '缩写');
  }
  if(S.simFilter==='all' || S.simFilter==='contrast' || S.simFilter==='variant'){
    for(var i=0;i<SIMILAR.length;i++){
      var g = SIMILAR[i];
      var isCon = g.type.indexOf('对比')>=0;
      if(S.simFilter==='contrast' && !isCon) continue;
      if(S.simFilter==='variant' && isCon) continue;
      if(q && (g.title+g.type).indexOf(q)<0 && !g.lines.some(function(it){return it[1] && it[1].indexOf(q)>=0;})) continue;
      out += '<div class="sim-group '+(isCon?'g-contrast':'g-variant')+'">'+
        '<div class="g-head"><span class="g-type">'+(isCon?'易混':'变体')+'</span><span class="g-title">'+g.title+'（'+g.type+'）</span></div>';
      var ai=0; // ans_list 游标：对比组答案行按 题A→题B 顺序
      for(var j=0;j<g.lines.length;j++){
        var it=g.lines[j];
        var isQA = it[0]==='A'||it[0]==='B';
        if(it[2]){ out += fullQ(it[2], it[0]!=='N'?it[0]:''); }
        else {
          out += '<div class="sim-item">'+(isQA?'<span class="tag">'+it[0]+'：</span>':'')+it[1]+
            (isQA&&g.ans_list&&g.ans_list[ai]?'<div class="sim-ans" style="margin-top:4px">答案：'+g.ans_list[ai]+'</div>':'')+'</div>';
        }
        if(isQA && g.ans_list) ai++;
      }
      if(g.shared_ans) out += '<div class="sim-ans">答案相同：<b>'+g.shared_ans+'</b></div>';
      if(g.variant) out += '<div class="sim-item" style="color:var(--sub)">'+g.variant+'</div>';
      if(g.diff) out += '<div class="sim-diff">⚠ '+g.diff+'</div>';
      out += '</div>';
    }
  }
  el.innerHTML = out || '<div class="card"><p>无匹配。</p></div>';
}
