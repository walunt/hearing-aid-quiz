": "声导纳"}], "a": "A", "multi": false, "exp": {"title": "考察点：咽鼓管功能", "text": "正确答案：A）峰压\n\n咽鼓管的主要功能：①保持鼓膜两侧气压平衡；②引流中耳分泌物；③阻声(防声、隔音)作用，调节中耳压力、保护中耳。"}}, {"n": 202, "s": "REIG 的中文意思是（    ）。", "o": [{"k": "A", "t": "真耳未助响应"}, {"k": "B", "t": "真耳插入增益"}, {"k": "C", "t": "真耳有助响应"}, {"k": "D", "t": "真耳耦合腔差值"}], "a": "B", "multi": false, "exp": {"title": "考察点：真耳增益", "text": "正确答案：B）真耳插入增益\n\nREAG=真耳有助增益；REUG=真耳未助增益；REIG=真耳插入增益(Real-Ear Insertion Gain)。三者仅差字母，注意区分。"}}, {"n": 203, "s": "完整的耳印模不包括（    ）。", "o": [{"k": "A", "t": "外耳道"}, {"k": "B", "t": "耳甲腔"}, {"k": "C", "t": "耳甲艇"}, {"k": "D", "t": "耳屏"}], "a": "D", "multi": false, "exp": {"title": "考察点：耳印模/耳模", "text": "正确答案：D）耳屏\n\n取耳印模用于制作耳模。完整耳印模覆盖耳道及耳廓前部相应区域；异常耳廓/耳道取印模时须正确置入耳障、注入印模材料并保证完整。"}}, {"n": 204, "s": "健听儿童的词序策略产生于 3 岁左右，（    ）以后渐渐减弱。", "o": [{"k": "A", "t": "4 岁"}, {"k": "B", "t": "5 岁"}, {"k": "C", "t": "6 岁"}, {"k": "D", "t": "7 岁"}], "a": "B", "multi": false, "exp": {"title": "考察点：词序策略", "text": "正确答案：B）5 岁\n\n健听儿童词序理解策略在 3 岁产生，5 岁后逐渐减弱。"}}, {"n": 205, "s": "幼儿出现偶偶作声情况（自言自语）， 一般发生在（    ）。", "o": [{"k": "A", "t": "2 个月时"}, {"k": "B", "t": "3 个月时"}, {"k": "C", "t": "4 个月时"}, {"k": "D", "t": "5 个月时"}], "a": "A", "multi": false, "exp": {"title": "考察点：助听器适用年龄", "text": "正确答案：A）2 个月时\n\n助听器适用全年龄段：幼儿、少年、青年、中年、老年。"}}, {"n": 206, "s": "移频通常是把（    ）频率声音移到（    ）频率区域。", "o": [{"k": "A", "t": "低频、高频"}, {"k": "B", "t": "中频、高频"}, {"k": "C", "t": "高频、中低频"}, {"k": "D", "t": "中低频、高频"}], "a": "C", "multi": false, "exp": {"title": "考察点：移频", "text": "正确答案：C）高频、中低频\n\n移频技术把听障者难听到的『高频』声音移频到可听的『中低频』区域。"}}, {"n": 207, "s": "外耳道肿瘤的性质均为（    ）。", "o": [{"k": "A", "t": "良性"}, {"k": "B", "t": "恶性"}, {"k": "C", "t": "良性或者恶性"}, {"k": "D", "t": "性质不明"}], "a": "C", "multi": false, "exp": {"title": "考察点：外耳道长度", "text": "正确答案：C）良性或者恶性\n\n成人外耳道长约 2.5 cm（外1/3软骨部，内2/3骨部）。"}}, {"n": 208, "s": "言语测试时，先检测（    ）。", "o": [{"k": "A", "t": "健耳"}, {"k": "B", "t": "患耳"}, {"k": "C", "t": "双耳"}, {"k": "D", "t": "都可以"}], "a": "A", "multi": false, "exp": {"title": "考察点：言语测听", "text": "正确答案：A）健耳\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。"}}, {"n": 209, "s": "父母亲均为 SLC26A4 基因隐性携带者，自己未发病，孩子出现发病表型的概率为（    ）。", "o": [{"k": "A", "t": "100%"}, {"k": "B", "t": "80%"}, {"k": "C", "t": "60%"}, {"k": "D", "t": "25%"}], "a": "D", "multi": false, "exp": {"title": "考察点：SLC26A4基因", "text": "正确答案：D）25%\n\nSLC26A4 基因隐性遗传，父母双方均为携带者时子女发病概率 25%。"}}, {"n": 210, "s": "3 岁以上的儿童做行为测试首选（    ）。", "o": [{"k": "A", "t": "视觉强化定向反应测听"}, {"k": "B", "t": "小儿行为观察反应测听"}, {"k": "C", "t": "游戏测听"}, {"k": "D", "t": "声导抗测听"}], "a": "C", "multi": false, "exp": {"title": "考察点：分龄测听法", "text": "正确答案：C）游戏测听\n\n按年龄选择行为测听法：4~6 月听觉行为观察；8 月左右视觉强化测听；3 岁以上游戏测听。"}}, {"n": 211, "s": "噪声程序适合下列（    ）场景。", "o": [{"k": "A", "t": "单位食堂（50 人左右同时就餐）"}, {"k": "B", "t": "效区安静的家中"}, {"k": "C", "t": "有 T 感线圈的音乐厅"}, {"k": "D", "t": "个人独享办公室"}], "a": "A", "multi": false, "exp": {"title": "考察点：方向性模式", "text": "正确答案：A）单位食堂（50 人左右同时就餐）\n\n方向性麦克风可提升信噪比；正前方（声源方向）声音不会被方向性处理降低强度，后方/侧方声音会被衰减。"}}, {"n": 212, "s": "游戏测听常用于（    ）。", "o": [{"k": "A", "t": "1 岁半至 4 岁"}, {"k": "B", "t": "1 岁半至 3 岁"}, {"k": "C", "t": "2 岁半至 5 岁或更年长"}, {"k": "D", "t": "2 岁半至 3 岁"}], "a": "C", "multi": false, "exp": {"title": "考察点：分龄测听法", "text": "正确答案：C）2 岁半至 5 岁或更年长\n\n按年龄选择行为测听法：4~6 月听觉行为观察；8 月左右视觉强化测听；3 岁以上游戏测听。"}}, {"n": 213, "s": "（    ）只说明受试耳对各频率纯音的听敏度，不能反映其听功能状态。", "o": [{"k": "A", "t": "声导抗测试"}, {"k": "B", "t": "言语测听"}, {"k": "C", "t": "纯音测听"}, {"k": "D", "t": "客观测听"}], "a": "C", "multi": false, "exp": {"title": "考察点：言语测听", "text": "正确答案：C）纯音测听\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。"}}, {"n": 214, "s": "下列（    ）是最大声输出设置的目的。", "o": [{"k": "A", "t": "避免使助听器不至于产生破音"}, {"k": "B", "t": "避免助听器的增益饱和"}, {"k": "C", "t": "避免大声损伤残余听力"}, {"k": "D", "t": "避免听小声说话声音过小"}], "a": "C", "multi": false, "exp": {"title": "考察点：最大声输出", "text": "正确答案：C）避免大声损伤残余听力\n\n最大声输出(MPO/OSPL90)设置目的是限制助听器最大输出声压级别，避免过强声音损伤残余听力并保证佩戴舒适，一般设在 UCL 与 MCL 之间。"}}, {"n": 215, "s": "一般情况下，下列(    )疾病导致听力损失的平均言语识别率最低。", "o": [{"k": "A", "t": "急性化脓性中耳炎"}, {"k": "B", "t": "听神经谱系障碍"}, {"k": "C", "t": "前庭导水管扩大"}, {"k": "D", "t": "鼓室硬化症"}], "a": "B", "multi": false, "exp": {"title": "考察点：言语测听", "text": "正确答案：B）听神经谱系障碍\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。"}}, {"n": 216, "s": "超大功率助听器的最大饱和声压级（2CC）声强会超过（    ）。", "o": [{"k": "A", "t": "100dB SPL"}, {"k": "B", "t": "110dB SPL"}, {"k": "C", "t": "120dB SPL"}, {"k": "D", "t": "130dB SPL"}], "a": "D", "multi": false, "exp": {"title": "考察点：饱和声压级", "text": "正确答案：D）130dB SPL\n\n饱和声压级(MPO/OSPL90)：超大功率>130 dB SPL；大功率 CIC 约 110~120 dB SPL。选功率时平均听损 95dB 需 MPO>135dB；65dB 约选 MPO 125~135dB SPL。"}}, {"n": 217, "s": "背景声中的言语识别成人采用（    ）。", "o": [{"k": "A", "t": "双音节词表或短句词表"}, {"k": "B", "t": "单音节词表或双音节词表"}, {"k": "C", "t": "单音节词表或短句词表"}, {"k": "D", "t": "噪声"}], "a": "A", "multi": false, "exp": {"title": "考察点：言语测听", "text": "正确答案：A）双音节词表或短句词表\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。"}}, {"n": 218, "s": "声导抗高频探测音适用于（    ）。", "o": [{"k": "A", "t": "幼儿"}, {"k": "B", "t": "少年"}, {"k": "C", "t": "6 个月以下婴儿"}, {"k": "D", "t": "老年人"}], "a": "C", "multi": false, "exp": {"title": "考察点：声导抗", "text": "正确答案：C）6 个月以下婴儿\n\n声导抗测试是声阻抗测试与声导纳测试的合称，用于客观评估中耳功能。"}}, {"n": 219, "s": "幼儿听觉行为观察测听法的英文缩写是（    ）。", "o": [{"k": "A", "t": "PA"}, {"k": "B", "t": "VRA"}, {"k": "C", "t": "PT"}, {"k": "D", "t": "BOA"}], "a": "D", "multi": false, "exp": {"title": "考察点：分龄测听法", "text": "正确答案：D）BOA\n\n按年龄选择行为测听法：4~6 月听觉行为观察；8 月左右视觉强化测听；3 岁以上游戏测听。"}}, {"n": 220, "s": "PLPTT 测试中，通常每个元音或辅音说（    ）次。", "o": [{"k": "A", "t": "3 次"}, {"k": "B", "t": "4 次"}, {"k": "C", "t": "5 次"}, {"k": "D", "t": "6 次"}], "a": "C", "multi": false, "exp": {"title": "考察点：塞擦音", "text": "正确答案：C）5 次\n\n塞擦音是塞音(爆破)与擦音(摩擦)的结合，如 zh、ch、j、z、c 等；清浊由 VOT/声带振动区分。"}}, {"n": 221, "s": "《残疾预防和残疾人康复条例》指出， 提供残疾人康复服务，应当保护残疾人（    ）， 不得歧视、侮辱残疾人。", "o": [{"k": "A", "t": "财产"}, {"k": "B", "t": "名誉"}, {"k": "C", "t": "权力"}, {"k": "D", "t": "隐私"}], "a": "D", "multi": false, "exp": {"title": "考察点：服务/利他", "text": "正确答案：D）隐私\n\n职业服务要求真诚热情、乐于助人、设身处地为服务对象着想。"}}, {"n": 222, "s": "道德不是由国家强制执行的。它是依靠（    ）等唤起人们的知耻心，培养人 们的道德责任感和善恶判断能力。从某种意义上讲， 舆论和良心的力量也是很强 大的。 【多选题】", "o": [{"k": "A", "t": "社会舆论"}, {"k": "B", "t": "人们的良心"}, {"k": "C", "t": "教育感化"}, {"k": "D", "t": "典型示范"}, {"k": "E", "t": "法律法规"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：爱岗敬业/职业理想", "text": "正确答案：A)社会舆论、B)人们的良心、C)教育感化、D)典型示范\n\n职业道德与职业素养是职业能力的重要构成：爱岗敬业、诚实守信、办事公道、服务群众、奉献社会。具备良好职业道德的员工才有创新动力与工作热情，并逐步形成明确的职业理想。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 223, "s": "以下属于职业道德修养的方法的是（    ）。 【多选题】", "o": [{"k": "A", "t": "学习职业道德规范，掌握职业道德知识"}, {"k": "B", "t": "努力学习现代科学文化知识和专业技能，提高文化素养"}, {"k": "C", "t": "经常进行自我反思，增强自律性"}, {"k": "D", "t": "提高精神境界，努力做到“慎独”"}, {"k": "E", "t": "职业道德修养要从培养自己良好的行为习惯着手"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：爱岗敬业/职业理想", "text": "正确答案：A)学习职业道德规范，掌握职业道德知识、B)努力学习现代科学文化知识和专业技能，提高文化素养、C)经常进行自我反思，增强自律性、D)提高精神境界，努力做到“慎独”\n\n职业道德与职业素养是职业能力的重要构成：爱岗敬业、诚实守信、办事公道、服务群众、奉献社会。具备良好职业道德的员工才有创新动力与工作热情，并逐步形成明确的职业理想。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 224, "s": "以下能够体现爱国守法是做好本职工作前提的是（    ）。 【多选题】", "o": [{"k": "A", "t": "把爱国放在公民道德行为之首，是必然的。"}, {"k": "B", "t": "一个现代化文明的国家必然是法治国家。"}, {"k": "C", "t": "守法是一个现代化的国家对公民的起码要求。"}, {"k": "D", "t": "公民也应当把守法当作基本的行为准则。"}, {"k": "E", "t": "公民守法实际上是尊重社会公众的利益和意志。"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：爱国守法", "text": "正确答案：A)把爱国放在公民道德行为之首，是必然的。、B)一个现代化文明的国家必然是法治国家。、C)守法是一个现代化的国家对公民的起码要求。、D)公民也应当把守法当作基本的行为准则。、E)公民守法实际上是尊重社会公众的利益和意志。\n\n爱国是公民道德之首，守法是现代化国家对公民的起码要求。敬业爱国守法是做好本职工作的前提。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 225, "s": "爱岗敬业取决于人们对自己所从事工作的职业态度。无论做什么事，只要      （    ）, 就能做好。 【多选题】", "o": [{"k": "A", "t": "态度端正"}, {"k": "B", "t": "自私自利"}, {"k": "C", "t": "热爱有加"}, {"k": "D", "t": "损人利己"}, {"k": "E", "t": "专心致志"}], "a": "ACE", "multi": true, "exp": {"title": "考察点：爱岗敬业/职业理想", "text": "正确答案：A)态度端正、C)热爱有加、E)专心致志\n\n职业道德与职业素养是职业能力的重要构成：爱岗敬业、诚实守信、办事公道、服务群众、奉献社会。具备良好职业道德的员工才有创新动力与工作热情，并逐步形成明确的职业理想。\n\n（3 项正确：['A', 'C', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 226, "s": "工作程序是使工作（    ），以求得最佳工作秩序、工作质量和工作效率。 【多选题】", "o": [{"k": "A", "t": "条理化"}, {"k": "B", "t": "标准化"}, {"k": "C", "t": "市场化"}, {"k": "D", "t": "规范化"}, {"k": "E", "t": "人性化"}], "a": "ABD", "multi": true, "exp": {"title": "考察点：工作程序", "text": "正确答案：A)条理化、B)标准化、D)规范化\n\n确立工作程序使工作条理化、标准化、规范化，以求得最佳工作秩序、工作质量与效率。\n\n（3 项正确：['A', 'B', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 227, "s": "颞骨位于颅骨两侧，是由（    ）组成。 【多选题】", "o": [{"k": "A", "t": "鳞部"}, {"k": "B", "t": "鼓部"}, {"k": "C", "t": "乳突部"}, {"k": "D", "t": "岩部"}, {"k": "E", "t": "茎突"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：颞骨组成", "text": "正确答案：A)鳞部、B)鼓部、C)乳突部、D)岩部、E)茎突\n\n颞骨位于颅骨两侧，由鳞部、鼓部、乳突部、岩部、茎突组成。乳突部、鼓部等均属颞骨。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 228, "s": "耳廓借（    ）附着于头颅侧面。 【多选题】", "o": [{"k": "A", "t": "韧带"}, {"k": "B", "t": "肌肉"}, {"k": "C", "t": "软骨"}, {"k": "D", "t": "皮肤"}, {"k": "E", "t": "纤毛"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：耳廓附着", "text": "正确答案：A)韧带、B)肌肉、C)软骨、D)皮肤\n\n耳廓借韧带、肌肉、软骨、皮肤附着于头颅侧面，主要起集声与声源定位作用。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 229, "s": "骨蜗管的管腔分为（    ）。 【多选题】", "o": [{"k": "A", "t": "前庭阶"}, {"k": "B", "t": "耳蜗阶"}, {"k": "C", "t": "中阶"}, {"k": "D", "t": "鼓阶"}, {"k": "E", "t": "后阶"}], "a": "ACD", "multi": true, "exp": {"title": "考察点：耳蜗/骨蜗管解剖", "text": "正确答案：A)前庭阶、C)中阶、D)鼓阶\n\n骨蜗管的管腔分为前庭阶、中阶(蜗管)、鼓阶三腔，内、外淋巴分隔。\n\n（3 项正确：['A', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 230, "s": "研究耳蜗换能器功能，包括（    ）。 【多选题】", "o": [{"k": "A", "t": "生化环境"}, {"k": "B", "t": "机械传导"}, {"k": "C", "t": "生物电"}, {"k": "D", "t": "电磁场"}, {"k": "E", "t": "速率"}], "a": "ABC", "multi": true, "exp": {"title": "考察点：耳蜗外淋巴", "text": "正确答案：A)生化环境、B)机械传导、C)生物电\n\n耳蜗前庭阶内的液体为外淋巴；中阶内为内淋巴。骨蜗管腔分为前庭阶、中阶、鼓阶。\n\n（3 项正确：['A', 'B', 'C']）本题为多选题，需选全所有正确项。"}}, {"n": 231, "s": "1997 年世界卫生组织以（    ）计算平均听阈级。 【多选题】", "o": [{"k": "A", "t": "250Hz"}, {"k": "B", "t": "500Hz"}, {"k": "C", "t": "1000Hz"}, {"k": "D", "t": "2000Hz"}, {"k": "E", "t": "4000Hz"}], "a": "BCDE", "multi": true, "exp": {"title": "考察点：听力损失程度", "text": "正确答案：B)500Hz、C)1000Hz、D)2000Hz、E)4000Hz\n\n正常听力阈值上限均值约 25dB HL；超过即存在听力损失。\n\n（4 项正确：['B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 232, "s": "下列有关机械振动的说法正确的是（    ）。 【多选题】", "o": [{"k": "A", "t": "实际的自由振动必然是阻尼振动"}, {"k": "B", "t": "在外力作用下的振动是受迫振动"}, {"k": "C", "t": "阻尼振动的幅度越来越小"}, {"k": "D", "t": "受迫振动稳定后的频率与自身物理条件无关"}, {"k": "E", "t": "现实中，自由振动随处可见"}], "a": "ACD", "multi": true, "exp": {"title": "考察点：机械振动", "text": "正确答案：A)实际的自由振动必然是阻尼振动、C)阻尼振动的幅度越来越小、D)受迫振动稳定后的频率与自身物理条件无关\n\n实际自由振动必为阻尼振动（幅度越来越小）；受迫振动的频率由外界策动力频率决定；受迫振动稳定后频率与自身物理条件无关。\n\n（3 项正确：['A', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 233, "s": "以下属于复合声的是（    ）。 【多选题】", "o": [{"k": "A", "t": "汽车的引擎声"}, {"k": "B", "t": "钢琴弹奏的声音"}, {"k": "C", "t": "频谱只有单一一条谱线的声音"}, {"k": "D", "t": "两个纯音的集合"}, {"k": "E", "t": "录音师使用的调音台上的纯音发生器发出的声音"}], "a": "ABD", "multi": true, "exp": {"title": "考察点：复合声", "text": "正确答案：A)汽车的引擎声、B)钢琴弹奏的声音、D)两个纯音的集合\n\n复合声=多个频率成分的组合（如引擎声、琴声），频谱有多条谱线；频谱只有单一谱线的为纯音。\n\n（3 项正确：['A', 'B', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 234, "s": "获得等响度曲线的条件是（    ）。 【多选题】", "o": [{"k": "A", "t": "听者要背对声源入射方向"}, {"k": "B", "t": "听者要面对声源入射方向"}, {"k": "C", "t": "当听者不在时，声场为平面自由行波"}, {"k": "D", "t": "声场的声压级应在听者不在场时测得"}, {"k": "E", "t": "声场的声压级应在听者在场时测得"}], "a": "BCD", "multi": true, "exp": {"title": "考察点：音色", "text": "正确答案：B)听者要面对声源入射方向、C)当听者不在时，声场为平面自由行波、D)声场的声压级应在听者不在场时测得\n\n两个声音响度、音调相同时，靠『音色』区分。音色由谐波/频谱包络决定。\n\n（3 项正确：['B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 235, "s": "人类拥有声源定位能力的机制是以下哪几方面的差异（    ）。 【多选题】", "o": [{"k": "A", "t": "声音传到双耳的时间"}, {"k": "B", "t": "声音的来源"}, {"k": "C", "t": "声音相位的差异"}, {"k": "D", "t": "声音强度的差异"}, {"k": "E", "t": "声音传播的速度"}], "a": "ACD", "multi": true, "exp": {"title": "考察点：声源定位", "text": "正确答案：A)声音传到双耳的时间、C)声音相位的差异、D)声音强度的差异\n\n声源定位靠双耳时间差、强度差、相位差实现；它『不包括』与听者之间的距离识别。\n\n（3 项正确：['A', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 236, "s": "助听器使用知识包括（    ）。 【多选题】", "o": [{"k": "A", "t": "电源的开关"}, {"k": "B", "t": "音量的控制"}, {"k": "C", "t": "电池的更换"}, {"k": "D", "t": "耳模的清洁"}, {"k": "E", "t": "助听器的保养"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：助听器使用保养", "text": "正确答案：A)电源的开关、B)音量的控制、C)电池的更换、D)耳模的清洁、E)助听器的保养\n\n助听器使用知识：电源开关、音量控制、电池更换、耳模清洁、助听器保养等，正确使用可延长寿命并保证验配效果。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 237, "s": "与保护消费者权益相关的的法律法规包括（    ）。 【多选题】", "o": [{"k": "A", "t": "《消费者权益保护法》"}, {"k": "B", "t": "《产品质量法》"}, {"k": "C", "t": "《侵权法》"}, {"k": "D", "t": "《食品卫生法》"}, {"k": "E", "t": "《反不正当竞争法》"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：消费者权益保护法", "text": "正确答案：A)《消费者权益保护法》、B)《产品质量法》、C)《侵权法》、D)《食品卫生法》、E)《反不正当竞争法》\n\n《消费者权益保护法》规定消费者享有九项权利：①人身、财产安全权；②知悉真实情况权(知情权)；③自主选择权；④公平交易权；⑤依法求偿权(赔偿权)；⑥依法结社权(成立维护自身权益的社会团体)；⑦获得消费和消费者权益保护知识权；⑧人格尊严、民族风俗习惯受尊重权；⑨监督批评权(对商品、服务及消费者权益保护工作的监督)。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 238, "s": "儿童听力诊断坚持主客观听力检测并行，客观测听优势是不需要儿童配合可 以获得听力损失阈值，下列属于客观听力检测的是 (    )。 【多选题】", "o": [{"k": "A", "t": "行为测听"}, {"k": "B", "t": "纯音测听"}, {"k": "C", "t": "ASSR"}, {"k": "D", "t": "40Hz 相关电位"}, {"k": "E", "t": "ABR"}], "a": "CDE", "multi": true, "exp": {"title": "考察点：主观客观听力测试", "text": "正确答案：C)ASSR、D)40Hz 相关电位、E)ABR\n\n主观听力测试需受试者主动配合(纯音测听、言语测听、行为测听)；客观听力测试不需配合(听性脑干反应 ABR、40Hz 相关电位、耳声发射、声导抗、ASSR 等)。\n\n（3 项正确：['C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 239, "s": "判断一个不能配合纯音测试孩子听力损失性质和程度需要用到下面哪些听力 检测方法 （    ）。 【多选题】", "o": [{"k": "A", "t": "声导抗"}, {"k": "B", "t": "耳声发射"}, {"k": "C", "t": "听觉诱发电位"}, {"k": "D", "t": "行为测听"}, {"k": "E", "t": "纯音测听"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：听力损失分级", "text": "正确答案：A)声导抗、B)耳声发射、C)听觉诱发电位、D)行为测听\n\n听力损失分级（WHO）：正常≤25，轻度 26~40，中度 41~60，重度 61~80，极重度≥81。70 dB HL 属重度听力损失。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 240, "s": "1 周岁孩子出现听力异常来验配助听器，根据病史询问注意要点，下列询问过程逐条还原，你认为比较合理的是（    ）。 【多选题】", "o": [{"k": "A", "t": "孩子出生年月日是什么时候？"}, {"k": "B", "t": "孩子出生后的听力筛查结果是通过还是转诊？"}, {"k": "C", "t": "孩子的智力发育是不是有问题？"}, {"k": "D", "t": "孩子父母亲及家人可有存在听力问题？"}, {"k": "E", "t": "孩子目前对周边哪些声音有反应？"}], "a": "ABDE", "multi": true, "exp": {"title": "考察点：线性处方", "text": "正确答案：A)孩子出生年月日是什么时候？、B)孩子出生后的听力筛查结果是通过还是转诊？、D)孩子父母亲及家人可有存在听力问题？、E)孩子目前对周边哪些声音有反应？\n\n常用于线性助听器验配的线性处方公式如 IHAFF、Fig6、NAL 等（以教材列举为准）。\n\n（4 项正确：['A', 'B', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 241, "s": "较为常见的引起耳聋的新生儿疾病有（    ）。 【多选题】", "o": [{"k": "A", "t": "新生儿核黄疸"}, {"k": "B", "t": "新生儿溶血病"}, {"k": "C", "t": "新生儿窒息"}, {"k": "D", "t": "新生儿脐炎"}, {"k": "E", "t": "新生儿肺炎"}], "a": "ABC", "multi": true, "exp": {"title": "考察点：新生儿筛查", "text": "正确答案：A)新生儿核黄疸、B)新生儿溶血病、C)新生儿窒息\n\n新生儿首次听力筛查应在出生后 72 小时内完成。\n\n（3 项正确：['A', 'B', 'C']）本题为多选题，需选全所有正确项。"}}, {"n": 242, "s": "以下属于职业道德特征的是（    ）。 【多选题】", "o": [{"k": "A", "t": "范围上的有限性"}, {"k": "B", "t": "内容上的稳定性"}, {"k": "C", "t": "内容上的连续性"}, {"k": "D", "t": "形式上的多样性"}, {"k": "E", "t": "制度上的普遍性"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：爱岗敬业/职业理想", "text": "正确答案：A)范围上的有限性、B)内容上的稳定性、C)内容上的连续性、D)形式上的多样性\n\n职业道德与职业素养是职业能力的重要构成：爱岗敬业、诚实守信、办事公道、服务群众、奉献社会。具备良好职业道德的员工才有创新动力与工作热情，并逐步形成明确的职业理想。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 243, "s": "听觉系统是对声音（    ）的感觉系统。 【多选题】", "o": [{"k": "A", "t": "收集"}, {"k": "B", "t": "传导"}, {"k": "C", "t": "运算"}, {"k": "D", "t": "处理"}, {"k": "E", "t": "综合"}], "a": "ABDE", "multi": true, "exp": {"title": "考察点：听觉发展阶段", "text": "正确答案：A)收集、B)传导、D)处理、E)综合\n\n听觉发展一般经过听觉察知→听觉注意→听觉分辨→听觉识别等阶段；『听觉识别(整合)』是更高阶段。\n\n（4 项正确：['A', 'B', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 244, "s": "内毛细胞和外毛细胞在（    ）方面有区别。 【多选题】", "o": [{"k": "A", "t": "形态学"}, {"k": "B", "t": "生物化学"}, {"k": "C", "t": "生理学"}, {"k": "D", "t": "传入神经支配模式"}, {"k": "E", "t": "传出神经支配模式"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：内/外耳分界", "text": "正确答案：A)形态学、B)生物化学、C)生理学、D)传入神经支配模式、E)传出神经支配模式\n\n耳蜗内毛细胞约 3500 个、外毛细胞约 12000 个。蜗管内有前庭阶、中阶(蜗管)、鼓阶三腔。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 245, "s": "一单摆做阻尼振动，在振动过程中（    ）。 【多选题】", "o": [{"k": "A", "t": "振幅越来越小，周期也越来越小"}, {"k": "B", "t": "振幅越来越小，周期不变"}, {"k": "C", "t": "在振动过程中，通过某一位置时，机械能始终不变"}, {"k": "D", "t": "在振动过程中，机械能不守恒，周期不变"}, {"k": "E", "t": "在振动过程中，机械能守恒，周期不变"}], "a": "BD", "multi": true, "exp": {"title": "考察点：机械振动", "text": "正确答案：B)振幅越来越小，周期不变、D)在振动过程中，机械能不守恒，周期不变\n\n实际自由振动必为阻尼振动（幅度越来越小）；受迫振动的频率由外界策动力频率决定；受迫振动稳定后频率与自身物理条件无关。\n\n（2 项正确：['B', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 246, "s": "关于驻波的特点，下列说法错误的是（    ）。 【多选题】", "o": [{"k": "A", "t": "两列具有相同频率与振幅的波，相向传播时会产生驻波"}, {"k": "B", "t": "当一列波在房间的墙壁之间反射时，入射波与反射波的叠加不会产生驻波"}, {"k": "C", "t": "波节的压强也因空气分子的聚集而表现为低的声压"}, {"k": "D", "t": "在房间中有大量的气体分子运动着，运动幅度最大的点叫做波腹"}, {"k": "E", "t": "波节出现在两列声波的相位差恰为180的位置，而波腹则出现于那些相位差为 0 的位置"}], "a": "BC", "multi": true, "exp": {"title": "考察点：驻波", "text": "正确答案：B)当一列波在房间的墙壁之间反射时，入射波与反射波的叠加不会产生驻波、C)波节的压强也因空气分子的聚集而表现为低的声压\n\n驻波由两列频率相同、传播方向相反的波叠加形成，有固定的波节(振幅为0)与波幅(振幅最大)位置。\n\n（2 项正确：['B', 'C']）本题为多选题，需选全所有正确项。"}}, {"n": 247, "s": "导致听力障碍者对言语的分辨能力降低的原因主要有（    ）。 【多选题】", "o": [{"k": "A", "t": "听力障碍者的内耳及听觉神经系统的病理变化"}, {"k": "B", "t": "听力障碍者和听力正常的人有不同的言语感知方式"}, {"k": "C", "t": "听力障碍者对声音频率、强度和持续时间的感知能力下降"}, {"k": "D", "t": "听力障碍者听力阈值的变化在不同频率并不相同"}, {"k": "E", "t": "听力障碍者可借助强度的变化来了解声带是否振动及发辅音的位置"}], "a": "AC", "multi": true, "exp": {"title": "考察点：言语测听", "text": "正确答案：A)听力障碍者的内耳及听觉神经系统的病理变化、C)听力障碍者对声音频率、强度和持续时间的感知能力下降\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。\n\n（2 项正确：['A', 'C']）本题为多选题，需选全所有正确项。"}}, {"n": 248, "s": "常规助听器的性能指标包括（    ）。 【多选题】", "o": [{"k": "A", "t": "饱和声压级"}, {"k": "B", "t": "满挡声增益"}, {"k": "C", "t": "频率范围"}, {"k": "D", "t": "等效输入噪声"}, {"k": "E", "t": "助听器失真"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：助听器性能指标", "text": "正确答案：A)饱和声压级、B)满挡声增益、C)频率范围、D)等效输入噪声、E)助听器失真\n\n常规助听器性能指标：饱和声压级(OSPL90)、满挡(满档)声增益、频率响应范围、等效输入噪声、总谐波失真等。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 249, "s": "中耳有两块肌肉，为（    ）。 【多选题】", "o": [{"k": "A", "t": "镫骨肌"}, {"k": "B", "t": "中耳肌肉"}, {"k": "C", "t": "鼓膜张肌"}, {"k": "D", "t": "面神经"}, {"k": "E", "t": "听骨链"}], "a": "AC", "multi": true, "exp": {"title": "考察点：中耳传声", "text": "正确答案：A)镫骨肌、C)鼓膜张肌\n\n中耳的主要作用是把来自外耳的声能传递到耳蜗淋巴液（经听小骨放大）。\n\n（2 项正确：['A', 'C']）本题为多选题，需选全所有正确项。"}}, {"n": 250, "s": "言语识别率一般采用（    ）。 【多选题】", "o": [{"k": "A", "t": "单音节词表"}, {"k": "B", "t": "双音节词表"}, {"k": "C", "t": "短句词表"}, {"k": "D", "t": "纯音信号"}, {"k": "E", "t": "探测音"}], "a": "AB", "multi": true, "exp": {"title": "考察点：言语测听", "text": "正确答案：A)单音节词表、B)双音节词表\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。\n\n（2 项正确：['A', 'B']）本题为多选题，需选全所有正确项。"}}, {"n": 251, "s": "背景声中的言语识别设计了 （    ）。 【多选题】", "o": [{"k": "A", "t": "多种自然环境背景声"}, {"k": "B", "t": "不同的信噪比条件"}, {"k": "C", "t": "安静的测试环境"}, {"k": "D", "t": "声场"}, {"k": "E", "t": "消声室"}], "a": "AB", "multi": true, "exp": {"title": "考察点：言语测听", "text": "正确答案：A)多种自然环境背景声、B)不同的信噪比条件\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。\n\n（2 项正确：['A', 'B']）本题为多选题，需选全所有正确项。"}}, {"n": 252, "s": "外耳道异常印模取样之前应当（    ）。 【多选题】", "o": [{"k": "A", "t": "询问病史"}, {"k": "B", "t": "耳镜检查"}, {"k": "C", "t": "如行耳部手术， 确认术后已满 3 个月"}, {"k": "D", "t": "耳部术腔已干燥"}, {"k": "E", "t": "患者配合"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：外耳道长度", "text": "正确答案：A)询问病史、B)耳镜检查、C)如行耳部手术， 确认术后已满 3 个月、D)耳部术腔已干燥、E)患者配合\n\n成人外耳道长约 2.5 cm（外1/3软骨部，内2/3骨部）。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 253, "s": "最大声输出设置最主要目的是（    ）。 【多选题】", "o": [{"k": "A", "t": "保障言语可懂度"}, {"k": "B", "t": "输出调节"}, {"k": "C", "t": "避免声损伤"}, {"k": "D", "t": "噪声管理"}, {"k": "E", "t": "匹配功率大小"}], "a": "AC", "multi": true, "exp": {"title": "考察点：最大声输出", "text": "正确答案：A)保障言语可懂度、C)避免声损伤\n\n最大声输出(MPO/OSPL90)设置目的是限制助听器最大输出声压级别，避免过强声音损伤残余听力并保证佩戴舒适，一般设在 UCL 与 MCL 之间。\n\n（2 项正确：['A', 'C']）本题为多选题，需选全所有正确项。"}}, {"n": 254, "s": "下列有关 CROS 助听器的工作原理说明不正确的是（    ）。 【多选题】", "o": [{"k": "A", "t": "CROS 助听器用户双耳都需要佩戴装置"}, {"k": "B", "t": "CROS 助听器双耳装置均装有受话器（喇叭）"}, {"k": "C", "t": "CROS 助听器双耳装置有一侧装置只装有麦克风"}, {"k": "D", "t": "CROS 助听器双耳互通只能通过无线技术实现"}, {"k": "E", "t": "CROS 助听器双耳装置有一侧是完整助听器"}], "a": "BD", "multi": true, "exp": {"title": "考察点：CROS/BICROS", "text": "正确答案：B)CROS 助听器双耳装置均装有受话器（喇叭）、D)CROS 助听器双耳互通只能通过无线技术实现\n\nCROS 信号对侧交联式，适合单侧重度聋；BICROS 双侧交联式，适合一侧正常/轻中度+另一侧极重度。CROS/BICROS 都不能同时放大差耳、仍为单声道感觉、不能减小头影效应。\n\n（2 项正确：['B', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 255, "s": "选配 BICROS 助听器注意和说明正确的是（    ）。 【多选题】", "o": [{"k": "A", "t": "选择前一定要根据差耳好耳听力情况正确选择双侧佩戴不同装置"}, {"k": "B", "t": "目前该类调试通常可以在软件中选择究竟是选 CROS 模式还是 BICROS 模式"}, {"k": "C", "t": "BICROS 助听器通常双耳麦克风都需要打开"}, {"k": "D", "t": "可以通过在助听器中设置多程序来解决双侧麦克风输入声音大小问题"}, {"k": "E", "t": "BICROS 助听器增益大小是根据好耳听力基础确定的"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：CROS/BICROS", "text": "正确答案：A)选择前一定要根据差耳好耳听力情况正确选择双侧佩戴不同装置、B)目前该类调试通常可以在软件中选择究竟是选 CROS 模式还是 BICROS 模式、C)BICROS 助听器通常双耳麦克风都需要打开、D)可以通过在助听器中设置多程序来解决双侧麦克风输入声音大小问题、E)BICROS 助听器增益大小是根据好耳听力基础确定的\n\nCROS 信号对侧交联式，适合单侧重度聋；BICROS 双侧交联式，适合一侧正常/轻中度+另一侧极重度。CROS/BICROS 都不能同时放大差耳、仍为单声道感觉、不能减小头影效应。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 256, "s": "真耳测试过程中，下列（    ）检测是在未启动助听器时前进行的检测。 【多选题】", "o": [{"k": "A", "t": "REUR"}, {"k": "B", "t": "REUG"}, {"k": "C", "t": "RECD"}, {"k": "D", "t": "REAG"}, {"k": "E", "t": "REIG"}], "a": "ABC", "multi": true, "exp": {"title": "考察点：探管校准", "text": "正确答案：A)REUR、B)REUG、C)RECD\n\n多数真耳分析仪测试前需进行探管校准；探管内频响不是平坦的，机器可通过自身计算修正；开放耳与堵耳助听器探管校准不同。\n\n（3 项正确：['A', 'B', 'C']）本题为多选题，需选全所有正确项。"}}, {"n": 257, "s": "安静环境言语识别率测试可以采用下列（    ）词表进行。 【多选题】", "o": [{"k": "A", "t": "单音节词"}, {"k": "B", "t": "双音节词"}, {"k": "C", "t": "短句"}, {"k": "D", "t": "虑波复合音"}, {"k": "E", "t": "言语噪声"}], "a": "ABC", "multi": true, "exp": {"title": "考察点：言语测听", "text": "正确答案：A)单音节词、B)双音节词、C)短句\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。\n\n（3 项正确：['A', 'B', 'C']）本题为多选题，需选全所有正确项。"}}, {"n": 258, "s": "如果不了解患者的（    ），很难有针对性地制订指导计划和方案。 【多选题】", "o": [{"k": "A", "t": "耳模的种类"}, {"k": "B", "t": "声孔的形状"}, {"k": "C", "t": "助听器的型号"}, {"k": "D", "t": "助听器的补偿程度"}, {"k": "E", "t": "对助听器的期望值"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：听觉训练教具", "text": "正确答案：A)耳模的种类、B)声孔的形状、C)助听器的型号、D)助听器的补偿程度、E)对助听器的期望值\n\n听觉训练常用词表/实物/图片等作为指导教具，依题中具体实物作答。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 259, "s": "言语训练过程中要向家长介绍（    ）。 【多选题】", "o": [{"k": "A", "t": "可能需要的发音训练"}, {"k": "B", "t": "可能需要的词句训练"}, {"k": "C", "t": "可能需要的句子训练"}, {"k": "D", "t": "可能需要的交际训练"}, {"k": "E", "t": "具体活动方案内容"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：言语测听", "text": "正确答案：A)可能需要的发音训练、B)可能需要的词句训练、C)可能需要的句子训练、D)可能需要的交际训练、E)具体活动方案内容\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 260, "s": "师生之间的沟通技巧包括（    ）。 【多选题】", "o": [{"k": "A", "t": "保持好的心情"}, {"k": "B", "t": "给予爱与关怀"}, {"k": "C", "t": "保持弹性"}, {"k": "D", "t": "创造幽默"}, {"k": "E", "t": "活跃课堂气氛"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：沟通技巧", "text": "正确答案：A)保持好的心情、B)给予爱与关怀、C)保持弹性、D)创造幽默、E)活跃课堂气氛\n\n良好沟通技巧包括：保持良好心情、给予爱与关怀、保持弹性、创造幽默、活跃课堂气氛等。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 261, "s": "对音色的分析可分为（    ）。 【多选题】", "o": [{"k": "A", "t": "高和低"}, {"k": "B", "t": "钝和尖锐"}, {"k": "C", "t": "紧密的和松散的"}, {"k": "D", "t": "色彩丰富的和色彩不丰富的"}, {"k": "E", "t": "清晰的和浑浊的"}], "a": "BCD", "multi": true, "exp": {"title": "考察点：音色", "text": "正确答案：B)钝和尖锐、C)紧密的和松散的、D)色彩丰富的和色彩不丰富的\n\n两个声音响度、音调相同时，靠『音色』区分。音色由谐波/频谱包络决定。\n\n（3 项正确：['B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 262, "s": "单纯听神经谱系障碍下列（    ）检查结果可能会发生异常。 【多选题】", "o": [{"k": "A", "t": "ABR"}, {"k": "B", "t": "声导抗"}, {"k": "C", "t": "纯音测听"}, {"k": "D", "t": "耳声发射"}, {"k": "E", "t": "ASSR"}], "a": "ACE", "multi": true, "exp": {"title": "考察点：听神经", "text": "正确答案：A)ABR、C)纯音测听、E)ASSR\n\n支配耳蜗毛细胞的神经纤维是听神经（蜗神经，第八对脑神经的一部分）。\n\n（3 项正确：['A', 'C', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 263, "s": "判断一个不能配合纯音测试孩子听力损失性质和程度需要用到下面（    ）听力检测方法。 【多选题】", "o": [{"k": "A", "t": "声导抗"}, {"k": "B", "t": "耳声发射"}, {"k": "C", "t": "听觉诱发电位"}, {"k": "D", "t": "行为测听"}, {"k": "E", "t": "纯音测听"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：听力损失分级", "text": "正确答案：A)声导抗、B)耳声发射、C)听觉诱发电位、D)行为测听\n\n听力损失分级（WHO）：正常≤25，轻度 26~40，中度 41~60，重度 61~80，极重度≥81。70 dB HL 属重度听力损失。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 264, "s": "听力障碍病人病史采集时应注意（    ）。 【多选题】", "o": [{"k": "A", "t": "现病史中记录原听力检查结果，助听器验配、使用情况，听力言语康复训练情况"}, {"k": "B", "t": "儿童听力障碍，在一般项目中需填写父母的文化程度和听力情况"}, {"k": "C", "t": "出生史单列，记录母孕期传染病史、用药史、分娩史"}, {"k": "D", "t": "家族史中询问父母兄弟姐妹及子女及亲属中的听力情况"}, {"k": "E", "t": "个人史记录预防接种、身高、体重"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：听觉发展阶段", "text": "正确答案：A)现病史中记录原听力检查结果，助听器验配、使用情况，听力言语康复训练情况、B)儿童听力障碍，在一般项目中需填写父母的文化程度和听力情况、C)出生史单列，记录母孕期传染病史、用药史、分娩史、D)家族史中询问父母兄弟姐妹及子女及亲属中的听力情况\n\n听觉发展一般经过听觉察知→听觉注意→听觉分辨→听觉识别等阶段；『听觉识别(整合)』是更高阶段。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 265, "s": "以下（    ）表现是在 3 岁半左右关键期出现。 【多选题】", "o": [{"k": "A", "t": "注意力发展"}, {"k": "B", "t": "独立性"}, {"k": "C", "t": "动手能力"}, {"k": "D", "t": "学习外语"}, {"k": "E", "t": "创造性"}], "a": "ABC", "multi": true, "exp": {"title": "考察点：关键期表现", "text": "正确答案：A)注意力发展、B)独立性、C)动手能力\n\n3 岁半小儿发展的关键期表现：注意力发展、独立性开始建立、动手能力发展成熟。\n\n（3 项正确：['A', 'B', 'C']）本题为多选题，需选全所有正确项。"}}, {"n": 266, "s": "声导抗的测试包括（    ）。 【多选题】", "o": [{"k": "A", "t": "言语测听"}, {"k": "B", "t": "声反射测试"}, {"k": "C", "t": "咽鼓管功能"}, {"k": "D", "t": "中耳"}, {"k": "E", "t": "鼓室图测试"}], "a": "BCE", "multi": true, "exp": {"title": "考察点：声导抗", "text": "正确答案：B)声反射测试、C)咽鼓管功能、E)鼓室图测试\n\n声导抗测试是声阻抗测试与声导纳测试的合称，用于客观评估中耳功能。\n\n（3 项正确：['B', 'C', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 267, "s": "双耳传导性听力损失的声导抗特点（     ）。 【多选题】", "o": [{"k": "A", "t": "双耳型"}, {"k": "B", "t": "镫骨肌反射同侧引不出"}, {"k": "C", "t": "镫骨肌反射对侧引不出"}, {"k": "D", "t": "镫骨肌反射同侧引出"}, {"k": "E", "t": "镫骨肌反射对侧引出"}], "a": "ABC", "multi": true, "exp": {"title": "考察点：听力损失分级", "text": "正确答案：A)双耳型、B)镫骨肌反射同侧引不出、C)镫骨肌反射对侧引不出\n\n听力损失分级（WHO）：正常≤25，轻度 26~40，中度 41~60，重度 61~80，极重度≥81。70 dB HL 属重度听力损失。\n\n（3 项正确：['A', 'B', 'C']）本题为多选题，需选全所有正确项。"}}, {"n": 268, "s": "小儿行为测听是主观听力测试方法，包括(    )。 【多选题】", "o": [{"k": "A", "t": "小儿行为观察反应测听"}, {"k": "B", "t": "视觉强化定向反应测听"}, {"k": "C", "t": "游戏测听"}, {"k": "D", "t": "声导抗测听"}, {"k": "E", "t": "听性脑干诱发电位"}], "a": "ABC", "multi": true, "exp": {"title": "考察点：行为测听法", "text": "正确答案：A)小儿行为观察反应测听、B)视觉强化定向反应测听、C)游戏测听\n\n小儿行为测听是主观听力测试方法，包括：小儿行为观察反应测听、视觉强化定向反应测听、游戏测听，按小儿年龄选用。\n\n（3 项正确：['A', 'B', 'C']）本题为多选题，需选全所有正确项。"}}, {"n": 269, "s": "言语测听作为听功能检查的组成部分，其作用有（    ）。 【多选题】", "o": [{"k": "A", "t": "弥补纯音测听的不足"}, {"k": "B", "t": "有助于耳聋病变位置的诊断"}, {"k": "C", "t": "有助于助听器的选择"}, {"k": "D", "t": "对助听后的康复有指导意义"}, {"k": "E", "t": "对纯音听阈的提高有意义"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：言语测听", "text": "正确答案：A)弥补纯音测听的不足、B)有助于耳聋病变位置的诊断、C)有助于助听器的选择、D)对助听后的康复有指导意义\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 270, "s": "对外耳道异常患者取印模的目的是（    ）。 【多选题】", "o": [{"k": "A", "t": "制作佩戴舒适的耳模固定助听器"}, {"k": "B", "t": "制作佩戴舒适的耳模并可改善助听器的某些声学特性"}, {"k": "C", "t": "纯装饰"}, {"k": "D", "t": "替代助听器编程"}, {"k": "E", "t": "矫正畸形"}], "a": "AB", "multi": true, "exp": {"title": "考察点：外耳道长度", "text": "正确答案：A)制作佩戴舒适的耳模固定助听器、B)制作佩戴舒适的耳模并可改善助听器的某些声学特性\n\n成人外耳道长约 2.5 cm（外1/3软骨部，内2/3骨部）。\n\n（2 项正确：['A', 'B']）本题为多选题，需选全所有正确项。"}}, {"n": 271, "s": "下列关于助听器 MPO 的调试说法不正确的是（    ）。 【多选题】", "o": [{"k": "A", "t": "MPO 在 MCL 和 UCL 之间"}, {"k": "B", "t": "MPO＜Gai ×"}, {"k": "C", "t": "MPO>UCL"}, {"k": "D", "t": "MPO 在 HTL 和 MCL 之间"}, {"k": "E", "t": "MPO 设置在助听器最大放大能力的极限"}], "a": "BCDE", "multi": true, "exp": {"title": "考察点：饱和声压级", "text": "正确答案：B)MPO＜Gai ×、C)MPO>UCL、D)MPO 在 HTL 和 MCL 之间、E)MPO 设置在助听器最大放大能力的极限\n\n饱和声压级(MPO/OSPL90)：超大功率>130 dB SPL；大功率 CIC 约 110~120 dB SPL。选功率时平均听损 95dB 需 MPO>135dB；65dB 约选 MPO 125~135dB SPL。\n\n（4 项正确：['B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 272, "s": "有关等效输入噪声，下列理解不正确的是（    ）。 【多选题】", "o": [{"k": "A", "t": "等效输入噪声是评价助听器的内在固有噪声"}, {"k": "B", "t": "等效输入噪声是由电子元噪件工作时产生的热噪声引起的"}, {"k": "C", "t": "等效输入噪声可以通过数字降噪完全消除，正常人耳感受不到噪声存在就 说明已经完全消除"}, {"k": "D", "t": "即使没有输入声，助听器也有嘈杂声输出"}, {"k": "E", "t": "新用户佩戴助听器后说有沙沙声，其它就是等效输入噪声"}], "a": "CE", "multi": true, "exp": {"title": "考察点：等效输入噪声", "text": "正确答案：C)等效输入噪声可以通过数字降噪完全消除，正常人耳感受不到噪声存在就 说明已经完全消除、E)新用户佩戴助听器后说有沙沙声，其它就是等效输入噪声\n\n等效输入噪声用于评价助听器内在固有噪声；由电子元件工作时产生的热噪声引起；即使无输入声，助听器也有轻微噪声输出；数字降噪不能完全消除。\n\n（2 项正确：['C', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 273, "s": "安静环境程序应当至少满足用户的（）。 【多选题】", "o": [{"k": "A", "t": "聆听舒适度需求"}, {"k": "B", "t": "言语清晰度需求"}, {"k": "C", "t": "音乐聆听需求"}, {"k": "D", "t": "固定电话接听需求"}, {"k": "E", "t": "打手机需求"}], "a": "AB", "multi": true, "exp": {"title": "考察点：多程序/程序", "text": "正确答案：A)聆听舒适度需求、B)言语清晰度需求\n\n助听器设置多个程序的目的是适应不同听声环境(安静、噪声、电话、音乐等)，一键切换以获得各场景最佳听声效果。\n\n（2 项正确：['A', 'B']）本题为多选题，需选全所有正确项。"}}, {"n": 274, "s": "下列（）操作会影响助听响应数据。 【多选题】", "o": [{"k": "A", "t": "探管插入深度"}, {"k": "B", "t": "公式选择"}, {"k": "C", "t": "耳道密封程度"}, {"k": "D", "t": "环境噪声"}, {"k": "E", "t": "受试者动机"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：影响助听响应", "text": "正确答案：A)探管插入深度、B)公式选择、C)耳道密封程度、D)环境噪声\n\n影响真耳助听响应(实测)数据的因素：探管插入深度、处方式(公式)选择、耳道密封程度、环境噪声、受试者配合等。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 275, "s": "有关 REUG 说明正确的是（    ）。 【多选题】", "o": [{"k": "A", "t": "等于 REUA 减去输入声强"}, {"k": "B", "t": "外耳道长度影响共振频率"}, {"k": "C", "t": "外耳道直径大小影响共振峰高度（声强）"}, {"k": "D", "t": "耳道较细的儿童 REUG 峰值更偏高频"}, {"k": "E", "t": "以上全不正确"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：真耳增益", "text": "正确答案：A)等于 REUA 减去输入声强、B)外耳道长度影响共振频率、C)外耳道直径大小影响共振峰高度（声强）、D)耳道较细的儿童 REUG 峰值更偏高频\n\nREAG=真耳有助增益；REUG=真耳未助增益；REIG=真耳插入增益(Real-Ear Insertion Gain)。三者仅差字母，注意区分。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 276, "s": "助听效果在(    )级别，言语康复过程中应当注意以听觉为主、看话为辅的原则进行听觉语言学习。 【多选题】", "o": [{"k": "A", "t": "最适（一级）"}, {"k": "B", "t": "适合（二级）"}, {"k": "C", "t": "较适（三级）"}, {"k": "D", "t": "较差（五级）"}, {"k": "E", "t": "看话（四级）"}], "a": "BC", "multi": true, "exp": {"title": "考察点：听觉发展阶段", "text": "正确答案：B)适合（二级）、C)较适（三级）\n\n听觉发展一般经过听觉察知→听觉注意→听觉分辨→听觉识别等阶段；『听觉识别(整合)』是更高阶段。\n\n（2 项正确：['B', 'C']）本题为多选题，需选全所有正确项。"}}, {"n": 277, "s": "如果患者是一个高龄老年人，需要考虑（    ）。 【多选题】", "o": [{"k": "A", "t": "指导老人使用助听器"}, {"k": "B", "t": "助听器的自动程序"}, {"k": "C", "t": "老人的身体状态"}, {"k": "D", "t": "助听器的 DSL v5 儿童公式"}, {"k": "E", "t": "老人的听力波动性"}], "a": "ABCE", "multi": true, "exp": {"title": "考察点：助听器适用年龄", "text": "正确答案：A)指导老人使用助听器、B)助听器的自动程序、C)老人的身体状态、E)老人的听力波动性\n\n助听器适用全年龄段：幼儿、少年、青年、中年、老年。\n\n（4 项正确：['A', 'B', 'C', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 278, "s": "熟悉听障儿童的听觉言语发展情况的具体工作包括（    ）。 【多选题】", "o": [{"k": "A", "t": "了解听障儿童个体助听设备的听觉补偿效果"}, {"k": "B", "t": "确认听障儿童个体所处的听觉发展阶段"}, {"k": "C", "t": "界定听障儿童个体现有的语言训练起点"}, {"k": "D", "t": "明确听障儿童个体现有的语言能力结构水平"}, {"k": "E", "t": "界定听障儿童个体现有的语言训练终点"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：言语测听", "text": "正确答案：A)了解听障儿童个体助听设备的听觉补偿效果、B)确认听障儿童个体所处的听觉发展阶段、C)界定听障儿童个体现有的语言训练起点、D)明确听障儿童个体现有的语言能力结构水平\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 279, "s": "助听器常见故障包括（    ）。 【多选题】", "o": [{"k": "A", "t": "没有输出"}, {"k": "B", "t": "嘈杂或声音失真"}, {"k": "C", "t": "声反馈或漏声"}, {"k": "D", "t": "间断有声"}, {"k": "E", "t": "耗电量过大"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：助听器常见故障", "text": "正确答案：A)没有输出、B)嘈杂或声音失真、C)声反馈或漏声、D)间断有声、E)耗电量过大\n\n助听器常见故障：无输出(无声)、声音嘈杂/失真、声反馈啸叫、声音间断、电池耗电过快等。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 280, "s": "咽鼓管的功能主要包括（    ）。 【多选题】", "o": [{"k": "A", "t": "保持鼓膜两侧气压平衡"}, {"k": "B", "t": "引流中耳分泌物"}, {"k": "C", "t": "阻抗匹配"}, {"k": "D", "t": "增压作用"}, {"k": "E", "t": "阻声作用"}], "a": "ABE", "multi": true, "exp": {"title": "考察点：咽鼓管功能", "text": "正确答案：A)保持鼓膜两侧气压平衡、B)引流中耳分泌物、E)阻声作用\n\n咽鼓管的主要功能：①保持鼓膜两侧气压平衡；②引流中耳分泌物；③阻声(防声、隔音)作用，调节中耳压力、保护中耳。\n\n（3 项正确：['A', 'B', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 281, "s": "母孕期感染下列（    ）感染会严重影响胎儿的听力。 【多选题】", "o": [{"k": "A", "t": "巨细胞病毒感染"}, {"k": "B", "t": "风疹"}, {"k": "C", "t": "麻疹"}, {"k": "D", "t": "弓形体病"}, {"k": "E", "t": "梅毒"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：孕期感染致聋", "text": "正确答案：A)巨细胞病毒感染、B)风疹、C)麻疹、D)弓形体病、E)梅毒\n\n母孕期感染(巨细胞病毒、风疹、麻疹、弓形体病、梅毒等 TORCH 类感染)可严重影响胎儿听力，是先天性听力障碍的重要病因。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 282, "s": "咽鼓管功能障碍声导抗的特点是（    ）。 【多选题】", "o": [{"k": "A", "t": "鼓室图是"}, {"k": "B", "t": "峰压为负压"}, {"k": "C", "t": "声顺值正常"}, {"k": "D", "t": "外耳道容积正常"}, {"k": "E", "t": "鼓室积液"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：咽鼓管功能", "text": "正确答案：A)鼓室图是、B)峰压为负压、C)声顺值正常、D)外耳道容积正常\n\n咽鼓管的主要功能：①保持鼓膜两侧气压平衡；②引流中耳分泌物；③阻声(防声、隔音)作用，调节中耳压力、保护中耳。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 283, "s": "言语测听结果是评估听力障碍患者（    ）的重要指标。 【多选题】", "o": [{"k": "A", "t": "残疾程度"}, {"k": "B", "t": "康复效果"}, {"k": "C", "t": "社会交往能力"}, {"k": "D", "t": "听敏度"}, {"k": "E", "t": "听力"}], "a": "ABC", "multi": true, "exp": {"title": "考察点：言语测听", "text": "正确答案：A)残疾程度、B)康复效果、C)社会交往能力\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。\n\n（3 项正确：['A', 'B', 'C']）本题为多选题，需选全所有正确项。"}}, {"n": 284, "s": "儿童言语测试时测试环境选择在（    ）。 【多选题】", "o": [{"k": "A", "t": "任何环境都可以"}, {"k": "B", "t": "本底噪声 45～55dB(A)"}, {"k": "C", "t": "标准测听室"}, {"k": "D", "t": "安静房间"}, {"k": "E", "t": "本底噪声 30dB(A)"}], "a": "BD", "multi": true, "exp": {"title": "考察点：言语测听", "text": "正确答案：B)本底噪声 45～55dB(A)、D)安静房间\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。\n\n（2 项正确：['B', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 285, "s": "言语识别阈测试所需装置包括（    ）。 【多选题】", "o": [{"k": "A", "t": "言语听力计"}, {"k": "B", "t": "言语材料播放装置"}, {"k": "C", "t": "耳机或扬声器"}, {"k": "D", "t": "声导抗测听"}, {"k": "E", "t": "发声玩具"}], "a": "ABC", "multi": true, "exp": {"title": "考察点：言语测听", "text": "正确答案：A)言语听力计、B)言语材料播放装置、C)耳机或扬声器\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。\n\n（3 项正确：['A', 'B', 'C']）本题为多选题，需选全所有正确项。"}}, {"n": 286, "s": "外耳道异常印模取样后应当（    ）。 【多选题】", "o": [{"k": "A", "t": "用电耳镜检查耳内有无残留物或损伤"}, {"k": "B", "t": "在耳模制作单上注明印模隆起或凹陷的原因"}, {"k": "C", "t": "立即烘干印模"}, {"k": "D", "t": "立即紫外光照射印模"}, {"k": "E", "t": "尽快放入冷柜储存"}], "a": "AB", "multi": true, "exp": {"title": "考察点：外耳道长度", "text": "正确答案：A)用电耳镜检查耳内有无残留物或损伤、B)在耳模制作单上注明印模隆起或凹陷的原因\n\n成人外耳道长约 2.5 cm（外1/3软骨部，内2/3骨部）。\n\n（2 项正确：['A', 'B']）本题为多选题，需选全所有正确项。"}}, {"n": 287, "s": "有关等效输入噪声测试过程中的步骤，描述正确的是（    ）。 【多选题】", "o": [{"k": "A", "t": "先将助听器设置在参考测试增益状态下"}, {"k": "B", "t": "输入参考测试频率 60 dB SPL 的纯音"}, {"k": "C", "t": "测得助听器输出声压级减去 60dB SPL 得到参考测试增益"}, {"k": "D", "t": "关闭声源，测助听器内部噪声的输出噪声级值"}, {"k": "E", "t": "在参考测试增益下的输出噪声级减去参考测试增益得到等效输"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：等效输入噪声", "text": "正确答案：A)先将助听器设置在参考测试增益状态下、B)输入参考测试频率 60 dB SPL 的纯音、C)测得助听器输出声压级减去 60dB SPL 得到参考测试增益、D)关闭声源，测助听器内部噪声的输出噪声级值、E)在参考测试增益下的输出噪声级减去参考测试增益得到等效输\n\n等效输入噪声用于评价助听器内在固有噪声；由电子元件工作时产生的热噪声引起；即使无输入声，助听器也有轻微噪声输出；数字降噪不能完全消除。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 288, "s": "下列有关谐波失真测量和说明不正确的是（    ）。 【多选题】", "o": [{"k": "A", "t": "国际标准规定对助听器非线性失真度测量仅局限于互调失真"}, {"k": "B", "t": "测试前先将助听器设置在满档增益状态"}, {"k": "C", "t": "在 400-1600 Hz 范围内，选取厂家指定的频率作为输入声"}, {"k": "D", "t": "以 50dB SPL 纯音输入助听器(F0)"}, {"k": "E", "t": "输出信号中二次谐波处 2F0 频率的声压级与 F0 处声压级之差，换算成百分比，即为二次谐波失真度"}], "a": "ABD", "multi": true, "exp": {"title": "考察点：助听器失真", "text": "正确答案：A)国际标准规定对助听器非线性失真度测量仅局限于互调失真、B)测试前先将助听器设置在满档增益状态、D)以 50dB SPL 纯音输入助听器(F0)\n\n助听器失真主要包括谐波失真和互调失真；削峰/压缩等是常见非线性失真源。\n\n（3 项正确：['A', 'B', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 289, "s": "功能较全面的无线系统发射机的麦克风模式有（    ）可选。 【多选题】", "o": [{"k": "A", "t": "颈挂式"}, {"k": "B", "t": "指向性"}, {"k": "C", "t": "全向性"}, {"k": "D", "t": "自适应"}, {"k": "E", "t": "静音"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：麦克风类型", "text": "正确答案：A)颈挂式、B)指向性、C)全向性、D)自适应、E)静音\n\n助听器麦克风按工作原理分：电磁动圈式、压电陶瓷式、驻极体式。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 290, "s": "77 ．分泌性中耳炎言语识别率和给声强度关系曲线通常为（    ）类型。 【多选题】", "o": [{"k": "A", "t": "正常型"}, {"k": "B", "t": "平移型"}, {"k": "C", "t": "平缓型"}, {"k": "D", "t": "回跌型"}, {"k": "E", "t": "低矮型"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：言语测听", "text": "正确答案：A)正常型、B)平移型、C)平缓型、D)回跌型、E)低矮型\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 291, "s": "听力学中将听力检测分为主观听力测试和客观听力测试，下列属于主观听力测试的是（    ）。 【多选题】", "o": [{"k": "A", "t": "纯音测听"}, {"k": "B", "t": "言语识别率测试"}, {"k": "C", "t": "言语识别阈测试"}, {"k": "D", "t": "行为测听"}, {"k": "E", "t": "真耳测试"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：主观客观听力测试", "text": "正确答案：A)纯音测听、B)言语识别率测试、C)言语识别阈测试、D)行为测听\n\n主观听力测试需受试者主动配合(纯音测听、言语测听、行为测听)；客观听力测试不需配合(听性脑干反应 ABR、40Hz 相关电位、耳声发射、声导抗、ASSR 等)。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 292, "s": "指导家长清楚准确的表达，包括（    ）。 【多选题】", "o": [{"k": "A", "t": "说话时语速稍缓"}, {"k": "B", "t": "发音清晰有力"}, {"k": "C", "t": "变化音量及语调"}, {"k": "D", "t": "使用变化的声调表达激动的情感"}, {"k": "E", "t": "使用表情传递要让他指导的信息"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：听觉训练教具", "text": "正确答案：A)说话时语速稍缓、B)发音清晰有力、C)变化音量及语调、D)使用变化的声调表达激动的情感、E)使用表情传递要让他指导的信息\n\n听觉训练常用词表/实物/图片等作为指导教具，依题中具体实物作答。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 293, "s": "对听力保健有益的习惯包括（    ）。 【多选题】", "o": [{"k": "A", "t": "每周用棉签挖耳一到两次"}, {"k": "B", "t": "远离噪音"}, {"k": "C", "t": "发现听力下降及时就诊"}, {"k": "D", "t": "避免长时间戴耳机听音乐"}, {"k": "E", "t": "避免水或异物进入耳道"}], "a": "BCDE", "multi": true, "exp": {"title": "考察点：助听器听觉康复/适应", "text": "正确答案：B)远离噪音、C)发现听力下降及时就诊、D)避免长时间戴耳机听音乐、E)避免水或异物进入耳道\n\n助听器适应性训练：成人包括心理适应、改变原有听觉习惯的适应、佩戴时间的适应、对声音强度的适应、佩戴环境的适应；儿童初始佩戴应从『安静』环境开始，循序渐进再到嘈杂环境。\n\n（4 项正确：['B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 294, "s": "关于声能的吸收， 下列说法错误的是（    ）。 【多选题】", "o": [{"k": "A", "t": "媒质的阻抗率只表现为阻碍的性质， 媒质对各频率声波的阻滞作用不一致"}, {"k": "B", "t": "声能在空气中的吸收，与空气温度和相对湿度的协同作用无关"}, {"k": "C", "t": "媒质的声阻抗率反映了媒质对声能吸收的本领"}, {"k": "D", "t": "声波传播过程中由于空气媒质的吸收而造成的声能衰减很小"}, {"k": "E", "t": "声波在媒质中传播， 由于媒质质点运动时产生摩擦，一部分能量在摩擦时转化为其他 形式的能量(如媒质的内能)，这种现象叫做媒质对声能的吸收"}], "a": "AB", "multi": true, "exp": {"title": "考察点：中耳传声", "text": "正确答案：A)媒质的阻抗率只表现为阻碍的性质， 媒质对各频率声波的阻滞作用不一致、B)声能在空气中的吸收，与空气温度和相对湿度的协同作用无关\n\n中耳的主要作用是把来自外耳的声能传递到耳蜗淋巴液（经听小骨放大）。\n\n（2 项正确：['A', 'B']）本题为多选题，需选全所有正确项。"}}, {"n": 295, "s": "临床听力诊断和实验研究常用的声学信号主要有（    ）。 【多选题】", "o": [{"k": "A", "t": "纯音"}, {"k": "B", "t": "调制声"}, {"k": "C", "t": "短时程信号"}, {"k": "D", "t": "言语信号"}, {"k": "E", "t": "噪声信号"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：磁感电感", "text": "正确答案：A)纯音、B)调制声、C)短时程信号、D)言语信号、E)噪声信号\n\n磁感电感线圈靠『磁场能量信号』从电话/环路系统拾取声音。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 296, "s": "与音色的分析有关的物理因素主要有（    ）。 【多选题】", "o": [{"k": "A", "t": "听力的阈值"}, {"k": "B", "t": "高频的成分"}, {"k": "C", "t": "各个成分之间的和谐性"}, {"k": "D", "t": "频谱能量分布"}, {"k": "E", "t": "时间、相位和强度的差异"}], "a": "BCD", "multi": true, "exp": {"title": "考察点：音色", "text": "正确答案：B)高频的成分、C)各个成分之间的和谐性、D)频谱能量分布\n\n两个声音响度、音调相同时，靠『音色』区分。音色由谐波/频谱包络决定。\n\n（3 项正确：['B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 297, "s": "塞擦音是（    ）的结合。 【多选题】", "o": [{"k": "A", "t": "边音"}, {"k": "B", "t": "鼻音"}, {"k": "C", "t": "塞音"}, {"k": "D", "t": "擦音"}, {"k": "E", "t": "元音"}], "a": "CD", "multi": true, "exp": {"title": "考察点：塞擦音", "text": "正确答案：C)塞音、D)擦音\n\n塞擦音是塞音(爆破)与擦音(摩擦)的结合，如 zh、ch、j、z、c 等；清浊由 VOT/声带振动区分。\n\n（2 项正确：['C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 298, "s": "堵耳式耳模包括（    ）。 【多选题】", "o": [{"k": "A", "t": "标准式耳模"}, {"k": "B", "t": "壳式耳模"}, {"k": "C", "t": "骨架式耳模"}, {"k": "D", "t": "耳道式耳模"}, {"k": "E", "t": "自由场式耳模"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：耳模更换", "text": "正确答案：A)标准式耳模、B)壳式耳模、C)骨架式耳模、D)耳道式耳模\n\n9~18 个月儿童耳模约 3 个月更换一次（因耳道快速发育）。耳模类型：标准式、壳式、耳道壳式、骨架式等。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 299, "s": "《残疾预防和残疾人康复条例》是指在残疾发生后综合运用（    ）等措施。 【多选题】", "o": [{"k": "A", "t": "医学"}, {"k": "B", "t": "教育"}, {"k": "C", "t": "职业"}, {"k": "D", "t": "社会"}, {"k": "E", "t": "心理和辅助器具"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：助听器听觉康复/适应", "text": "正确答案：A)医学、B)教育、C)职业、D)社会、E)心理和辅助器具\n\n助听器适应性训练：成人包括心理适应、改变原有听觉习惯的适应、佩戴时间的适应、对声音强度的适应、佩戴环境的适应；儿童初始佩戴应从『安静』环境开始，循序渐进再到嘈杂环境。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 300, "s": "对外耳道异常患者取印模的准备材料和工具，说法正确的是（     ）。 【多选题】", "o": [{"k": "A", "t": "一般材料和工具同常规准备"}, {"k": "B", "t": "需要准备特殊耳障和填塞用棉球"}, {"k": "C", "t": "紫外线灯"}, {"k": "D", "t": "专用烤箱"}, {"k": "E", "t": "冷柜储存"}], "a": "AB", "multi": true, "exp": {"title": "考察点：外耳道长度", "text": "正确答案：A)一般材料和工具同常规准备、B)需要准备特殊耳障和填塞用棉球\n\n成人外耳道长约 2.5 cm（外1/3软骨部，内2/3骨部）。\n\n（2 项正确：['A', 'B']）本题为多选题，需选全所有正确项。"}}, {"n": 301, "s": "耵聍栓塞对验配助听器的影响是（    ）。 【多选题】", "o": [{"k": "A", "t": "影响耳印模质量"}, {"k": "B", "t": "影响助听器的声学效果"}, {"k": "C", "t": "影响美观"}, {"k": "D", "t": "影响测听结果"}, {"k": "E", "t": "影响助听器的使用年数"}], "a": "ABD", "multi": true, "exp": {"title": "考察点：线性处方", "text": "正确答案：A)影响耳印模质量、B)影响助听器的声学效果、D)影响测听结果\n\n常用于线性助听器验配的线性处方公式如 IHAFF、Fig6、NAL 等（以教材列举为准）。\n\n（3 项正确：['A', 'B', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 302, "s": "如果用户佩戴过程觉得声音不够敞亮，言语声不够清晰，外界声无论大小如何变化，都没有抱怨有任何不适，下列（    ）调试方法的方向可能改善他的聆听效果。 【多选题】", "o": [{"k": "A", "t": "在输出界面将大中小三条输出曲线向距离远离方向调试"}, {"k": "B", "t": "在增益界面将大中小三条增益曲线向距离远离方向调试"}, {"k": "C", "t": "在输出界面将大中小三条输出曲线向距离靠近方向调试"}, {"k": "D", "t": "在增益界面将大中小三条增益曲线向距离靠近方向调试"}, {"k": "E", "t": "在增益界面将最上面一条增益曲线向上方向调试"}], "a": "AD", "multi": true, "exp": {"title": "考察点：言语测听", "text": "正确答案：A)在输出界面将大中小三条输出曲线向距离远离方向调试、D)在增益界面将大中小三条增益曲线向距离靠近方向调试\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。\n\n（2 项正确：['A', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 303, "s": "下列现象和方向性麦克风功能不符的是（    ）。 【多选题】", "o": [{"k": "A", "t": "启动后用户感觉环境本底噪声减小"}, {"k": "B", "t": "患者感觉背后说话声减小"}, {"k": "C", "t": "患者感觉闷的感觉减轻"}, {"k": "D", "t": "患者感觉大噪声不吵了"}, {"k": "E", "t": "患者感觉声音离自己近了"}], "a": "CDE", "multi": true, "exp": {"title": "考察点：麦克风类型", "text": "正确答案：C)患者感觉闷的感觉减轻、D)患者感觉大噪声不吵了、E)患者感觉声音离自己近了\n\n助听器麦克风按工作原理分：电磁动圈式、压电陶瓷式、驻极体式。\n\n（3 项正确：['C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 304, "s": "下列（    ）种类助听器可以通过双麦克风技术实现方向性功能。 【多选题】", "o": [{"k": "A", "t": "耳背式"}, {"k": "B", "t": "耳道受话器耳背式"}, {"k": "C", "t": "ITE"}, {"k": "D", "t": "ITC"}, {"k": "E", "t": "IIC"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：麦克风类型", "text": "正确答案：A)耳背式、B)耳道受话器耳背式、C)ITE、D)ITC\n\n助听器麦克风按工作原理分：电磁动圈式、压电陶瓷式、驻极体式。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 305, "s": "方向性麦克风灵敏指向图共有（    ）方向性模式。 【多选题】", "o": [{"k": "A", "t": "全向性"}, {"k": "B", "t": "心形"}, {"k": "C", "t": "超心形"}, {"k": "D", "t": "超强心形"}, {"k": "E", "t": "8 字形（双极形）"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：方向性模式", "text": "正确答案：A)全向性、B)心形、C)超心形、D)超强心形、E)8 字形（双极形）\n\n方向性麦克风可提升信噪比；正前方（声源方向）声音不会被方向性处理降低强度，后方/侧方声音会被衰减。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 306, "s": "目前市场上助听器绝大多数都有多程序功能,下列（    ）情形建议启用多程序功能。 【多选题】", "o": [{"k": "A", "t": "患者经常的社交至少有两种以上的聆听环境"}, {"k": "B", "t": "患者希望在不同环境中能切换程序（包括手动和自动）"}, {"k": "C", "t": "患者会报怨生活场景转换后，有的地方会觉得吵"}, {"k": "D", "t": "患者到噪声环境下总是不自主摘下助听器"}, {"k": "E", "t": "患者改变场景后，在某个场景总觉得人说话声小，每次都需要手动去调试音量多下"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：多程序/程序", "text": "正确答案：A)患者经常的社交至少有两种以上的聆听环境、B)患者希望在不同环境中能切换程序（包括手动和自动）、C)患者会报怨生活场景转换后，有的地方会觉得吵、D)患者到噪声环境下总是不自主摘下助听器、E)患者改变场景后，在某个场景总觉得人说话声小，每次都需要手动去调试音量多下\n\n助听器设置多个程序的目的是适应不同听声环境(安静、噪声、电话、音乐等)，一键切换以获得各场景最佳听声效果。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 307, "s": "移频范围由（    ）决定。 【多选题】", "o": [{"k": "A", "t": "辅音频率范围"}, {"k": "B", "t": "频响范围"}, {"k": "C", "t": "起始频率"}, {"k": "D", "t": "截止频率"}, {"k": "E", "t": "助听器频宽"}], "a": "CD", "multi": true, "exp": {"title": "考察点：移频", "text": "正确答案：C)起始频率、D)截止频率\n\n移频技术把听障者难听到的『高频』声音移频到可听的『中低频』区域。\n\n（2 项正确：['C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 308, "s": "指导家长做一个积极的聆听者，包括（    ） 。 【多选题】", "o": [{"k": "A", "t": "对孩子的手势时刻能用语言给予相应的回应"}, {"k": "B", "t": "全神贯注地聆听孩子的讲话"}, {"k": "C", "t": "不时地对孩子所讲述的话题表示出兴趣"}, {"k": "D", "t": "容忍孩子的发音水平"}, {"k": "E", "t": "重复孩子所讲的话，使其内容更接近他所要表达的主题"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：听觉训练教具", "text": "正确答案：A)对孩子的手势时刻能用语言给予相应的回应、B)全神贯注地聆听孩子的讲话、C)不时地对孩子所讲述的话题表示出兴趣、D)容忍孩子的发音水平、E)重复孩子所讲的话，使其内容更接近他所要表达的主题\n\n听觉训练常用词表/实物/图片等作为指导教具，依题中具体实物作答。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 309, "s": "选择培训方式的标准可以包括（    ）。 【多选题】", "o": [{"k": "A", "t": "受训学员的人数"}, {"k": "B", "t": "受训学员的验配水平和文化程度"}, {"k": "C", "t": "确定培训目标的重点和方向"}, {"k": "D", "t": "培训器材和环境"}, {"k": "E", "t": "结合培训教师本身的特色，尽可能采取互动性的多样化培训"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：综合", "text": "正确答案：A)受训学员的人数、B)受训学员的验配水平和文化程度、C)确定培训目标的重点和方向、D)培训器材和环境、E)结合培训教师本身的特色，尽可能采取互动性的多样化培训\n\n\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 310, "s": "把道德二字连用，始见于春秋战国时期的（    ）等书中。 【多选题】", "o": [{"k": "A", "t": "《老子》"}, {"k": "B", "t": "《管子》"}, {"k": "C", "t": "《庄子》"}, {"k": "D", "t": "《荀子》"}, {"k": "E", "t": "《孟子》"}], "a": "BCD", "multi": true, "exp": {"title": "考察点：爱岗敬业/职业理想", "text": "正确答案：B)《管子》、C)《庄子》、D)《荀子》\n\n职业道德与职业素养是职业能力的重要构成：爱岗敬业、诚实守信、办事公道、服务群众、奉献社会。具备良好职业道德的员工才有创新动力与工作热情，并逐步形成明确的职业理想。\n\n（3 项正确：['B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 311, "s": "“团结就是力量”体现了（    ）。 【多选题】", "o": [{"k": "A", "t": "团队合作精神是营造人际和谐氛围的动力"}, {"k": "B", "t": "是团结互助、增强团体凝聚力的重要保证"}, {"k": "C", "t": "在社会主义现代化建设事业中，是社会生产的客观要求"}, {"k": "D", "t": "一切工作与活动正常进行的重要保证"}, {"k": "E", "t": "在工作中节约一张表格、一张复印纸、一点耳模材料，都是对企业对社会的一种贡献， 同时也反映了一个人的思想品质"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：团队合作", "text": "正确答案：A)团队合作精神是营造人际和谐氛围的动力、B)是团结互助、增强团体凝聚力的重要保证、C)在社会主义现代化建设事业中，是社会生产的客观要求、D)一切工作与活动正常进行的重要保证\n\n团结协作体现团队合作精神：是营造人际和谐氛围的动力，是增强团队凝聚力、保证各项工作正常开展的重要条件，也是社会化生产的客观要求。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 312, "s": "关于听阈的测试方法，以下说法错误的是（    ）。 【多选题】", "o": [{"k": "A", "t": "上升法和下降法测出的结果基本吻合"}, {"k": "B", "t": "上升法是首先给出一个受试者听不到的声音，逐渐增加强度"}, {"k": "C", "t": "下降法是先给出受试者能清楚听到的声音"}, {"k": "D", "t": "下降法是先给出一个巨大的声音，然后逐渐降低强度"}, {"k": "E", "t": "由于节律反应的影响，上升法比下降法测得的阈值要高一些"}], "a": "AD", "multi": true, "exp": {"title": "考察点：响度单位", "text": "正确答案：A)上升法和下降法测出的结果基本吻合、D)下降法是先给出一个巨大的声音，然后逐渐降低强度\n\n纯音听力零级是统计正常的可听阈，单位 dB HL(听力级)；声压级单位 dB SPL。\n\n（2 项正确：['A', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 313, "s": "关于双耳的交互作用下列说法正确的是（    ）。 【多选题】", "o": [{"k": "A", "t": "传入双耳的声音信号会经过两侧听神经传至听觉中枢，双侧大脑皮层将信号整合后作 出相应反应"}, {"k": "B", "t": "双耳听觉比单耳听觉可多获得 3 dB 的增益"}, {"k": "C", "t": "双耳佩戴助听器能够提高整合效果，特别是对低频声音的能量整合减小， 同时可以降 低助听器的整体输出增益"}, {"k": "D", "t": "助听器的外壳或耳模在条件许可的情况下应该尽量地做短做松"}, {"k": "E", "t": "助听器的通气孔加大，给耳道内部留有尽量大的空间，可以减轻堵耳效应带来的烦恼"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：声源定位", "text": "正确答案：A)传入双耳的声音信号会经过两侧听神经传至听觉中枢，双侧大脑皮层将信号整合后作 出相应反应、B)双耳听觉比单耳听觉可多获得 3 dB 的增益、C)双耳佩戴助听器能够提高整合效果，特别是对低频声音的能量整合减小， 同时可以降 低助听器的整体输出增益、D)助听器的外壳或耳模在条件许可的情况下应该尽量地做短做松、E)助听器的通气孔加大，给耳道内部留有尽量大的空间，可以减轻堵耳效应带来的烦恼\n\n声源定位靠双耳时间差、强度差、相位差实现；它『不包括』与听者之间的距离识别。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 314, "s": "喉室虽小，但它的形状和容积变化可改变整个声音质量，其形状和容积的变化主要是因为（    ）因素引起。 【多选题】", "o": [{"k": "A", "t": "假声带的活动"}, {"k": "B", "t": "喉口肌肉的收缩"}, {"k": "C", "t": "声带的反复开闭"}, {"k": "D", "t": "气管内的气压变化"}, {"k": "E", "t": "声道的不同形状"}], "a": "AB", "multi": true, "exp": {"title": "考察点：喉室", "text": "正确答案：A)假声带的活动、B)喉口肌肉的收缩\n\n喉室虽小，其形状与容积变化会改变整个发声的声音质量，主要受声带肌、喉部调节等因素影响。\n\n（2 项正确：['A', 'B']）本题为多选题，需选全所有正确项。"}}, {"n": 315, "s": "（    ）属于客观听力检查。 【多选题】", "o": [{"k": "A", "t": "纯音测听"}, {"k": "B", "t": "听性脑干反应"}, {"k": "C", "t": "40Hz 听觉事项相关电位"}, {"k": "D", "t": "耳声发射"}, {"k": "E", "t": "声导抗"}], "a": "BCDE", "multi": true, "exp": {"title": "考察点：主观客观听力测试", "text": "正确答案：B)听性脑干反应、C)40Hz 听觉事项相关电位、D)耳声发射、E)声导抗\n\n主观听力测试需受试者主动配合(纯音测听、言语测听、行为测听)；客观听力测试不需配合(听性脑干反应 ABR、40Hz 相关电位、耳声发射、声导抗、ASSR 等)。\n\n（4 项正确：['B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 316, "s": "美尼尔病会引起听力下降，除了听力下降外还可能会有其它（    ）症状。 【多选题】", "o": [{"k": "A", "t": "头晕"}, {"k": "B", "t": "耳鸣"}, {"k": "C", "t": "眩晕"}, {"k": "D", "t": "闷胀"}, {"k": "E", "t": "发烧"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：噪声性聋", "text": "正确答案：A)头晕、B)耳鸣、C)眩晕、D)闷胀\n\n噪声性听力损失除听力下降外常伴耳鸣。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 317, "s": "小儿后天性聋的常见原因为（    ）。 【多选题】", "o": [{"k": "A", "t": "各种传染性疾病"}, {"k": "B", "t": "药物中毒"}, {"k": "C", "t": "外伤"}, {"k": "D", "t": "中耳炎"}, {"k": "E", "t": "肠炎"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：小儿后天性聋", "text": "正确答案：A)各种传染性疾病、B)药物中毒、C)外伤、D)中耳炎\n\n小儿后天性聋常见原因：各种传染性疾病、药物(耳毒性药)中毒、外伤、中耳炎；欠发达国家 0~17 岁后天性聋主因是中耳炎。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 318, "s": "下列（    ）表现是和4-7 个月正常听力孩子相对应的听力表现符合。 【多选题】", "o": [{"k": "A", "t": "辩认游戏中的短语"}, {"k": "B", "t": "对 40-60dB SPL 较轻的声音能做出持续可信的反应"}, {"k": "C", "t": "听到母亲声停止活动，头转向声源"}, {"k": "D", "t": "根据语调判断 友好、生气"}, {"k": "E", "t": "听懂简单指令"}], "a": "BCD", "multi": true, "exp": {"title": "考察点：听力损失程度", "text": "正确答案：B)对 40-60dB SPL 较轻的声音能做出持续可信的反应、C)听到母亲声停止活动，头转向声源、D)根据语调判断 友好、生气\n\n正常听力阈值上限均值约 25dB HL；超过即存在听力损失。\n\n（3 项正确：['B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 319, "s": "声导抗测试是（    ）的合称。 【多选题】", "o": [{"k": "A", "t": "声阻抗测试"}, {"k": "B", "t": "声导纳测试"}, {"k": "C", "t": "纯音测试"}, {"k": "D", "t": "言语测听"}, {"k": "E", "t": "鼓室图测试"}], "a": "AB", "multi": true, "exp": {"title": "考察点：声导抗", "text": "正确答案：A)声阻抗测试、B)声导纳测试\n\n声导抗测试是声阻抗测试与声导纳测试的合称，用于客观评估中耳功能。\n\n（2 项正确：['A', 'B']）本题为多选题，需选全所有正确项。"}}, {"n": 320, "s": "鼓室图测试可以检测出（    ）。 【多选题】", "o": [{"k": "A", "t": "中耳是否有积液"}, {"k": "B", "t": "听力是否正常"}, {"k": "C", "t": "咽鼓管通畅程度"}, {"k": "D", "t": "外耳道是否堵塞"}, {"k": "E", "t": "鼓膜是否穿孔"}], "a": "ACD", "multi": true, "exp": {"title": "考察点：鼓室图", "text": "正确答案：A)中耳是否有积液、C)咽鼓管通畅程度、D)外耳道是否堵塞\n\n声导抗正常鼓室图一般呈 A 型。探测音常用 226Hz/678Hz/1000Hz；6 个月以下小儿用 1000Hz。鼓室图可检测中耳积液、咽鼓管通畅度、外耳道是否堵塞等情况。\n\n（3 项正确：['A', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 321, "s": "感音神经性聋可细分为（    ）。 【多选题】", "o": [{"k": "A", "t": "传导性聋"}, {"k": "B", "t": "耳蜗性聋"}, {"k": "C", "t": "蜗后性聋"}, {"k": "D", "t": "混合性聋"}, {"k": "E", "t": "噪声性聋"}], "a": "BC", "multi": true, "exp": {"title": "考察点：感音神经性聋", "text": "正确答案：B)耳蜗性聋、C)蜗后性聋\n\n感音神经性聋可细分为耳蜗性聋与蜗后性聋。\n\n（2 项正确：['B', 'C']）本题为多选题，需选全所有正确项。"}}, {"n": 322, "s": "以下说法正确的是（    ）。 【多选题】", "o": [{"k": "A", "t": "对听力障碍儿童及时进行听力测试，及时诊断，并及时实施早起干预， 目的在于最大限度的降低由于耳聋带给小儿生理、心理、智能等多方面的影响"}, {"k": "B", "t": "客观听力测试不能全面反映小儿真是的听力情况"}, {"k": "C", "t": "主观听力测试经过整个听觉通路，属于生理物理测试方法"}, {"k": "D", "t": "主客观听力测试不能互相替代"}, {"k": "E", "t": "小儿听力评估应是小儿行为测听， 客观听力测试的组合测试法"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：综合", "text": "正确答案：A)对听力障碍儿童及时进行听力测试，及时诊断，并及时实施早起干预， 目的在于最大限度的降低由于耳聋带给小儿生理、心理、智能等多方面的影响、B)客观听力测试不能全面反映小儿真是的听力情况、C)主观听力测试经过整个听觉通路，属于生理物理测试方法、D)主客观听力测试不能互相替代、E)小儿听力评估应是小儿行为测听， 客观听力测试的组合测试法\n\n\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 323, "s": "（    ）属于患者的家族史。 【多选题】", "o": [{"k": "A", "t": "父母的健康状况"}, {"k": "B", "t": "兄弟姐妹的健康状况"}, {"k": "C", "t": "子女的健康状况"}, {"k": "D", "t": "直系亲属有无与患者同样疾病的成员"}, {"k": "E", "t": "两系三级亲属的健康和疾病情况"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：临床表现/记录", "text": "正确答案：A)父母的健康状况、B)兄弟姐妹的健康状况、C)子女的健康状况、D)直系亲属有无与患者同样疾病的成员、E)两系三级亲属的健康和疾病情况\n\n病史采集含现病史、既往史、家族史、个人史等；直系亲属及两系三级亲属的患病情况属家族史内容。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 324, "s": "外耳部分不包括（    ）。 【多选题】", "o": [{"k": "A", "t": "耳廓"}, {"k": "B", "t": "听小骨"}, {"k": "C", "t": "耳蜗"}, {"k": "D", "t": "听神经"}, {"k": "E", "t": "外耳道"}], "a": "BCD", "multi": true, "exp": {"title": "考察点：外耳组成", "text": "正确答案：B)听小骨、C)耳蜗、D)听神经\n\n外耳包括耳廓与外耳道；听小骨属中耳，耳蜗、听神经属内耳(蜗后)，故外耳不包括听小骨、耳蜗、听神经。\n\n（3 项正确：['B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 325, "s": "鼓膜可分为（    ）。 【多选题】", "o": [{"k": "A", "t": "上皮层"}, {"k": "B", "t": "下皮层"}, {"k": "C", "t": "纤维组织层"}, {"k": "D", "t": "松弛层"}, {"k": "E", "t": "粘膜层"}], "a": "ACE", "multi": true, "exp": {"title": "考察点：鼓膜光锥", "text": "正确答案：A)上皮层、C)纤维组织层、E)粘膜层\n\n鼓膜自脐向前下达鼓膜边缘的三角形反光区叫『光锥』；鼓膜分为上皮层、纤维组织层、粘膜层三层。\n\n（3 项正确：['A', 'C', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 326, "s": "影响听阈测试结果的因素有（    ）。 【多选题】", "o": [{"k": "A", "t": "测试方法"}, {"k": "B", "t": "受试者"}, {"k": "C", "t": "噪声"}, {"k": "D", "t": "频率"}, {"k": "E", "t": "测试者和受试者动机"}], "a": "ABCE", "multi": true, "exp": {"title": "考察点：响度单位", "text": "正确答案：A)测试方法、B)受试者、C)噪声、E)测试者和受试者动机\n\n纯音听力零级是统计正常的可听阈，单位 dB HL(听力级)；声压级单位 dB SPL。\n\n（4 项正确：['A', 'B', 'C', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 327, "s": "音调感受理论有（    ）学说。 【多选题】", "o": [{"k": "A", "t": "时间学说"}, {"k": "B", "t": "位置学说"}, {"k": "C", "t": "共振学说"}, {"k": "D", "t": "行波学说"}, {"k": "E", "t": "频率学说"}], "a": "AB", "multi": true, "exp": {"title": "考察点：音调改变", "text": "正确答案：A)时间学说、B)位置学说\n\n改变发声体振动快慢可改变音调；改变声音的大小(振幅)改变响度。敲不同水量瓶子弹可变音调。\n\n（2 项正确：['A', 'B']）本题为多选题，需选全所有正确项。"}}, {"n": 328, "s": "鼻音全部是浊音，而且它的共振峰结构和元音类似，但是声道更长，开口较小，且有一个侧（闭合的口腔），这种变化会引起（    ）现象。 【多选题】", "o": [{"k": "A", "t": "全部共振频率降低"}, {"k": "B", "t": "声音的振幅减小"}, {"k": "C", "t": "产生一个频谱的“零点”"}, {"k": "D", "t": "大部分声能衰减"}, {"k": "E", "t": "共振峰转移"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：等响/共振峰", "text": "正确答案：A)全部共振频率降低、B)声音的振幅减小、C)产生一个频谱的“零点”、D)大部分声能衰减\n\n频谱图包络用平滑线连接幅值，其中较宽的峰为共振峰。元音特性由共振峰位置决定。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 329, "s": "下列（    ）疾病可以通过影像检查得到诊断。 【多选题】", "o": [{"k": "A", "t": "前庭导水管扩大"}, {"k": "B", "t": "中耳炎"}, {"k": "C", "t": "内听道狭窄"}, {"k": "D", "t": "听神经瘤"}, {"k": "E", "t": "耳蜗畸形"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：影像检查诊断耳科疾病", "text": "正确答案：A)前庭导水管扩大、B)中耳炎、C)内听道狭窄、D)听神经瘤、E)耳蜗畸形\n\n影像学检查(CT、MRI 等)可显示耳部结构的形态改变，可用于诊断前庭导水管扩大、中耳炎、内听道狭窄、听神经瘤、耳蜗畸形等具有形态学改变的耳科疾病。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 330, "s": "6 个月～2 岁半的幼儿听力评估需要包括（    ）项目。 【多选题】", "o": [{"k": "A", "t": "听性脑干诱发电位，耳声发射，声导抗"}, {"k": "B", "t": "游戏测听"}, {"k": "C", "t": "视觉强化测听"}, {"k": "D", "t": "听觉行为观察测听"}, {"k": "E", "t": "多频稳态诱发电位"}], "a": "ACE", "multi": true, "exp": {"title": "考察点：幼儿听力评估", "text": "正确答案：A)听性脑干诱发电位，耳声发射，声导抗、C)视觉强化测听、E)多频稳态诱发电位\n\n6 个月~2 岁半幼儿听力评估需主客观结合：客观检查(听性脑干诱发电位 ABR、耳声发射、声导抗、多频稳态诱发电位 ASSR)＋主观行为测听(视觉强化测听等)；因该年龄段不能配合纯音测听，需综合多项指标。\n\n（3 项正确：['A', 'C', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 331, "s": "言语测听装置包括（    ）。 【多选题】", "o": [{"k": "A", "t": "言语听力计"}, {"k": "B", "t": "言语材料播放装置"}, {"k": "C", "t": "耳机或扬声器"}, {"k": "D", "t": "声导抗测听"}, {"k": "E", "t": "发声玩具"}], "a": "ABC", "multi": true, "exp": {"title": "考察点：言语测听", "text": "正确答案：A)言语听力计、B)言语材料播放装置、C)耳机或扬声器\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。\n\n（3 项正确：['A', 'B', 'C']）本题为多选题，需选全所有正确项。"}}, {"n": 332, "s": "言语测听前向患者解释规则（    ）。 【多选题】", "o": [{"k": "A", "t": "确定测试耳"}, {"k": "B", "t": "交待测试内容，说明如何做答"}, {"k": "C", "t": "测试过程中如有不适及时提出"}, {"k": "D", "t": "尽量避免产生噪音"}, {"k": "E", "t": "听到举手"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：言语测听", "text": "正确答案：A)确定测试耳、B)交待测试内容，说明如何做答、C)测试过程中如有不适及时提出、D)尽量避免产生噪音、E)听到举手\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 333, "s": "耳廓畸形常伴有（    ）。 【多选题】", "o": [{"k": "A", "t": "外耳道畸形"}, {"k": "B", "t": "中耳畸形"}, {"k": "C", "t": "内耳畸形"}, {"k": "D", "t": "听神经畸形"}, {"k": "E", "t": "听中枢畸形"}], "a": "AB", "multi": true, "exp": {"title": "考察点：招风耳", "text": "正确答案：A)外耳道畸形、B)中耳畸形\n\n招风耳(扇风耳)是耳廓畸形的一种，因耳廓软骨发育异常致耳廓过分外翻，常需手术矫正。\n\n（2 项正确：['A', 'B']）本题为多选题，需选全所有正确项。"}}, {"n": 334, "s": "有关参考测试增益过程下列说明不正确的选项有（    ）。 【多选题】", "o": [{"k": "A", "t": "50dB SPL 纯音信号输入助听器"}, {"k": "B", "t": "一边调节增益一边测堵耳模拟器中的声输出"}, {"k": "C", "t": "使参考测试频率处的声输出恰好为 OSPL90 以下（15 正负 1）dB"}, {"k": "D", "t": "若增益已经调至最大仍不能达到这一数值，则取 OSPL90 以下（20 正负 1）dB 值"}, {"k": "E", "t": "参考测试增益测试前无需测试 OSPL90 或最大声输出"}], "a": "ADE", "multi": true, "exp": {"title": "考察点：参考测试频率", "text": "正确答案：A)50dB SPL 纯音信号输入助听器、D)若增益已经调至最大仍不能达到这一数值，则取 OSPL90 以下（20 正负 1）dB 值、E)参考测试增益测试前无需测试 OSPL90 或最大声输出\n\n参考测试频率一般选 2500 Hz 和 1600 Hz 两个；2500Hz 反映高频特性。\n\n（3 项正确：['A', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 335, "s": "下列（    ）属于 BICROS 助听器的局限性。 【多选题】", "o": [{"k": "A", "t": "不能像真正双耳听觉一样一定程度提升信噪比"}, {"k": "B", "t": "差耳侧听不到任何放大声音"}, {"k": "C", "t": "仍为单声道非立体声感觉"}, {"k": "D", "t": "即使好耳听力正常也需要佩戴助听器"}, {"k": "E", "t": "不能减小头影效应"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：CROS/BICROS", "text": "正确答案：A)不能像真正双耳听觉一样一定程度提升信噪比、B)差耳侧听不到任何放大声音、C)仍为单声道非立体声感觉、D)即使好耳听力正常也需要佩戴助听器\n\nCROS 信号对侧交联式，适合单侧重度聋；BICROS 双侧交联式，适合一侧正常/轻中度+另一侧极重度。CROS/BICROS 都不能同时放大差耳、仍为单声道感觉、不能减小头影效应。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 336, "s": "可以作为听觉识别训练指导教具的物品包括（    ）。 【多选题】", "o": [{"k": "A", "t": "幼儿课桌一张"}, {"k": "B", "t": "水果盘 5 个"}, {"k": "C", "t": "幼儿座椅两把"}, {"k": "D", "t": "葡萄 100g"}, {"k": "E", "t": "橘子 2 个"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：听觉训练教具", "text": "正确答案：A)幼儿课桌一张、B)水果盘 5 个、C)幼儿座椅两把、D)葡萄 100g\n\n听觉训练常用词表/实物/图片等作为指导教具，依题中具体实物作答。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 337, "s": "听障儿童发音不清的主要元音包括（    ）。 【多选题】", "o": [{"k": "A", "t": "接收到的信号含糊"}, {"k": "B", "t": "发音口耳协调不当"}, {"k": "C", "t": "发音器官不能运用自如"}, {"k": "D", "t": "智力落后"}, {"k": "E", "t": "口舌器质性问题"}], "a": "ABC", "multi": true, "exp": {"title": "考察点：言语训练/发音不清", "text": "正确答案：A)接收到的信号含糊、B)发音口耳协调不当、C)发音器官不能运用自如\n\n听障儿童发音不清常与接收信号含糊、发音口耳协调不当、发音器官不能运用自如等因素有关。\n\n（3 项正确：['A', 'B', 'C']）本题为多选题，需选全所有正确项。"}}, {"n": 338, "s": "以下（    ）能够体现爱国守法是做好本职工作前提。 【多选题】", "o": [{"k": "A", "t": "把爱国放在公民道德行为之首，是必然的"}, {"k": "B", "t": "一个现代化文明的国家必然是法治国家"}, {"k": "C", "t": "守法是一个现代化的国家对公民的起码要求"}, {"k": "D", "t": "公民也应当把守法当作基本的行为准则"}, {"k": "E", "t": "公民守法实际上是尊重社会公众的利益和意志"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：爱国守法", "text": "正确答案：A)把爱国放在公民道德行为之首，是必然的、B)一个现代化文明的国家必然是法治国家、C)守法是一个现代化的国家对公民的起码要求、D)公民也应当把守法当作基本的行为准则、E)公民守法实际上是尊重社会公众的利益和意志\n\n爱国是公民道德之首，守法是现代化国家对公民的起码要求。敬业爱国守法是做好本职工作的前提。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 339, "s": "中耳包括（    ）。 【多选题】", "o": [{"k": "A", "t": "鼓室"}, {"k": "B", "t": "咽鼓管"}, {"k": "C", "t": "鼓窦"}, {"k": "D", "t": "乳突"}, {"k": "E", "t": "茎突"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：中耳传声", "text": "正确答案：A)鼓室、B)咽鼓管、C)鼓窦、D)乳突\n\n中耳的主要作用是把来自外耳的声能传递到耳蜗淋巴液（经听小骨放大）。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 340, "s": "响度的感觉可能和听神经系统中的（    ）参数有关。 【多选题】", "o": [{"k": "A", "t": "神经元的个数"}, {"k": "B", "t": "神经冲动的位置"}, {"k": "C", "t": "神经冲动的速率"}, {"k": "D", "t": "发生冲动的神经的数量"}, {"k": "E", "t": "神经冲动的传导方向"}], "a": "CD", "multi": true, "exp": {"title": "考察点：听神经", "text": "正确答案：C)神经冲动的速率、D)发生冲动的神经的数量\n\n支配耳蜗毛细胞的神经纤维是听神经（蜗神经，第八对脑神经的一部分）。\n\n（2 项正确：['C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 341, "s": "下列（    ）是 3岁半小儿发展的关键期表现。 【多选题】", "o": [{"k": "A", "t": "动手能力开始发展成熟"}, {"k": "B", "t": "小儿独立性开始建立"}, {"k": "C", "t": "注意力发展"}, {"k": "D", "t": "外语学习"}, {"k": "E", "t": "学习掌握生活观念"}], "a": "ABC", "multi": true, "exp": {"title": "考察点：关键期表现", "text": "正确答案：A)动手能力开始发展成熟、B)小儿独立性开始建立、C)注意力发展\n\n3 岁半小儿发展的关键期表现：注意力发展、独立性开始建立、动手能力发展成熟。\n\n（3 项正确：['A', 'B', 'C']）本题为多选题，需选全所有正确项。"}}, {"n": 342, "s": "小儿理解语言意义、口语发展、掌握汉语三个关键期分别是（    ）。 【多选题】", "o": [{"k": "A", "t": "6-8 个月"}, {"k": "B", "t": "1 岁半"}, {"k": "C", "t": "5 岁半"}, {"k": "D", "t": "8-10 个月"}, {"k": "E", "t": "3 岁半"}], "a": "BCD", "multi": true, "exp": {"title": "考察点：语言关键期", "text": "正确答案：B)1 岁半、C)5 岁半、D)8-10 个月\n\n小儿理解语言意义、口语发展、掌握汉语的三个关键期约在 8~10 个月、1 岁半、5 岁半（各教材表述差异，以题中数值为准）。\n\n（3 项正确：['B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 343, "s": "声导抗的探测音有（    ）。 【多选题】", "o": [{"k": "A", "t": "226Hz"}, {"k": "B", "t": "678Hz"}, {"k": "C", "t": "1000Hz"}, {"k": "D", "t": "500Hz"}, {"k": "E", "t": "300Hz"}], "a": "ABC", "multi": true, "exp": {"title": "考察点：声导抗", "text": "正确答案：A)226Hz、B)678Hz、C)1000Hz\n\n声导抗测试是声阻抗测试与声导纳测试的合称，用于客观评估中耳功能。\n\n（3 项正确：['A', 'B', 'C']）本题为多选题，需选全所有正确项。"}}, {"n": 344, "s": "异常耳廓的印模取样方法是（    ）。 【多选题】", "o": [{"k": "A", "t": "将耳障推入耳道的适当位置"}, {"k": "B", "t": "将印模膏依次注入固定区域"}, {"k": "C", "t": "膏体要填满整个耳廓的前外面"}, {"k": "D", "t": "确保印模完整，与耳廓形状完全一样"}, {"k": "E", "t": "无需放耳障"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：耳廓附着", "text": "正确答案：A)将耳障推入耳道的适当位置、B)将印模膏依次注入固定区域、C)膏体要填满整个耳廓的前外面、D)确保印模完整，与耳廓形状完全一样\n\n耳廓借韧带、肌肉、软骨、皮肤附着于头颅侧面，主要起集声与声源定位作用。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 345, "s": "外耳道异常的原因可为（    ）。 【多选题】", "o": [{"k": "A", "t": "先天性"}, {"k": "B", "t": "后天性"}, {"k": "C", "t": "外伤性"}, {"k": "D", "t": "感染性"}, {"k": "E", "t": "中毒性"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：外耳道长度", "text": "正确答案：A)先天性、B)后天性、C)外伤性、D)感染性\n\n成人外耳道长约 2.5 cm（外1/3软骨部，内2/3骨部）。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 346, "s": "从声学测量角度看， 一个具有正常功能数字线路助听器的非功能性失真主要包括（    ） 失真。 【多选题】", "o": [{"k": "A", "t": "谐波失真"}, {"k": "B", "t": "削峰失真"}, {"k": "C", "t": "互调失真"}, {"k": "D", "t": "压缩失真"}, {"k": "E", "t": "移频失真"}], "a": "AC", "multi": true, "exp": {"title": "考察点：听力损失程度", "text": "正确答案：A)谐波失真、C)互调失真\n\n正常听力阈值上限均值约 25dB HL；超过即存在听力损失。\n\n（2 项正确：['A', 'C']）本题为多选题，需选全所有正确项。"}}, {"n": 347, "s": "参考测试频率一般选择两个频率， 分别为（    ）。 【多选题】", "o": [{"k": "A", "t": "500 Hz"}, {"k": "B", "t": "1000 Hz"}, {"k": "C", "t": "1600 Hz"}, {"k": "D", "t": "2500 Hz"}, {"k": "E", "t": "3000 Hz"}], "a": "CD", "multi": true, "exp": {"title": "考察点：参考测试频率", "text": "正确答案：C)1600 Hz、D)2500 Hz\n\n参考测试频率一般选 2500 Hz 和 1600 Hz 两个；2500Hz 反映高频特性。\n\n（2 项正确：['C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 348, "s": "助听器调试通常需要至少输入的听力资料有（    ）。 【多选题】", "o": [{"k": "A", "t": "气导听阈值"}, {"k": "B", "t": "骨导听阈值"}, {"k": "C", "t": "舒适阈"}, {"k": "D", "t": "不舒适阈"}, {"k": "E", "t": "言语察觉阈"}], "a": "ABD", "multi": true, "exp": {"title": "考察点：助听器调试资料", "text": "正确答案：A)气导听阈值、B)骨导听阈值、D)不舒适阈\n\n助听器调试至少需输入：气导听阈值、骨导听阈值、不舒适阈(UCL)；舒适阈、言语察觉阈为可选补充。\n\n（3 项正确：['A', 'B', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 349, "s": "有关探管校准下列说法正确的是（    ）。 【多选题】", "o": [{"k": "A", "t": "多数真耳分析仪测试前均要进行控管标校准"}, {"k": "B", "t": "探管是一根细长的软管，内在频响不是平坦的"}, {"k": "C", "t": "机器可以通过自身计算修正探管的频响反应"}, {"k": "D", "t": "通常使用具有平坦频响曲线的参考麦克风校准测量麦克风"}, {"k": "E", "t": "开放耳助听器探管校准与堵耳助听器不同"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：探管校准", "text": "正确答案：A)多数真耳分析仪测试前均要进行控管标校准、B)探管是一根细长的软管，内在频响不是平坦的、C)机器可以通过自身计算修正探管的频响反应、D)通常使用具有平坦频响曲线的参考麦克风校准测量麦克风、E)开放耳助听器探管校准与堵耳助听器不同\n\n多数真耳分析仪测试前需进行探管校准；探管内频响不是平坦的，机器可通过自身计算修正；开放耳与堵耳助听器探管校准不同。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 350, "s": "声场环境录制词表做言语测听，声场和测试过程中需要做的校准有 （）。 【多选题】", "o": [{"k": "A", "t": "耦合腔校准"}, {"k": "B", "t": "参考麦克风校准"}, {"k": "C", "t": "声场言语听力级校谁"}, {"k": "D", "t": "测听设备电平校准"}, {"k": "E", "t": "探管校准"}], "a": "CD", "multi": true, "exp": {"title": "考察点：言语测听", "text": "正确答案：C)声场言语听力级校谁、D)测听设备电平校准\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。\n\n（2 项正确：['C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 351, "s": "在进行听觉训练指导前， 一定要对助听器配戴者的（    ）有所了解。 【多选题】", "o": [{"k": "A", "t": "年龄"}, {"k": "B", "t": "耳聋原因"}, {"k": "C", "t": "伴随症状"}, {"k": "D", "t": "耳聋发病时间"}, {"k": "E", "t": "听力损失的性质和程度"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：听觉训练教具", "text": "正确答案：A)年龄、B)耳聋原因、C)伴随症状、D)耳聋发病时间、E)听力损失的性质和程度\n\n听觉训练常用词表/实物/图片等作为指导教具，依题中具体实物作答。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 352, "s": "助听器适用的年龄范围包括（    ）。 【多选题】", "o": [{"k": "A", "t": "幼儿"}, {"k": "B", "t": "少年"}, {"k": "C", "t": "青年"}, {"k": "D", "t": "中年"}, {"k": "E", "t": "老年"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：助听器适用年龄", "text": "正确答案：A)幼儿、B)少年、C)青年、D)中年、E)老年\n\n助听器适用全年龄段：幼儿、少年、青年、中年、老年。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 353, "s": "职业道德在企业文化中的重要地位表现在（    ）。 【多选题】", "o": [{"k": "A", "t": "企业环境需要由员工来维护和爱护，如果员工没有爱厂如家的职业道德， 不爱惜企业 的厂房、机器、设备等，不讲究卫生，随意丢弃废物、堆放物品， 企业环境就很难保持整洁、 宽敞、明亮、安全、舒适"}, {"k": "B", "t": "如果员工没有严格遵守规章制度的觉悟，随意违反纪律，那么企业的规章制度就形同虚设"}, {"k": "C", "t": "实现企业价值观、经营之道和企业发展战略目标的主体是员工， 员工若不能接受企业 的价值观和经营之道，不把这种价值观和经营之道落实于生产经营行为之中，企业价值观、 经营之道就成了空中楼阁，企业发展目标也不可能实现"}, {"k": "D", "t": "企业作风和企业礼仪本来就是员工职业道德的表现，如果员工没有较高的职业道德水 平，就不会有好的企业作风和企业礼仪，即使企业制定了企业礼仪，也很难维持下去"}, {"k": "E", "t": "职业道德对员工提高科学文化素质和职业技能具有推动作用。员工若有较高的职业道 德水平，就会刻苦学习科学文化知识， 努力钻研业务，熟练职业技能"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：爱岗敬业/职业理想", "text": "正确答案：A)企业环境需要由员工来维护和爱护，如果员工没有爱厂如家的职业道德， 不爱惜企业 的厂房、机器、设备等，不讲究卫生，随意丢弃废物、堆放物品， 企业环境就很难保持整洁、 宽敞、明亮、安全、舒适、B)如果员工没有严格遵守规章制度的觉悟，随意违反纪律，那么企业的规章制度就形同虚设、C)实现企业价值观、经营之道和企业发展战略目标的主体是员工， 员工若不能接受企业 的价值观和经营之道，不把这种价值观和经营之道落实于生产经营行为之中，企业价值观、 经营之道就成了空中楼阁，企业发展目标也不可能实现、D)企业作风和企业礼仪本来就是员工职业道德的表现，如果员工没有较高的职业道德水 平，就不会有好的企业作风和企业礼仪，即使企业制定了企业礼仪，也很难维持下去、E)职业道德对员工提高科学文化素质和职业技能具有推动作用。员工若有较高的职业道 德水平，就会刻苦学习科学文化知识， 努力钻研业务，熟练职业技能\n\n职业道德与职业素养是职业能力的重要构成：爱岗敬业、诚实守信、办事公道、服务群众、奉献社会。具备良好职业道德的员工才有创新动力与工作热情，并逐步形成明确的职业理想。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 354, "s": "慢性化脓性中耳炎分型包括（    ）。 【多选题】", "o": [{"k": "A", "t": "单纯型"}, {"k": "B", "t": "骨疡型"}, {"k": "C", "t": "乳突型"}, {"k": "D", "t": "胆脂瘤型"}, {"k": "E", "t": "多变型"}], "a": "ABD", "multi": true, "exp": {"title": "考察点：小儿后天性聋", "text": "正确答案：A)单纯型、B)骨疡型、D)胆脂瘤型\n\n小儿后天性聋常见原因：各种传染性疾病、药物(耳毒性药)中毒、外伤、中耳炎；欠发达国家 0~17 岁后天性聋主因是中耳炎。\n\n（3 项正确：['A', 'B', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 355, "s": "以下说法中，关于听力障碍对元音、辅音及超音段音位的影响正确的是（    ）。 【多选题】", "o": [{"k": "A", "t": "对辅音而言，听力障碍对位置信息的影响小于对发音方式及声带振动与否对信息的影响"}, {"k": "B", "t": "由于辅音音位的能量较低且频率较高，而听力损失常常以高频区域为主，所以听力障碍对辅音感知产生的影响大于元音"}, {"k": "C", "t": "对元音而言，听力障碍对 F1 的影响大于对 F2 的影响"}, {"k": "D", "t": "对超音段音位而言，听力障碍对频率信息的影响大于对时间信息和强度信息的影响"}, {"k": "E", "t": "不能仅仅用听力图来预测言语识别率"}], "a": "BDE", "multi": true, "exp": {"title": "考察点：塞擦音", "text": "正确答案：B)由于辅音音位的能量较低且频率较高，而听力损失常常以高频区域为主，所以听力障碍对辅音感知产生的影响大于元音、D)对超音段音位而言，听力障碍对频率信息的影响大于对时间信息和强度信息的影响、E)不能仅仅用听力图来预测言语识别率\n\n塞擦音是塞音(爆破)与擦音(摩擦)的结合，如 zh、ch、j、z、c 等；清浊由 VOT/声带振动区分。\n\n（3 项正确：['B', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 356, "s": "助听器麦克风按照工作原理可分为（    ）。 【多选题】", "o": [{"k": "A", "t": "电磁动圈式"}, {"k": "B", "t": "分立放大式"}, {"k": "C", "t": "集成电路式"}, {"k": "D", "t": "压电陶瓷式"}, {"k": "E", "t": "驻极体式"}], "a": "ADE", "multi": true, "exp": {"title": "考察点：麦克风类型", "text": "正确答案：A)电磁动圈式、D)压电陶瓷式、E)驻极体式\n\n助听器麦克风按工作原理分：电磁动圈式、压电陶瓷式、驻极体式。\n\n（3 项正确：['A', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 357, "s": "单侧感音神经性听力损失的声导抗特点（    ）。 【多选题】", "o": [{"k": "A", "t": "双耳型 A 图"}, {"k": "B", "t": "同侧镫骨肌反射健侧引出"}, {"k": "C", "t": "同侧镫骨肌反射患侧引不出"}, {"k": "D", "t": "对侧镫骨肌反射健侧引出"}, {"k": "E", "t": "对侧镫骨肌反射患侧引不出"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：感音神经性聋", "text": "正确答案：A)双耳型 A 图、B)同侧镫骨肌反射健侧引出、C)同侧镫骨肌反射患侧引不出、D)对侧镫骨肌反射健侧引出、E)对侧镫骨肌反射患侧引不出\n\n感音神经性聋可细分为耳蜗性聋与蜗后性聋。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 358, "s": "先天性外耳道异常可伴有（    ）。 【多选题】", "o": [{"k": "A", "t": "耳廓畸形"}, {"k": "B", "t": "中耳畸形"}, {"k": "C", "t": "前庭畸形"}, {"k": "D", "t": "内耳畸形"}, {"k": "E", "t": "听神经畸形"}], "a": "AB", "multi": true, "exp": {"title": "考察点：外耳道长度", "text": "正确答案：A)耳廓畸形、B)中耳畸形\n\n成人外耳道长约 2.5 cm（外1/3软骨部，内2/3骨部）。\n\n（2 项正确：['A', 'B']）本题为多选题，需选全所有正确项。"}}, {"n": 359, "s": "如果用户佩戴过程对声音变化非常敏感，声音稍有一点增大就觉得不舒适，下列（    ）调试方法的方向是正确的。 【多选题】", "o": [{"k": "A", "t": "在输出界面将大中小三条输出曲线向距离远离方向调试"}, {"k": "B", "t": "在增益界面将大中小三条增益曲线向距离远离方向调试"}, {"k": "C", "t": "在输出界面将大中小三条输出曲线向距离靠近方向调试"}, {"k": "D", "t": "在增益界面将大中小三条增益曲线向距离靠近方向调试"}, {"k": "E", "t": "在增益界面将最上面一条增益曲线向上方向调试"}], "a": "BC", "multi": true, "exp": {"title": "考察点：敏感频率", "text": "正确答案：B)在增益界面将大中小三条增益曲线向距离远离方向调试、C)在输出界面将大中小三条输出曲线向距离靠近方向调试\n\n佩戴助听器后对某频率特别敏感，多为 1000 Hz。\n\n（2 项正确：['B', 'C']）本题为多选题，需选全所有正确项。"}}, {"n": 360, "s": "下列属于 CROS 助听器的局限性的有（    ）。 【多选题】", "o": [{"k": "A", "t": "不像真正双耳听觉一样一定程度提升信噪比"}, {"k": "B", "t": "差耳听力实际上并未得到帮助"}, {"k": "C", "t": "并非真正的双耳听觉"}, {"k": "D", "t": "即使好耳听力正常也需要佩戴助听器"}, {"k": "E", "t": "不能减小头影效应"}], "a": "ABCD", "multi": true, "exp": {"title": "考察点：CROS/BICROS", "text": "正确答案：A)不像真正双耳听觉一样一定程度提升信噪比、B)差耳听力实际上并未得到帮助、C)并非真正的双耳听觉、D)即使好耳听力正常也需要佩戴助听器\n\nCROS 信号对侧交联式，适合单侧重度聋；BICROS 双侧交联式，适合一侧正常/轻中度+另一侧极重度。CROS/BICROS 都不能同时放大差耳、仍为单声道感觉、不能减小头影效应。\n\n（4 项正确：['A', 'B', 'C', 'D']）本题为多选题，需选全所有正确项。"}}, {"n": 361, "s": "有关 SRT 和 PTA 的差值说法正确的是（    ）。 【多选题】", "o": [{"k": "A", "t": "SRT 与 PTA 差值一般不超过 13dB"}, {"k": "B", "t": "差值在 6 dB 以内认为测听结果一致性好"}, {"k": "C", "t": "差值在 7-12 dB 之间认为测听结果一致性较好"}, {"k": "D", "t": "差值大于 13dB 认为测听结果一致性差"}, {"k": "E", "t": "此差值可以帮助鉴别伪聋"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：言语识别阈", "text": "正确答案：A)SRT 与 PTA 差值一般不超过 13dB、B)差值在 6 dB 以内认为测听结果一致性好、C)差值在 7-12 dB 之间认为测听结果一致性较好、D)差值大于 13dB 认为测听结果一致性差、E)此差值可以帮助鉴别伪聋\n\n言语识别阈(SRT)用双音节词表；言语识别率≥90% 视为助听效果『最适』。纯音测听与 SRT 差值一般≤13dB，≥13dB 结果一致性差。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 362, "s": "下列有关言语测听掩蔽操作过程理解说明正确的是（    ）。 【多选题】", "o": [{"k": "A", "t": "对侧掩蔽必须戴耳机完成"}, {"k": "B", "t": "双耳听损程度相近时，声场环境下裸耳分耳言语测听不能完成"}, {"k": "C", "t": "双耳听损程度相近时进行声场环境下分耳言语测听，即使在非测试耳加了阻音耳塞也不能确保识别结果为测试耳成绩"}, {"k": "D", "t": "使用插入式耳机耳间衰减最大"}, {"k": "E", "t": "压耳式耳机做分耳言语测听，当测试耳的言语信号级(测试强度)比非测试耳的纯音 500\\1000\\2000Hz 平均骨导听阈大 40dB 时，应在非测试耳加掩蔽"}], "a": "ABCDE", "multi": true, "exp": {"title": "考察点：言语测听", "text": "正确答案：A)对侧掩蔽必须戴耳机完成、B)双耳听损程度相近时，声场环境下裸耳分耳言语测听不能完成、C)双耳听损程度相近时进行声场环境下分耳言语测听，即使在非测试耳加了阻音耳塞也不能确保识别结果为测试耳成绩、D)使用插入式耳机耳间衰减最大、E)压耳式耳机做分耳言语测听，当测试耳的言语信号级(测试强度)比非测试耳的纯音 500\\1000\\2000Hz 平均骨导听阈大 40dB 时，应在非测试耳加掩蔽\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。\n\n（5 项正确：['A', 'B', 'C', 'D', 'E']）本题为多选题，需选全所有正确项。"}}, {"n": 363, "s": "相较于幼 // ========== localStorage ==========
var LS = {
  get:function(k,d){try{var v=localStorage.getItem('ypf_'+k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set:function(k,v){localStorage.setItem('ypf_'+k,JSON.stringify(v));}
};

// ========== 全局状态 ==========
var S = { page:'home', mode:'all', qid:null, history:[], answered:false, theme:LS.get('theme','light'),
          multi_sel:{}, // 多选题已勾选集合
          simFilter:'all', topic:null };

// ========== 间隔重复权重 ==========
function getWeights(){ return LS.get('weights',{}); }
function getWeight(qid){ var w=getWeights(); return (w[qid]!==undefined)?w[qid]:1.0; }
function updateWeight(qid, correct){ var w=getWeights(); var cur=(w[qid]!==undefined)?w[qid]:1.0;
  if(correct) cur=Math.max(0.15, cur*0.5); else cur=Math.min(8.0, cur*2.2); w[qid]=cur; LS.set('weights',w); }
function weightedPick(pool){ if(!pool.length) return null; var weights=[],tot=0;
  for(var i=0;i<pool.length;i++){ var ww=getWeight(pool[i]); weights.push(ww); tot+=ww; }
  var r=Math.random()*tot, cum=0; for(var i=0;i<pool.length;i++){ cum+=weights[i]; if(r<=cum) return pool[i]; } return pool[pool.length-1]; }

// ========== 渲染入口 ==========
function render(){
  document.documentElement.setAttribute('data-theme', S.theme);
  if(S.page==='home') renderHome();
  else if(S.page==='quiz') renderQuiz();
  else if(S.page==='similar') renderSimilar();
  else if(S.page==='cheat') renderCheat();
  else if(S.page==='wrong') renderWrong();
  else if(S.page==='topic') renderTopic();
}

function topbar(active){
  var tabs = [
    ['首页','home'],['刷题','quiz'],['错题本','wrong'],['分类练习','topic'],['相似题对比','similar'],['速记手册','cheat']
  ];
  var html = '<div class="topbar"><span class="brand">验配师·复习系统</span><span class="sp"></span>';
  for(var i=0;i<tabs.length;i++){
    html += '<button class="tab-btn '+(active===tabs[i][1]?'active':'')+'" onclick="goTab(\''+tabs[i][1]+'\')">'+tabs[i][0]+'</button>';
  }
  html += '</div>';
  return html;
}
function goTab(p){
  if(p==='quiz' && S.qid==null){ startQuiz(); return; }
  S.page=p; render();
}

// ========== 错题本 / 分类 工具 ==========
function getTopic(q){ return q.exp.title.replace(/^考察点：/,''); }
function getWrong(){ return LS.get('wrong',[]); }
function addWrong(qid){ var w=getWrong(); if(w.indexOf(qid)<0){ w.push(qid); LS.set('wrong',w); } }
function removeWrong(qid){ var w=getWrong(); var i=w.indexOf(qid); if(i>=0){ w.splice(i,1); LS.set('wrong',w); } }
// 已做过（去重）：无论对错，答过就计入，用于算"未做题"进度
function getDone(){ return LS.get('done',[]); }
function getRounds(){ return LS.get('rounds',0); }
function addDone(qid){
  var d=getDone();
  if(d.indexOf(qid)<0){
    d.push(qid);
    if(d.length>=TOTAL){            // 本轮刷满全部题 → 完成一轮，进入下一轮并重新计数
      LS.set('rounds', getRounds()+1);
      d=[];
    }
    LS.set('done',d);
  }
}
function practiceOne(qid){ S.page='quiz'; S.qid=qid; S.history=[]; S.answered=false; S.multi_sel={}; render(); }
function topicPool(topic){ var p=[]; for(var i=0;i<BANK.length;i++){ if(getTopic(BANK[i])===topic) p.push(i); } return p; }
function startWrong(){ S.mode='wrong'; startQuiz(); }
function startUndone(){ S.mode='undone'; startQuiz(); }
function startTopic(t){ S.topic=t; S.mode='topic'; startQuiz(); }
