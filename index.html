// ========== 模拟考试 ==========
var EXAM = { single:30, multi:10, minutes:60, timer:null, deadline:0, qlist:[], idx:0, answers:{}, finished:false };
function renderExam(){
  if(EXAM.finished){ app.innerHTML = examReport(); return; }
  if(EXAM.qlist.length){ app.innerHTML = examQuiz(); examTick(); return; }
  // 配置页：拖拽滑块
  var h = topbar('exam');
  h += '<div class="card"><h2>📝 模拟考试配置</h2>'+
    '<div class="range-row"><label>单选题数量 <b id="rv-s">'+EXAM.single+'</b></label>'+
      '<input type="range" min="5" max="120" step="5" value="'+EXAM.single+'" oninput="EXAM.single=+this.value;document.getElementById(\'rv-s\').textContent=this.value"></div>'+
    '<div class="range-row"><label>多选题数量 <b id="rv-m">'+EXAM.multi+'</b></label>'+
      '<input type="range" min="0" max="60" step="5" value="'+EXAM.multi+'" oninput="EXAM.multi=+this.value;document.getElementById(\'rv-m\').textContent=this.value"></div>'+
    '<div class="range-row"><label>考试时间（分钟） <b id="rv-t">'+EXAM.minutes+'</b></label>'+
      '<input type="range" min="10" max="180" step="5" value="'+EXAM.minutes+'" oninput="EXAM.minutes=+this.value;document.getElementById(\'rv-t\').textContent=this.value"></div>'+
    '<div class="spaced"><button class="btn btn-primary" onclick="startExam()">开始考试</button>'+
    '<button class="btn btn-ghost" onclick="goTab(\'home\')">返回</button></div>'+
    '<p class="desc" style="color:var(--muted);font-size:12px;margin-top:10px">共 '+ (EXAM.single+EXAM.multi) +' 题 · 从题库随机抽题 · 限时自动交卷</p></div>';
  app.innerHTML = h;
}
function startExam(){
  var sp=[], mp=[];
  for(var i=0;i<BANK.length;i++){ if(BANK[i].multi) mp.push(i); else sp.push(i); }
  function pick(arr,n){ var a=arr.slice(), out=[]; for(var k=0;k<n&&a.length;k++){ out.push(a.splice(Math.floor(Math.random()*a.length),1)[0]); } return out; }
  EXAM.qlist = pick(sp, EXAM.single).concat(pick(mp, EXAM.multi));
  EXAM.idx=0; EXAM.answers={}; EXAM.finished=false;
  EXAM.deadline = Date.now() + EXAM.minutes*60000;
  if(EXAM.timer) clearInterval(EXAM.timer);
  EXAM.timer = setInterval(examTick, 1000);
  S.page='exam';
  render();
}
function examTick(){
  if(EXAM.finished) return;
  var left = Math.max(0, EXAM.deadline - Date.now());
  var el = document.getElementById('exam-timer');
  if(el){ var m=Math.floor(left/60000), s=Math.floor((left%60000)/1000);
    el.textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    el.className = 'exam-timer' + (left<60000?' warn':''); }
  if(left<=0){ submitExam(true); }
}
function examQuiz(){
  var q = BANK[EXAM.qlist[EXAM.idx]];
  var tot = EXAM.qlist.length;
  var h = '<div class="exam-timer" id="exam-timer">--:--</div>';
  h += '<div class="q-card"><div><span class="q-tag '+(q.multi?'multi':'sel')+'">'+(q.multi?'多选题':'单选题')+'</span>'+
    '<span class="q-meta">第 '+(EXAM.idx+1)+' / '+tot+' 题</span></div>'+
    '<div class="q-stem">'+q.s+'</div><div class="options">';
  var chosen = EXAM.answers[EXAM.qlist[EXAM.idx]] || [];
  for(var i=0;i<q.o.length;i++){
    var k=q.o[i].k, sel = chosen.indexOf(k)>=0;
    h += '<div class="option'+(sel?' selected':'')+'" onclick="examPick(\''+k+'\')"><span class="letter">'+k+'</span><span>'+q.o[i].t+'</span></div>';
  }
  h += '</div><div class="spaced">';
  h += '<button class="btn btn-ghost" onclick="examPrev()">上一题</button>';
  h += (EXAM.idx<tot-1) ? '<button class="btn btn-primary" onclick="examNext()">下一题</button>'
                        : '<button class="btn btn-primary" onclick="submitExam(false)">交卷</button>';
  h += '</div></div>';
  return topbar('exam') + h;
}
function examPick(k){
  var id=EXAM.qlist[EXAM.idx]; var arr=EXAM.answers[id]||[];
  var q=BANK[id];
  if(q.multi){ if(arr.indexOf(k)>=0) arr.splice(arr.indexOf(k),1); else arr.push(k); } // 多选可多选
  else { arr=[k]; } // 单选
  EXAM.answers[id]=arr; render();
}
function examNext(){ if(EXAM.idx<EXAM.qlist.length-1) EXAM.idx++; render(); }
function examPrev(){ if(EXAM.idx>0) EXAM.idx--; render(); }
function submitExam(auto){
  if(!auto){
    if(!confirm('确定要交卷吗？共 '+EXAM.qlist.length+' 题。交卷后将查看成绩与错题回顾，且错题会记入答题统计。')) return;
  }
  if(EXAM.timer) clearInterval(EXAM.timer);
  EXAM.finished = true;
  var wrong=getWrong();
  var stats=LS.get('stats',{total:0,correct:0});
  var done=getDone();
  for(var i=0;i<EXAM.qlist.length;i++){
    var q=BANK[EXAM.qlist[i]], ans=EXAM.answers[EXAM.qlist[i]]||[];
    var ok = ans.length>0 && ans.slice().sort().join('')===q.a.split('').sort().join('');
    stats.total++; if(ok) stats.correct++;   // 考试题计入答题统计
    if(ans.length>0 && done.indexOf(EXAM.qlist[i])<0) done.push(EXAM.qlist[i]);  // 作答过的题计入"已做过"进度
    if(!ok && wrong.indexOf(EXAM.qlist[i])<0) wrong.push(EXAM.qlist[i]);
  }
  LS.set('stats', stats);
  LS.set('wrong', wrong);
  LS.set('done', done);
  render();
}
function examReport(){
  var tot=EXAM.qlist.length, cor=0, sCor=0, mCor=0, sTot=0, mTot=0;
  var wrongList=[];
  for(var i=0;i<tot;i++){
    var q=BANK[EXAM.qlist[i]], ans=EXAM.answers[EXAM.qlist[i]]||[];
    var ok = ans.length>0 && ans.slice().sort().join('')===q.a.split('').sort().join('');
    if(ok){ cor++; if(q.multi) mCor++; else sCor++; }
    if(q.multi) mTot++; else sTot++;
    if(!ok) wrongList.push(EXAM.qlist[i]);
  }
  var pass = cor/tot >= 0.6;
  var h = '<div class="report-box"><h2 style="text-align:center">📊 模拟考试报告</h2>'+
    '<div class="report-score '+(pass?'report-pass':'report-fail')+'">'+cor+' / '+tot+'</div>'+
    '<p style="text-align:center;color:var(--muted)">正确率 '+Math.round(cor/tot*100)+'% · '+(pass?'✅ 通过（≥60%）':'❌ 未通过')+'</p>'+
    '<div class="p-row"><span>单选题</span><b>'+sCor+' / '+sTot+'</b></div>'+
    '<div class="p-row"><span>多选题</span><b>'+mCor+' / '+mTot+'</b></div>'+
    '<div class="p-row"><span>本次错题</span><b class="red">'+wrongList.length+' 题</b></div>'+
    '<p class="desc" style="color:var(--muted);font-size:12px;margin-top:8px">错题已自动加入系统「错题本」，可在刷题时重点练习。</p>'+
    '<div class="spaced" style="justify-content:center;margin-top:12px"><button class="btn btn-primary" onclick="examRestart()">再考一次</button>'+
    '<button class="btn btn-ghost" onclick="goTab(\'wrong\')">看错题本 →</button>'+
    '<button class="btn btn-ghost" onclick="goTab(\'home\')">返回首页</button></div></div>';
  if(wrongList.length){
    h += '<div class="card" style="margin-top:16px"><h2>❌ 本次错题回顾</h2>';
    for(var w=0;w<wrongList.length;w++){
      var q=BANK[wrongList[w]];
      h += '<div class="sim-item"><div class="g-title">'+q.s+'</div><div class="options" style="margin:8px 0">';
      var userAns = EXAM.answers[wrongList[w]]||[];
      for(var o=0;o<q.o.length;o++){
        var kk=q.o[o].k;
        var isRight = q.a.indexOf(kk)>=0;
        var isUser = userAns.indexOf(kk)>=0;
        var cls = isRight ? 'correct' : (isUser ? 'wrong' : 'dim');
        var mark = isRight ? ' ✓正确答案' : (isUser ? ' ✗你的选择' : '');
        h += '<div class="option '+cls+'" style="cursor:default"><span class="letter">'+kk+'</span><span>'+q.o[o].t+mark+'</span></div>';
      }
      h += '</div><div class="sim-ans">正确答案：<b>'+q.a+'</b>'+(userAns.length?' · 你的选择：'+userAns.sort().join('') : ' · 未作答')+'</div></div>';
    }
    h += '</div>';
  }
  return topbar('exam') + h;
}
function examRestart(){ EXAM.qlist=[]; EXAM.finished=false; render(); }

// ========== 系统数据设置 ==========
function renderSetting(){
  var weak = LS.get('weak_review', {on:false, days:1, last:0});
  var h = topbar('setting');
  h += '<div class="card"><h2>⚙ 系统数据设置</h2><p style="color:var(--muted)">管理学习数据：重置进度、跨设备迁移、弱项间隔重练。</p></div>';
  // 弱项重练
  h += '<div class="card"><div class="set-item"><div><b>弱项间隔重练</b></div>'+
    '<div class="desc">开启后，进入刷题时若距上次已超过设定天数，会自动把「错题本」题目优先塞进练习队列，确保旧错题周期性复现、真正记住。</div>'+
    '<label class="switch"><input type="checkbox" '+(weak.on?'checked':'')+' onchange="setWeakOn(this.checked)"> 启用弱项间隔重练</label>'+
    '<div class="range-row" style="margin-top:6px"><label>间隔天数 <b id="rv-d">'+weak.days+'</b></label>'+
      '<input type="range" min="1" max="30" step="1" value="'+weak.days+'" oninput="weakSetDays(+this.value)"></div></div></div>';
  // 导入导出
  h += '<div class="card"><div class="set-item"><div><b>进度导入 / 导出</b></div>'+
    '<div class="desc">导出当前全部学习数据（答题统计、错题本、进度、权重、弱项设置）为 JSON 文件；换设备后导入即可恢复，手机与电脑进度互通。</div>'+
    '<div class="spaced"><button class="btn btn-primary btn-mini" onclick="exportData()">⬇ 导出进度 JSON</button>'+
    '<button class="btn btn-ghost btn-mini" onclick="document.getElementById(\'imp\').click()">⬆ 导入进度 JSON</button>'+
    '<input type="file" id="imp" class="hidden-file" accept="application/json" onchange="importData(this)"></div></div></div>';
  // 重置
  h += '<div class="card"><div class="set-item"><div><b>重置所有学习数据</b></div>'+
    '<div class="desc">清空本题库全部进度：答题统计、错题本、已完成轮数、权重、弱项设置。此操作不可恢复。</div>'+
    '<button class="btn btn-danger btn-mini" onclick="resetAll()">清空所有数据</button></div></div>';
  h += '<div class="footer">本系统由核桃制作 · '+VERSION+'</div>';
  app.innerHTML = h;
}
function setWeakOn(v){ var w=LS.get('weak_review',{on:false,days:1,last:0}); w.on=v; LS.set('weak_review',w); }
function weakSetDays(d){ var w=LS.get('weak_review',{on:false,days:1,last:0}); w.days=d; LS.set('weak_review',w); document.getElementById('rv-d').textContent=d; }
function exportData(){
  var data={ v:VERSION, exportAt:Date.now(),
    stats:LS.get('stats',{}), wrong:LS.get('wrong',[]), done:LS.get('done',[]),
    rounds:LS.get('rounds',0), weights:LS.get('weights',{}), weak_review:LS.get('weak_review',{on:false,days:1,last:0}) };
  var blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href=url; a.download='验配师复习进度_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function importData(input){
  if(!input.files || !input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var d = JSON.parse(e.target.result);
      if(d.stats) LS.set('stats',d.stats);
      if(d.wrong) LS.set('wrong',d.wrong);
      if(d.done) LS.set('done',d.done);
      if(d.rounds!=null) LS.set('rounds',d.rounds);
      if(d.weights) LS.set('weights',d.weights);
      if(d.weak_review) LS.set('weak_review', Object.assign({on:false,days:1,last:0}, d.weak_review));
      alert('导入成功！已恢复进度数据。'); render();
    }catch(err){ alert('导入失败：文件格式不正确。'); }
  };
  reader.readAsText(input.files[0]);
}

function renderCheat(){
  var stats=LS.get('stats',{total:0,correct:0});
  var cheat = '<div class="card"><h2>📘 考试速记要点</h2><p>'+
    '① 单选题不会就蒙 <b>B</b>（B 占比最高约 31%，A 最少约 19%）。'+
    '② 多选题不会就全选 <b>ABCDE</b>（全选占比最高约 26%）；A/B/C 出现率约 80% 可放心选，E 仅约 40% 要慎重。</p></div>';
  app.innerHTML = topbar('cheat')+cheat+knowledgeBrowser();
}
function knowledgeBrowser(){
  // 构建知识点浏览（从题目解析按考察点聚合）
  var map={}; var order=[];
  for(var i=0;i<BANK.length;i++){
    var t=BANK[i].exp.title.replace('考察点：','');
    if(!map[t]){ map[t]={count:0,exp:BANK[i].exp.text}; order.push(t); }
    map[t].count++;
  }
  var html='<div class="card"><h2>📚 知识点速览（按出题量聚合）</h2><input class="search-box" type="text" placeholder="搜索知识点" oninput="filterKn(this.value)" />';
  for(var i=0;i<order.length;i++){
    var t=order[i]; var e=map[t];
    html += '<div class="kn-cat"><h3>'+t+' <span style="font-weight:400;color:var(--muted)">('+e.count+' 题)</span></h3>'+
      '<div class="kn-item">'+e.exp.replace(/\n/g,'<br>')+'</div></div>';
  }
  html += '</div>';
  return html;
}
function filterKn(v){
  var cats=document.querySelectorAll('.kn-cat');
  for(var i=0;i<cats.length;i++){
    var txt=cats[i].textContent;
    cats[i].style.display=(v && txt.indexOf(v)<0)?'none':'';
  }
}

// ========== 通用 ==========
function goHome(){ S.page='home'; render(); }
document.addEventListener('keydown',function(e){
  if(S.page!=='quiz') return;
  if(e.code==='Space'){ e.preventDefault(); if(S.answered) pickNext(); }
});
function toggleTheme(){ S.theme=S.theme==='light'?'dark':'light'; LS.set('theme',S.theme); render(); }
function resetAll(){
  if(!confirm('确定要清空所有学习数据吗？此操作不可恢复。')) return;
  if(!confirm('⚠️ 最后确认：继续将清空全部历史学习进度（答题统计、错题本、已完成轮数、权重、弱项设置等），且无法恢复。确定继续吗？')) return;
  var keys=[]; for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k.indexOf('ypf_')===0) keys.push(k); }
  for(var j=0;j<keys.length;j++) localStorage.removeItem(keys[j]);
  S.page='home'; render();
}

S.theme=LS.get('theme','light');
render();
</script>
