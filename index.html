<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>助听器验配师（三级） — 考试复习系统</title>
<style>
:root {
  --bg:#f0f2f5; --card:#fff; --text:#1a1a2e; --sub:#666; --muted:#999;
  --accent:#0ea5e9; --accent2:#6366f1; --correct:#10b981; --wrong:#ef4444;
  --warn:#f59e0b; --border:#e5e7eb; --shadow:0 2px 12px rgba(0,0,0,.08);
  --radius:14px; --panel-w:30px;
}
[data-theme="dark"] {
  --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --muted:#64748b;
  --border:#334155; --shadow:0 2px 12px rgba(0,0,0,.35);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; transition:background .3s; }
#app { max-width:1000px; margin:0 auto; padding:20px 20px 90px; }
.hidden{display:none!important;}

/* 顶部导航 */
.topbar { display:flex; align-items:center; gap:10px; padding:0 4px 18px; flex-wrap:wrap; }
.topbar .brand { font-weight:800; font-size:18px; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.topbar .sp { flex:1; }
.tab-btn { padding:8px 16px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:13px; cursor:pointer; transition:all .2s; }
.tab-btn:hover { border-color:var(--accent); color:var(--accent); }
.tab-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

/* 卡片通用 */
.card { background:var(--card); border-radius:var(--radius); padding:26px; box-shadow:var(--shadow); border:1px solid var(--border); margin-bottom:18px; }
.card h2 { font-size:18px; margin-bottom:12px; }
.card p { color:var(--sub); font-size:14px; line-height:1.8; }

/* 首页 */
.home-hero { text-align:center; padding:22px 0 6px; }
.home-hero h1 { font-size:28px; font-weight:800; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.home-hero .sub { color:var(--sub); margin-top:8px; font-size:14px; }
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin:20px 0; }
.stats-grid .s-item { background:var(--bg); border-radius:10px; padding:16px; text-align:center; }
.stats-grid .s-item .n { font-size:26px; font-weight:800; color:var(--accent); }
.stats-grid .s-item .l { font-size:11px; color:var(--muted); margin-top:3px; }
.prog-wrap { background:var(--bg); border-radius:10px; padding:14px 16px; margin-bottom:18px; }
.mini-cta { margin-top:10px; width:100%; padding:6px 10px; font-size:12px; border:1px solid var(--border); background:transparent; color:var(--accent); border-radius:8px; cursor:pointer; transition:all .15s; }
.mini-cta:hover { background:rgba(127,127,255,.08); border-color:var(--accent); }
.stats-grid .s-item.undone { display:flex; flex-direction:column; align-items:center; justify-content:center; }
.prog-bar { height:12px; background:var(--border); border-radius:6px; overflow:hidden; }
.prog-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:6px; transition:width .4s; }
.prog-label { font-size:13px; color:var(--sub); margin-top:8px; }
.prog-label b { color:var(--accent); }
.mode-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin:16px 0; }
.mode-btn { padding:16px; border-radius:12px; border:2px solid var(--border); background:var(--card); color:var(--text); text-align:left; cursor:pointer; transition:all .2s; }
.mode-btn b { font-size:15px; display:block; margin-bottom:4px; }
.mode-btn span { font-size:12px; color:var(--muted); }
.mode-btn:hover { border-color:var(--accent); transform:translateY(-2px); }
.mode-btn.weak { border-color:var(--warn); }
.mode-btn.weak b { color:var(--warn); }
.mode-btn.sel { border-color:var(--accent); background:rgba(14,165,233,.09); box-shadow:0 0 0 2px rgba(14,165,233,.15); }
.mode-btn.sel b { color:var(--accent); }
.mode-btn.sel span { color:var(--text); }
.mode-btn.weak.sel { border-color:var(--warn); background:rgba(245,158,11,.10); box-shadow:0 0 0 2px rgba(245,158,11,.18); }
.mode-btn.weak.sel b { color:var(--warn); }
.mode-btn .mark { display:inline-block; width:14px; height:14px; border-radius:50%; border:2px solid var(--muted); margin-right:7px; vertical-align:-2px; transition:all .2s; }
.mode-btn.sel .mark { border-color:var(--accent); background:var(--accent); box-shadow:inset 0 0 0 3px var(--card); }
.mode-btn.weak.sel .mark { border-color:var(--warn); background:var(--warn); box-shadow:inset 0 0 0 3px var(--card); }
.big-start { display:block; width:100%; padding:15px; border:none; border-radius:12px; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-size:17px; font-weight:700; cursor:pointer; margin-top:6px; }
.big-start:hover { opacity:.92; }

/* 刷题页 */
.q-wrap { display:grid; grid-template-columns:1fr 250px; gap:18px; }
/* 竖屏手机：单列（右侧面板沉底） */
@media(max-width:760px){ .q-wrap{grid-template-columns:1fr;} }
/* 中等屏（含 iPhone 横屏 ~932px）：保持双栏，题目区紧凑 */
@media(max-width:1100px) and (min-width:761px){
  .q-card{padding:16px;}
  .q-stem{font-size:15px;line-height:1.7;margin:12px 0 14px;}
  .options{gap:8px;}
  .option{padding:10px 12px;font-size:14px;border-radius:10px;}
  .option .letter{width:24px;height:24px;font-size:13px;margin-right:10px;}
  .confirm-bar{margin-top:12px;}
  .feedback{padding:12px;margin-top:12px;font-size:14px;line-height:1.6;}
  .feedback .explain{padding:10px 12px;font-size:13px;line-height:1.7;}
  .next-hint{margin-top:12px;font-size:11px;}
}
/* 窄屏（手机竖屏/小窗）：整体紧凑 */
@media(max-width:760px){
  #app{padding:12px 12px 80px;}
  .topbar{padding:0 0 10px;}
  .topbar .brand{font-size:16px;}
  .tab-btn{padding:6px 10px;font-size:13px;}
  .q-card{padding:14px;}
  .q-stem{font-size:15px;line-height:1.7;margin:12px 0 14px;}
  .options{gap:8px;}
  .option{padding:10px 12px;font-size:14px;border-radius:10px;}
  .option .letter{width:24px;height:24px;font-size:13px;margin-right:10px;}
  .confirm-bar{margin-top:12px;}
  .feedback{padding:12px;margin-top:12px;font-size:14px;line-height:1.6;}
  .feedback .explain{padding:10px 12px;font-size:13px;line-height:1.7;}
  .next-hint{margin-top:12px;font-size:11px;}
  .side{padding:14px;position:static;max-height:none;}
  .side .big{font-size:26px;}
  .side .p-row{padding:6px 0;font-size:12px;}
  .side .dots{gap:3px;}
  .side .dot{width:15px;height:15px;font-size:10px;}
  .card{padding:14px;margin-bottom:12px;}
  .card h2{font-size:16px;margin-bottom:8px;}
  .home-hero h1{font-size:22px;}
  .home-hero .sub{font-size:12px;}
  .stats-grid{gap:8px;margin:12px 0;}
  .stats-grid .s-item{padding:10px 6px;}
  .stats-grid .s-item .n{font-size:22px;}
  .mode-grid{gap:8px;margin:10px 0;}
  .mode-btn{padding:10px 12px;}
  /* 单列时答题后固定底部"下一题" */
  .mobile-next{display:block;position:fixed;left:10px;right:10px;bottom:10px;z-index:60;}
  .mobile-next .btn{width:100%;padding:13px;font-size:16px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.25);}
}
.mobile-next{display:none;}
.q-card { background:var(--card); border-radius:var(--radius); padding:28px; box-shadow:var(--shadow); border:1px solid var(--border); }
.q-tag { display:inline-block; padding:3px 10px; border-radius:6px; font-size:12px; font-weight:600; margin-right:8px; }
.q-tag.tf { background:#dbeafe; color:#1d4ed8; }
.q-tag.sel { background:#fef3c7; color:#b45309; }
.q-tag.multi { background:#dcfce7; color:#15803d; }
.q-meta { font-size:13px; color:var(--sub); }
.q-stem { font-size:17px; line-height:1.85; margin:20px 0 22px; }
.options { display:flex; flex-direction:column; gap:10px; }
.option { display:flex; align-items:center; padding:13px 16px; border:2px solid var(--border); border-radius:12px; cursor:pointer; transition:all .2s; font-size:15px; }
.option:hover { border-color:var(--accent); }
.option .letter { width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--border); margin-right:12px; font-weight:700; font-size:14px; flex-shrink:0; transition:all .2s; }
.option.multi-tog.selected { border-color:var(--accent); background:rgba(14,165,233,.08); }
.option.multi-tog.selected .letter { background:var(--accent); color:#fff; }
.option.correct { border-color:var(--correct); background:rgba(16,185,129,.1); }
.option.correct .letter { background:var(--correct); color:#fff; }
.option.wrong { border-color:var(--wrong); background:rgba(239,68,68,.1); }
.option.wrong .letter { background:var(--wrong); color:#fff; }
.option.dim { opacity:.45; }
.confirm-bar { margin-top:16px; }
.btn { padding:12px 22px; border-radius:10px; border:none; font-size:15px; font-weight:600; cursor:pointer; transition:all .2s; }
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:var(--accent2); }
.btn-ghost { background:transparent; border:2px solid var(--accent); color:var(--accent); }
.btn-ghost:hover { background:var(--accent); color:#fff; }
.btn-danger { background:transparent; border:2px solid var(--wrong); color:var(--wrong); }
.btn-danger:hover { background:var(--wrong); color:#fff; }
.btn-mini { padding:6px 14px; font-size:13px; }
.feedback { padding:16px; border-radius:12px; margin-top:18px; font-size:15px; line-height:1.7; animation:fadeIn .25s; }
.feedback.ok { background:rgba(16,185,129,.1); border:1px solid var(--correct); }
.feedback.err { background:rgba(239,68,68,.1); border:1px solid var(--wrong); }
.feedback .explain { margin-top:12px; padding:14px 16px; background:var(--bg); border-radius:10px; font-size:14px; line-height:1.8; color:var(--text); border-left:3px solid var(--accent); white-space:pre-wrap; }
.feedback .explain .exp-title { font-weight:700; color:var(--accent); margin-bottom:6px; }
.exp-toggle { font-size:13px; color:var(--accent); cursor:pointer; text-decoration:underline; margin-left:6px; }
@keyframes fadeIn { from{opacity:0;transform:translateY(4px);} to{opacity:1;transform:translateY(0);} }
.next-hint { font-size:12px; color:var(--muted); margin-top:16px; }
.next-hint kbd { background:var(--border); padding:2px 8px; border-radius:4px; }

/* 侧栏 */
.side { background:var(--card); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); border:1px solid var(--border); height:fit-content; position:sticky; top:20px; max-height:calc(100vh - 40px); display:flex; flex-direction:column; }
.side-top { flex-shrink:0; }
.side-scroll { flex:1; min-height:0; overflow-y:auto; }
.side-scroll::-webkit-scrollbar { width:4px; }
.side-scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.side .side-actions { display:flex; flex-direction:column; gap:8px; margin-top:12px; flex-shrink:0; border-top:1px solid var(--border); padding-top:12px; }
.side .side-actions .btn { width:100%; }
.side .p-title { font-size:13px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; }
.side .big { font-size:32px; font-weight:800; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-align:center; }
.side .label { font-size:11px; color:var(--muted); text-align:center; margin-top:2px; }
.side .p-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
.side .p-row .green { color:var(--correct); font-weight:700; }
.side .p-row .red { color:var(--wrong); font-weight:700; }
.side .p-bar { height:6px; background:var(--border); border-radius:3px; overflow:hidden; margin:10px 0; }
.side .p-bar-fill { height:100%; background:var(--correct); border-radius:3px; }

/* 相似题 / 速记 页面 */
.sim-group { background:var(--card); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow); border:1px solid var(--border); margin-bottom:16px; }
.sim-group .g-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.sim-group .g-type { font-size:11px; padding:2px 8px; border-radius:5px; font-weight:700; }
.sim-group.g-contrast .g-type { background:#fee2e2; color:#b91c1c; }
.sim-group.g-variant .g-type { background:#e0e7ff; color:#4338ca; }
.sim-group .g-title { font-weight:700; font-size:15px; }
.sim-item { padding:10px 12px; border-radius:8px; background:var(--bg); margin:8px 0; font-size:14px; line-height:1.7; }
.sim-item .tag { font-weight:700; color:var(--accent); margin-right:8px; }
.sim-ans { margin-top:6px; font-size:13px; color:var(--sub); }
.sim-ans b { color:var(--correct); }
.sim-diff { margin-top:10px; font-size:12px; color:var(--warn); }

/* 完整题目卡片（纯记忆题 & 相似题富化） */
.fullq { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin:8px 0; }
.fq-tag { display:inline-block; font-size:11px; padding:2px 9px; border-radius:5px; background:var(--accent); color:#fff; margin-bottom:6px; font-weight:700; }
.fq-stem { font-size:14px; line-height:1.7; }
.fq-opts { display:flex; flex-direction:column; gap:4px; margin:8px 0; }
.fq-opts .opt { display:flex; gap:8px; font-size:13px; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:6px; padding:4px 8px; }
.fq-opts .opt .ol { font-weight:700; color:var(--accent); min-width:16px; }
.fq-opts .opt.ans { border-color:var(--correct); background:rgba(16,185,129,.08); }
.fq-opts .opt.ans .ol { color:var(--correct); }
.fq-ans { font-size:13px; }
.fq-ans b { color:var(--correct); }
.memo-sec { margin-bottom:20px; }
.memo-sec h2 { font-size:16px; color:var(--accent); margin-bottom:10px; }
.memo-count { font-size:13px; color:var(--muted); font-weight:400; margin-left:6px; }
.filter-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.filter-chip { padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:var(--card); color:var(--sub); font-size:13px; cursor:pointer; }
.filter-chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.search-box { width:100%; padding:12px 16px; border-radius:10px; border:2px solid var(--border); background:var(--card); color:var(--text); font-size:15px; margin-bottom:16px; outline:none; }
.search-box:focus { border-color:var(--accent); }

/* 速记卡片 */
.kn-cat { margin-bottom:18px; }
.kn-cat h3 { font-size:14px; color:var(--accent); margin-bottom:10px; }
.kn-item { background:var(--card); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:8px; padding:12px 14px; margin-bottom:8px; font-size:14px; line-height:1.7; }
.kn-item b { color:var(--accent); }

/* 答题轨迹点 */
.side .dots-wrap { border-bottom:1px solid var(--border); margin-bottom:4px; }
.side .dots-wrap .p-row { border-bottom:none; }
.side .dots { display:flex; flex-wrap:wrap; gap:4px; padding:4px 0 8px; }
.side .dot { width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:11px; color:#fff; font-weight:700; }
.side .dot.ok { background:var(--correct); }
.side .dot.bad { background:var(--wrong); }

/* 错题本 */
.wrong-item { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--border); border-left:3px solid var(--wrong); border-radius:10px; padding:12px 14px; margin-bottom:10px; font-size:14px; }
.wrong-item .q-tag { flex-shrink:0; }
.wrong-item .w-stem { flex:1; }
.wrong-item .btn-mini { flex-shrink:0; }

/* 分类练习 */
.topic-item { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:10px; }
.topic-item .t-head { flex:1; }
.topic-item .t-count { color:var(--muted); font-size:12px; margin-left:8px; }

/* 主题按钮 */
.theme-btn { position:fixed; bottom:18px; right:18px; width:44px; height:44px; border-radius:50%; background:var(--card); border:1px solid var(--border); cursor:pointer; font-size:20px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); z-index:30; transition:all .2s; }
.theme-btn:hover { transform:scale(1.08); }

.footer { text-align:center; padding:18px 0 8px; color:var(--muted); font-size:12px; line-height:1.8; }
</style>
</head>
<body>
<div id="app"></div>

<script>
var BANK = [{"n": 1, "s": "具有良好的（    ）是员工提高创新意识和创新能力的精神动力。企业的生存 和发展主要取决于企业是否具有创新能力，是否能开发出满足社会需求的新技术 和新产品。", "o": [{"k": "A", "t": "文化素质"}, {"k": "B", "t": "职业道德"}, {"k": "C", "t": "拼搏精神"}, {"k": "D", "t": "抗挫能力"}], "a": "B", "multi": false, "exp": {"title": "考察点：爱岗敬业/职业理想", "text": "正确答案：B）职业道德\n\n职业道德与职业素养是职业能力的重要构成：爱岗敬业、诚实守信、办事公道、服务群众、奉献社会。具备良好职业道德的员工才有创新动力与工作热情，并逐步形成明确的职业理想。"}}, {"n": 2, "s": "人类个体在环境和教育的影响下，随着知识水平和爱好兴趣的发展，会逐步 养成对某种职业的爱好，并在此基础上形成一定的（    ）。", "o": [{"k": "A", "t": "职业爱好"}, {"k": "B", "t": "职业理想"}, {"k": "C", "t": "职业规划"}, {"k": "D", "t": "职业需求"}], "a": "B", "multi": false, "exp": {"title": "考察点：爱岗敬业/职业理想", "text": "正确答案：B）职业理想\n\n职业道德与职业素养是职业能力的重要构成：爱岗敬业、诚实守信、办事公道、服务群众、奉献社会。具备良好职业道德的员工才有创新动力与工作热情，并逐步形成明确的职业理想。"}}, {"n": 3, "s": "在工作岗位上具有良好的（    ），心情舒畅，才能激发起巨大的热情和积极 性。", "o": [{"k": "A", "t": "精神状态"}, {"k": "B", "t": "活力"}, {"k": "C", "t": "精力"}, {"k": "D", "t": "物质基础"}], "a": "A", "multi": false, "exp": {"title": "考察点：爱岗", "text": "正确答案：A）精神状态\n\n爱岗=热爱自己的工作岗位、热爱本职工作；敬业=对本职工作尽职尽责、精益求精。爱岗敬业是职业道德的核心要求。"}}, {"n": 4, "s": "助听器验配师的设备工具是比较高档的精密仪器，仪器的（    ）是工作认真 负责的一部分，如果仪器某一个部位出现问题，将会给工作带来损失。所以在设 备的使用中应加倍爱护，延长其使用寿命，更好地为听障者服务。", "o": [{"k": "A", "t": "使用"}, {"k": "B", "t": "保护"}, {"k": "C", "t": "保养"}, {"k": "D", "t": "校配"}], "a": "B", "multi": false, "exp": {"title": "考察点：爱护精密仪器设备", "text": "正确答案：B）保护\n\n助听器验配师的设备工具属高档精密仪器，应加倍爱护、正确保养，以延长使用寿命；仪器的保护是工作认真负责的体现，一处故障就会给工作带来损失。对应『爱护设备/工具』的职业道德要求。"}}, {"n": 5, "s": "素养（Shitsuke)：形成制度，（     ）。对于规定了的事， 大家都按要求遵守执行，并且成为一种习惯。", "o": [{"k": "A", "t": "科学布局"}, {"k": "B", "t": "一留一弃"}, {"k": "C", "t": "空间活用"}, {"k": "D", "t": "养成习惯"}], "a": "D", "multi": false, "exp": {"title": "考察点：5S素养", "text": "正确答案：D）养成习惯\n\n5S 即整理、整顿、清扫、清洁、素养（Shitsuke）。『素养』指形成制度后大家都按要求遵守执行并养成习惯，属最高要求。"}}, {"n": 6, "s": "成人外耳道长约（    ）。", "o": [{"k": "A", "t": "1cm"}, {"k": "B", "t": "1.5cm"}, {"k": "C", "t": "2cm"}, {"k": "D", "t": "2.5cm"}], "a": "D", "multi": false, "exp": {"title": "考察点：外耳道长度", "text": "正确答案：D）2.5cm\n\n成人外耳道长约 2.5 cm（外1/3软骨部，内2/3骨部）。"}}, {"n": 7, "s": "鼓膜自脐向前下达鼓膜边缘有一个三角形反光区，名（    ）。", "o": [{"k": "A", "t": "反射区"}, {"k": "B", "t": "光锥"}, {"k": "C", "t": "扇面"}, {"k": "D", "t": "上棘"}], "a": "B", "multi": false, "exp": {"title": "考察点：鼓膜光锥", "text": "正确答案：B）光锥\n\n鼓膜自脐向前下达鼓膜边缘的三角形反光区叫『光锥』；鼓膜分为上皮层、纤维组织层、粘膜层三层。"}}, {"n": 8, "s": "（    ）是支配耳蜗毛细胞的神经纤维。", "o": [{"k": "A", "t": "迷走神经"}, {"k": "B", "t": "听神经"}, {"k": "C", "t": "舌咽神经"}, {"k": "D", "t": "三叉神经"}], "a": "B", "multi": false, "exp": {"title": "考察点：听神经", "text": "正确答案：B）听神经\n\n支配耳蜗毛细胞的神经纤维是听神经（蜗神经，第八对脑神经的一部分）。"}}, {"n": 9, "s": "（    ）的主要作用是将来自外耳的声能传递到耳蜗的淋巴液。", "o": [{"k": "A", "t": "外耳"}, {"k": "B", "t": "中耳"}, {"k": "C", "t": "内耳"}, {"k": "D", "t": "听神经"}], "a": "B", "multi": false, "exp": {"title": "考察点：中耳传声", "text": "正确答案：B）中耳\n\n中耳的主要作用是把来自外耳的声能传递到耳蜗淋巴液（经听小骨放大）。"}}, {"n": 10, "s": "耳蜗前庭阶内的液体被称为（    ）。", "o": [{"k": "A", "t": "外淋巴"}, {"k": "B", "t": "内淋巴"}, {"k": "C", "t": "第三淋巴"}, {"k": "D", "t": "第四淋巴"}], "a": "A", "multi": false, "exp": {"title": "考察点：耳蜗外淋巴", "text": "正确答案：A）外淋巴\n\n耳蜗前庭阶内的液体为外淋巴；中阶内为内淋巴。骨蜗管腔分为前庭阶、中阶、鼓阶。"}}, {"n": 11, "s": "大多数初级神经元放电率改变量很小，但响度的变化超过了（    ）范围。", "o": [{"k": "A", "t": "80dB"}, {"k": "B", "t": "90dB"}, {"k": "C", "t": "100dB"}, {"k": "D", "t": "110dB"}], "a": "C", "multi": false, "exp": {"title": "考察点：响度机制", "text": "正确答案：C）100dB\n\n响度与听神经冲动的速率及发生冲动的神经数量有关；多数初级神经元放电率变化小，而响度变化可超过 100 dB。"}}, {"n": 12, "s": "梅尼埃病首次发病年龄约在（    ）岁。", "o": [{"k": "A", "t": "10～30"}, {"k": "B", "t": "20～40"}, {"k": "C", "t": "30～50"}, {"k": "D", "t": "40～60"}], "a": "C", "multi": false, "exp": {"title": "考察点：梅尼埃病", "text": "正确答案：C）30～50\n\n梅尼埃病首次发病年龄约 30~50 岁。"}}, {"n": 13, "s": "沿绳传播的一列机械波，当波源突然停止振动时(    ）。", "o": [{"k": "A", "t": "绳上各质点同时停止振动，横波立即消失"}, {"k": "B", "t": "绳上各质点同时停止振动，纵波立即消失"}, {"k": "C", "t": "绳上各质点同时停止振动，横波纵波同时消失"}, {"k": "D", "t": "离波源较近的各质点先停止振动，较远的各质点稍后停止振动"}], "a": "D", "multi": false, "exp": {"title": "考察点：声波特性", "text": "正确答案：D）离波源较近的各质点先停止振动，较远的各质点稍后停止振动\n\n声波在空气中向三维空间呈膨胀球体传播。低频波长大于头部直径时两耳间几乎无头影衰减；高频波长小于头部直径时受头部衍射/头影作用而削弱。"}}, {"n": 14, "s": "关于波的传播，以下说法错误的是（    ）。", "o": [{"k": "A", "t": "当一颗石头被扔进水中，水面的波纹以同心圆的形式向外传播"}, {"k": "B", "t": "当一颗石头被扔进水中，水面的波纹以正弦波浪的形式向外传播"}, {"k": "C", "t": "声波在空气中的传播类似于水波在水面的传播"}, {"k": "D", "t": "声波在空气中的传播时在整个三维空间内的，想一个膨胀的球体"}], "a": "B", "multi": false, "exp": {"title": "考察点：声波特性", "text": "正确答案：B）当一颗石头被扔进水中，水面的波纹以正弦波浪的形式向外传播\n\n声波在空气中向三维空间呈膨胀球体传播。低频波长大于头部直径时两耳间几乎无头影衰减；高频波长小于头部直径时受头部衍射/头影作用而削弱。"}}, {"n": 15, "s": "当高频声波的波长小于头部的直径时，由于头部的（    ）作用， 声波在从 一只耳朵到另-只耳朵传递的过程中将受到削弱。当低频声波的波长大于头部的 直径时，声波在两耳之间将（    ）。", "o": [{"k": "A", "t": "反射，增强"}, {"k": "B", "t": "衍射，不会有变化"}, {"k": "C", "t": "散射，增强"}, {"k": "D", "t": "反射，不会有变化"}], "a": "D", "multi": false, "exp": {"title": "考察点：声波特性", "text": "正确答案：D）反射，不会有变化\n\n声波在空气中向三维空间呈膨胀球体传播。低频波长大于头部直径时两耳间几乎无头影衰减；高频波长小于头部直径时受头部衍射/头影作用而削弱。"}}, {"n": 16, "s": "人耳听觉的可闻阈声压级为（    ），人耳听觉的痛阈声压级为（    ）。", "o": [{"k": "A", "t": "0 dB SPL，120 dB SPL"}, {"k": "B", "t": "20 dB SPL，85 dB SPL"}, {"k": "C", "t": "20 dB SPL，50 dB SPL"}, {"k": "D", "t": "0 dB SPL，100 dB SPL"}], "a": "A", "multi": false, "exp": {"title": "考察点：可闻阈痛阈", "text": "正确答案：A）0 dB SPL，120 dB SPL\n\n人耳可闻阈约 0 dB SPL，痛阈约 120 dB SPL（此区段为听觉动态范围）。"}}, {"n": 17, "s": "纯音测听的规范中要求，纯音的给声时间为（    ）。", "o": [{"k": "A", "t": "1～2s"}, {"k": "B", "t": "1s 以内"}, {"k": "C", "t": "1～5s"}, {"k": "D", "t": "5s 以上"}], "a": "A", "multi": false, "exp": {"title": "考察点：纯音测听规范", "text": "正确答案：A）1～2s\n\n纯音测听给声时间≥500 ms；给声时间太短（<100ms）时纯音响度随给声时间减少而降低，需更高强度才听到。纯音测听只反映听敏度，不反映听功能状态。"}}, {"n": 18, "s": "人耳对不同频率声刺激的敏感性不同， 以（    ） 声音 最敏感，（    ）声 音次之，对（    ）声音的敏感性最差。", "o": [{"k": "A", "t": "高频、中领、低频"}, {"k": "B", "t": "中频、高频、低频"}, {"k": "C", "t": "高频、低频、中频"}, {"k": "D", "t": "中频、低频、高频"}], "a": "B", "multi": false, "exp": {"title": "考察点：敏感频率", "text": "正确答案：B）中频、高频、低频\n\n佩戴助听器后对某频率特别敏感，多为 1000 Hz。"}}, {"n": 19, "s": "在进行纯音测听的时候，给声的时间不得小于 500 ms 是 （    ）。", "o": [{"k": "A", "t": "因为在时值小于 200 ms 时，纯音的响度将随着给声时间的减少而升高"}, {"k": "B", "t": "因为在时值小于 100 ms 时，纯音的响度将随着给声时间的减少而降低"}, {"k": "C", "t": "因为如果使用很短的纯音，需要一个较高的强度才能使受试者听到"}, {"k": "D", "t": "因为如果使用很短的纯音，需要一个较低的强度才能使受试者听到"}], "a": "C", "multi": false, "exp": {"title": "考察点：纯音测听规范", "text": "正确答案：C）因为如果使用很短的纯音，需要一个较高的强度才能使受试者听到\n\n纯音测听给声时间≥500 ms；给声时间太短（<100ms）时纯音响度随给声时间减少而降低，需更高强度才听到。纯音测听只反映听敏度，不反映听功能状态。"}}, {"n": 20, "s": "当信号强度刚刚高于掩藏噪声时，也就是说刚刚高于掩蔽阈值时，对响度的影响（    ）。", "o": [{"k": "A", "t": "最小"}, {"k": "B", "t": "最接近零值"}, {"k": "C", "t": "最大"}, {"k": "D", "t": "可忽略不计"}], "a": "C", "multi": false, "exp": {"title": "考察点：音色", "text": "正确答案：C）最大\n\n两个声音响度、音调相同时，靠『音色』区分。音色由谐波/频谱包络决定。"}}, {"n": 21, "s": "下列做法用来改变音调的是（    ）。", "o": [{"k": "A", "t": "老师用扩音器讲课"}, {"k": "B", "t": "在公共场所轻声说话"}, {"k": "C", "t": "依次敲击装有不同高度水的瓶子"}, {"k": "D", "t": "用大小不同的力敲击同一个音叉歌唱"}], "a": "C", "multi": false, "exp": {"title": "考察点：音调改变", "text": "正确答案：C）依次敲击装有不同高度水的瓶子\n\n改变发声体振动快慢可改变音调；改变声音的大小(振幅)改变响度。敲不同水量瓶子弹可变音调。"}}, {"n": 22, "s": "声源定位是听觉系统对发声物体位置的判断过程，它不包括（    ）。", "o": [{"k": "A", "t": "近距离声源定位"}, {"k": "B", "t": "垂直声源定位"}, {"k": "C", "t": "与听者距离的识别"}, {"k": "D", "t": "水平声源定位"}], "a": "A", "multi": false, "exp": {"title": "考察点：声源定位", "text": "正确答案：A）近距离声源定位\n\n声源定位靠双耳时间差、强度差、相位差实现；它『不包括』与听者之间的距离识别。"}}, {"n": 23, "s": "对频谱图要考虑到频谱图包络，即把图中的幅值用一条平滑的线连接起来。 在频谱图包络中可以有一些较（    ）的峰值，称为（    ）。", "o": [{"k": "A", "t": "窄、基频"}, {"k": "B", "t": "清晰、泛音"}, {"k": "C", "t": "模糊、共振峰"}, {"k": "D", "t": "宽、共振峰"}], "a": "D", "multi": false, "exp": {"title": "考察点：等响/共振峰", "text": "正确答案：D）宽、共振峰\n\n频谱图包络用平滑线连接幅值，其中较宽的峰为共振峰。元音特性由共振峰位置决定。"}}, {"n": 24, "s": "严格地说，人体的声源器官只有声带，它的振动虽然不能直接形成语声， 但对语声的（    ）和 （    ）有着重要的影响。", "o": [{"k": "A", "t": "音色、音强"}, {"k": "B", "t": "音高、音色"}, {"k": "C", "t": "强、音调"}, {"k": "D", "t": "音高、音长"}], "a": "B", "multi": false, "exp": {"title": "考察点：机械振动", "text": "正确答案：B）音高、音色\n\n实际自由振动必为阻尼振动（幅度越来越小）；受迫振动的频率由外界策动力频率决定；受迫振动稳定后频率与自身物理条件无关。"}}, {"n": 25, "s": "根据时值把元音分为长元音和短元音。长元音的时值（    ），短元音的时值 (    )。", "o": [{"k": "A", "t": "大于 150ms、少于 50ms"}, {"k": "B", "t": "大于 250ms、少于 200ms"}, {"k": "C", "t": "大于 100ms、少于 10 ms"}, {"k": "D", "t": "大于 500ms、少于 100ms"}], "a": "B", "multi": false, "exp": {"title": "考察点：言语训练/发音不清", "text": "正确答案：B）大于 250ms、少于 200ms\n\n听障儿童发音不清常与接收信号含糊、发音口耳协调不当、发音器官不能运用自如等因素有关。"}}, {"n": 26, "s": "林氏(LI×GS) 五音基本反映了语音在（    ）之间的频率分布。", "o": [{"k": "A", "t": "100～500 Hz"}, {"k": "B", "t": "250～500 Hz"}, {"k": "C", "t": "250～8000 Hz"}, {"k": "D", "t": "500～1000 Hz"}], "a": "C", "multi": false, "exp": {"title": "考察点：声波特性", "text": "正确答案：C）250～8000 Hz\n\n声波在空气中向三维空间呈膨胀球体传播。低频波长大于头部直径时两耳间几乎无头影衰减；高频波长小于头部直径时受头部衍射/头影作用而削弱。"}}, {"n": 27, "s": "听力障碍使患者的听敏度降低，提高了阈值，不利于言语信号的接收。患者听力阈值的变化在不同（    ）并不相同。", "o": [{"k": "A", "t": "频率"}, {"k": "B", "t": "强度"}, {"k": "C", "t": "周期"}, {"k": "D", "t": "环境"}], "a": "A", "multi": false, "exp": {"title": "考察点：言语测听", "text": "正确答案：A）频率\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。"}}, {"n": 28, "s": "最早的全数字助听器在（    ）推出。", "o": [{"k": "A", "t": "1990 年"}, {"k": "B", "t": "1992 年"}, {"k": "C", "t": "1994 年"}, {"k": "D", "t": "1996 年"}], "a": "D", "multi": false, "exp": {"title": "考察点：助听器发展史", "text": "正确答案：D）1996 年\n\n助听器发展里程碑：第一台可随身佩戴的电子管助听器诞生于英国；1961 年助听器行业大会提出描述助听器性能的标准方法；最早的(全)数字助听器于 1996 年推出。"}}, {"n": 29, "s": "M-T 转换开关中的 M 是指（    ）。", "o": [{"k": "A", "t": "高频增加"}, {"k": "B", "t": "音量"}, {"k": "C", "t": "麦克风"}, {"k": "D", "t": "受话器"}], "a": "C", "multi": false, "exp": {"title": "考察点：M-T开关", "text": "正确答案：C）麦克风\n\n助听器 M-T 转换开关：M 指麦克风(Microphone)挡，采集环境声；T 指电感(Telecoil)挡，感应电话/环路磁场。"}}, {"n": 30, "s": "《助听器交货时质量检验的性能测量》是（    ）。", "o": [{"k": "A", "t": "IEC 118-0"}, {"k": "B", "t": "IEC 118-1"}, {"k": "C", "t": "IEC 118-2"}, {"k": "D", "t": "IEC 118-7"}], "a": "D", "multi": false, "exp": {"title": "考察点：助听器检验标准", "text": "正确答案：D）IEC 118-7\n\n助听器质量标准：国际电工委员会(IEC)标准《助听器交货时质量检验的性能测量》为 IEC 118-7；我国采用 GB6657 作为助听器电声特性测量标准。"}}, {"n": 31, "s": "（    ）美国国家耳模实验室宣布了一些标准的耳模名称。", "o": [{"k": "A", "t": "1976 年"}, {"k": "B", "t": "1977 年"}, {"k": "C", "t": "1978 年"}, {"k": "D", "t": "1979 年"}], "a": "A", "multi": false, "exp": {"title": "考察点：耳模更换", "text": "正确答案：A）1976 年\n\n9~18 个月儿童耳模约 3 个月更换一次（因耳道快速发育）。耳模类型：标准式、壳式、耳道壳式、骨架式等。"}}, {"n": 32, "s": "导声管的长度加长，其所传输声音的（    ）增加。", "o": [{"k": "A", "t": "响度"}, {"k": "B", "t": "低频增益"}, {"k": "C", "t": "中频增益"}, {"k": "D", "t": "高频增益"}], "a": "B", "multi": false, "exp": {"title": "考察点：外耳道长度", "text": "正确答案：B）低频增益\n\n成人外耳道长约 2.5 cm（外1/3软骨部，内2/3骨部）。"}}, {"n": 33, "s": "对于 4～6 个月的儿童，采取的测听方法推荐（    ）。", "o": [{"k": "A", "t": "听性反射"}, {"k": "B", "t": "听觉行为反应"}, {"k": "C", "t": "视觉强化测听"}, {"k": "D", "t": "游戏测听"}], "a": "B", "multi": false, "exp": {"title": "考察点：分龄测听法", "text": "正确答案：B）听觉行为反应\n\n按年龄选择行为测听法：4~6 月听觉行为观察；8 月左右视觉强化测听；3 岁以上游戏测听。"}}, {"n": 34, "s": "助听器自主选配论坛将响度分成了（    ）等级。", "o": [{"k": "A", "t": "7 个"}, {"k": "B", "t": "8 个"}, {"k": "C", "t": "9 个"}, {"k": "D", "t": "10 个"}], "a": "B", "multi": false, "exp": {"title": "考察点：音色", "text": "正确答案：B）8 个\n\n两个声音响度、音调相同时，靠『音色』区分。音色由谐波/频谱包络决定。"}}, {"n": 35, "s": "对于家住偏僻地区的患者，可以采用（    ）。", "o": [{"k": "A", "t": "言语测听检查"}, {"k": "B", "t": "纯音听阈检查"}, {"k": "C", "t": "电话咨询回访"}, {"k": "D", "t": "真耳分析"}], "a": "C", "multi": false, "exp": {"title": "考察点：远程验配/偏远地区", "text": "正确答案：C）电话咨询回访\n\n家住偏僻地区不便往返的患者，可采用远程助听器验配/调试(联网远程调机)或遥控配件，减少往返成本。"}}, {"n": 36, "s": "在整个成人语言康复训练过程中，分类训练所占时间一般（    ）。", "o": [{"k": "A", "t": "5～8 分钟"}, {"k": "B", "t": "8～10 分钟"}, {"k": "C", "t": "10～15 分钟"}, {"k": "D", "t": "15～18 分钟"}], "a": "C", "multi": false, "exp": {"title": "考察点：助听器听觉康复/适应", "text": "正确答案：C）10～15 分钟\n\n助听器适应性训练：成人包括心理适应、改变原有听觉习惯的适应、佩戴时间的适应、对声音强度的适应、佩戴环境的适应；儿童初始佩戴应从『安静』环境开始，循序渐进再到嘈杂环境。"}}, {"n": 37, "s": "目前已发现的耳毒性药物达（    ）。", "o": [{"k": "A", "t": "30 多种"}, {"k": "B", "t": "50 多种"}, {"k": "C", "t": "70 多种"}, {"k": "D", "t": "100 多种"}], "a": "D", "multi": false, "exp": {"title": "考察点：耳毒性药物", "text": "正确答案：D）100 多种\n\n耳毒性药物指对内耳(耳蜗/前庭)有损伤的药物，如氨基糖苷类抗生素(链霉素、庆大霉素)、部分利尿剂、抗肿瘤药等。小儿耳聋中药物中毒是常见后天原因之一。"}}, {"n": 38, "s": "《消费者权益保护法》规定了消费者的（    ）权力。", "o": [{"k": "A", "t": "6 项"}, {"k": "B", "t": "7 项"}, {"k": "C", "t": "8 项"}, {"k": "D", "t": "9 项"}], "a": "D", "multi": false, "exp": {"title": "考察点：消费者权益保护法", "text": "正确答案：D）9 项\n\n《消费者权益保护法》规定消费者享有九项权利：①人身、财产安全权；②知悉真实情况权(知情权)；③自主选择权；④公平交易权；⑤依法求偿权(赔偿权)；⑥依法结社权(成立维护自身权益的社会团体)；⑦获得消费和消费者权益保护知识权；⑧人格尊严、民族风俗习惯受尊重权；⑨监督批评权(对商品、服务及消费者权益保护工作的监督)。"}}, {"n": 39, "s": "小儿理解语言意义的关键期是（    ）。", "o": [{"k": "A", "t": "1-3 个月"}, {"k": "B", "t": "4-6 个月"}, {"k": "C", "t": "6-8 个月"}, {"k": "D", "t": "8-10 个月"}], "a": "D", "multi": false, "exp": {"title": "考察点：语言关键期", "text": "正确答案：D）8-10 个月\n\n小儿理解语言意义、口语发展、掌握汉语的三个关键期约在 8~10 个月、1 岁半、5 岁半（各教材表述差异，以题中数值为准）。"}}, {"n": 40, "s": "新生儿首次听力筛查的时间一般在出生后多长时间内完成（    ）。", "o": [{"k": "A", "t": "半个月"}, {"k": "B", "t": "一个月"}, {"k": "C", "t": "72 小时"}, {"k": "D", "t": "一周内"}], "a": "C", "multi": false, "exp": {"title": "考察点：新生儿筛查", "text": "正确答案：C）72 小时\n\n新生儿首次听力筛查应在出生后 72 小时内完成。"}}, {"n": 41, "s": "声导抗正常鼓室图一般为什么形态（     ）。", "o": [{"k": "A", "t": "B 型"}, {"k": "B", "t": "C 型"}, {"k": "C", "t": "Ad 型"}, {"k": "D", "t": "A 型"}], "a": "D", "multi": false, "exp": {"title": "考察点：鼓室图", "text": "正确答案：D）A 型\n\n声导抗正常鼓室图一般呈 A 型。探测音常用 226Hz/678Hz/1000Hz；6 个月以下小儿用 1000Hz。鼓室图可检测中耳积液、咽鼓管通畅度、外耳道是否堵塞等情况。"}}, {"n": 42, "s": "以下药物中，不会导致胎儿感音神经性聋的有（    ）。", "o": [{"k": "A", "t": "抗糖尿病药物降糖灵"}, {"k": "B", "t": "链霉素"}, {"k": "C", "t": "庆大霉素"}, {"k": "D", "t": "头孢曲松"}], "a": "D", "multi": false, "exp": {"title": "考察点：感音神经性聋", "text": "正确答案：D）头孢曲松\n\n感音神经性聋可细分为耳蜗性聋与蜗后性聋。"}}, {"n": 43, "s": "噪声性听力损失除了听力损失症状外，常伴随出现下列（    ）症状。", "o": [{"k": "A", "t": "耳痛"}, {"k": "B", "t": "眩晕"}, {"k": "C", "t": "耳鸣"}, {"k": "D", "t": "头痛"}], "a": "C", "multi": false, "exp": {"title": "考察点：噪声性聋", "text": "正确答案：C）耳鸣\n\n噪声性听力损失除听力下降外常伴耳鸣。"}}, {"n": 44, "s": "70dB HL 的听力损失属于（    ）。", "o": [{"k": "A", "t": "轻度"}, {"k": "B", "t": "中度"}, {"k": "C", "t": "重度"}, {"k": "D", "t": "极重度"}], "a": "C", "multi": false, "exp": {"title": "考察点：听力损失分级", "text": "正确答案：C）重度\n\n听力损失分级（WHO）：正常≤25，轻度 26~40，中度 41~60，重度 61~80，极重度≥81。70 dB HL 属重度听力损失。"}}, {"n": 45, "s": "中频声音是指频率在（    ）左右的声音。", "o": [{"k": "A", "t": "100 Hz"}, {"k": "B", "t": "500 Hz"}, {"k": "C", "t": "1000 Hz"}, {"k": "D", "t": "5000 Hz"}], "a": "C", "multi": false, "exp": {"title": "考察点：声波特性", "text": "正确答案：C）1000 Hz\n\n声波在空气中向三维空间呈膨胀球体传播。低频波长大于头部直径时两耳间几乎无头影衰减；高频波长小于头部直径时受头部衍射/头影作用而削弱。"}}, {"n": 46, "s": "音乐上（    ）为一个倍频程，含（    ）在对数上等分的半音，每个半音又被 对数等分为 100 分，这样，一个倍频程含有（    ）。", "o": [{"k": "A", "t": "每一度、10 个、1000 分"}, {"k": "B", "t": "每八度、12 个、1200 分"}, {"k": "C", "t": "每十度、8 个、800 分"}, {"k": "D", "t": "每八度、5 个、500 分"}], "a": "B", "multi": false, "exp": {"title": "考察点：倍频程", "text": "正确答案：B）每八度、12 个、1200 分\n\n一个倍频程=每八度=12 个半音=1200 音分。两个倍频程之间频率比为 2:1。"}}, {"n": 47, "s": "阻尼子阻尼值最大的颜色为（    ）。", "o": [{"k": "A", "t": "白色"}, {"k": "B", "t": "棕色"}, {"k": "C", "t": "绿色"}, {"k": "D", "t": "黄色"}], "a": "D", "multi": false, "exp": {"title": "考察点：机械振动", "text": "正确答案：D）黄色\n\n实际自由振动必为阻尼振动（幅度越来越小）；受迫振动的频率由外界策动力频率决定；受迫振动稳定后频率与自身物理条件无关。"}}, {"n": 48, "s": "影像检查可以帮助医生了解患者的相关器官的解剖结构和生理功能，下列（    ）影像检查会容易损坏助听器。", "o": [{"k": "A", "t": "超声波"}, {"k": "B", "t": "MRI（核磁共振）"}, {"k": "C", "t": "CT 脑部扫描"}, {"k": "D", "t": "CT 动脉造影"}], "a": "B", "multi": false, "exp": {"title": "考察点：影像检查/助听器防护", "text": "正确答案：B）MRI（核磁共振）\n\n助听器含磁性元件与电子电路，MRI(核磁共振)的强磁场易损坏助听器；行 MRI 等影像检查前应取下助听器。"}}, {"n": 49, "s": "耳聋基因检测对于患者本身最大实用意义是（    ）。", "o": [{"k": "A", "t": "查明原因"}, {"k": "B", "t": "未来听力变化预期判断 ，干预方法及平时注意事项参考"}, {"k": "C", "t": "治愈听力障碍"}, {"k": "D", "t": "避免听力进一步下降"}], "a": "B", "multi": false, "exp": {"title": "考察点：SLC26A4基因", "text": "正确答案：B）未来听力变化预期判断 ，干预方法及平时注意事项参考\n\nSLC26A4 基因隐性遗传，父母双方均为携带者时子女发病概率 25%。"}}, {"n": 50, "s": "新生儿首次听力筛查的时间一般在出生后（    ）内完成。", "o": [{"k": "A", "t": "半个月"}, {"k": "B", "t": "一个月"}, {"k": "C", "t": "72 小时"}, {"k": "D", "t": "一周内"}], "a": "C", "multi": false, "exp": {"title": "考察点：新生儿筛查", "text": "正确答案：C）72 小时\n\n新生儿首次听力筛查应在出生后 72 小时内完成。"}}, {"n": 51, "s": "下列(    )客观检测主要用来判断中耳是否存在病变情况。", "o": [{"k": "A", "t": "OAE"}, {"k": "B", "t": "声导抗"}, {"k": "C", "t": "ABR"}, {"k": "D", "t": "ASSR"}], "a": "B", "multi": false, "exp": {"title": "考察点：中耳传声", "text": "正确答案：B）声导抗\n\n中耳的主要作用是把来自外耳的声能传递到耳蜗淋巴液（经听小骨放大）。"}}, {"n": 52, "s": "8 个月龄儿童建议采用下列（    ）主观听力测试方法。", "o": [{"k": "A", "t": "行为观察测听"}, {"k": "B", "t": "视觉强化测听"}, {"k": "C", "t": "游戏测听"}, {"k": "D", "t": "听声放物测听"}], "a": "B", "multi": false, "exp": {"title": "考察点：行为测听法", "text": "正确答案：B）视觉强化测听\n\n小儿行为测听是主观听力测试方法，包括：小儿行为观察反应测听、视觉强化定向反应测听、游戏测听，按小儿年龄选用。"}}, {"n": 53, "s": "先天性隐性遗传听力损失的特点是（    ）。", "o": [{"k": "A", "t": "父母双方均聋"}, {"k": "B", "t": "父母双方有一个为聋"}, {"k": "C", "t": "父母双方不聋， 但有一个是携带者"}, {"k": "D", "t": "父母双方不聋， 但均为携带者"}], "a": "D", "multi": false, "exp": {"title": "考察点：SLC26A4基因", "text": "正确答案：D）父母双方不聋， 但均为携带者\n\nSLC26A4 基因隐性遗传，父母双方均为携带者时子女发病概率 25%。"}}, {"n": 54, "s": "小儿口语发展的关键期（    ）。", "o": [{"k": "A", "t": "5-7 个月"}, {"k": "B", "t": "8-10 个月"}, {"k": "C", "t": "10-12 个月"}, {"k": "D", "t": "1 岁半左右"}], "a": "D", "multi": false, "exp": {"title": "考察点：关键期表现", "text": "正确答案：D）1 岁半左右\n\n3 岁半小儿发展的关键期表现：注意力发展、独立性开始建立、动手能力发展成熟。"}}, {"n": 55, "s": "正常小儿在(    )年龄段对40-60dB SPL 较轻的声音能做出持续可信的反 应，听到母亲声音停止活动，如果这个年龄段还没的寻找声源反应，孩子往往存 在着听力损失。", "o": [{"k": "A", "t": "0-3 个月"}, {"k": "B", "t": "2-4 个月"}, {"k": "C", "t": "4-7 个月"}, {"k": "D", "t": "7-10 个月"}], "a": "C", "multi": false, "exp": {"title": "考察点：婴儿反应月龄", "text": "正确答案：C）4-7 个月\n\n正常小儿 4~7 个月对 40~60 dB SPL 的较轻声音能做出持续可信的反应，听到母亲声音会停止活动；若此月龄仍无寻找声源反应，提示听力损失可能。"}}, {"n": 56, "s": "成人语后聋患者听阈达到（    ）程度建议选择助听器。", "o": [{"k": "A", "t": "大于等于 21Db HL"}, {"k": "B", "t": "大于等于 31dB HL"}, {"k": "C", "t": "大于等于 41dB HL"}, {"k": "D", "t": "大于等于 51dB HL"}], "a": "C", "multi": false, "exp": {"title": "考察点：响度单位", "text": "正确答案：C）大于等于 41dB HL\n\n纯音听力零级是统计正常的可听阈，单位 dB HL(听力级)；声压级单位 dB SPL。"}}, {"n": 57, "s": "峰压是指声导抗出现峰值时的（    ）。", "o": [{"k": "A", "t": "鼓膜压力"}, {"k": "B", "t": "鼓室压力"}, {"k": "C", "t": "外耳道容积"}, {"k": "D", "t": "声导抗出现峰值时的数值"}], "a": "B", "multi": false, "exp": {"title": "考察点：声导抗", "text": "正确答案：B）鼓室压力\n\n声导抗测试是声阻抗测试与声导纳测试的合称，用于客观评估中耳功能。"}}, {"n": 58, "s": "鼓室图 A 型图的峰压出现在(    )daPa 范围内。", "o": [{"k": "A", "t": "0 至+100"}, {"k": "B", "t": "-50 至+50"}, {"k": "C", "t": "-100 至+100"}, {"k": "D", "t": "-200 至+100"}], "a": "C", "multi": false, "exp": {"title": "考察点：鼓室图", "text": "正确答案：C）-100 至+100\n\n声导抗正常鼓室图一般呈 A 型。探测音常用 226Hz/678Hz/1000Hz；6 个月以下小儿用 1000Hz。鼓室图可检测中耳积液、咽鼓管通畅度、外耳道是否堵塞等情况。"}}, {"n": 59, "s": "鼓室图测试时，对 6 个月下的小儿用的探测音是(    )。", "o": [{"k": "A", "t": "1000Hz"}, {"k": "B", "t": "226Hz"}, {"k": "C", "t": "678Hz"}, {"k": "D", "t": "其他"}], "a": "A", "multi": false, "exp": {"title": "考察点：鼓室图", "text": "正确答案：A）1000Hz\n\n声导抗正常鼓室图一般呈 A 型。探测音常用 226Hz/678Hz/1000Hz；6 个月以下小儿用 1000Hz。鼓室图可检测中耳积液、咽鼓管通畅度、外耳道是否堵塞等情况。"}}, {"n": 60, "s": "以下有关游戏测听的做法错误的是（    ）。", "o": [{"k": "A", "t": "为能分别得到小儿两耳的听力，在训练时应尽可能的给小儿佩戴耳机"}, {"k": "B", "t": "为消除小儿紧张情绪，可先将耳机戴在自己头上或妈妈（爸爸）头上示范后，再给小儿戴上"}, {"k": "C", "t": "如仍不能说服小儿佩戴耳机，只能采取声场给声的形式，得到的是双耳中 的好耳听力"}, {"k": "D", "t": "整个训练可降低强度直到小儿完全理解"}], "a": "D", "multi": false, "exp": {"title": "考察点：分龄测听法", "text": "正确答案：D）整个训练可降低强度直到小儿完全理解\n\n按年龄选择行为测听法：4~6 月听觉行为观察；8 月左右视觉强化测听；3 岁以上游戏测听。"}}, {"n": 61, "s": "幼儿听觉行为观察测听法主要适合于（     ）以内的儿童。", "o": [{"k": "A", "t": "3 个月"}, {"k": "B", "t": "6 个月"}, {"k": "C", "t": "1 岁"}, {"k": "D", "t": "2 岁半至 3 岁"}], "a": "B", "multi": false, "exp": {"title": "考察点：分龄测听法", "text": "正确答案：B）6 个月\n\n按年龄选择行为测听法：4~6 月听觉行为观察；8 月左右视觉强化测听；3 岁以上游戏测听。"}}, {"n": 62, "s": "4～7 个月对（    ）的反应会不完全转向声源。", "o": [{"k": "A", "t": "80～90dB SPL"}, {"k": "B", "t": "40～60dB SPL"}, {"k": "C", "t": "20～50dB SPL"}, {"k": "D", "t": "30～40dB SPL"}], "a": "B", "multi": false, "exp": {"title": "考察点：婴儿反应月龄", "text": "正确答案：B）40～60dB SPL\n\n正常小儿 4~7 个月对 40~60 dB SPL 的较轻声音能做出持续可信的反应，听到母亲声音会停止活动；若此月龄仍无寻找声源反应，提示听力损失可能。"}}, {"n": 63, "s": "言语测听是用（    ）作为刺激声来检查被试者的言语听阈及言语识别能力，是听力测试的重要方法之一。", "o": [{"k": "A", "t": "言语信号"}, {"k": "B", "t": "言语噪声"}, {"k": "C", "t": "纯音信号"}, {"k": "D", "t": "短纯音"}], "a": "A", "multi": false, "exp": {"title": "考察点：言语测听", "text": "正确答案：A）言语信号\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。"}}, {"n": 64, "s": "双耳言语识别率得分若较单耳得分(    )，说明助听器效果达到优化。", "o": [{"k": "A", "t": "下降"}, {"k": "B", "t": "上升"}, {"k": "C", "t": "不变"}, {"k": "D", "t": "都可以"}], "a": "B", "multi": false, "exp": {"title": "考察点：言语测听", "text": "正确答案：B）上升\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。"}}, {"n": 65, "s": "不适响度级的英文缩写是（    ）。", "o": [{"k": "A", "t": "MCL"}, {"k": "B", "t": "UCL"}, {"k": "C", "t": "PT"}, {"k": "D", "t": "PA"}], "a": "B", "multi": false, "exp": {"title": "考察点：音色", "text": "正确答案：B）UCL\n\n两个声音响度、音调相同时，靠『音色』区分。音色由谐波/频谱包络决定。"}}, {"n": 66, "s": "耳廓异常注射耳样材料时（    ）。", "o": [{"k": "A", "t": "只要注满即可"}, {"k": "B", "t": "边注射边退出，注射器头不离膏体"}, {"k": "C", "t": "注射器头不能埋在膏体中"}, {"k": "D", "t": "要快速推注"}], "a": "B", "multi": false, "exp": {"title": "考察点：耳廓附着", "text": "正确答案：B）边注射边退出，注射器头不离膏体\n\n耳廓借韧带、肌肉、软骨、皮肤附着于头颅侧面，主要起集声与声源定位作用。"}}, {"n": 67, "s": "耳廓异常印模取出耳样的时间为 （    ）。", "o": [{"k": "A", "t": "耳样材料 2/3 凝固状态"}, {"k": "B", "t": "耳样材料凝固后即可取出"}, {"k": "C", "t": "耳样材料凝固后 5 分钟取出"}, {"k": "D", "t": "耳样材料凝固后 10 分钟取出"}], "a": "B", "multi": false, "exp": {"title": "考察点：耳廓附着", "text": "正确答案：B）耳样材料凝固后即可取出\n\n耳廓借韧带、肌肉、软骨、皮肤附着于头颅侧面，主要起集声与声源定位作用。"}}, {"n": 68, "s": "无法对外耳道异常患者取印模的情况是（    ）。", "o": [{"k": "A", "t": "乳突手术后"}, {"k": "B", "t": "外耳道闭锁"}, {"k": "C", "t": "隐耳"}, {"k": "D", "t": "儿童"}], "a": "B", "multi": false, "exp": {"title": "考察点：外耳道长度", "text": "正确答案：B）外耳道闭锁\n\n成人外耳道长约 2.5 cm（外1/3软骨部，内2/3骨部）。"}}, {"n": 69, "s": "患外耳道疾病的人（    ）。", "o": [{"k": "A", "t": "较多"}, {"k": "B", "t": "不多"}, {"k": "C", "t": "较少"}, {"k": "D", "t": "很少"}], "a": "A", "multi": false, "exp": {"title": "考察点：外耳道长度", "text": "正确答案：A）较多\n\n成人外耳道长约 2.5 cm（外1/3软骨部，内2/3骨部）。"}}, {"n": 70, "s": "我国采用了国际电工委员会助听器数据测量标准，助听器电声特性的测量方法符合（    ）标准。", "o": [{"k": "A", "t": "GB6658"}, {"k": "B", "t": "GB6657"}, {"k": "C", "t": "GB7263"}, {"k": "D", "t": "GB6659"}], "a": "B", "multi": false, "exp": {"title": "考察点：助听器检验标准", "text": "正确答案：B）GB6657\n\n助听器质量标准：国际电工委员会(IEC)标准《助听器交货时质量检验的性能测量》为 IEC 118-7；我国采用 GB6657 作为助听器电声特性测量标准。"}}, {"n": 71, "s": "平均听力损失程度在 95DBHL，适合选下列哪种功率助听器（    ）。（以下 数据为堵耳模拟器中获得数据）", "o": [{"k": "A", "t": "MPO 小于 105dB SPL"}, {"k": "B", "t": "MPO 105-124dB SPL"}, {"k": "C", "t": "MPO 125-135dB SPL"}, {"k": "D", "t": "MPO 大于 135dB SPL"}], "a": "D", "multi": false, "exp": {"title": "考察点：听力损失分级", "text": "正确答案：D）MPO 大于 135dB SPL\n\n听力损失分级（WHO）：正常≤25，轻度 26~40，中度 41~60，重度 61~80，极重度≥81。70 dB HL 属重度听力损失。"}}, {"n": 72, "s": "参考测试增益状态需要通过调节助听器增益来设置，一般要求在参考测试频 率处的声输出恰好为 OSPL90 以下（    ）dB。", "o": [{"k": "A", "t": "5 dB"}, {"k": "B", "t": "正负 5 dB"}, {"k": "C", "t": "15 dB（允许上下 1 dB 误差）"}, {"k": "D", "t": "正负 10 dB"}], "a": "C", "multi": false, "exp": {"title": "考察点：参考测试频率", "text": "正确答案：C）15 dB（允许上下 1 dB 误差）\n\n参考测试频率一般选 2500 Hz 和 1600 Hz 两个；2500Hz 反映高频特性。"}}, {"n": 73, "s": "频率响应曲线可以是声输出、增益等声学参数随频率变化的函数曲线， 纵坐 标为线性 dB 刻度，横坐标为对数频率刻度，在绘图时横坐标上 10 倍频程长度对应纵坐标上（    ）dB 范围的高度。", "o": [{"k": "A", "t": "20"}, {"k": "B", "t": "30"}, {"k": "C", "t": "40"}, {"k": "D", "t": "50"}], "a": "D", "multi": false, "exp": {"title": "考察点：纯音测听频率范围", "text": "正确答案：D）50\n\n常规纯音测听频率范围约 125~8000 Hz，分倍频程测听。"}}, {"n": 74, "s": "国际标准规定的对助听器非线性失真度的测量仅局限于（    ）。", "o": [{"k": "A", "t": "互调失真"}, {"k": "B", "t": "压缩失真"}, {"k": "C", "t": "移频失真"}, {"k": "D", "t": "谐波失真"}], "a": "D", "multi": false, "exp": {"title": "考察点：助听器失真", "text": "正确答案：D）谐波失真\n\n助听器失真主要包括谐波失真和互调失真；削峰/压缩等是常见非线性失真源。"}}, {"n": 75, "s": "磁感音线圈功能开启时，直接输入助听器的声音信号源是（    ）。", "o": [{"k": "A", "t": "声波能量信号"}, {"k": "B", "t": "蓝牙无线信号"}, {"k": "C", "t": "磁场能量信号"}, {"k": "D", "t": "射频能量信号"}], "a": "C", "multi": false, "exp": {"title": "考察点：磁感电感", "text": "正确答案：C）磁场能量信号\n\n磁感电感线圈靠『磁场能量信号』从电话/环路系统拾取声音。"}}, {"n": 76, "s": "压缩放大助听器的增益随输入声强度改变而改变，为了满足对助听器电声学特性质量检测，多数厂家应用（    ）dBsp 较低输入声级来测量增益。", "o": [{"k": "A", "t": "30"}, {"k": "B", "t": "40"}, {"k": "C", "t": "50"}, {"k": "D", "t": "60"}], "a": "C", "multi": false, "exp": {"title": "考察点：压缩/增益", "text": "正确答案：C）50\n\n压缩放大增益随输入声强而改变；测增益一般在较低输入声级(如 50dB SPL)下进行。MPO 应设在 MCL 与 UCL 之间。"}}, {"n": 77, "s": "人们在生活中聆听是，平均大约有（    ）感兴趣的声音不在正前方。", "o": [{"k": "A", "t": "10%"}, {"k": "B", "t": "20%"}, {"k": "C", "t": "30%"}, {"k": "D", "t": "40%"}], "a": "B", "multi": false, "exp": {"title": "考察点：方向性模式", "text": "正确答案：B）20%\n\n方向性麦克风可提升信噪比；正前方（声源方向）声音不会被方向性处理降低强度，后方/侧方声音会被衰减。"}}, {"n": 78, "s": "安静环境适合下列（    ）方向性模式。", "o": [{"k": "A", "t": "心形模式"}, {"k": "B", "t": "超心形模式"}, {"k": "C", "t": "超聚集模式"}, {"k": "D", "t": "全向形模式"}], "a": "D", "multi": false, "exp": {"title": "考察点：方向性模式", "text": "正确答案：D）全向形模式\n\n方向性麦克风可提升信噪比；正前方（声源方向）声音不会被方向性处理降低强度，后方/侧方声音会被衰减。"}}, {"n": 79, "s": "目前市场上绝大多数助听器最常用的麦克风属于（    ）种类。", "o": [{"k": "A", "t": "电磁式"}, {"k": "B", "t": "压电式"}, {"k": "C", "t": "驻级体电容式"}, {"k": "D", "t": "陶瓷式"}], "a": "C", "multi": false, "exp": {"title": "考察点：麦克风类型", "text": "正确答案：C）驻级体电容式\n\n助听器麦克风按工作原理分：电磁动圈式、压电陶瓷式、驻极体式。"}}, {"n": 80, "s": "小儿发生听力问题，需要做母亲孕产史采集，下列(    )不属于孕产史采集内容", "o": [{"k": "A", "t": "孕期生病用药情况"}, {"k": "B", "t": "新生儿是否有缺氧、核黄疸现象"}, {"k": "C", "t": "产程是否有窘迫，产后婴儿得分"}, {"k": "D", "t": "孕期营养食谱"}], "a": "D", "multi": false, "exp": {"title": "考察点：孕产史采集", "text": "正确答案：D）孕期营养食谱\n\n孕产史采集关注孕期疾病、用药、接触史、分娩情况等与胎儿听力相关的因素；『孕期营养食谱』不属于孕产史采集的核心内容。"}}, {"n": 81, "s": "刷频器一般位于（    ）。", "o": [{"k": "A", "t": "教室入口"}, {"k": "B", "t": "教室讲桌上"}, {"k": "C", "t": "教师身上"}, {"k": "D", "t": "学生身上"}], "a": "A", "multi": false, "exp": {"title": "考察点：刷频器/编程钮", "text": "正确答案：A）教室入口\n\n助听器刷频器(编程口/调节钮)一般位于助听器外壳或面板上，用于连接调机与音量/程序调节。"}}, {"n": 82, "s": "适合移频的听损程度及听力图类型（    ）。", "o": [{"k": "A", "t": "重度平坦型"}, {"k": "B", "t": "低频轻度、中高频中度缓降型"}, {"k": "C", "t": "低、中频中度、 高频极重度听损的下降型"}, {"k": "D", "t": "低频重度、中高频中度的上升型听力"}], "a": "C", "multi": false, "exp": {"title": "考察点：移频", "text": "正确答案：C）低、中频中度、 高频极重度听损的下降型\n\n移频技术把听障者难听到的『高频』声音移频到可听的『中低频』区域。"}}, {"n": 83, "s": "语法知识主要由两部分组成：造句法和（    ）。", "o": [{"k": "A", "t": "字法"}, {"k": "B", "t": "音法"}, {"k": "C", "t": "词法"}, {"k": "D", "t": "句法"}], "a": "C", "multi": false, "exp": {"title": "考察点：语法/词法", "text": "正确答案：C）词法\n\n语法知识主要由造句法(句法)与词法两部分组成；词法研究词的构成与变化，句法研究句子的结构。"}}, {"n": 84, "s": "有关 BICROS 调试理解正确的是（    ）。", "o": [{"k": "A", "t": "增益要兼顾双侧听损情况"}, {"k": "B", "t": "调试要考虑差耳言语识别率"}, {"k": "C", "t": "调试考虑差耳听力情况"}, {"k": "D", "t": "调试通常考虑好耳听力情况"}], "a": "D", "multi": false, "exp": {"title": "考察点：CROS/BICROS", "text": "正确答案：D）调试通常考虑好耳听力情况\n\nCROS 信号对侧交联式，适合单侧重度聋；BICROS 双侧交联式，适合一侧正常/轻中度+另一侧极重度。CROS/BICROS 都不能同时放大差耳、仍为单声道感觉、不能减小头影效应。"}}, {"n": 85, "s": "3 岁以内儿童做封闭式言语测试，需要受试者如何配合（    ）。", "o": [{"k": "A", "t": "要据发声描述，指认听到的词汇对应卡片"}, {"k": "B", "t": "解释听到词汇对应的卡片"}, {"k": "C", "t": "复述所有听到的词（听不懂可以猜）"}, {"k": "D", "t": "只复述觉得正确的词"}], "a": "A", "multi": false, "exp": {"title": "考察点：言语测听", "text": "正确答案：A）要据发声描述，指认听到的词汇对应卡片\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。"}}, {"n": 86, "s": "鼓膜完整时的咽鼓管功能测试，先做一次鼓室图，再给患者做吹张，此时再做鼓室图， 如果咽鼓管功能正常，峰压点应该向(    )方向移动。", "o": [{"k": "A", "t": "负压"}, {"k": "B", "t": "正压"}, {"k": "C", "t": "不变"}, {"k": "D", "t": "都可能"}], "a": "B", "multi": false, "exp": {"title": "考察点：鼓室/中耳组成", "text": "正确答案：B）正压\n\n中耳包括鼓室、咽鼓管、鼓窦、乳突（茎突属颞骨不属于中耳腔）。"}}, {"n": 87, "s": "助听后言语识别率达到（    ）范围，助听效果为适合。", "o": [{"k": "A", "t": "44%-60%"}, {"k": "B", "t": "70%-80%"}, {"k": "C", "t": "80%-90%"}, {"k": "D", "t": "大于 90%"}], "a": "C", "multi": false, "exp": {"title": "考察点：言语测听", "text": "正确答案：C）80%-90%\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。"}}, {"n": 88, "s": "声场环境测听，受试者一般取坐位，校准参考点位置说明正确是（    ）。", "o": [{"k": "A", "t": "距离扬声器 50CM，同扬声器中点等高"}, {"k": "B", "t": "受试者置侧后方 50CM 处，距扬声器 1 米"}, {"k": "C", "t": "取受试者两侧外耳道口连线中点，此点距扬声器 1M，同扬声器等高"}, {"k": "D", "t": "距离扬声器 5OCM，受试者耳道口位置"}], "a": "C", "multi": false, "exp": {"title": "考察点：分龄测听法", "text": "正确答案：C）取受试者两侧外耳道口连线中点，此点距扬声器 1M，同扬声器等高\n\n按年龄选择行为测听法：4~6 月听觉行为观察；8 月左右视觉强化测听；3 岁以上游戏测听。"}}, {"n": 89, "s": "开 √型通气孔会使助听器高频信号损失（    ）。", "o": [{"k": "A", "t": "3dB"}, {"k": "B", "t": "4dB"}, {"k": "C", "t": "5dB"}, {"k": "D", "t": "6dB"}], "a": "D", "multi": false, "exp": {"title": "考察点：移频", "text": "正确答案：D）6dB\n\n移频技术把听障者难听到的『高频』声音移频到可听的『中低频』区域。"}}, {"n": 90, "s": "菜花耳属于（    ）。", "o": [{"k": "A", "t": "先天性耳廓畸形"}, {"k": "B", "t": "后天性耳廓畸形"}, {"k": "C", "t": "遗传性耳廓畸形"}, {"k": "D", "t": "不属于耳廓畸形"}], "a": "B", "multi": false, "exp": {"title": "考察点：菜花耳", "text": "正确答案：B）后天性耳廓畸形\n\n菜花耳属后天性耳廓畸形（常因外伤致软骨膜炎）。"}}, {"n": 91, "s": "DAI 是指（    ）。", "o": [{"k": "A", "t": "FM 系统"}, {"k": "B", "t": "直接音频输入"}, {"k": "C", "t": "方向性麦克风"}, {"k": "D", "t": "直连式助听器"}], "a": "B", "multi": false, "exp": {"title": "考察点：DAI", "text": "正确答案：B）直接音频输入\n\nDAI(Direct Audio Input)直接音频输入；FM 系统用无线将信号传入助听器。麦克风与 FM 信号音量调节位置常在『麦克风衰减』。"}}, {"n": 92, "s": "双侧交联式助听器的英文缩写是（    ）。", "o": [{"k": "A", "t": "CROS"}, {"k": "B", "t": "BICROS"}, {"k": "C", "t": "AGCI"}, {"k": "D", "t": "WDRC"}], "a": "B", "multi": false, "exp": {"title": "考察点：CROS/BICROS", "text": "正确答案：B）BICROS\n\nCROS 信号对侧交联式，适合单侧重度聋；BICROS 双侧交联式，适合一侧正常/轻中度+另一侧极重度。CROS/BICROS 都不能同时放大差耳、仍为单声道感觉、不能减小头影效应。"}}, {"n": 93, "s": "“助残日”时每年（    ）的第三个星期日。", "o": [{"k": "A", "t": "二月"}, {"k": "B", "t": "三月"}, {"k": "C", "t": "四月"}, {"k": "D", "t": "五月"}], "a": "D", "multi": false, "exp": {"title": "考察点：助残日", "text": "正确答案：D）五月\n\n全国助残日定在每年五月第三个星期日。"}}, {"n": 94, "s": "助听器验配师的设备工具是比较高档的精密仪器，仪器的（    ）是工作认真负责的一部分，如果仪器某一个部位出现问题，将会给工作带来损失。", "o": [{"k": "A", "t": "使用"}, {"k": "B", "t": "保护"}, {"k": "C", "t": "保养"}, {"k": "D", "t": "校配"}], "a": "B", "multi": false, "exp": {"title": "考察点：爱护精密仪器设备", "text": "正确答案：B）保护\n\n助听器验配师的设备工具属高档精密仪器，应加倍爱护、正确保养，以延长使用寿命；仪器的保护是工作认真负责的体现，一处故障就会给工作带来损失。对应『爱护设备/工具』的职业道德要求。"}}, {"n": 95, "s": "无任何堵塞的外耳道主要在（    ）频率范围内有共振增益。", "o": [{"k": "A", "t": "0.5-1KHZ"}, {"k": "B", "t": "1-2KHZ"}, {"k": "C", "t": "2.4-3.4KHZ"}, {"k": "D", "t": "4-5KHZ"}], "a": "C", "multi": false, "exp": {"title": "考察点：纯音测听频率范围", "text": "正确答案：C）2.4-3.4KHZ\n\n常规纯音测听频率范围约 125~8000 Hz，分倍频程测听。"}}, {"n": 96, "s": "当测试耳的言语信号级(测试强度)比非测试耳的纯音0.5，1k，2kHz 平均骨导听阈大     （    ） 时，应在非测试耳加掩蔽。", "o": [{"k": "A", "t": "20dB"}, {"k": "B", "t": "30dB"}, {"k": "C", "t": "40dB"}, {"k": "D", "t": "50dB"}], "a": "C", "multi": false, "exp": {"title": "考察点：掩蔽", "text": "正确答案：C）40dB\n\n掩蔽：给非测试耳噪声防其参与。测试耳言语信号级(强度)比非测试耳纯音 0.5/1/2kHz 平均骨导听阈大 40dB 时应加掩蔽。插入式耳机耳间衰减最大。"}}, {"n": 97, "s": "成人的外耳道中，骨部约占其（    ）。", "o": [{"k": "A", "t": "外 1/3"}, {"k": "B", "t": "外 2/3"}, {"k": "C", "t": "内 1/3"}, {"k": "D", "t": "内 2/3"}], "a": "D", "multi": false, "exp": {"title": "考察点：外耳道长度", "text": "正确答案：D）内 2/3\n\n成人外耳道长约 2.5 cm（外1/3软骨部，内2/3骨部）。"}}, {"n": 98, "s": "平均听力损失程度在 65DBHL，适合选下列哪种功率助听器（    ）。（以下数据为堵耳 模拟器中获得数据）", "o": [{"k": "A", "t": "MPO 小于 105dB SPL"}, {"k": "B", "t": "MPO 105-124dB SPL"}, {"k": "C", "t": "MPO 125-135dB SPL"}, {"k": "D", "t": "MPO 大于 135dB SPL"}], "a": "C", "multi": false, "exp": {"title": "考察点：听力损失分级", "text": "正确答案：C）MPO 125-135dB SPL\n\n听力损失分级（WHO）：正常≤25，轻度 26~40，中度 41~60，重度 61~80，极重度≥81。70 dB HL 属重度听力损失。"}}, {"n": 99, "s": "中耳炎在欠发达地区小儿发病率较高，其发病早期可引起（    ）性耳聋，慢性中耳炎经 久不愈，亦可导致感音神经性聋。", "o": [{"k": "A", "t": "感音神经性"}, {"k": "B", "t": "混合性"}, {"k": "C", "t": "传导性"}, {"k": "D", "t": "功能性"}], "a": "C", "multi": false, "exp": {"title": "考察点：小儿后天性聋", "text": "正确答案：C）传导性\n\n小儿后天性聋常见原因：各种传染性疾病、药物(耳毒性药)中毒、外伤、中耳炎；欠发达国家 0~17 岁后天性聋主因是中耳炎。"}}, {"n": 100, "s": "对于患有（    ）的孩子要多加照顾，不要出现跌倒摔伤导致听力损失加重的情况。", "o": [{"k": "A", "t": "感冒"}, {"k": "B", "t": "耳硬化症"}, {"k": "C", "t": "中耳炎"}, {"k": "D", "t": "大前庭水管综合征"}], "a": "D", "multi": false, "exp": {"title": "考察点：听力损失分级", "text": "正确答案：D）大前庭水管综合征\n\n听力损失分级（WHO）：正常≤25，轻度 26~40，中度 41~60，重度 61~80，极重度≥81。70 dB HL 属重度听力损失。"}}, {"n": 101, "s": "接打手机效果最佳方式是（    ）。", "o": [{"k": "A", "t": "使用 2.4G 无线蓝牙程序"}, {"k": "B", "t": "手机受话和助听器麦克风接近"}, {"k": "C", "t": "T 感线圈程序"}, {"k": "D", "t": "声学电话程序"}], "a": "A", "multi": false, "exp": {"title": "考察点：手机兼容/接打电话", "text": "正确答案：A）使用 2.4G 无线蓝牙程序\n\n助听器接打手机效果最佳方式：开启电感(T挡)或与手机/蓝牙配件连接，减少语音信号干扰、提高接听清晰度。"}}, {"n": 102, "s": "指导听障儿童进行选择性听取练习时，被试者的位置一般选择测试环境的（    ）。", "o": [{"k": "A", "t": "最近处"}, {"k": "B", "t": "最远端"}, {"k": "C", "t": "中心点"}, {"k": "D", "t": "最右侧"}], "a": "C", "multi": false, "exp": {"title": "考察点：听觉训练教具", "text": "正确答案：C）中心点\n\n听觉训练常用词表/实物/图片等作为指导教具，依题中具体实物作答。"}}, {"n": 103, "s": "ABR 是指（    ）。", "o": [{"k": "A", "t": "耳声发射"}, {"k": "B", "t": "声导抗"}, {"k": "C", "t": "听性脑干反应"}, {"k": "D", "t": "游戏测听"}], "a": "C", "multi": false, "exp": {"title": "考察点：ABR", "text": "正确答案：C）听性脑干反应\n\nABR(听性脑干反应/听觉脑干诱发电位)属客观听力检查，反映听神经及脑干听觉通路的功能状态。"}}, {"n": 104, "s": "法律与道德相互作用、相互促进。比如，法律教育的作用，法律制裁的威力，有助于社会主义社会道德（    ）的形成和发展。", "o": [{"k": "A", "t": "水平"}, {"k": "B", "t": "舆论"}, {"k": "C", "t": "观念"}, {"k": "D", "t": "规范"}], "a": "C", "multi": false, "exp": {"title": "考察点：爱岗敬业/职业理想", "text": "正确答案：C）观念\n\n职业道德与职业素养是职业能力的重要构成：爱岗敬业、诚实守信、办事公道、服务群众、奉献社会。具备良好职业道德的员工才有创新动力与工作热情，并逐步形成明确的职业理想。"}}, {"n": 105, "s": "（    ）主要作用是将来自外耳的声能传递到耳蜗的淋巴液。", "o": [{"k": "A", "t": "外耳"}, {"k": "B", "t": "中耳"}, {"k": "C", "t": "内耳"}, {"k": "D", "t": "听神经"}], "a": "B", "multi": false, "exp": {"title": "考察点：中耳传声", "text": "正确答案：B）中耳\n\n中耳的主要作用是把来自外耳的声能传递到耳蜗淋巴液（经听小骨放大）。"}}, {"n": 106, "s": "无论采用哪种方向性模式，哪个方向的声音强度都不会被降低（    ）。", "o": [{"k": "A", "t": "左侧向"}, {"k": "B", "t": "右侧向"}, {"k": "C", "t": "后方"}, {"k": "D", "t": "正前方"}], "a": "D", "multi": false, "exp": {"title": "考察点：方向性模式", "text": "正确答案：D）正前方\n\n方向性麦克风可提升信噪比；正前方（声源方向）声音不会被方向性处理降低强度，后方/侧方声音会被衰减。"}}, {"n": 107, "s": "耳蜗内毛细胞数量约为（    ）。", "o": [{"k": "A", "t": "1500 个"}, {"k": "B", "t": "2500 个"}, {"k": "C", "t": "3500 个"}, {"k": "D", "t": "4500 个"}], "a": "C", "multi": false, "exp": {"title": "考察点：内/外耳分界", "text": "正确答案：C）3500 个\n\n耳蜗内毛细胞约 3500 个、外毛细胞约 12000 个。蜗管内有前庭阶、中阶(蜗管)、鼓阶三腔。"}}, {"n": 108, "s": "（    ）是听觉察知的高级阶段。", "o": [{"k": "A", "t": "听觉分辨"}, {"k": "B", "t": "听觉整合"}, {"k": "C", "t": "听觉识别"}, {"k": "D", "t": "听觉注意"}], "a": "D", "multi": false, "exp": {"title": "考察点：听觉发展阶段", "text": "正确答案：D）听觉注意\n\n听觉发展一般经过听觉察知→听觉注意→听觉分辨→听觉识别等阶段；『听觉识别(整合)』是更高阶段。"}}, {"n": 109, "s": "REAG 的中文全称（    ）。", "o": [{"k": "A", "t": "真耳有助增益"}, {"k": "B", "t": "真耳有助响应"}, {"k": "C", "t": "真耳无助响应"}, {"k": "D", "t": "真耳无助增益"}], "a": "A", "multi": false, "exp": {"title": "考察点：真耳增益", "text": "正确答案：A）真耳有助增益\n\nREAG=真耳有助增益；REUG=真耳未助增益；REIG=真耳插入增益(Real-Ear Insertion Gain)。三者仅差字母，注意区分。"}}, {"n": 110, "s": "言语听觉评估中，选择（    ）可以了解连续语言的能力及词语音的相互掩蔽影响程度。", "o": [{"k": "A", "t": "声调识别"}, {"k": "B", "t": "声母识别"}, {"k": "C", "t": "韵母识别"}, {"k": "D", "t": "短句识别"}], "a": "D", "multi": false, "exp": {"title": "考察点：言语测听", "text": "正确答案：D）短句识别\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。"}}, {"n": 111, "s": "（    ）助听器行业大会提出了描述助听器性能的标准方法。", "o": [{"k": "A", "t": "1960 年"}, {"k": "B", "t": "1961 年"}, {"k": "C", "t": "1962 年"}, {"k": "D", "t": "1963 年"}], "a": "B", "multi": false, "exp": {"title": "考察点：助听器发展史", "text": "正确答案：B）1961 年\n\n助听器发展里程碑：第一台可随身佩戴的电子管助听器诞生于英国；1961 年助听器行业大会提出描述助听器性能的标准方法；最早的(全)数字助听器于 1996 年推出。"}}, {"n": 112, "s": "从上至下，咽腔可以分为三个部分（    ）。", "o": [{"k": "A", "t": "口咽、鼻咽和喉咽"}, {"k": "B", "t": "鼻咽、口咽和喉咽"}, {"k": "C", "t": "喉咽、鼻咽和口咽"}, {"k": "D", "t": "口咽、喉咽和鼻咽"}], "a": "B", "multi": false, "exp": {"title": "考察点：咽腔分区", "text": "正确答案：B）鼻咽、口咽和喉咽\n\n咽腔自上而下分为鼻咽、口咽、喉咽三部分。"}}, {"n": 113, "s": "REUG 的中文全称（    ）。", "o": [{"k": "A", "t": "真耳有助增益"}, {"k": "B", "t": "真耳有助响应"}, {"k": "C", "t": "真耳未助响应"}, {"k": "D", "t": "真耳未助增益"}], "a": "D", "multi": false, "exp": {"title": "考察点：真耳增益", "text": "正确答案：D）真耳未助增益\n\nREAG=真耳有助增益；REUG=真耳未助增益；REIG=真耳插入增益(Real-Ear Insertion Gain)。三者仅差字母，注意区分。"}}, {"n": 114, "s": "言语识别阈一般采用（    ）。", "o": [{"k": "A", "t": "单音节词表"}, {"k": "B", "t": "双音节词表"}, {"k": "C", "t": "短句词表"}, {"k": "D", "t": "纯音信号"}], "a": "B", "multi": false, "exp": {"title": "考察点：言语测听", "text": "正确答案：B）双音节词表\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。"}}, {"n": 115, "s": "练习教学法的第一步应为（    ）。", "o": [{"k": "A", "t": "评量结果"}, {"k": "B", "t": "反复练习"}, {"k": "C", "t": "学生模仿"}, {"k": "D", "t": "引起动机"}], "a": "D", "multi": false, "exp": {"title": "考察点：言语康复教学法", "text": "正确答案：D）引起动机\n\n练习教学法第一步应为引起学习动机(激发兴趣)，再逐步示范、模仿、重复练习。"}}, {"n": 116, "s": "人耳听觉的痛阈声压级为（    ）。", "o": [{"k": "A", "t": "20 dB SPL"}, {"k": "B", "t": "50 dB SPL"}, {"k": "C", "t": "85 dB SPL"}, {"k": "D", "t": "120 dB SPL"}], "a": "D", "multi": false, "exp": {"title": "考察点：可闻阈痛阈", "text": "正确答案：D）120 dB SPL\n\n人耳可闻阈约 0 dB SPL，痛阈约 120 dB SPL（此区段为听觉动态范围）。"}}, {"n": 117, "s": "言语测听能（    ）。", "o": [{"k": "A", "t": "直接反映言语识别能力"}, {"k": "B", "t": "直接反映听觉敏感度"}, {"k": "C", "t": "矫治言语障碍"}, {"k": "D", "t": "提高言语识别能力"}], "a": "A", "multi": false, "exp": {"title": "考察点：言语测听", "text": "正确答案：A）直接反映言语识别能力\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。"}}, {"n": 118, "s": "常用于线性助听器验配的线性处方公式是（    ）。", "o": [{"k": "A", "t": "×AL-×LI"}, {"k": "B", "t": "×AL-RP"}, {"k": "C", "t": "Fig6"}, {"k": "D", "t": "IHAFF"}], "a": "B", "multi": false, "exp": {"title": "考察点：线性处方", "text": "正确答案：B）×AL-RP\n\n常用于线性助听器验配的线性处方公式如 IHAFF、Fig6、NAL 等（以教材列举为准）。"}}, {"n": 119, "s": "助听器中调试麦克风与 FM 信号音量关系的位置通常在（    ）。", "o": [{"k": "A", "t": "降噪"}, {"k": "B", "t": "麦克风衰减"}, {"k": "C", "t": "风噪声处理"}, {"k": "D", "t": "自动程序"}], "a": "B", "multi": false, "exp": {"title": "考察点：麦克风FM音量", "text": "正确答案：B）麦克风衰减\n\n助听器调试中麦克风与 FM 信号音量关系的位置通常在『麦克风衰减』。"}}, {"n": 120, "s": "正常听力婴幼对 40-60dB SPL 较轻声音能做出持续可信的反应从（    ）月龄开始。", "o": [{"k": "A", "t": "0-3 个月"}, {"k": "B", "t": "4-7 个月"}, {"k": "C", "t": "8-12 个月"}, {"k": "D", "t": "1-2 岁"}], "a": "B", "multi": false, "exp": {"title": "考察点：婴儿反应月龄", "text": "正确答案：B）4-7 个月\n\n正常小儿 4~7 个月对 40~60 dB SPL 的较轻声音能做出持续可信的反应，听到母亲声音会停止活动；若此月龄仍无寻找声源反应，提示听力损失可能。"}}, {"n": 121, "s": "助听器失真包括谐波失真和（    ）。", "o": [{"k": "A", "t": "相位失真"}, {"k": "B", "t": "反差失真"}, {"k": "C", "t": "对比失真"}, {"k": "D", "t": "互调失真"}], "a": "D", "multi": false, "exp": {"title": "考察点：助听器失真", "text": "正确答案：D）互调失真\n\n助听器失真主要包括谐波失真和互调失真；削峰/压缩等是常见非线性失真源。"}}, {"n": 122, "s": "耳硬化症属于（    ）。", "o": [{"k": "A", "t": "外耳疾病"}, {"k": "B", "t": "中耳疾病"}, {"k": "C", "t": "内耳疾病"}, {"k": "D", "t": "听神经疾病"}], "a": "B", "multi": false, "exp": {"title": "考察点：耳硬化症", "text": "正确答案：B）中耳疾病\n\n耳硬化症属中耳疾病（镫骨固定导致传导性聋）。"}}, {"n": 123, "s": "常规纯音测听，先从（    ）测起。", "o": [{"k": "A", "t": "500Hz"}, {"k": "B", "t": "1000Hz"}, {"k": "C", "t": "2000Hz"}, {"k": "D", "t": "4000Hz"}], "a": "B", "multi": false, "exp": {"title": "考察点：纯音测听规范", "text": "正确答案：B）1000Hz\n\n纯音测听给声时间≥500 ms；给声时间太短（<100ms）时纯音响度随给声时间减少而降低，需更高强度才听到。纯音测听只反映听敏度，不反映听功能状态。"}}, {"n": 124, "s": "视觉强化测听可以得到（    ）听力损失的情况。", "o": [{"k": "A", "t": "高频"}, {"k": "B", "t": "低频"}, {"k": "C", "t": "中频"}, {"k": "D", "t": "各频率"}], "a": "D", "multi": false, "exp": {"title": "考察点：分龄测听法", "text": "正确答案：D）各频率\n\n按年龄选择行为测听法：4~6 月听觉行为观察；8 月左右视觉强化测听；3 岁以上游戏测听。"}}, {"n": 125, "s": "我国聋儿康复的“三早”原则不包括（    ）。", "o": [{"k": "A", "t": "早期发现"}, {"k": "B", "t": "早期适应"}, {"k": "C", "t": "早期矫治"}, {"k": "D", "t": "早期教育"}], "a": "B", "multi": false, "exp": {"title": "考察点：三早原则", "text": "正确答案：B）早期适应\n\n我国聋儿康复『三早』指早期发现、早期矫治(诊断)、早期教育（三个早），『早期适应』不属于三早。"}}, {"n": 126, "s": "能讲一些双词句属于（    ）发展阶段的训练任务。", "o": [{"k": "A", "t": "前语言理解"}, {"k": "B", "t": "语言理解"}, {"k": "C", "t": "口语萌芽"}, {"k": "D", "t": "完整句掌握"}], "a": "C", "multi": false, "exp": {"title": "考察点：关键期表现", "text": "正确答案：C）口语萌芽\n\n3 岁半小儿发展的关键期表现：注意力发展、独立性开始建立、动手能力发展成熟。"}}, {"n": 127, "s": "最大饱和声压级数值是指（    ）。", "o": [{"k": "A", "t": "OSPL90"}, {"k": "B", "t": "OSPL90  曲线"}, {"k": "C", "t": "OSPL90  曲线上的最大值"}, {"k": "D", "t": "OSPL90  曲线均值"}], "a": "C", "multi": false, "exp": {"title": "考察点：饱和声压级", "text": "正确答案：C）OSPL90  曲线上的最大值\n\n饱和声压级(MPO/OSPL90)：超大功率>130 dB SPL；大功率 CIC 约 110~120 dB SPL。选功率时平均听损 95dB 需 MPO>135dB；65dB 约选 MPO 125~135dB SPL。"}}, {"n": 128, "s": "目前市场上大功率 CIC 助听器的最大饱和声压级（2CC）在（    ）范围。", "o": [{"k": "A", "t": "100dB SPL-110dB SPL"}, {"k": "B", "t": "110dB SPL-120dB SPL"}, {"k": "C", "t": "120dB SPL-130dB SPL"}, {"k": "D", "t": "130dB SPL-135dB SPL"}], "a": "B", "multi": false, "exp": {"title": "考察点：饱和声压级", "text": "正确答案：B）110dB SPL-120dB SPL\n\n饱和声压级(MPO/OSPL90)：超大功率>130 dB SPL；大功率 CIC 约 110~120 dB SPL。选功率时平均听损 95dB 需 MPO>135dB；65dB 约选 MPO 125~135dB SPL。"}}, {"n": 129, "s": "遇到外耳道炎时，（    ）。", "o": [{"k": "A", "t": "先转诊治疗，后取耳印模"}, {"k": "B", "t": "先取耳印模，后转诊治疗"}, {"k": "C", "t": "治疗和取耳印模同时进行"}, {"k": "D", "t": "由患者决定"}], "a": "A", "multi": false, "exp": {"title": "考察点：外耳道长度", "text": "正确答案：A）先转诊治疗，后取耳印模\n\n成人外耳道长约 2.5 cm（外1/3软骨部，内2/3骨部）。"}}, {"n": 130, "s": "正确的言语识别阈的英文简写（    ）。", "o": [{"k": "A", "t": "SRT"}, {"k": "B", "t": "SRS"}, {"k": "C", "t": "SDT"}, {"k": "D", "t": "PTA"}], "a": "A", "multi": false, "exp": {"title": "考察点：言语测听", "text": "正确答案：A）SRT\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。"}}, {"n": 131, "s": "使用助听器进行测听的功能也称为（    ）。", "o": [{"k": "A", "t": "助听听阈测试"}, {"k": "B", "t": "原位测听"}, {"k": "C", "t": "气导测试"}, {"k": "D", "t": "骨导测试"}], "a": "B", "multi": false, "exp": {"title": "考察点：原位测听", "text": "正确答案：B）原位测听\n\n利用助听器本身(在真耳条件下)进行的测听称原位测听(实时测听)，用于评估助听放大后的实际听声效果。"}}, {"n": 132, "s": "为听障者制订的训练计划频率建议为(    )。", "o": [{"k": "A", "t": "每周 1～2 次"}, {"k": "B", "t": "每周 2～3 次"}, {"k": "C", "t": "每周 3～4 次"}, {"k": "D", "t": "每周 4～5 次"}], "a": "A", "multi": false, "exp": {"title": "考察点：声波特性", "text": "正确答案：A）每周 1～2 次\n\n声波在空气中向三维空间呈膨胀球体传播。低频波长大于头部直径时两耳间几乎无头影衰减；高频波长小于头部直径时受头部衍射/头影作用而削弱。"}}, {"n": 133, "s": "助听器的低通滤波器主要用来降低（    ）以上的增益。", "o": [{"k": "A", "t": "250Hz"}, {"k": "B", "t": "500Hz"}, {"k": "C", "t": "1000Hz"}, {"k": "D", "t": "2000Hz"}], "a": "C", "multi": false, "exp": {"title": "考察点：低通滤波器", "text": "正确答案：C）1000Hz\n\n助听器低通滤波器允许低于截止频率的信号通过，衰减(降低)高于截止频率(如 1000 Hz)的声音/增益，主要用于降低中高频增益以减少高频噪声、抑制声反馈，或适配相应的高频听力损失。常见概念区分：低通=滤掉高频，高通=滤掉低频。"}}, {"n": 134, "s": "34月龄儿童建议采用下列（    ）测试主观测试方法。", "o": [{"k": "A", "t": "行为观察测听"}, {"k": "B", "t": "视觉强化测听"}, {"k": "C", "t": "游戏测听"}, {"k": "D", "t": "听声放物测听"}], "a": "C", "multi": false, "exp": {"title": "考察点：分龄测听法", "text": "正确答案：C）游戏测听\n\n按年龄选择行为测听法：4~6 月听觉行为观察；8 月左右视觉强化测听；3 岁以上游戏测听。"}}, {"n": 135, "s": "总谐波失真中以下（    ）成份最为显著", "o": [{"k": "A", "t": "二次谐波"}, {"k": "B", "t": "三次谐波"}, {"k": "C", "t": "四次谐波"}, {"k": "D", "t": "五次谐波"}], "a": "A", "multi": false, "exp": {"title": "考察点：助听器失真", "text": "正确答案：A）二次谐波\n\n助听器失真主要包括谐波失真和互调失真；削峰/压缩等是常见非线性失真源。"}}, {"n": 136, "s": "9～18 个月的儿童，耳模应（    ）换一次。", "o": [{"k": "A", "t": "1 个月"}, {"k": "B", "t": "两个月"}, {"k": "C", "t": "三个月"}, {"k": "D", "t": "半年"}], "a": "C", "multi": false, "exp": {"title": "考察点：耳模更换", "text": "正确答案：C）三个月\n\n9~18 个月儿童耳模约 3 个月更换一次（因耳道快速发育）。耳模类型：标准式、壳式、耳道壳式、骨架式等。"}}, {"n": 137, "s": "声导抗探头的三个小管中（    ）与气压泵和气压计相连。", "o": [{"k": "A", "t": "上管"}, {"k": "B", "t": "中管"}, {"k": "C", "t": "下管"}, {"k": "D", "t": "声刺激管"}], "a": "B", "multi": false, "exp": {"title": "考察点：声导抗", "text": "正确答案：B）中管\n\n声导抗测试是声阻抗测试与声导纳测试的合称，用于客观评估中耳功能。"}}, {"n": 138, "s": "设置多程序目的是（    ）。", "o": [{"k": "A", "t": "提高不同环境下聆听效果"}, {"k": "B", "t": "体现多方向性优势"}, {"k": "C", "t": "多程序技术选进更易售卖"}, {"k": "D", "t": "提升用户操作参与度提升"}], "a": "A", "multi": false, "exp": {"title": "考察点：多程序/程序", "text": "正确答案：A）提高不同环境下聆听效果\n\n助听器设置多个程序的目的是适应不同听声环境(安静、噪声、电话、音乐等)，一键切换以获得各场景最佳听声效果。"}}, {"n": 139, "s": "插入增益数值的意思是指（    ）。", "o": [{"k": "A", "t": "堵耳响应-未助响应"}, {"k": "B", "t": "堵耳响应-给声强度"}, {"k": "C", "t": "纯音听阈-助听听阈"}, {"k": "D", "t": "REAR-RGUR"}], "a": "D", "multi": false, "exp": {"title": "考察点：插入增益", "text": "正确答案：D）REAR-RGUR\n\n真耳插入增益 REIG = REAG − REUG（真耳有助增益 − 真耳未助增益）= REAR − REUR（助耳响应 − 裸耳响应），即佩戴助听器相比裸耳所增加的真耳增益。源题库选项『REAR-RGUR / EAR-RGUR』为录入笔误，正确答案应为 REAG − REUG。"}}, {"n": 140, "s": "助听器蓝牙连接 MFI 的功能是（    ）。", "o": [{"k": "A", "t": "直连所有智能通迅设备"}, {"k": "B", "t": "直连苹果智能设备"}, {"k": "C", "t": "直连安卓智能设备"}, {"k": "D", "t": "直连 Wi×dow 智能设备"}], "a": "B", "multi": false, "exp": {"title": "考察点：手机兼容/接打电话", "text": "正确答案：B）直连苹果智能设备\n\n助听器接打手机效果最佳方式：开启电感(T挡)或与手机/蓝牙配件连接，减少语音信号干扰、提高接听清晰度。"}}, {"n": 141, "s": "游戏测听如不能说服小儿带耳机，只能采用声场给声的形式，得到的是（    ）的听力。", "o": [{"k": "A", "t": "差耳"}, {"k": "B", "t": "好耳"}, {"k": "C", "t": "双耳"}, {"k": "D", "t": "都不是"}], "a": "B", "multi": false, "exp": {"title": "考察点：分龄测听法", "text": "正确答案：B）好耳\n\n按年龄选择行为测听法：4~6 月听觉行为观察；8 月左右视觉强化测听；3 岁以上游戏测听。"}}, {"n": 142, "s": "新生儿核黄疸又可称为（    ）。", "o": [{"k": "A", "t": "生理性黄疸"}, {"k": "B", "t": "胆红素脑病"}, {"k": "C", "t": "高胆红素血症"}, {"k": "D", "t": "溶血性黄疸"}], "a": "B", "multi": false, "exp": {"title": "考察点：新生儿筛查", "text": "正确答案：B）胆红素脑病\n\n新生儿首次听力筛查应在出生后 72 小时内完成。"}}, {"n": 143, "s": "声导抗测试报告引出镫骨肌反射，表示（    ）。", "o": [{"k": "A", "t": "传导性听力损失"}, {"k": "B", "t": "正常听力或轻中度感音性听力损失"}, {"k": "C", "t": "神经性听力损失"}, {"k": "D", "t": "混合性听力损失"}], "a": "B", "multi": false, "exp": {"title": "考察点：声反射/镫骨肌", "text": "正确答案：B）正常听力或轻中度感音性听力损失\n\n镫骨肌反射是声导抗的一部分；单侧感音神经性聋可见同侧/对侧镫骨肌反射异常引出情况。传导性聋镫骨肌反射同侧引不出。"}}, {"n": 144, "s": "声导抗测试前要检查（    ） ，防止耳塞被堵。", "o": [{"k": "A", "t": "中耳"}, {"k": "B", "t": "内耳"}, {"k": "C", "t": "外耳道"}, {"k": "D", "t": "都要检查"}], "a": "C", "multi": false, "exp": {"title": "考察点：声导抗", "text": "正确答案：C）外耳道\n\n声导抗测试是声阻抗测试与声导纳测试的合称，用于客观评估中耳功能。"}}, {"n": 145, "s": "声导抗测试报告为 B 型图，提示（    ）。", "o": [{"k": "A", "t": "鼓室积液"}, {"k": "B", "t": "咽鼓管功能障碍"}, {"k": "C", "t": "中耳正常"}, {"k": "D", "t": "鼓室硬化"}], "a": "A", "multi": false, "exp": {"title": "考察点：声导抗", "text": "正确答案：A）鼓室积液\n\n声导抗测试是声阻抗测试与声导纳测试的合称，用于客观评估中耳功能。"}}, {"n": 146, "s": "小儿后天性耳聋的常见原因为（    ）。", "o": [{"k": "A", "t": "各种传染性疾病，耳中毒，外伤，中耳炎"}, {"k": "B", "t": "各种传染性疾病，耳中毒，外伤，中耳炎，弓形体感染"}, {"k": "C", "t": "各种传染性疾病，耳中毒，外伤"}, {"k": "D", "t": "各种传染性疾病，耳中毒，中耳炎"}], "a": "A", "multi": false, "exp": {"title": "考察点：小儿后天性聋", "text": "正确答案：A）各种传染性疾病，耳中毒，外伤，中耳炎\n\n小儿后天性聋常见原因：各种传染性疾病、药物(耳毒性药)中毒、外伤、中耳炎；欠发达国家 0~17 岁后天性聋主因是中耳炎。"}}, {"n": 147, "s": "视觉强化测听首先要建立条件反射的方法，开始时播放测试音和灯光玩具，顺序是（    ）。", "o": [{"k": "A", "t": "先放测试音后放灯光玩具"}, {"k": "B", "t": "先放灯光玩具后放测试音"}, {"k": "C", "t": "同时放"}, {"k": "D", "t": "任意组合"}], "a": "A", "multi": false, "exp": {"title": "考察点：分龄测听法", "text": "正确答案：A）先放测试音后放灯光玩具\n\n按年龄选择行为测听法：4~6 月听觉行为观察；8 月左右视觉强化测听；3 岁以上游戏测听。"}}, {"n": 148, "s": "新生儿的听觉已相当良好，对（    ）的声音会有反应。", "o": [{"k": "A", "t": "50～70dB SPL"}, {"k": "B", "t": "30～40dB SPL"}, {"k": "C", "t": "20～50dB SPL"}, {"k": "D", "t": "70～90dB SPL"}], "a": "A", "multi": false, "exp": {"title": "考察点：新生儿听觉反应", "text": "正确答案：A）50～70dB SPL\n\n新生儿听觉发育已相当完善，对 50~70 dB SPL 的声音能作出反应(听到声音会有转头/惊动等表现)；新生儿首次听力筛查在出生后 72 小时内完成。"}}, {"n": 149, "s": "言语听力计的校准：照相关国标，将耳机或扬声器输出的言语信号的声压级数值（dB SPL) 与 （    ）表盘显示的听力计数值（dBHL）建立对应关系。", "o": [{"k": "A", "t": "听力计"}, {"k": "B", "t": "耳机"}, {"k": "C", "t": "扬声器"}, {"k": "D", "t": "声导抗测听"}], "a": "A", "multi": false, "exp": {"title": "考察点：可闻阈痛阈", "text": "正确答案：A）听力计\n\n人耳可闻阈约 0 dB SPL，痛阈约 120 dB SPL（此区段为听觉动态范围）。"}}, {"n": 150, "s": "言语测试是患者听到（    ）重复。", "o": [{"k": "A", "t": "很清楚"}, {"k": "B", "t": "听不清尽量猜"}, {"k": "C", "t": "听不见"}, {"k": "D", "t": "听大声"}], "a": "B", "multi": false, "exp": {"title": "考察点：言语测听", "text": "正确答案：B）听不清尽量猜\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。"}}, {"n": 151, "s": "招风耳（扇风耳）（    ）。", "o": [{"k": "A", "t": "属于后天性耳廓畸形"}, {"k": "B", "t": "属于先天性耳廓畸形"}, {"k": "C", "t": "属于感染性耳廓畸形"}, {"k": "D", "t": "不属于耳廓畸形"}], "a": "B", "multi": false, "exp": {"title": "考察点：招风耳", "text": "正确答案：B）属于先天性耳廓畸形\n\n招风耳(扇风耳)是耳廓畸形的一种，因耳廓软骨发育异常致耳廓过分外翻，常需手术矫正。"}}, {"n": 152, "s": "对已行耳部手术患者，制取耳印模的时间应在 （    ）。", "o": [{"k": "A", "t": "术后 1 个月"}, {"k": "B", "t": "术后 2 个月"}, {"k": "C", "t": "术后 3 个月，且术腔已干燥"}, {"k": "D", "t": "术后 12 个月"}], "a": "C", "multi": false, "exp": {"title": "考察点：耳印模/耳模", "text": "正确答案：C）术后 3 个月，且术腔已干燥\n\n取耳印模用于制作耳模。完整耳印模覆盖耳道及耳廓前部相应区域；异常耳廓/耳道取印模时须正确置入耳障、注入印模材料并保证完整。"}}, {"n": 153, "s": "下列（    ）数据是反应助听器基本频率响应特性。", "o": [{"k": "A", "t": "OSPL90 曲线"}, {"k": "B", "t": "HAIC 增益"}, {"k": "C", "t": "基本频率响应曲线"}, {"k": "D", "t": "最大声增益"}], "a": "C", "multi": false, "exp": {"title": "考察点：助听器性能指标", "text": "正确答案：C）基本频率响应曲线\n\n常规助听器性能指标：饱和声压级(OSPL90)、满挡(满档)声增益、频率响应范围、等效输入噪声、总谐波失真等。"}}, {"n": 154, "s": "满档声增益多用于描述助听器（    ）能力。", "o": [{"k": "A", "t": "最大声输出能力"}, {"k": "B", "t": "电路最大放大能力"}, {"k": "C", "t": "压缩能力"}, {"k": "D", "t": "低强度输入声的补偿能力"}], "a": "B", "multi": false, "exp": {"title": "考察点：压缩/增益", "text": "正确答案：B）电路最大放大能力\n\n压缩放大增益随输入声强而改变；测增益一般在较低输入声级(如 50dB SPL)下进行。MPO 应设在 MCL 与 UCL 之间。"}}, {"n": 155, "s": "IEC-118 规定参考测试频率和参考测试增益的目的是（    ）。", "o": [{"k": "A", "t": "评判助听器放大能力"}, {"k": "B", "t": "评判助听器实际使用时的效果"}, {"k": "C", "t": "评判助听器保真度"}, {"k": "D", "t": "评判助听器底噪强度"}], "a": "B", "multi": false, "exp": {"title": "考察点：参考测试频率", "text": "正确答案：B）评判助听器实际使用时的效果\n\n参考测试频率一般选 2500 Hz 和 1600 Hz 两个；2500Hz 反映高频特性。"}}, {"n": 156, "s": "只想单纯使用磁感应功能时，应当助听器开至（    ）程序。", "o": [{"k": "A", "t": "仅打开 T 档程序"}, {"k": "B", "t": "T 档程序同时打开助听器麦克风"}, {"k": "C", "t": "通用程序"}, {"k": "D", "t": "噪音程序"}], "a": "A", "multi": false, "exp": {"title": "考察点：磁感电感", "text": "正确答案：A）仅打开 T 档程序\n\n磁感电感线圈靠『磁场能量信号』从电话/环路系统拾取声音。"}}, {"n": 157, "s": "下列（    ）外型助听器很难通过双麦克风技术实现方向性功能。", "o": [{"k": "A", "t": "耳背式"}, {"k": "B", "t": "耳道受话器耳背式"}, {"k": "C", "t": "ITE"}, {"k": "D", "t": "IIC"}], "a": "D", "multi": false, "exp": {"title": "考察点：麦克风类型", "text": "正确答案：D）IIC\n\n助听器麦克风按工作原理分：电磁动圈式、压电陶瓷式、驻极体式。"}}, {"n": 158, "s": "双极形会降低（    ）向上的声音强度。", "o": [{"k": "A", "t": "双侧向"}, {"k": "B", "t": "正上方"}, {"k": "C", "t": "正前方"}, {"k": "D", "t": "正后方"}], "a": "A", "multi": false, "exp": {"title": "考察点：声源定位", "text": "正确答案：A）双侧向\n\n声源定位靠双耳时间差、强度差、相位差实现；它『不包括』与听者之间的距离识别。"}}, {"n": 159, "s": "T 感线圈程序设置最主要目的是（    ）。", "o": [{"k": "A", "t": "接打智能手机"}, {"k": "B", "t": "接打固定电话"}, {"k": "C", "t": "微信语音通话"}, {"k": "D", "t": "PAD 听小视频"}], "a": "B", "multi": false, "exp": {"title": "考察点：磁感电感", "text": "正确答案：B）接打固定电话\n\n磁感电感线圈靠『磁场能量信号』从电话/环路系统拾取声音。"}}, {"n": 160, "s": "不同班级的 FM 频道设置过于接近，可能出现（    ）。", "o": [{"k": "A", "t": "串频"}, {"k": "B", "t": "移频"}, {"k": "C", "t": "转频"}, {"k": "D", "t": "射频"}], "a": "A", "multi": false, "exp": {"title": "考察点：DAI", "text": "正确答案：A）串频\n\nDAI(Direct Audio Input)直接音频输入；FM 系统用无线将信号传入助听器。麦克风与 FM 信号音量调节位置常在『麦克风衰减』。"}}, {"n": 161, "s": "BICROS 式助听器是指（    ）。", "o": [{"k": "A", "t": "信号对传式助听器"}, {"k": "B", "t": "双侧信号对传式助听器"}, {"k": "C", "t": "环路系统"}, {"k": "D", "t": "FM 系统"}], "a": "B", "multi": false, "exp": {"title": "考察点：CROS/BICROS", "text": "正确答案：B）双侧信号对传式助听器\n\nCROS 信号对侧交联式，适合单侧重度聋；BICROS 双侧交联式，适合一侧正常/轻中度+另一侧极重度。CROS/BICROS 都不能同时放大差耳、仍为单声道感觉、不能减小头影效应。"}}, {"n": 162, "s": "适合一侧轻度或中度听力损失，另一侧极重度听力损失的患者的助听器是（    ）。", "o": [{"k": "A", "t": "骨导助听器"}, {"k": "B", "t": "盒式助听器"}, {"k": "C", "t": "单侧交联式助听器"}, {"k": "D", "t": "双侧交联式助听器"}], "a": "D", "multi": false, "exp": {"title": "考察点：听力损失分级", "text": "正确答案：D）双侧交联式助听器\n\n听力损失分级（WHO）：正常≤25，轻度 26~40，中度 41~60，重度 61~80，极重度≥81。70 dB HL 属重度听力损失。"}}, {"n": 163, "s": "真耳未助听反应(REUR)是测量（    ）。", "o": [{"k": "A", "t": "耳廓顶部对源自扬声器声音的频率响应"}, {"k": "B", "t": "外耳道口对源自扬声器声音的频率响应"}, {"k": "C", "t": "外耳道近鼓膜处对源自扬声器声音的频率响应"}, {"k": "D", "t": "鼓室内对源自扬声器声音的频率响应"}], "a": "C", "multi": false, "exp": {"title": "考察点：插入增益", "text": "正确答案：C）外耳道近鼓膜处对源自扬声器声音的频率响应\n\n真耳插入增益 REIG = REAG − REUG（真耳有助增益 − 真耳未助增益）= REAR − REUR（助耳响应 − 裸耳响应），即佩戴助听器相比裸耳所增加的真耳增益。源题库选项『REAR-RGUR / EAR-RGUR』为录入笔误，正确答案应为 REAG − REUG。"}}, {"n": 164, "s": "真耳有助响应测试中大、中、小声测试增益曲线要接近（    ）被认为助听器的调试是合适的。", "o": [{"k": "A", "t": "频响曲线"}, {"k": "B", "t": "目标增益曲线"}, {"k": "C", "t": "UCL 曲线"}, {"k": "D", "t": "MPO  曲线"}], "a": "B", "multi": false, "exp": {"title": "考察点：真耳增益", "text": "正确答案：B）目标增益曲线\n\nREAG=真耳有助增益；REUG=真耳未助增益；REIG=真耳插入增益(Real-Ear Insertion Gain)。三者仅差字母，注意区分。"}}, {"n": 165, "s": "助听后正常语声强度言语识别率达到或超过（    ），助听效果为最适。", "o": [{"k": "A", "t": "44%"}, {"k": "B", "t": "70%"}, {"k": "C", "t": "80%"}, {"k": "D", "t": "90%"}], "a": "D", "multi": false, "exp": {"title": "考察点：助听后识别率", "text": "正确答案：D）90%\n\n助听后言语识别率≥90% 代表助听效果『最适』。"}}, {"n": 166, "s": "佩戴助听器后，有的孩子会对部分频率的声音特别敏感，大部分是（    ）。", "o": [{"k": "A", "t": "500Hz"}, {"k": "B", "t": "1000Hz"}, {"k": "C", "t": "2000Hz"}, {"k": "D", "t": "4000Hz"}], "a": "B", "multi": false, "exp": {"title": "考察点：敏感频率", "text": "正确答案：B）1000Hz\n\n佩戴助听器后对某频率特别敏感，多为 1000 Hz。"}}, {"n": 167, "s": "儿童初始佩戴助听器时，要从（    ）的环境开始。", "o": [{"k": "A", "t": "陌生"}, {"k": "B", "t": "刺激"}, {"k": "C", "t": "嘈杂"}, {"k": "D", "t": "安静"}], "a": "D", "multi": false, "exp": {"title": "考察点：助听器听觉康复/适应", "text": "正确答案：D）安静\n\n助听器适应性训练：成人包括心理适应、改变原有听觉习惯的适应、佩戴时间的适应、对声音强度的适应、佩戴环境的适应；儿童初始佩戴应从『安静』环境开始，循序渐进再到嘈杂环境。"}}, {"n": 168, "s": "患者的（    ）对制定康复计划没有直接的关系。", "o": [{"k": "A", "t": "年龄"}, {"k": "B", "t": "助听器型号"}, {"k": "C", "t": "家庭对其佩戴助听器的支持程度"}, {"k": "D", "t": "收入水平"}], "a": "D", "multi": false, "exp": {"title": "考察点：助听器听觉康复/适应", "text": "正确答案：D）收入水平\n\n助听器适应性训练：成人包括心理适应、改变原有听觉习惯的适应、佩戴时间的适应、对声音强度的适应、佩戴环境的适应；儿童初始佩戴应从『安静』环境开始，循序渐进再到嘈杂环境。"}}, {"n": 169, "s": "建议家长坚持（    ）的有效助听范围和孩子交谈。", "o": [{"k": "A", "t": "0～1 米"}, {"k": "B", "t": "1～2 米"}, {"k": "C", "t": "2～3 米"}, {"k": "D", "t": "3～4 米"}], "a": "B", "multi": false, "exp": {"title": "考察点：有效助听距离", "text": "正确答案：B）1～2 米\n\n佩戴助听器后，与佩戴者交谈应保持在其有效助听范围内(约 1~2 米)，距离过远不利于言语清晰度与听觉康复。"}}, {"n": 170, "s": "游戏测听的英文缩写是（    ）。", "o": [{"k": "A", "t": "PBA"}, {"k": "B", "t": "VRA"}, {"k": "C", "t": "PA"}, {"k": "D", "t": "BOA"}], "a": "C", "multi": false, "exp": {"title": "考察点：分龄测听法", "text": "正确答案：C）PA\n\n按年龄选择行为测听法：4~6 月听觉行为观察；8 月左右视觉强化测听；3 岁以上游戏测听。"}}, {"n": 171, "s": "助听器的音量开关英文缩写为（    ）。", "o": [{"k": "A", "t": "AC"}, {"k": "B", "t": "BC"}, {"k": "C", "t": "VC"}, {"k": "D", "t": "FC"}], "a": "C", "multi": false, "exp": {"title": "考察点：麦克风FM音量", "text": "正确答案：C）VC\n\n助听器调试中麦克风与 FM 信号音量关系的位置通常在『麦克风衰减』。"}}, {"n": 172, "s": "古人有“吾日三省吾身”的修养方法，这种方法就是说一个人每天三次检查自己的行为，看是否符合道德要求。今天，人们应借鉴古人的修养方法，经常用（    ）对照检查自己的言 行，要敢于正视自身存在的缺点。", "o": [{"k": "A", "t": "职业道德标准"}, {"k": "B", "t": "职业道德修养"}, {"k": "C", "t": "职业道德水平"}, {"k": "D", "t": "职业道德观念"}], "a": "A", "multi": false, "exp": {"title": "考察点：爱岗敬业/职业理想", "text": "正确答案：A）职业道德标准\n\n职业道德与职业素养是职业能力的重要构成：爱岗敬业、诚实守信、办事公道、服务群众、奉献社会。具备良好职业道德的员工才有创新动力与工作热情，并逐步形成明确的职业理想。"}}, {"n": 173, "s": "（    ）就是热爱自己的工作岗位，热爱本职工作。", "o": [{"k": "A", "t": "爱岗"}, {"k": "B", "t": "守纪"}, {"k": "C", "t": "敬业"}, {"k": "D", "t": "爱岗敬业"}], "a": "A", "multi": false, "exp": {"title": "考察点：爱岗", "text": "正确答案：A）爱岗\n\n爱岗=热爱自己的工作岗位、热爱本职工作；敬业=对本职工作尽职尽责、精益求精。爱岗敬业是职业道德的核心要求。"}}, {"n": 174, "s": "如果存在摩擦和空气阻力，那么物体的机械振动严格地讲都不是简谐振动，在振动过程 中振幅减小，周期不变，机械能（    ）。", "o": [{"k": "A", "t": "不变"}, {"k": "B", "t": "减小"}, {"k": "C", "t": "增大"}, {"k": "D", "t": "为 0"}], "a": "B", "multi": false, "exp": {"title": "考察点：机械振动", "text": "正确答案：B）减小\n\n实际自由振动必为阻尼振动（幅度越来越小）；受迫振动的频率由外界策动力频率决定；受迫振动稳定后频率与自身物理条件无关。"}}, {"n": 175, "s": "在自由声场中，声波在所有方向上的传播都是无干扰的，声能在球形波振面上辐射出去。 离声源越远，波振面越（    ），通过单位面积的声能越（    ），声强表现为（    ）。", "o": [{"k": "A", "t": "大，少， 增强"}, {"k": "B", "t": "大，少，衰减"}, {"k": "C", "t": "小，多，衰减"}, {"k": "D", "t": "小，少，增强"}], "a": "B", "multi": false, "exp": {"title": "考察点：声波特性", "text": "正确答案：B）大，少，衰减\n\n声波在空气中向三维空间呈膨胀球体传播。低频波长大于头部直径时两耳间几乎无头影衰减；高频波长小于头部直径时受头部衍射/头影作用而削弱。"}}, {"n": 176, "s": "如果两个声音具有同样的响度和音调，那么可以用（    ）来区分和鉴别。", "o": [{"k": "A", "t": "音色"}, {"k": "B", "t": "音强"}, {"k": "C", "t": "频率"}, {"k": "D", "t": "音高"}], "a": "A", "multi": false, "exp": {"title": "考察点：音色", "text": "正确答案：A）音色\n\n两个声音响度、音调相同时，靠『音色』区分。音色由谐波/频谱包络决定。"}}, {"n": 177, "s": "清塞音的 VOT 通常（    ）， 而浊塞音的 VOT 多（    ）。", "o": [{"k": "A", "t": "大于 50ms、短于 30 ms"}, {"k": "B", "t": "短于 10ms、大于 50 ms"}, {"k": "C", "t": "大于 70ms、短于 30 ms"}, {"k": "D", "t": "短于 20ms、大于 70 ms"}], "a": "C", "multi": false, "exp": {"title": "考察点：VOT", "text": "正确答案：C）大于 70ms、短于 30 ms\n\nVOT(嗓音起始时间)为塞音除阻到声带振动开始的时间。清塞音 VOT 较长(正值，声带振动晚)；浊塞音 VOT 短/近零或负值(声带振动早)。"}}, {"n": 178, "s": "Fig.6 公式于（    ）命名推出。", "o": [{"k": "A", "t": "1990 年"}, {"k": "B", "t": "1991 年"}, {"k": "C", "t": "1992 年"}, {"k": "D", "t": "1993 年"}], "a": "D", "multi": false, "exp": {"title": "考察点：线性处方", "text": "正确答案：D）1993 年\n\n常用于线性助听器验配的线性处方公式如 IHAFF、Fig6、NAL 等（以教材列举为准）。"}}, {"n": 179, "s": "声导抗正常鼓室图一般为（    ）形态。", "o": [{"k": "A", "t": "B 型"}, {"k": "B", "t": "C 型"}, {"k": "C", "t": "Ad 型"}, {"k": "D", "t": "A 型"}], "a": "D", "multi": false, "exp": {"title": "考察点：鼓室图", "text": "正确答案：D）A 型\n\n声导抗正常鼓室图一般呈 A 型。探测音常用 226Hz/678Hz/1000Hz；6 个月以下小儿用 1000Hz。鼓室图可检测中耳积液、咽鼓管通畅度、外耳道是否堵塞等情况。"}}, {"n": 180, "s": "家族史采集涉及到的亲属不包括（    ）。", "o": [{"k": "A", "t": "父母亲"}, {"k": "B", "t": "外公外婆"}, {"k": "C", "t": "爷爷奶奶"}, {"k": "D", "t": "妯娌"}], "a": "D", "multi": false, "exp": {"title": "考察点：临床表现/记录", "text": "正确答案：D）妯娌\n\n病史采集含现病史、既往史、家族史、个人史等；直系亲属及两系三级亲属的患病情况属家族史内容。"}}, {"n": 181, "s": "第一台可随身佩戴的电子管助听器诞生于（    ）。", "o": [{"k": "A", "t": "英国"}, {"k": "B", "t": "德国"}, {"k": "C", "t": "美国"}, {"k": "D", "t": "日本"}], "a": "A", "multi": false, "exp": {"title": "考察点：助听器发展史", "text": "正确答案：A）英国\n\n助听器发展里程碑：第一台可随身佩戴的电子管助听器诞生于英国；1961 年助听器行业大会提出描述助听器性能的标准方法；最早的(全)数字助听器于 1996 年推出。"}}, {"n": 182, "s": "半壳式耳模又称（    ）。", "o": [{"k": "A", "t": "标准式耳模"}, {"k": "B", "t": "壳式耳模"}, {"k": "C", "t": "耳道壳式耳模"}, {"k": "D", "t": "耳甲壳式耳模"}], "a": "C", "multi": false, "exp": {"title": "考察点：耳模更换", "text": "正确答案：C）耳道壳式耳模\n\n9~18 个月儿童耳模约 3 个月更换一次（因耳道快速发育）。耳模类型：标准式、壳式、耳道壳式、骨架式等。"}}, {"n": 183, "s": "227 、34 月龄儿童建议采用下列（    ）测试主观测试方法。", "o": [{"k": "A", "t": "行为观察测听"}, {"k": "B", "t": "视觉强化测听"}, {"k": "C", "t": "游戏测听"}, {"k": "D", "t": "听声放物测听"}], "a": "C", "multi": false, "exp": {"title": "考察点：分龄测听法", "text": "正确答案：C）游戏测听\n\n按年龄选择行为测听法：4~6 月听觉行为观察；8 月左右视觉强化测听；3 岁以上游戏测听。"}}, {"n": 184, "s": "婴儿期是小儿生长发育速度最快的阶段，通常指（    ）年龄区间的孩子。", "o": [{"k": "A", "t": "28 天-1 周岁"}, {"k": "B", "t": "出生到 28 天"}, {"k": "C", "t": "出生到 6 个月"}, {"k": "D", "t": "出生到 1 周岁"}], "a": "A", "multi": false, "exp": {"title": "考察点：分龄测听法", "text": "正确答案：A）28 天-1 周岁\n\n按年龄选择行为测听法：4~6 月听觉行为观察；8 月左右视觉强化测听；3 岁以上游戏测听。"}}, {"n": 185, "s": "以下（    ）原因导致的听力损失，随着病程发展可能会引起耳蜗内膜增生骨化现象，需要早期考虑人工耳蜗植入。", "o": [{"k": "A", "t": "化脓性中耳炎"}, {"k": "B", "t": "药物性聋"}, {"k": "C", "t": "前庭导水管扩大"}, {"k": "D", "t": "流型性脑脊髓膜炎"}], "a": "D", "multi": false, "exp": {"title": "考察点：听力损失分级", "text": "正确答案：D）流型性脑脊髓膜炎\n\n听力损失分级（WHO）：正常≤25，轻度 26~40，中度 41~60，重度 61~80，极重度≥81。70 dB HL 属重度听力损失。"}}, {"n": 186, "s": "在欠发达国家，导致 0～17 岁（后天性）人群听力残疾的重要病因是（    ）。", "o": [{"k": "A", "t": "遗传"}, {"k": "B", "t": "中耳炎"}, {"k": "C", "t": "耳毒性药物"}, {"k": "D", "t": "传染性疾病"}], "a": "B", "multi": false, "exp": {"title": "考察点：小儿后天性聋", "text": "正确答案：B）中耳炎\n\n小儿后天性聋常见原因：各种传染性疾病、药物(耳毒性药)中毒、外伤、中耳炎；欠发达国家 0~17 岁后天性聋主因是中耳炎。"}}, {"n": 187, "s": "中耳正常的鼓室图是（    ）。", "o": [{"k": "A", "t": "B 型"}, {"k": "B", "t": "C 型"}, {"k": "C", "t": "A 型"}, {"k": "D", "t": "Ad 型"}], "a": "C", "multi": false, "exp": {"title": "考察点：鼓室图", "text": "正确答案：C）A 型\n\n声导抗正常鼓室图一般呈 A 型。探测音常用 226Hz/678Hz/1000Hz；6 个月以下小儿用 1000Hz。鼓室图可检测中耳积液、咽鼓管通畅度、外耳道是否堵塞等情况。"}}, {"n": 188, "s": "游戏测听的游戏项目可以（    ）。", "o": [{"k": "A", "t": "简单，有趣"}, {"k": "B", "t": "太简单，太有趣"}, {"k": "C", "t": "太简单，无趣"}, {"k": "D", "t": "都可以"}], "a": "A", "multi": false, "exp": {"title": "考察点：分龄测听法", "text": "正确答案：A）简单，有趣\n\n按年龄选择行为测听法：4~6 月听觉行为观察；8 月左右视觉强化测听；3 岁以上游戏测听。"}}, {"n": 189, "s": "游戏测听的英文是(    )。", "o": [{"k": "A", "t": "PA"}, {"k": "B", "t": "VRA"}, {"k": "C", "t": "PT"}, {"k": "D", "t": "BOA"}], "a": "A", "multi": false, "exp": {"title": "考察点：分龄测听法", "text": "正确答案：A）PA\n\n按年龄选择行为测听法：4~6 月听觉行为观察；8 月左右视觉强化测听；3 岁以上游戏测听。"}}, {"n": 190, "s": "严格地说，人体的声源器官只有声带。它的振动虽然不能直接形成语声，但对语声的（    ）有着重要的影响。", "o": [{"k": "A", "t": "音色、音强"}, {"k": "B", "t": "音高、音色"}, {"k": "C", "t": "音强、音调"}, {"k": "D", "t": "音高、音长"}], "a": "B", "multi": false, "exp": {"title": "考察点：机械振动", "text": "正确答案：B）音高、音色\n\n实际自由振动必为阻尼振动（幅度越来越小）；受迫振动的频率由外界策动力频率决定；受迫振动稳定后频率与自身物理条件无关。"}}, {"n": 191, "s": "儿童言语测试时测试者与被测试者并排而坐，两人间距（    ）。", "o": [{"k": "A", "t": "1 米"}, {"k": "B", "t": "半米"}, {"k": "C", "t": "1.5 米"}, {"k": "D", "t": "都可以"}], "a": "B", "multi": false, "exp": {"title": "考察点：言语测听", "text": "正确答案：B）半米\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。"}}, {"n": 192, "s": "为了反应助听器高频特性，参考测试频率通常设定为（    ）。", "o": [{"k": "A", "t": "500 Hz"}, {"k": "B", "t": "1000 Hz"}, {"k": "C", "t": "1600 Hz"}, {"k": "D", "t": "2500 Hz"}], "a": "D", "multi": false, "exp": {"title": "考察点：参考测试频率", "text": "正确答案：D）2500 Hz\n\n参考测试频率一般选 2500 Hz 和 1600 Hz 两个；2500Hz 反映高频特性。"}}, {"n": 193, "s": "（    ）是人耳对声音的一种生理性反应。", "o": [{"k": "A", "t": "听觉察知"}, {"k": "B", "t": "听觉分辨"}, {"k": "C", "t": "听觉整合"}, {"k": "D", "t": "听觉识别"}], "a": "A", "multi": false, "exp": {"title": "考察点：婴儿反应月龄", "text": "正确答案：A）听觉察知\n\n正常小儿 4~7 个月对 40~60 dB SPL 的较轻声音能做出持续可信的反应，听到母亲声音会停止活动；若此月龄仍无寻找声源反应，提示听力损失可能。"}}, {"n": 194, "s": "真耳分析(测量)的测量(探管)传声器(麦克风)用于测量（    ）。", "o": [{"k": "A", "t": "耳廓顶部声压级"}, {"k": "B", "t": "外耳道口声压级"}, {"k": "C", "t": "外耳道近鼓膜处声压级"}, {"k": "D", "t": "鼓室内声压级"}], "a": "C", "multi": false, "exp": {"title": "考察点：探管校准", "text": "正确答案：C）外耳道近鼓膜处声压级\n\n多数真耳分析仪测试前需进行探管校准；探管内频响不是平坦的，机器可通过自身计算修正；开放耳与堵耳助听器探管校准不同。"}}, {"n": 195, "s": "采集新生婴儿年龄时，应写（    ）。", "o": [{"k": "A", "t": "月"}, {"k": "B", "t": "孩"}, {"k": "C", "t": "天"}, {"k": "D", "t": "婴儿"}], "a": "C", "multi": false, "exp": {"title": "考察点：分龄测听法", "text": "正确答案：C）天\n\n按年龄选择行为测听法：4~6 月听觉行为观察；8 月左右视觉强化测听；3 岁以上游戏测听。"}}, {"n": 196, "s": "儿童言语测试时测试时间控制在（    ）。", "o": [{"k": "A", "t": "5 分钟以内"}, {"k": "B", "t": "15 分钟以内"}, {"k": "C", "t": "20 分钟以内"}, {"k": "D", "t": "10 分钟以内"}], "a": "D", "multi": false, "exp": {"title": "考察点：言语测听", "text": "正确答案：D）10 分钟以内\n\n言语测听能直接反映言语识别能力；先测『健耳』；分耳测听时测试耳信号级比非测试耳骨导阈大 40dB 时加掩蔽。"}}, {"n": 197, "s": "通过研究声导抗的改变， 可以了解（    ）的生理或病理生理状况。", "o": [{"k": "A", "t": "外耳"}, {"k": "B", "t": "内耳"}, {"k": "C", "t": "中耳"}, {"k": "D", "t": "蜗后"}], "a": "C", "multi": false, "exp": {"title": "考察点：声导抗", "text": "正确答案：C）中耳\n\n声导抗测试是声阻抗测试与声导纳测试的合称，用于客观评估中耳功能。"}}, {"n": 198, "s": "《语言能力发展阶段测试简表》中每一级测试都包含（    ）题目。", "o": [{"k": "A", "t": "4 个"}, {"k": "B", "t": "5 个"}, {"k": "C", "t": "6 个"}, {"k": "D", "t": "7 个"}], "a": "B", "multi": false, "exp": {"title": "考察点：关键期表现", "text": "正确答案：B）5 个\n\n3 岁半小儿发展的关键期表现：注意力发展、独立性开始建立、动手能力发展成熟。"}}, {"n": 199, "s": "对于乳突手术后的耳道， 制取耳印模时应该（    ）。", "o": [{"k": "A", "t": "与正常耳道一样放置耳障"}, {"k": "B", "t": "将耳道填满耳障"}, {"k": "C", "t": "在适当部位放适量耳障"}, {"k": "D", "t": "不放耳障"}], "a": "C", "multi": false, "exp": {"title": "考察点：耳印模/耳模", "text": "正确答案：C）在适当部位放适量耳障\n\n取耳印模用于制作耳模。完整耳印模覆盖耳道及耳廓前部相应区域；异常耳廓/耳道取印模时须正确置入耳障、注入印模材料并保证完整。"}}, {"n": 200, "s": "主诉一般不超过（    ）为宜。", "o": [{"k": "A", "t": "10 字"}, {"k": "B", "t": "15 字"}, {"k": "C", "t": "20 字"}, {"k": "D", "t": "25 字"}], "a": "C", "multi": false, "exp": {"title": "考察点：主诉", "text": "正确答案：C）20 字\n\n主诉应简明扼要、突出主要症状与持续时间，一般不超过 20 字为宜。"}}, {"n": 201, "s": "鼓膜完整时，可以结合吞咽动作观察（    ）变化，了解咽鼓管功能。", "o": [{"k": "A", "t": "峰压"}, {"k": "B", "t": "声顺值小于 0.3mL"}, {"k": "C", "t": "外耳道容积"}, {"k": "D", "t
